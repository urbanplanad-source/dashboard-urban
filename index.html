  // ═══════════════════════════════════════════════
  //  DRAFTS VIEW (글 보관함)
  // ═══════════════════════════════════════════════
  const DRAFT_CLIENT_MAP = {
    btskin:'노형아름다운피부과', belrmon:'벨르몬성형외과', eyecare:'눈사랑안과',
    seoulup:'서울UP치과', echi:'이치과', igochi:'이고치과',
    jejuexpress:'제주인익스프레스', kyunghee:'365경희부부한의원'
  };
  const DRAFT_CHANNELS = ['홈페이지','블로그','위챗','인스타','라인','기타'];
  const DRAFT_CH_COLOR = {
    '홈페이지':'#1d4ed8','블로그':'#16a34a','위챗':'#15803d',
    '인스타':'#9333ea','라인':'#65a30d','기타':'#6b7280'
  };

  // ── 글 보관함 파이프라인 status (Drafts 시트 status 컬럼과 1:1) ──
  // growth-team(push) → review → [검토] → approved → naver-writer(임시저장) → staged → [수동 발행] → published
  const DRAFT_STATUSES = ['draft','review','approved','staged','published'];
  const DRAFT_STATUS_META = {
    draft:     { label:'초안',      color:'var(--text-2)', bg:'var(--border-2)' },
    review:    { label:'검토중',    color:'var(--amber)',  bg:'var(--amber-bg)' },
    approved:  { label:'승인',      color:'var(--blue)',   bg:'var(--blue-bg)' },
    staged:    { label:'임시저장됨', color:'var(--purple)', bg:'var(--purple-bg)' },
    published: { label:'발행완료',  color:'var(--green)',  bg:'var(--green-bg)' },
  };
  const normalizeDraftStatus = (s) => {
    const v = String(s || '').trim();
    return DRAFT_STATUSES.includes(v) ? v : 'draft';
  };

  function DraftsView() {
    const [drafts,        setDrafts]        = useState([]);
    const [loading,       setLoading]       = useState(true);
    const [detailLoading, setDetailLoading] = useState(null);
    const [detailErrors,  setDetailErrors]  = useState({});
    const [filterClient,  setFilterClient]  = useState('');
    const [filterChannel, setFilterChannel] = useState('');
    const [filterStatus,  setFilterStatus]  = useState('');
    const [expandedId,    setExpandedId]    = useState(null);
    const [showAdd,       setShowAdd]       = useState(false);
    const [copied,        setCopied]        = useState(null);
    const [commandCopied, setCommandCopied] = useState(null);
    const [addForm,       setAddForm]       = useState({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' });

    function normalizeDraftList(list, hasFullContent=false) {
      return (list || []).map(d => {
        const content = d.content || '';
        return {
          ...d,
          status: normalizeDraftStatus(d.status),
          preview: d.preview || content.slice(0, 120),
          contentLength: Number(d.contentLength || content.length || 0),
          contentLoaded: hasFullContent || Boolean(content),
        };
      });
    }

    function extractDraftList(payload) {
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload?.data?.drafts)) return payload.data.drafts;
      if (Array.isArray(payload?.drafts)) return payload.drafts;
      return [];
    }

    function loadDrafts() {
      setLoading(true);
      setExpandedId(null);
      fetch(API_URL + '?action=draftsList')
        .then(r => r.json())
        .then(d => {
          const list = extractDraftList(d);
          if (!d.success || !list.length) throw new Error('draftsList unavailable');
          setDrafts(normalizeDraftList(list).slice().reverse());
          setLoading(false);
        })
        .catch(() => {
          fetch(API_URL + '?action=summary&draftMode=light')
            .then(r => r.json())
            .then(d => {
              const list = extractDraftList(d);
              const hasFullContent = list.some(item => item.content);
              setDrafts(normalizeDraftList(list, hasFullContent).slice().reverse());
              setLoading(false);
            })
            .catch(() => setLoading(false));
        });
    }

    useEffect(() => { loadDrafts(); }, []);

    const allClients = [...new Set(drafts.map(d => d.clientId).filter(Boolean))];
    const filtered = drafts.filter(d =>
      (!filterClient  || d.clientId === filterClient) &&
      (!filterChannel || d.channel  === filterChannel) &&
      (!filterStatus  || normalizeDraftStatus(d.status) === filterStatus)
    );
    const statusCounts = DRAFT_STATUSES.reduce((acc, s) => {
      acc[s] = drafts.filter(d => normalizeDraftStatus(d.status) === s).length;
      return acc;
    }, {});

    // ── 파이프라인 status 변경 (Sheets updateDraft 동기화) ──
    function changeDraftStatus(draft, status) {
      const next = normalizeDraftStatus(status);
      const prevStatus = normalizeDraftStatus(draft.status);
      setDrafts(prev => prev.map(d => d.draftId === draft.draftId ? { ...d, status: next } : d));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateDraft', draftId: draft.draftId, status: next })
      })
        .then(r => r.json())
        .then(d => { if (!d.success) throw new Error(d.error || 'updateDraft 실패'); })
        .catch(e => {
          setDrafts(prev => prev.map(d => d.draftId === draft.draftId ? { ...d, status: prevStatus } : d));
          console.warn('updateDraft status 오류:', e);
          alert('상태 변경 저장에 실패했습니다. 화면 상태를 이전 값으로 되돌렸습니다.');
        });
    }

    function copyDraftText(text, draftId) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(draftId);
        setTimeout(() => setCopied(null), 2000);
      }).catch(() => {
        const el = document.createElement('textarea');
        el.value = text; document.body.appendChild(el);
        el.select(); document.execCommand('copy'); document.body.removeChild(el);
        setCopied(draftId);
        setTimeout(() => setCopied(null), 2000);
      });
    }

    function loadDraftContent(draft) {
      if (!draft?.draftId) return Promise.resolve('');
      if (draft.contentLoaded || draft.content) return Promise.resolve(draft.content || '');
      setDetailLoading(draft.draftId);
      setDetailErrors(prev => ({ ...prev, [draft.draftId]: null }));
      return fetch(API_URL + '?action=draftDetail&draftId=' + encodeURIComponent(draft.draftId))
        .then(r => r.json())
        .then(d => {
          const detail = d.data?.draft || d.data || d.draft || {};
          if (!d.success || detail.content === undefined) throw new Error(d.error || '본문을 불러오지 못했습니다.');
          setDrafts(prev => prev.map(item => item.draftId === draft.draftId ? {
            ...item,
            ...detail,
            preview: item.preview || (detail.content || '').slice(0, 120),
            contentLength: Number(detail.contentLength || (detail.content || '').length || item.contentLength || 0),
            contentLoaded: true,
          } : item));
          return detail.content || '';
        })
        .catch(e => {
          setDetailErrors(prev => ({ ...prev, [draft.draftId]: e.message || '본문을 불러오지 못했습니다.' }));
          throw e;
        })
        .finally(() => setDetailLoading(null));
    }

    function toggleDraft(draft) {
      if (expandedId === draft.draftId) {
        setExpandedId(null);
        return;
      }
      setExpandedId(draft.draftId);
      loadDraftContent(draft).catch(() => {});
    }

    function handleCopy(draft) {
      loadDraftContent(draft)
        .then(text => copyDraftText(text, draft.draftId))
        .catch(() => alert('본문을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'));
    }

    function buildNaverTempSaveCommand(draftId) {
      return [
        'cd /d "%USERPROFILE%\\Desktop\\개발 작업\\naver-writer"',
        `npm.cmd run draft:dashboard -- --draft-id ${draftId}`
      ].join('\r\n');
    }

    function copyNaverCommand(draft) {
      if (normalizeDraftStatus(draft.status) !== 'approved') {
        alert('네이버 임시저장 명령은 승인 상태에서만 복사할 수 있습니다.');
        return;
      }
      const command = buildNaverTempSaveCommand(draft.draftId);
      navigator.clipboard.writeText(command).then(() => {
        setCommandCopied(draft.draftId);
        setTimeout(() => setCommandCopied(null), 2000);
      }).catch(() => {
        const el = document.createElement('textarea');
        el.value = command; document.body.appendChild(el);
        el.select(); document.execCommand('copy'); document.body.removeChild(el);
        setCommandCopied(draft.draftId);
        setTimeout(() => setCommandCopied(null), 2000);
      });
    }

    function handleDelete(draftId) {
      if (!confirm('이 초안을 삭제하시겠습니까?')) return;
      setDrafts(prev => prev.filter(d => d.draftId !== draftId));
      fetch(API_URL, { method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'deleteDraft', draftId })
      }).catch(e => console.warn('deleteDraft 오류:', e));
    }

    function handleAdd() {
      if (!addForm.title.trim()) { alert('제목을 입력하세요.'); return; }
      if (!addForm.content.trim()) { alert('내용을 입력하세요.'); return; }
      const createdAt = today();
      const draftId = 'dr-' + Date.now().toString(36);
      const newDraft = { ...addForm, draftId, createdAt, status:'draft', preview:addForm.content.slice(0,120), contentLength:addForm.content.length, contentLoaded:true };
      setDrafts(prev => [newDraft, ...prev]);
      fetch(API_URL, { method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'addDraft', ...addForm })
      })
        .then(r => r.json())
        .then(d => {
          if (d.success && d.draftId) {
            setDrafts(prev => prev.map(item => item.draftId === draftId ? { ...item, draftId:d.draftId } : item));
          }
        })
        .catch(e => console.warn('addDraft 오류:', e));
      setAddForm({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' });
      setShowAdd(false);
    }

    const iS = { fontFamily:'inherit', fontSize:13, border:'1px solid var(--border)', borderRadius:6, padding:'7px 10px', outline:'none', background:'var(--surface)' };

    return (
      <div style={{maxWidth:960, margin:'0 auto', padding:'28px 24px'}}>

        {/* 헤더 행 */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20}}>
          <div>
            <h2 style={{display:'flex',alignItems:'center',gap:8,margin:0, fontSize:20, fontWeight:800, color:'var(--ink)',letterSpacing:'-.3px'}}><Icon name="file" size={18} style={{color:'var(--gold)'}} /> 글 보관함</h2>
            <p style={{margin:'4px 0 0', fontSize:12, color:'var(--text-3)'}}>Codex가 작성한 초안을 거래처별로 보관합니다. 복사 후 직접 발행하세요.</p>
          </div>
          <div style={{display:'flex', gap:8}}>
            <button onClick={loadDrafts}
              style={{display:'inline-flex',alignItems:'center',gap:5,background:'var(--border-2)', border:'none', borderRadius:8, padding:'8px 14px', fontSize:12, fontWeight:700, color:'var(--text)', cursor:'pointer', fontFamily:'inherit'}}>
              <Icon name="refresh" size={12} /> 새로고침
            </button>
            <button onClick={() => setShowAdd(v => !v)}
              style={{display:'inline-flex',alignItems:'center',gap:5,background:'var(--navy)', color:'#fff', border:'none', borderRadius:8, padding:'8px 16px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit'}}>
              {showAdd ? <><Icon name="x" size={12} /> 닫기</> : <><Icon name="plus" size={12} /> 직접 등록</>}
            </button>
          </div>
        </div>

        {/* 직접 등록 폼 */}
        {showAdd && (
          <div style={{background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:12, padding:'20px', marginBottom:20}}>
            <div style={{fontWeight:700, fontSize:14, color:'var(--text)', marginBottom:14}}>새 초안 등록</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:10}}>
              <div>
                <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>거래처</div>
                <select value={addForm.clientId} onChange={e => setAddForm(f => ({...f, clientId:e.target.value}))} style={{...iS, width:'100%'}}>
                  <option value="">공통 / 없음</option>
                  {Object.entries(DRAFT_CLIENT_MAP).map(([id,name]) => <option key={id} value={id}>{name}</option>)}
                </select>
              </div>
              <div>
                <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>채널</div>
                <select value={addForm.channel} onChange={e => setAddForm(f => ({...f, channel:e.target.value}))} style={{...iS, width:'100%'}}>
                  {DRAFT_CHANNELS.map(ch => <option key={ch} value={ch}>{ch}</option>)}
                </select>
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>제목</div>
              <input value={addForm.title} onChange={e => setAddForm(f => ({...f, title:e.target.value}))} style={{...iS, width:'100%', boxSizing:'border-box'}} placeholder="글 제목" />
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>본문</div>
              <textarea value={addForm.content} onChange={e => setAddForm(f => ({...f, content:e.target.value}))}
                style={{...iS, width:'100%', boxSizing:'border-box', minHeight:140, resize:'vertical', lineHeight:1.6}}
                placeholder="글 본문 전체 내용을 붙여넣으세요" />
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>메모 (선택)</div>
              <input value={addForm.memo} onChange={e => setAddForm(f => ({...f, memo:e.target.value}))} style={{...iS, width:'100%', boxSizing:'border-box'}} placeholder="키워드, 참고사항 등" />
            </div>
            <div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
              <button onClick={() => { setShowAdd(false); setAddForm({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' }); }}
                style={{background:'var(--border-2)', border:'none', borderRadius:7, padding:'8px 18px', fontSize:13, fontWeight:600, color:'var(--text)', cursor:'pointer', fontFamily:'inherit'}}>취소</button>
              <button onClick={handleAdd}
                style={{background:'#6366f1', border:'none', borderRadius:7, padding:'8px 20px', fontSize:13, fontWeight:700, color:'#fff', cursor:'pointer', fontFamily:'inherit'}}>저장</button>
            </div>
          </div>
        )}

        {/* ── 파이프라인 요약 바 (status별 건수 + 클릭 필터) ── */}
        <div style={{display:'flex', gap:0, alignItems:'stretch', marginBottom:14, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'var(--radius)', overflow:'hidden', boxShadow:'var(--shadow-sm)'}}>
          {DRAFT_STATUSES.map((s, i) => {
            const meta = DRAFT_STATUS_META[s];
            const active = filterStatus === s;
            return (
              <button key={s}
                onClick={() => setFilterStatus(active ? '' : s)}
                style={{flex:1, minWidth:0, border:'none', borderLeft: i>0 ? '1px solid var(--border-2)' : 'none',
                  background: active ? meta.bg : 'transparent', cursor:'pointer', fontFamily:'inherit',
                  padding:'10px 6px', textAlign:'center', transition:'background .12s'}}>
                <div style={{fontSize:18, fontWeight:800, color: statusCounts[s] > 0 ? meta.color : 'var(--text-3)', lineHeight:1.1}}>
                  {statusCounts[s]}
                </div>
                <div style={{fontSize:10.5, fontWeight:700, color: active ? meta.color : 'var(--text-3)', marginTop:3, whiteSpace:'nowrap'}}>
                  {meta.label}{i < DRAFT_STATUSES.length-1 ? '' : ''}
                </div>
              </button>
            );
          })}
        </div>

        {/* 필터 행 */}
        <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:20}}>
          {/* 거래처 필터 */}
          <button onClick={() => setFilterClient('')}
            style={{background: filterClient==='' ? '#1a1a2e' : '#f3f4f6', color: filterClient==='' ? '#fff' : '#6b7280', border:'none', borderRadius:20, padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
            전체
          </button>
          {allClients.map(cid => (
            <button key={cid} onClick={() => setFilterClient(cid === filterClient ? '' : cid)}
              style={{background: filterClient===cid ? '#1a1a2e' : '#f3f4f6', color: filterClient===cid ? '#fff' : '#6b7280', border:'none', borderRadius:20, padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
              {DRAFT_CLIENT_MAP[cid] || cid}
            </button>
          ))}
          <div style={{width:1, background:'#e8e7e3', margin:'0 4px'}} />
          {/* 채널 필터 */}
          {DRAFT_CHANNELS.map(ch => (
            <button key={ch} onClick={() => setFilterChannel(ch === filterChannel ? '' : ch)}
              style={{background: filterChannel===ch ? DRAFT_CH_COLOR[ch]||'#374151' : '#f3f4f6', color: filterChannel===ch ? '#fff' : '#6b7280', border:'none', borderRadius:20, padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
              {ch}
            </button>
          ))}
        </div>

        {/* 카운트 */}
        <div style={{fontSize:12, color:'var(--text-3)', marginBottom:12}}>
          {loading ? '불러오는 중...' : `총 ${filtered.length}건${filterClient||filterChannel ? ' (필터 적용됨)' : ''}`}
        </div>

        {/* 초안 목록 */}
        {loading ? (
          <div style={{textAlign:'center', padding:'60px 0', color:'var(--text-3)', fontSize:13}}>보관함 로딩 중...</div>
        ) : filtered.length === 0 ? (
          <div style={{textAlign:'center', padding:'60px 0', color:'var(--text-3)', fontSize:13}}>
            {drafts.length === 0 ? '저장된 초안이 없습니다. Codex에게 글 작성 후 저장을 요청하세요.' : '해당 조건의 초안이 없습니다.'}
          </div>
        ) : (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            {filtered.map(draft => {
              const isExpanded = expandedId === draft.draftId;
              const clientName = DRAFT_CLIENT_MAP[draft.clientId] || draft.clientId || '공통';
              const chColor = DRAFT_CH_COLOR[draft.channel] || '#6b7280';
              const preview = draft.preview || (draft.content || '').slice(0, 120);
              const hasMorePreview = Number(draft.contentLength || (draft.content || '').length || 0) > 120;
              const isCopied = copied === draft.draftId;
              const isCommandCopied = commandCopied === draft.draftId;
              const dStatus = normalizeDraftStatus(draft.status);
              const sMeta = DRAFT_STATUS_META[dStatus];
              const canApprove = dStatus === 'draft' || dStatus === 'review';
              const canCopyNaverCommand = dStatus === 'approved';
              const needsCompliance = (draft.memo||'').includes('needs_compliance_review') && (dStatus === 'draft' || dStatus === 'review');
              return (
                <div key={draft.draftId} style={{background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, overflow:'hidden', boxShadow:'0 1px 4px rgba(0,0,0,0.05)'}}>
                  {/* 카드 헤더 */}
                  <div style={{display:'flex', alignItems:'center', gap:10, padding:'14px 18px', borderBottom: isExpanded ? '1px solid #f3f4f6' : 'none', cursor:'pointer'}}
                    onClick={() => toggleDraft(draft)}>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:4, flexWrap:'wrap'}}>
                        <span style={{background:sMeta.bg, color:sMeta.color, fontSize:11, fontWeight:800, borderRadius:6, padding:'2px 9px'}}>{sMeta.label}</span>
                        {needsCompliance && (
                          <span style={{display:'inline-flex',alignItems:'center',gap:3,background:'var(--red-bg)', color:'var(--red)', fontSize:11, fontWeight:700, borderRadius:6, padding:'2px 8px'}}>
                            <Icon name="alert" size={10} /> 심의검토
                          </span>
                        )}
                        <span style={{background:chColor+'22', color:chColor, fontSize:11, fontWeight:700, borderRadius:10, padding:'2px 9px'}}>{draft.channel||'기타'}</span>
                        <span style={{background:'var(--border-2)', color:'var(--text)', fontSize:11, fontWeight:600, borderRadius:10, padding:'2px 9px'}}>{clientName}</span>
                        <span style={{fontSize:11, color:'var(--text-3)'}}>{draft.createdAt||''}</span>
                        {draft.memo && <span style={{fontSize:11, color:'var(--text-3)', fontStyle:'italic'}}>| {draft.memo}</span>}
                      </div>
                      <div style={{fontSize:14, fontWeight:700, color:'var(--ink)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{draft.title||'(제목 없음)'}</div>
                      {!isExpanded && <div style={{fontSize:12, color:'var(--text-2)', marginTop:3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{preview ? `${preview}${hasMorePreview?'…':''}` : '클릭하면 본문을 불러옵니다.'}</div>}
                    </div>
                    <div style={{display:'flex', gap:6, flexShrink:0, flexWrap:'wrap', justifyContent:'flex-end'}} onClick={e => e.stopPropagation()}>
                      <select
                        value={dStatus}
                        onChange={e => changeDraftStatus(draft, e.target.value)}
                        title="파이프라인 상태 변경"
                        style={{border:'1px solid var(--border)', borderRadius:7, padding:'6px 8px', fontSize:12, fontWeight:700, fontFamily:'inherit', color:sMeta.color, background:'var(--surface)', cursor:'pointer', outline:'none'}}>
                        {DRAFT_STATUSES.map(s => <option key={s} value={s}>{DRAFT_STATUS_META[s].label}</option>)}
                      </select>
                      {canApprove && (
                        <button onClick={() => changeDraftStatus(draft, 'approved')}
                          title="검토 완료 후 네이버 임시저장 가능 상태로 변경"
                          style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,background:'var(--blue)', color:'#fff', border:'none', borderRadius:7, padding:'7px 12px', fontSize:12, fontWeight:800, cursor:'pointer', fontFamily:'inherit'}}>
                          <Icon name="check" size={12} /> 승인
                        </button>
                      )}
                      <button onClick={() => copyNaverCommand(draft)}
                        disabled={!canCopyNaverCommand}
                        title={canCopyNaverCommand ? 'CMD에 붙여넣을 네이버 임시저장 명령 복사' : '승인 상태에서만 명령을 복사할 수 있습니다'}
                        style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,background: canCopyNaverCommand ? (isCommandCopied ? 'var(--green)' : 'var(--purple)') : 'var(--border-2)', color: canCopyNaverCommand ? '#fff' : 'var(--text-3)', border:'none', borderRadius:7, padding:'7px 12px', fontSize:12, fontWeight:800, cursor:canCopyNaverCommand?'pointer':'not-allowed', fontFamily:'inherit'}}>
                        {isCommandCopied ? <><Icon name="check" size={12} /> 명령 복사됨</> : <><Icon name="copy" size={12} /> CMD 복사</>}
                      </button>
                      <button onClick={() => handleCopy(draft)}
                        style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,background: isCopied ? 'var(--green)' : 'var(--navy)', color:'#fff', border:'none', borderRadius:7, padding:'7px 14px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit', minWidth:78, transition:'background 0.2s'}}>
                        {isCopied ? <><Icon name="check" size={12} /> 복사됨</> : <><Icon name="copy" size={12} /> 복사</>}
                      </button>
                      <button onClick={() => handleDelete(draft.draftId)}
                        style={{background:'var(--red-bg)', color:'var(--red)', border:'1px solid #fecaca', borderRadius:7, padding:'7px 10px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit'}}>
                        삭제
                      </button>
                    </div>
                  </div>
                  {/* 본문 확장 */}
                  {isExpanded && (
                    <div style={{padding:'16px 18px', background:'#fafafa'}}>
                      {detailLoading === draft.draftId && !draft.content ? (
                        <div style={{fontSize:13, color:'var(--text-2)'}}>본문 불러오는 중...</div>
                      ) : detailErrors[draft.draftId] ? (
                        <div style={{fontSize:13, color:'var(--red)'}}>{detailErrors[draft.draftId]}</div>
                      ) : (
                        <pre style={{margin:0, fontFamily:'inherit', fontSize:13, lineHeight:1.75, color:'var(--text)', whiteSpace:'pre-wrap', wordBreak:'break-word'}}>{draft.content||''}</pre>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  APP ROOT
  // ═══════════════════════════════════════════════
  // ═══════════════════════════════════════════════
  //  REVENUE VIEW (수익 관리)
  // ═══════════════════════════════════════════════
  const fmtMoney = (n) => {
    if (!n && n !== 0) return '—';
    return '₩ ' + Number(n).toLocaleString('ko-KR');
  };

  // ═══════════════════════════════════════════════
  //  REVENUE VIEW — 손익 관리
  // ═══════════════════════════════════════════════

  const REV_KEY = 'rev-data-v1';
  function loadRevData() {
    try { return JSON.parse(safeStorage.getItem(REV_KEY)) || getDefaultRevData(); } catch { return getDefaultRevData(); }
  }
  function saveRevData(d) { try { safeStorage.setItem(REV_KEY, JSON.stringify(d)); } catch {} }

  const EXPENSE_CATS = ['인건비','외주비','광고비','촬영/디자인 제작비','툴/구독료','사무운영비','세무/수수료','기타비용'];
  const PAY_METHODS  = ['카드','계좌이체','현금','기타'];
  const CAT_COLORS   = {
    '인건비':'#6366f1','외주비':'#8b5cf6','광고비':'#ec4899',
    '촬영/디자인 제작비':'#f59e0b','툴/구독료':'#3b82f6',
    '사무운영비':'#10b981','세무/수수료':'#64748b','기타비용':'#d1d5db',
  };

  function getDefaultRevData() {
    const now = new Date();
    const months = [];
    for (let i=5; i>=0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    }
    const [m0,m1,m2,m3,m4,m5] = months;
    const clientRevenue = [
      {clientId:'btskin',    monthlyFee:1200000, additionalRevenue:{[m4]:300000,[m5]:150000}, allocatedCosts:{}, contractStart:'2024-06-01', memo:'홈페이지+블로그+SNS'},
      {clientId:'belrmon',   monthlyFee:800000,  additionalRevenue:{[m5]:200000},             allocatedCosts:{}, contractStart:'2024-09-01', memo:'홈페이지+블로그'},

  // ── SVG 차트: 손익 흐름 ──
  function ProfitChart({ data6 }) {
    const W=520, H=180, PL=52, PR=12, PT=20, PB=28;
    const cW=W-PL-PR, cH=H-PT-PB;
    const maxV = Math.max(...data6.flatMap(d=>[d.revenue,d.costs]), 1);
    const gW = cW / data6.length;
    const bW = gW * 0.28;
    const toY = v => PT + cH - (Math.max(0,v)/maxV)*cH;
    const profPts = data6.map((d,i) => `${PL+i*gW+gW/2},${toY(d.profit)}`).join(' ');
    const fK = v => v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':'0';
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
        {[0,0.25,0.5,0.75,1].map(r=>(
          <g key={r}>
            <line x1={PL} x2={W-PR} y1={toY(maxV*r)} y2={toY(maxV*r)} stroke={r===0?'#e8e7e3':'#f3f4f6'} strokeWidth="1"/>
            {r>0&&<text x={PL-4} y={toY(maxV*r)+4} textAnchor="end" fontSize="8" fill="#9ca3af">{fK(maxV*r)}</text>}
          </g>
        ))}
        {data6.map((d,i) => {
          const cx=PL+i*gW;
          return (
            <g key={i}>
              <rect x={cx+gW*0.08}      y={toY(d.revenue)} width={bW} height={(d.revenue/maxV)*cH} fill="#3b82f6" opacity="0.75" rx="2"/>
              <rect x={cx+gW*0.08+bW+2} y={toY(d.costs)}   width={bW} height={(d.costs/maxV)*cH}   fill="#f59e0b" opacity="0.75" rx="2"/>
              <text x={cx+gW/2} y={H-6} textAnchor="middle" fontSize="9" fill="#9ca3af">{d.month.slice(5)}월</text>
            </g>
          );
        })}
        <polyline points={profPts} fill="none" stroke="#10b981" strokeWidth="2"/>
        {data6.map((d,i) => (
          <circle key={i} cx={PL+i*gW+gW/2} cy={toY(d.profit)} r="3.5" fill="#10b981" stroke="#fff" strokeWidth="1.5"/>
        ))}
        <rect x={PL} y={3} width={7} height={7} fill="#3b82f6" opacity="0.75" rx="1"/>
        <text x={PL+10} y={10} fontSize="8.5" fill="#6b7280">매출</text>
        <rect x={PL+40} y={3} width={7} height={7} fill="#f59e0b" opacity="0.75" rx="1"/>
        <text x={PL+50} y={10} fontSize="8.5" fill="#6b7280">비용</text>
        <circle cx={PL+82} cy={7} r="3" fill="#10b981"/>
        <text x={PL+88} y={10} fontSize="8.5" fill="#6b7280">순이익</text>
      </svg>
    );
  }

  // ── SVG 차트: 비용 도넛 ──
  function CostDonut({ expenses }) {
    const byCat = EXPENSE_CATS.map(cat=>({
      label:cat,
      value:expenses.filter(e=>e.category===cat).reduce((s,e)=>s+Number(e.amount||0),0),
      color:CAT_COLORS[cat]||'#d1d5db',
    })).filter(c=>c.value>0);
    const total=byCat.reduce((s,c)=>s+c.value,0);
    if (total===0) return <div style={{textAlign:'center',color:'var(--text-3)',fontSize:12,padding:'40px 0'}}>이번 달 비용 없음</div>;
    const R=68, r=44, CX=80, CY=80;
    let ang=-Math.PI/2;
    const segs=byCat.map(c=>{
      const a=(c.value/total)*2*Math.PI;
      const x1=CX+R*Math.cos(ang), y1=CY+R*Math.sin(ang);
      ang+=a;
      const x2=CX+R*Math.cos(ang), y2=CY+R*Math.sin(ang);
      const xi1=CX+r*Math.cos(ang), yi1=CY+r*Math.sin(ang);
      const xi2=CX+r*Math.cos(ang-a), yi2=CY+r*Math.sin(ang-a);
      const lg=a>Math.PI?1:0;
      return {...c, path:`M${x1},${y1}A${R},${R},0,${lg},1,${x2},${y2}L${xi1},${yi1}A${r},${r},0,${lg},0,${xi2},${yi2}Z`};
    });
    return (
      <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
        <svg viewBox="0 0 160 160" style={{width:130,flexShrink:0}}>
          {segs.map((s,i)=><path key={i} d={s.path} fill={s.color}/>)}
          <text x={CX} y={CY-7}  textAnchor="middle" fontSize="9"  fill="#9ca3af">총비용</text>
          <text x={CX} y={CY+7}  textAnchor="middle" fontSize="12" fontWeight="700" fill="#374151">{(total/10000).toFixed(0)}만</text>
        </svg>
        <div style={{fontSize:10,lineHeight:'19px',paddingTop:6,flex:1}}>
          {segs.map((s,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:5}}>
              <span style={{width:7,height:7,borderRadius:1,background:s.color,display:'inline-block',flexShrink:0}}/>
              <span style={{color:'var(--text-2)',flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.label}</span>
              <span style={{color:'var(--text)',fontWeight:700,paddingLeft:4}}>{(s.value/10000).toFixed(1)}만</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ── 메인 컴포넌트 ──
  function RevenueView({ data }) {
    const clients = data.clients || [];
    const [revData,     setRevData]    = useState(()=>loadRevData());
    const [selMonth,    setSelMonth]   = useState(nowMonth);
    const [activeTab,   setActiveTab]  = useState('profit');
    const [editingCid,  setEditingCid] = useState(null);
    const [editCForm,   setEditCForm]  = useState({});
    const [showAddExp,  setShowAddExp] = useState(false);
    const [editingEid,  setEditingEid] = useState(null);
    const blankExp = { date:today(), category:'인건비', description:'', amount:'', type:'고정비', clientId:'', payMethod:'카드', isRecurring:false, memo:'' };
    const [expForm, setExpForm] = useState(blankExp);

    // localStorage 저장
    useEffect(()=>{ saveRevData(revData); }, [revData]);
    const mutRev = fn => setRevData(prev=>fn(prev));

    // Sheets에서 비용 데이터 동기화 (마운트 시)
    useEffect(()=>{
      fetchFromSheets().then(sheetsData=>{
        if (sheetsData.expenses && sheetsData.expenses.length > 0) {
          mutRev(prev=>({ ...prev, expenses: sheetsData.expenses }));
        }
      }).catch(()=>{});
    }, []);

    const cr = revData.clientRevenue || [];
    const selExpenses = (revData.expenses||[]).filter(e=>e.date&&e.date.startsWith(selMonth));

    // 거래처별 수익 계산 — 귀속비용은 비용기록에서 자동 집계
    const clientRows = clients.map(c=>{
      const rv = cr.find(r=>r.clientId===c.clientId)||{monthlyFee:0,additionalRevenue:{},contractStart:'',memo:''};
      const base  = Number(rv.monthlyFee)||0;
      const extra = Number((rv.additionalRevenue||{})[selMonth])||0;
      const totalRev = base+extra;
      // 비용 기록에서 이 거래처에 귀속된 비용 자동 합산
      const allocCost = selExpenses.filter(e=>e.clientId===c.clientId).reduce((s,e)=>s+Number(e.amount||0),0);
      const profit = totalRev-allocCost;
      const margin = totalRev>0 ? profit/totalRev*100 : 0;
      return {...c, monthlyFee:base, additionalRevenue:extra, totalRevenue:totalRev, allocatedCosts:allocCost, profit, margin, contractStart:rv.contractStart||'', memo:rv.memo||''};
    });

    const totalRevenue = clientRows.reduce((s,r)=>s+r.totalRevenue, 0);
    const totalCosts   = selExpenses.reduce((s,e)=>s+Number(e.amount||0), 0);
    const netProfit    = totalRevenue-totalCosts;
    const profitMargin = totalRevenue>0 ? netProfit/totalRevenue*100 : 0;
    const fixedCosts   = selExpenses.filter(e=>e.type==='고정비').reduce((s,e)=>s+Number(e.amount||0),0);
    const varCosts     = selExpenses.filter(e=>e.type==='변동비').reduce((s,e)=>s+Number(e.amount||0),0);

    // 전월 비교
    const prevM = (()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();
    const prevRevenue = clients.reduce((s,c)=>{ const rv=cr.find(r=>r.clientId===c.clientId)||{monthlyFee:0,additionalRevenue:{}}; return s+(Number(rv.monthlyFee)||0)+(Number((rv.additionalRevenue||{})[prevM])||0); },0);
    const prevCosts   = (revData.expenses||[]).filter(e=>e.date&&e.date.startsWith(prevM)).reduce((s,e)=>s+Number(e.amount||0),0);
    const profitDiff  = netProfit-(prevRevenue-prevCosts);

    // 6개월 추이
    const now6 = Array.from({length:6},(_,i)=>{
      const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-(5-i));
      const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const rev=clients.reduce((s,c)=>{ const rv=cr.find(r=>r.clientId===c.clientId)||{monthlyFee:0,additionalRevenue:{}}; return s+(Number(rv.monthlyFee)||0)+(Number((rv.additionalRevenue||{})[m])||0); },0);
      const cost=(revData.expenses||[]).filter(e=>e.date&&e.date.startsWith(m)).reduce((s,e)=>s+Number(e.amount||0),0);
      return {month:m, revenue:rev, costs:cost, profit:rev-cost};
    });

    // 상위 5 비용
    const top5 = [...selExpenses].sort((a,b)=>Number(b.amount)-Number(a.amount)).slice(0,5);

    // 월 선택지 (최근 12개월)
    const monthOptions = Array.from({length:12},(_,i)=>{
      const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    });

    // ── 거래처 수익 편집 ──
    function startEditClient(row) {
      setEditingCid(row.clientId);
      const rv=cr.find(r=>r.clientId===row.clientId)||{};
      setEditCForm({ monthlyFee:rv.monthlyFee||0, additionalRevenue:(rv.additionalRevenue||{})[selMonth]||0, contractStart:rv.contractStart||'', memo:rv.memo||'' });
    }
    function saveEditClient(clientId) {
      mutRev(prev=>{
        const idx=prev.clientRevenue.findIndex(r=>r.clientId===clientId);
        const ex=prev.clientRevenue[idx]||{clientId,additionalRevenue:{}};
        const updated={...ex, monthlyFee:Number(editCForm.monthlyFee)||0, additionalRevenue:{...(ex.additionalRevenue||{}),[selMonth]:Number(editCForm.additionalRevenue)||0}, contractStart:editCForm.contractStart||'', memo:editCForm.memo||''};
        return {...prev, clientRevenue: idx>=0 ? prev.clientRevenue.map((r,i)=>i===idx?updated:r) : [...prev.clientRevenue,updated]};
      });
      setEditingCid(null);
    }

    // ── 비용 CRUD (로컬 + Sheets 동기화) ──
    function addExpense() {
      const eid = 'exp-' + Date.now().toString(36);
      const newExp = { expenseId:eid, ...expForm, amount:Number(expForm.amount)||0 };

        method:'POST', redirect:'follow',

      }).catch(e=>console.warn('addExpense Sheets 오류:', e));
      setExpForm(blankExp); setShowAddExp(false);
    }
    function startEditExp(e) { setEditingEid(e.expenseId); setExpForm({...e,amount:String(e.amount)}); setShowAddExp(false); }

      const updated = { ...expForm, expenseId:editingEid, amount:Number(expForm.amount)||0 };
      mutRev(prev=>({...prev, expenses:prev.expenses.map(e=>e.expenseId===editingEid?updated:e)}));

    }
    function deleteExp(eid) {
      if(!confirm('이 비용 항목을 삭제하시겠습니까?')) return;

        method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'deleteExpense', expenseId:eid })
      }).catch(e=>console.warn('deleteExpense Sheets 오류:', e));

    const diffColor = profitDiff>=0?'var(--green)':'var(--red)';

  // ═══════════════════════════════════════════════
  //  MAIN KPI ROW (메인 상단 지표)
  // ═══════════════════════════════════════════════
  function MainKpis({ data }) {
    const jobs      = data.monthlyJobs || [];
    const essential = jobs.filter(j => j.kind === '필수');
    const essDone   = essential.filter(isJobDone).length;
    const countJobs = essential.filter(j => j.targetCount != null);
    const countCur  = countJobs.reduce((s,j)=>s + Math.min(Number(j.currentCount||0), Number(j.targetCount||0)), 0);
    const countTgt  = countJobs.reduce((s,j)=>s + Number(j.targetCount||0), 0);
    const dueSoonJobs = jobs.filter(j => j.dueDate && !isJobDone(j))
      .map(j => daysLeft(j.dueDate)).filter(d => d !== null && d <= 3).length;
    const dueSoonTasks = (data.commonTasks||[]).filter(t => t.kind !== 'group' && !t.done && t.dueDate)
      .map(t => daysLeft(t.dueDate)).filter(d => d !== null && d <= 3).length;
    const dueSoon    = dueSoonJobs + dueSoonTasks;
    const monthPosts = (data.postLogs||[]).filter(p => p.month === nowMonth()).length;
    const essClients = new Set(essential.map(j => j.clientId)).size;

    const kpis = [
      { icon:'home',  label:'활성 거래처',        value:`${(data.clients||[]).length}곳`,
        sub:`필수업무 운영 ${essClients}곳` },
      { icon:'trend', label:'이달 필수업무 진행',  value: countTgt > 0 ? `${Math.round(countCur/countTgt*100)}%` : (essential.length > 0 ? `${essDone}/${essential.length}` : '—'),
        sub: countTgt > 0 ? `콘텐츠 ${countCur}/${countTgt}건 발행` : '카운트 업무 없음' },
      { icon:'clock', label:'마감 임박 (3일 내)',  value:`${dueSoon}건`,
        sub: dueSoon > 0 ? '오늘의 포커스에서 확인' : '임박한 마감 없음', alert: dueSoon > 0 },
      { icon:'file',  label:'이달 발행 글',        value:`${monthPosts}건`,
        sub:`${fmtMonth(nowMonth())} 발행 기준` },
    ];

    return (
      <div className="kpi-grid">
        {kpis.map((k,i)=>(
          <div key={i} className="kpi-card">
            <div className="kpi-label"><Icon name={k.icon} size={13} /> {k.label}</div>
            <div className="kpi-value" style={k.alert ? {color:'var(--red)'} : undefined}>{k.value}</div>
            <div className="kpi-sub">{k.sub}</div>
          </div>
        ))}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  CLIENT TABLE (거래처 현황 리스트 뷰)
  // ═══════════════════════════════════════════════
  function ClientTable({ clients, data, onSelect }) {
    return (
      <div className="ctbl">
        <div className="ctbl-head">
          {['거래처','진료과','필수업무 진행','진행중','마감 임박','방문자 리뷰','보고서'].map((h,i)=>(
            <span key={i}>{h}</span>
          ))}
        </div>
        {clients.map(c => {
          const jobs      = (data.monthlyJobs||[]).filter(j => j.clientId === c.clientId);
          const ess       = jobs.filter(j => j.kind === '필수');
          const countJobs = ess.filter(j => j.targetCount != null);
          const cur = countJobs.reduce((s,j)=>s + Math.min(Number(j.currentCount||0), Number(j.targetCount||0)), 0);
          const tgt = countJobs.reduce((s,j)=>s + Number(j.targetCount||0), 0);
          const pct = tgt > 0 ? Math.round(cur/tgt*100) : null;
          const activeCnt = jobs.filter(j => (j.kind==='서브'||j.kind==='순위') && !isJobDone(j)).length;
          const dueDays = jobs.filter(j => j.dueDate && !isJobDone(j))
            .map(j => daysLeft(j.dueDate)).filter(d => d !== null && d <= 3);
          const minDue  = dueDays.length ? Math.min(...dueDays) : null;
          const review  = (data.reviewTargets||[]).find(r => r.clientId === c.clientId);
          return (

  function App() {
    const [data,       setData]       = useState(()=>loadData());
    const [view,       setView]       = useState('main');
    const [clientView, setClientView] = useState(()=> safeStorage.getItem('ui_client_view') || 'list');
    useEffect(()=>{ safeStorage.setItem('ui_client_view', clientView); }, [clientView]);
    const [selId,      setSelId]      = useState(null);
    const [modal,      setModal]      = useState({ open:false });
    const [syncStatus, setSyncStatus] = useState('idle');
    const [adminOpen,  setAdminOpen]  = useState(false);

    // ── 계약 upsert ──
    function upsertContract(clientId, fields) {
      mutate(d => {
        const existing = (d.contracts||[]).findIndex(c => c.clientId === clientId);
        let updated;
        if (existing >= 0) {
          updated = (d.contracts||[]).map(c => c.clientId === clientId ? { ...c, ...fields } : c);
        } else {
          updated = [...(d.contracts||[]), { clientId, ...fields }];
        }
        return { ...d, contracts: updated };
      });
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'upsertContract', clientId, ...fields })
      }).catch(e => console.warn('upsertContract Sheets 오류:', e));
    }

    useEffect(() => { saveData(data); }, [data]);

    const mutate = useCallback((fn) => setData(prev => fn(prev)), []);

    const handleSync = useCallback(() => {
      setSyncStatus('loading');
      fetchFromSheets()
        .then(sheetsData => {
          mutate(prev => {
            // ── 안전 병합 헬퍼: Sheets가 비어있으면 반드시 로컬 값 유지 ──
            const safeArr = (sheetsArr, prevArr) =>
              (sheetsArr && sheetsArr.length > 0) ? sheetsArr
              : (prevArr  && prevArr.length  > 0) ? prevArr
              : [];

            return {
              ...prev,  // ← 로컬 전체를 base로 (Sheets 누락 필드로 로컬 덮어쓰기 방지)

              // 거래처: DEFAULT_DATA 순서 + Sheets + 로컬 3-way merge
              clients:     mergeClients(DEFAULT_DATA.clients, sheetsData.clients || [], prev.clients || []),

              // 계정정보: 로컬 전용 — 절대 Sheets로 교체 안 함
              credentials: prev.credentials ?? DEFAULT_CREDENTIALS,

              // 계약: Sheets 우선, 비어있으면 로컬 유지
              contracts:   safeArr(sheetsData.contracts, prev.contracts),

              // 공통업무: Sheets 우선, 비어있으면 로컬 유지
              commonTasks: safeArr(sheetsData.commonTasks, prev.commonTasks),

              // 발행 글: Sheets 우선, 비어있으면 로컬 유지 (Sheets 초기화로 날아가지 않도록)
              postLogs:    safeArr(sheetsData.postLogs, prev.postLogs),

              // 로그: Sheets 우선, 비어있으면 로컬 유지
              logs:        safeArr(sheetsData.logs, prev.logs),

              // 비용: Sheets 우선, 비어있으면 로컬 유지
              expenses:    safeArr(sheetsData.expenses, prev.expenses),

              // 글 보관함: Sheets 우선, 비어있으면 로컬 유지
              drafts:      safeArr(sheetsData.drafts, prev.drafts),

              // 상담내역: Sheets 우선, 비어있으면 로컬 유지
              consults:    safeArr(sheetsData.consults, prev.consults),

              // 방문자 리뷰 모니터링: Sheets 우선, 비어있으면 로컬 유지
              reviewTargets: safeArr(sheetsData.reviewTargets, prev.reviewTargets),

              // ── 월별 업무 병합 전략 ──────────────────────────────────────────
              // 서브/순위 업무: Sheets 값을 기준으로 동기화
              //   → 로컬 파일과 GitHub Pages의 진행중/완료 상태를 일치시킴
              //   → API 응답 전 임시 생성된 로컬 업무(syncPending)만 보존
              // 필수(메인) 업무: Sheets 우선, 없으면 로컬 유지
              //   → Sheets에서 진행상황 업데이트가 로컬로 반영됨
              // ─────────────────────────────────────────────────────────────────
              monthlyJobs: (()=>{
                // DEFAULT_DATA 기준으로 서브/순위 jobId Set 구성
                // (Sheets 데이터의 kind 필드가 누락될 수 있으므로 DEFAULT_DATA 기준 판단)
                const defaultSubIds = new Set(
                  DEFAULT_DATA.monthlyJobs
                    .filter(dj => dj.kind === '서브' || dj.kind === '순위')
                    .map(dj => dj.jobId)
                );

                const sheetJobs = sheetsData.monthlyJobs || [];
                const hasSheetJobs = sheetJobs.length > 0;
                const isSubLike = j => j.kind === '서브' || j.kind === '순위' || defaultSubIds.has(j.jobId);

                // 1) 서브/순위: Sheets 기준. 단, addSubJob 응답 전 임시 로컬 업무만 유지
                const localSubs = (prev.monthlyJobs || [])
                  .filter(isSubLike);
                const sheetSubs = hasSheetJobs
                  ? sheetJobs.filter(isSubLike)
                  : null;
                const sheetSubIds = new Set((sheetSubs || []).map(j => j.jobId));
                const pendingLocalSubs = localSubs
                  .filter(j => j.syncPending && !sheetSubIds.has(j.jobId));
                const subBase = sheetSubs
                  ? [...sheetSubs, ...pendingLocalSubs]
                  : localSubs;

                // 2) 필수(메인): Sheets에서 서브/순위 제거 후 사용
                const sheetsMain = hasSheetJobs
                  ? sheetJobs.filter(sj => !isSubLike(sj))
                  : null;

                const mainBase = (sheetsMain && sheetsMain.length > 0)
                  ? sheetsMain.map(sj => {
                      const lj = (prev.monthlyJobs || []).find(j => j.jobId === sj.jobId);
                      if (!lj) return sj;
                      return {
                        ...sj,
                        dueDate:      lj.dueDate ?? sj.dueDate,
                        currentCount: (sj.currentCount != null && lj.currentCount != null)
                          ? Math.max(Number(sj.currentCount), Number(lj.currentCount))
                          : sj.currentCount ?? lj.currentCount,
                      };
                    })
                  : (prev.monthlyJobs || []).filter(j => !isSubLike(j));

                // 3) DEFAULT_DATA 메인 업무 중 Sheets/로컬 누락분 보완
                //    (로컬에 존재했던 것만 추가 — 완전 초기화 시 재유입 방지)
                const baseIds = new Set(mainBase.map(j => j.jobId));
                const prevIds = new Set((prev.monthlyJobs || []).map(j => j.jobId));
                const extras  = DEFAULT_DATA.monthlyJobs
                  .filter(dj => !isSubLike(dj))
                  .filter(dj => !baseIds.has(dj.jobId) && prevIds.has(dj.jobId));

                // 최종: 메인 + DEFAULT 보완 + Sheets 서브/순위 (순서: 메인→서브)
                return [...mainBase, ...extras, ...subBase];
              })(),
            };
          });

          // ── 동기화 완료 시 로컬 자동 백업 (IndexedDB) ──
          try {
            const backupKey = 'urbanplanad_backup_' + nowMonth();
            const currentRaw = safeStorage.getItem(STORAGE_KEY);
            if (currentRaw) safeStorage.setItem(backupKey, currentRaw);
          } catch(e) {}

          setSyncStatus('ok');
        })
        .catch(e => { console.error('Sheets 연동 오류:', e); setSyncStatus('error'); });
    }, []);

    // ── 월별 초기화 (자동 실행 제거 — 수동 버튼으로만 실행) ──
    // ※ 자동 초기화 비활성화: 월 전환 시 데이터 소실 방지
    // ※ 설정 탭 > "다음 달 초기화" 버튼으로만 실행 가능
    useEffect(() => {
      // MONTH_KEY만 현재 월로 업데이트 (자동 초기화 없음)
      safeStorage.setItem(MONTH_KEY, nowMonth());
    }, []);

    // ── 수동 월별 초기화 함수 (설정 탭 버튼에서 호출) ──
    async function handleMonthlyReset() {
      if (!confirm('⚠️ 이달 업무를 다음 달 기준으로 초기화합니다.\n\n완료된 서브업무만 삭제되고, 완료 체크하지 않은 서브업무는 다음 달로 이월됩니다.\n노형아름다운피부과·벨르몬성형외과 채널별 상담 내역은 통계로 백업 후 초기화됩니다.\n계속하시겠습니까?')) return;
      if (!confirm('정말 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;

      // ── 1) 채널별 상담 내역 백업 (btskin / belrmon) ──
      // 초기화는 이번 달 업무를 닫는 작업이므로 백업 월 = 이전 달 (전달 데이터 보존)
      const backupMonth = prevMonth();
      const CONSULT_TARGETS = ['btskin', 'belrmon'];
      const newHistories = CONSULT_TARGETS.map(cid => {
        const raw     = safeStorage.getItem('consult-v1-' + cid);
        const records = raw ? (() => { try { return JSON.parse(raw); } catch { return []; } })() : [];
        const byChannel = {};
        records.forEach(r => { byChannel[r.channel] = (byChannel[r.channel] || 0) + 1; });
        const clientName = (data.clients || []).find(c => c.clientId === cid)?.clientName || cid;
        return {
          month:      backupMonth,
          clientId:   cid,
          clientName,
          records,
          savedAt:    new Date().toISOString(),
          summary:    { total: records.length, byChannel },
        };
      }).filter(h => h.records.length > 0);  // 데이터 없으면 백업 항목 생성 안 함

      const postJson = async (body) => {
        const res = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          body: JSON.stringify(body)
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || `${body.action} 실패`);
        return result;
      };

      // ── 2) Sheets 초기화 먼저 완료 확인 ──
      // 월초에 전월 보고서를 마친 뒤 누르는 전제이므로, 새 운영월은 현재 월(nowMonth)이다.
      const isCompletedSubJob = (job) => String(job.note || '').trim().startsWith('완료');
      const allSubs = (data.monthlyJobs || []).filter(j => j.kind === '서브');
      const carryoverSubs = allSubs.filter(j => !isCompletedSubJob(j));
      const completedServerSubs = allSubs.filter(j => !j.syncPending && isCompletedSubJob(j));
      const deleteCompletedSubJob = async (job) => {
        try {
          return await postJson({ action: 'deleteSubJob', jobId: job.jobId });
        } catch (e) {
          if (String(e.message || e).includes('Job not found:')) {
            console.warn('monthlyReset: 이미 Sheets에 없는 완료 서브업무로 간주:', job.jobId);
            return { success: true, alreadyDeleted: true, jobId: job.jobId };
          }
          throw e;
        }
      };

      setSyncStatus('loading');
      try {
        await Promise.all(completedServerSubs.map(deleteCompletedSubJob));
        await postJson({ action: 'monthlyReset', month: nowMonth() });

        // live monthlyReset 내부 구현이 서브업무를 건드리더라도, 미완료 서브업무는 다시 보강한다.
        const afterReset = await fetchFromSheets();
        const afterIds = new Set((afterReset.monthlyJobs || []).map(j => j.jobId));
        const missingCarryovers = carryoverSubs.filter(j => !j.syncPending && !afterIds.has(j.jobId));

        await Promise.all(missingCarryovers.map(async (job) => {
          const added = await postJson({
            action: 'addSubJob',
            clientId: job.clientId,
            title: job.title,
            dueDate: job.dueDate || null,
          });
          if ((job.note || job.dueDate) && added.jobId) {
            await postJson({
              action: 'updateSubJob',
              jobId: added.jobId,
              title: job.title,
              note: job.note || '',
              dueDate: job.dueDate || null,
            });
          }
        }));
      } catch (e) {
        console.error('monthlyReset 오류:', e);
        setSyncStatus('error');
        alert(`초기화에 실패했습니다.\n\nSheets 반영이 확인되지 않아 로컬 화면도 초기화하지 않았습니다.\n잠시 후 다시 시도해 주세요.\n\n오류: ${e.message || e}`);
        return;
      }

      // ── 3) 상담 localStorage 초기화 ──
      CONSULT_TARGETS.forEach(cid => {
        safeStorage.setItem('consult-v1-' + cid, '[]');
      });

      const mergeConsultHistories = (existing, additions) => {
        const next = [...(existing || [])];
        (additions || []).forEach(add => {
          const idx = next.findIndex(h => h.clientId === add.clientId && h.month === add.month);
          if (idx < 0) {
            next.push(add);
            return;
          }

          const prevItem = next[idx];
          const prevRecords = prevItem.records || [];
          const addRecords = add.records || [];
          const shouldReplaceSummarySeed = prevItem.summaryOnly && addRecords.length > 0;
          const baseRecords = shouldReplaceSummarySeed ? [] : prevRecords;
          const prevIds = new Set(prevRecords.map(r => r.id));
          next[idx] = {
            ...prevItem,
            ...add,
            records: [
              ...baseRecords,
              ...addRecords.filter(r => shouldReplaceSummarySeed || !prevIds.has(r.id)),
            ],
            summaryOnly: add.summaryOnly || false,
            savedAt: add.savedAt || prevItem.savedAt,
          };
        });
        return next;
      };

      // ── 4) 상태 업데이트 (완료된 서브업무만 제거 + 백업 저장) ──
      mutate(prev => ({
        ...prev,
        monthlyJobs: prev.monthlyJobs
          .filter(j => j.kind !== '서브' || !isCompletedSubJob(j))
          .map(j => ({
            ...j,
            currentCount: j.targetCount != null ? 0 : j.currentCount,
            note:         j.note === '완료' ? '' : j.note,
          })),
        postLogs:         [],
        consultHistories: mergeConsultHistories(prev.consultHistories || [], newHistories),
      }));

      const backupMsg = newHistories.length > 0
        ? `\n\n📊 상담 내역 백업 완료:\n` + newHistories.map(h => `  • ${h.clientName}: ${h.summary.total}건`).join('\n')
        : '';
      setSyncStatus('ok');
      alert('초기화 완료!' + backupMsg);
    }

    // ── 과거 월 라벨 교정 마이그레이션 비활성화 ──
    // 2026-04/2026-05 상담 요약은 아래 consult_summary_seed_v1에서 명시 관리한다.
    useEffect(() => {

            },
            {

          ],
        },
        {
          month: '2026-04',

          summaryOnly: true,
          summary: { total: 20, byChannel: { '라인': 13, '인스타': 7 } },
          records: [
            {
              id: 'sum-belrmon-2026-04-line',
              channel: '라인',
              nickname: '4월 라인 상담 요약',
              date: '2026-04-30',
              content: 'LINE 비즈니스 상담 13건. 예약확정 2건 포함.',
            },

          records: [
            {
              id: 'sum-btskin-2026-05-wechat',
              channel: '위챗',
              nickname: '5월 위챗 상담 요약',
              date: '2026-05-31',
              content: '위챗 상담 30건. 5월 다채널 상담 중 가장 큰 비중.',
            },
            {
              id: 'sum-btskin-2026-05-line',
              channel: '라인',
              nickname: '5월 라인 상담 요약',
              date: '2026-05-31',
              content: '라인 상담 11건. 위챗 다음으로 많은 상담 채널.',
            },
            {
              id: 'sum-btskin-2026-05-insta',
              channel: '인스타',
              nickname: '5월 인스타 상담 요약',
              date: '2026-05-31',
              content: '인스타 상담 3건. 위챗·라인과 함께 다채널 문의 흐름에 포함.',
            },
          ],
        },
        {
          month: '2026-04',
          clientId: 'btskin',
          clientName: '노형아름다운피부과',
          summaryOnly: true,
          summary: { total: 31, byChannel: { '위챗': 28, '라인': 3 } },
          records: [
            {
              id: 'sum-btskin-2026-04-wechat',
              channel: '위챗',
              nickname: '4월 위챗 상담 요약',
              date: '2026-04-30',
              content: '위챗 상담 28건. 외국인 채널 상담의 중심 채널로 확인됨.',
            },
            {
              id: 'sum-btskin-2026-04-line',
              channel: '라인',
              nickname: '4월 라인 상담 요약',
              date: '2026-04-30',
              content: '라인 상담 3건. 위챗 중심 상담 흐름을 보조하는 채널로 집계됨.',
            },
          ],
        },
      ].map(item => ({ ...item, savedAt: new Date().toISOString() }));

      mutate(prev => {
        const histories = prev.consultHistories || [];
        const next = [...histories];

        seeds.forEach(seed => {
          const idx = next.findIndex(h => h.clientId === seed.clientId && h.month === seed.month);
          if (idx < 0) {
            next.push(seed);
            return;
          }

          const existing = next[idx];
          const existingRecords = existing.records || [];
          const existingRecordIds = new Set(existingRecords.map(r => r.id));
          const hasExistingRecords = existingRecords.length > 0;
          next[idx] = {
            ...existing,
            ...seed,
            records: [
              ...existingRecords,
              ...seed.records.filter(r => !existingRecordIds.has(r.id)),
            ],
            summaryOnly: hasExistingRecords ? Boolean(existing.summaryOnly) : seed.summaryOnly,
            savedAt: existing.savedAt || seed.savedAt,
          };
        });

        return { ...prev, consultHistories: next };
      });

      safeStorage.setItem(MIG_KEY, '1');
    }, []);

    // ── 일회성 마이그레이션: 노형아름다운피부과 4월/5월 상담 요약 월 교정 ──
    useEffect(() => {
      const MIG_KEY = 'consult_btskin_month_swap_fix_v1';
      if (safeStorage.getItem(MIG_KEY)) return;

      const corrections = {
        '2026-05': {
          summaryOnly: true,
          summary: { total: 44, byChannel: { '위챗': 30, '라인': 11, '인스타': 3 } },
          records: [
            { id:'sum-btskin-2026-05-wechat', channel:'위챗', nickname:'5월 위챗 상담 요약', date:'2026-05-31', content:'위챗 상담 30건. 5월 다채널 상담 중 가장 큰 비중.' },
            { id:'sum-btskin-2026-05-line', channel:'라인', nickname:'5월 라인 상담 요약', date:'2026-05-31', content:'라인 상담 11건. 위챗 다음으로 많은 상담 채널.' },
            { id:'sum-btskin-2026-05-insta', channel:'인스타', nickname:'5월 인스타 상담 요약', date:'2026-05-31', content:'인스타 상담 3건. 위챗·라인과 함께 다채널 문의 흐름에 포함.' },
          ],
        },
        '2026-04': {
          summaryOnly: true,
          summary: { total: 31, byChannel: { '위챗': 28, '라인': 3 } },
          records: [
            { id:'sum-btskin-2026-04-wechat', channel:'위챗', nickname:'4월 위챗 상담 요약', date:'2026-04-30', content:'위챗 상담 28건. 외국인 채널 상담의 중심 채널로 확인됨.' },
            { id:'sum-btskin-2026-04-line', channel:'라인', nickname:'4월 라인 상담 요약', date:'2026-04-30', content:'라인 상담 3건. 위챗 중심 상담 흐름을 보조하는 채널로 집계됨.' },
          ],
        },
      };

      mutate(prev => {
        const histories = prev.consultHistories || [];
        const next = histories.filter(h =>
          !(h.clientId === 'btskin' && ['2026-04', '2026-05'].includes(h.month))
        );

        Object.entries(corrections).forEach(([month, correction]) => {
          next.push({
            month,
            clientId: 'btskin',
            clientName: '노형아름다운피부과',
            savedAt: new Date().toISOString(),
            ...correction,
          });
        });

        return { ...prev, consultHistories: next };
      });

      safeStorage.setItem(MIG_KEY, '1');
    }, []);

    // 페이지 로드 시 자동 동기화 (loading 상태 즉시 표시)
    useEffect(() => { setSyncStatus('loading'); handleSync(); }, []);

    // ── 자동 로그 (업무 완료/카운트 시 자동 기록) ──
    function autoLog(clientId, message) {
      const newLog = { logId: `l-${uid()}`, clientId, createdAt: today(), message };
      mutate(d => ({ ...d, logs: [...(d.logs||[]), newLog] }));
      mutate(d => ({ ...d, clients: d.clients.map(c => c.clientId===clientId ? {...c, lastUpdated:today()} : c) }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addLog', clientId, message })
      }).catch(e => console.warn('autoLog 오류:', e));
    }

    // ── 로그 CRUD ──
    function addLog(logData, context) {
      const newL = { logId:`l-${uid()}`, clientId:context.clientId, createdAt:today(), ...logData };
      mutate(d=>({...d, logs:[...d.logs, newL]}));
      mutate(d=>({...d, clients:d.clients.map(c=>c.clientId===context.clientId?{...c,lastUpdated:today()}:c)}));
      // Sheets 동기화 (수동 로그도 저장)
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addLog', clientId: context.clientId, message: logData.message || '' })
      }).catch(e => console.warn('addLog Sheets 오류:', e));
    }
    function deleteLog(id) {
      mutate(d=>({...d, logs:d.logs.filter(l=>l.logId!==id)}));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deleteLog', logId: id })
      }).catch(e => console.warn('deleteLog Sheets 오류:', e));
    }

    // ── Modal ──
    function openModal(type, mode, formData, context) {
      setModal({ open:true, type, mode, formData, context });
    }
    function closeModal() { setModal({ open:false }); }

    function handleSave(type, mode, form, context) {
      if(type==='log')        addLog(form, context);
      if(type==='add-client') addClient(form);
      closeModal();
    }
    function handleDelete(context) {
      if(context.type==='log')  deleteLog(context.id);
      if(context.type==='post') deletePost(context.id);
      closeModal();
    }

    // ── 발행 글 삭제 ──
    function deletePost(logId) {
      mutate(d => ({ ...d, postLogs: (d.postLogs||[]).filter(p => p.logId !== logId) }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deletePost', logId })
      }).catch(e => console.warn('deletePost Sheets 오류:', e));
    }

    // ── 공통업무 CRUD ──
    function addCommonGroup(title) {
      const taskId = 'ct-g-' + uid();
      const newGroup = { taskId, title, kind: 'group', parentId: null, done: false, dueDate: null, createdAt: today() };
      mutate(d => ({ ...d, commonTasks: [...(d.commonTasks||[]), newGroup] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskAdd', taskId, title, kind: 'group', parentId: null })
      }).catch(e => console.warn('commonTaskAdd(group) 오류:', e));
    }
    function addCommonTask(parentId, title, dueDate) {
      const taskId = 'ct-' + uid();
      const newTask = { taskId, title, kind: 'task', parentId: parentId || null, done: false, dueDate: dueDate || null, createdAt: today() };
      mutate(d => ({ ...d, commonTasks: [...(d.commonTasks||[]), newTask] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskAdd', taskId, title, kind: 'task', parentId: parentId || null, dueDate: dueDate || null })
      }).catch(e => console.warn('commonTaskAdd(task) 오류:', e));
    }
    function toggleCommonTask(taskId, done) {
      mutate(d => ({
        ...d,
        commonTasks: (d.commonTasks||[]).map(t => t.taskId===taskId ? {...t, done} : t)
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskToggle', taskId, done })
      }).catch(e => console.warn('commonTaskToggle 오류:', e));
    }
    function deleteCommonTask(taskId) {
      // 그룹 삭제 시 하위 태스크도 함께 제거
      mutate(d => {
        const target = (d.commonTasks||[]).find(t => t.taskId === taskId);
        const toDelete = new Set([taskId]);
        if (target && target.kind === 'group') {
          (d.commonTasks||[]).forEach(t => { if (t.parentId === taskId) toDelete.add(t.taskId); });
        }
        toDelete.forEach(id => {
          if (id !== taskId) {
            fetch(API_URL, { method:'POST', redirect:'follow', body: JSON.stringify({ action:'commonTaskDelete', taskId: id }) }).catch(()=>{});
          }
        });
        return { ...d, commonTasks: (d.commonTasks||[]).filter(t => !toDelete.has(t.taskId)) };
      });
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskDelete', taskId })
      }).catch(e => console.warn('commonTaskDelete 오류:', e));
    }
    function editCommonTask(taskId, title, dueDate) {
      mutate(d => ({
        ...d,
        commonTasks: (d.commonTasks||[]).map(t => t.taskId===taskId ? { ...t, title, dueDate: dueDate !== undefined ? dueDate : t.dueDate } : t)
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskUpdate', taskId, title, dueDate: dueDate || null })
      }).catch(e => console.warn('commonTaskUpdate 오류:', e));
    }

    // ── 캘린더 연동 CRUD ──
    function addCalendarSubJob(clientId, title, dueDate) {
      const tempId = 'mj-dyn-' + Date.now().toString(36);
      const newJob = {
        jobId: tempId,
        clientId,
        title,
        kind: '서브',
        targetCount: null,
        currentCount: null,
        unit: null,
        dueDate: dueDate || null,
        note: ''
      };
      mutate(d => ({ ...d, monthlyJobs: [...(d.monthlyJobs||[]), newJob] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addSubJob', clientId, title, dueDate: dueDate || null })
      }).then(r=>r.json()).then(res => {
        if (res.success && res.jobId) {
          mutate(d => ({ ...d, monthlyJobs: (d.monthlyJobs||[]).map(j => j.jobId === tempId ? { ...j, jobId: res.jobId } : j) }));
        }
      }).catch(e => console.warn('calendar addSubJob 오류:', e));
    }
    function updateCalendarJob(jobId, fields) {
      const clean = {
        ...fields,
        dueDate: fields.dueDate ? normalizeDate(fields.dueDate) : null,
      };
      mutate(d => ({
        ...d,
        monthlyJobs: (d.monthlyJobs||[]).map(j => j.jobId === jobId ? { ...j, ...clean } : j)
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateSubJob', jobId, ...clean })
      }).catch(e => console.warn('calendar updateJob 오류:', e));
    }
    function deleteCalendarJob(jobId) {
      const job = (data.monthlyJobs||[]).find(j => j.jobId === jobId);
      if (job && job.kind === '필수') {
        updateCalendarJob(jobId, { title: job.title, note: job.note || '', dueDate: null });
        return;
      }
      mutate(d => ({ ...d, monthlyJobs: (d.monthlyJobs||[]).filter(j => j.jobId !== jobId) }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deleteSubJob', jobId })
      }).catch(e => console.warn('calendar deleteJob 오류:', e));
    }

    // ── 자격증명 CRUD (로컬 전용) ──
    function addCredential(clientId, cred) {
      const credId = 'cr-' + uid();
      mutate(d => ({
        ...d,
        credentials: {
          ...(d.credentials||{}),
          [clientId]: [...((d.credentials||{})[clientId]||[]), { credId, ...cred }]
        }
      }));
    }
    function deleteCredential(clientId, credId) {
      mutate(d => ({
        ...d,
        credentials: {
          ...(d.credentials||{}),
          [clientId]: ((d.credentials||{})[clientId]||[]).filter(c => c.credId!==credId)
        }
      }));
    }

    // ── 거래처 CRUD ──
    function addClient(fields) {
      const clientId = 'cl-' + uid();
      const newClient = {
        clientId,
        clientName:    (fields.clientName||'').trim(),
        specialty:     fields.specialty || '기타',
        mainContact:   (fields.mainContact||'').trim(),
        priorityLevel: fields.priorityLevel || '중간',
        reportFile:    (fields.reportFile||'').trim(),
        lastUpdated:   today(),
      };
      mutate(d => ({ ...d, clients: [...d.clients, newClient] }));
      // Sheets에도 저장 — sync 후에도 유지되도록
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addClient', ...newClient })
      }).catch(e => console.warn('addClient Sheets 오류:', e));
    }
    function updateClient(clientId, fields) {
      mutate(d => ({
        ...d,
        clients: d.clients.map(c => c.clientId===clientId ? { ...c, ...fields } : c)
      }));
      // Sheets 업데이트
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateClient', clientId, ...fields })
      }).catch(e => console.warn('updateClient Sheets 오류:', e));
    }
    function handleDeleteClient(clientId) {
      mutate(d => ({
        ...d,
        clients:     d.clients.filter(c => c.clientId !== clientId),
        monthlyJobs: d.monthlyJobs.filter(j => j.clientId !== clientId),
        logs:        d.logs.filter(l => l.clientId !== clientId),
        postLogs:    (d.postLogs||[]).filter(p => p.clientId !== clientId),
      }));
      setView('main');
      // Sheets에서도 삭제
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deleteClient', clientId })
      }).catch(e => console.warn('deleteClient Sheets 오류:', e));
    }

    // ── Client 그룹 분리 ──
    const { topClients, bottomClients } = useMemo(() => {
      const hasFessential = (c) => (data.monthlyJobs||[]).some(j => j.clientId===c.clientId && j.kind==='필수');
      return {
        topClients:    data.clients.filter(hasFessential),
        bottomClients: data.clients.filter(c => !hasFessential(c)),
      };
    }, [data.clients, data.monthlyJobs]);

    const selectedClient = selId ? data.clients.find(c=>c.clientId===selId) : null;
    const goClient = useCallback((id) => {
      setSelId(id);
      setView('client');
    }, []);

    function saveDashboardBackup() {
      if (hasCredentialEntries(data.credentials)) {
        const ok = confirm('백업 파일에 계정/비밀번호 메모가 포함됩니다.\n외부 공유용이 아니라 로컬 보관용으로만 사용하세요.\n계속 저장하시겠습니까?');
        if (!ok) return;
      }
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `dashboard_backup_${nowMonth()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    const cardGrid = (clients) => (
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:16}}>
        {clients.map(client=>(
          <ClientCard
            key={client.clientId}
            client={client}
            data={data}
            onSelect={(id)=>{ setSelId(id); setView('client'); }}
          />
        ))}
      </div>
    );

    return (
      <div className="app-shell">
        <Sidebar
          view={view}
          selectedClient={selectedClient}
          clients={data.clients || []}
          onHome={()=>setView('main')}
          onGoClient={goClient}
          onDrafts={()=>setView('drafts')}
          onRevenue={()=>setView('revenue')}
          syncStatus={syncStatus}
          onSync={handleSync}
        />
        <div className="app-content">

        {view==='main' && (
          <div style={{maxWidth:1200,margin:'0 auto',padding:'26px 28px'}}>

            <TodayFocus
              data={data}
              syncStatus={syncStatus}
              onGoClient={goClient}
              onSync={handleSync}
            />

            <MainKpis data={data} />

            {/* 내 사업 공통업무 + 업무 캘린더 */}
            <div className="main-top-grid">
              <div style={{minWidth:0}}>
                <CommonTasksCard
                  tasks={data.commonTasks || []}
                  onAddGroup={addCommonGroup}
                  onAddTask={addCommonTask}
                  onToggle={toggleCommonTask}
                  onDelete={deleteCommonTask}
                  onEdit={editCommonTask}
                />
                <CredentialsSection
                  clientId="__business"
                  credentials={data.credentials || {}}
                  onAdd={addCredential}
                  onDelete={deleteCredential}
                  title="내 사업 계정 / 비밀번호 메모"
                />
              </div>
              <CalendarCard
                data={data}
                onAddCommonTask={(title,dueDate)=>addCommonTask(null,title,dueDate)}
                onAddClientSubJob={addCalendarSubJob}
                onUpdateCommonTask={editCommonTask}
                onDeleteCommonTask={deleteCommonTask}
                onUpdateJob={updateCalendarJob}
                onDeleteJob={deleteCalendarJob}
                onGoClient={(id)=>{ setSelId(id); setView('client'); }}
              />
            </div>

            {/* ── 거래처 현황: 섹션 헤더 + 리스트/카드 토글 ── */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'24px 0 12px',gap:10,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'baseline',gap:8}}>
                <span style={{fontSize:15,fontWeight:800,color:'var(--ink)'}}>거래처 현황</span>
                <span style={{fontSize:12,color:'var(--text-3)',fontWeight:600}}>{(data.clients||[]).length}곳</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div className="seg">
                  <button className={clientView==='list' ? 'active' : ''} onClick={()=>setClientView('list')}>
                    <Icon name="rows" size={12} /> 리스트
                  </button>
                  <button className={clientView==='card' ? 'active' : ''} onClick={()=>setClientView('card')}>
                    <Icon name="cards" size={12} /> 카드
                  </button>
                </div>
                <button
                  onClick={()=>openModal('add-client','add',{specialty:'기타',priorityLevel:'중간'},{})}
                  style={{display:'inline-flex',alignItems:'center',gap:5,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 12px',fontSize:12,fontWeight:700,color:'var(--text-2)',cursor:'pointer'}}>
                  <Icon name="plus" size={12} /> 거래처 추가
                </button>
              </div>
            </div>

            {clientView==='list' ? (
              <ClientTable
                clients={[...topClients, ...bottomClients]}
                data={data}
                onSelect={goClient}
              />
            ) : (
              <>
                {/* 필수업무 거래처 */}
                {topClients.length > 0 && cardGrid(topClients)}

                {/* 구분선 */}
                {topClients.length > 0 && bottomClients.length > 0 && (
                  <div style={{display:'flex',alignItems:'center',gap:12,margin:'24px 0'}}>
                    <div style={{flex:1,height:1,background:'var(--border)'}} />
                    <span style={{fontSize:11,fontWeight:700,color:'var(--text-3)',letterSpacing:'1px',whiteSpace:'nowrap'}}>순위 관리 거래처</span>
                    <div style={{flex:1,height:1,background:'var(--border)'}} />
                  </div>
                )}

                {/* 순위작업만 거래처 */}
                {bottomClients.length > 0 && cardGrid(bottomClients)}
              </>
            )}

          </div>
        )}

        {view==='drafts' && (
          <DraftsView />
        )}

        {view==='revenue' && (
          <RevenueView data={data} />
        )}

        {view==='client' && selectedClient && (
          <ClientDetailView
            client={selectedClient}
            data={data}
            mutate={mutate}
            onOpenModal={openModal}
            autoLog={autoLog}
            onAddCredential={addCredential}
            onDeleteCredential={deleteCredential}
            onDeletePost={deletePost}
            onUpdateClient={updateClient}
            onDeleteClient={handleDeleteClient}
          />
        )}

        {modal.open && (
          <Modal modal={modal} onClose={closeModal} onSave={handleSave} onDelete={handleDelete} />
        )}

        {/* 관리 버튼 */}
        <div style={{position:'fixed',bottom:20,right:20,display:'flex',flexDirection:'column',gap:8,alignItems:'flex-end'}}>
          {adminOpen && (
            <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,boxShadow:'0 16px 36px rgba(15,23,42,0.18)',padding:10,display:'flex',flexDirection:'column',gap:7,minWidth:176}}>
              {view==='main' && (
                <>
                  <button
                    style={{display:'flex',alignItems:'center',gap:7,background:'var(--purple)',color:'#fff',border:'none',borderRadius:8,padding:'8px 12px',fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}}
                    onClick={()=>{ setAdminOpen(false); handleMonthlyReset(); }}>
                    <Icon name="calendar" size={13} /> 다음 달 초기화
                  </button>
                  <button
                    style={{display:'flex',alignItems:'center',gap:7,background:'var(--surface-2)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px',fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}}
                    onClick={()=>{ if(confirm('⚠️ 로컬 데이터를 기본값으로 초기화합니다. 계속하시겠습니까?') && confirm('정말 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) { safeStorage.removeItem(STORAGE_KEY); setData({...DEFAULT_DATA, credentials: DEFAULT_CREDENTIALS}); setAdminOpen(false); } }}>
                    <Icon name="restore" size={13} /> 데이터 초기화
                  </button>
                </>
              )}
              <button
                style={{display:'flex',alignItems:'center',gap:7,background:'var(--surface-2)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px',fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}}
                onClick={()=>{ saveDashboardBackup(); setAdminOpen(false); }}>
                <Icon name="download" size={13} /> 백업 저장
              </button>
              <button
                style={{display:'flex',alignItems:'center',gap:7,background:'var(--surface-2)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px',fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}}
                onClick={()=>{
                  // 이전 달 백업 목록 표시
                  const backups = [];
                  for(let i=0;i<safeStorage.length;i++){
                    const k=safeStorage.key(i);
                    if(k && k.startsWith('urbanplanad_backup_')) backups.push(k);
                  }
                  backups.sort().reverse();
                  if(backups.length===0){ alert('저장된 자동 백업이 없습니다.\n동기화가 한 번 이상 완료된 후 자동 백업이 생성됩니다.'); return; }
                  const list = backups.map((k,i)=>`${i+1}. ${k.replace('urbanplanad_backup_','')}`).join('\n');
                  const choice = prompt(`복원할 백업을 선택하세요 (번호 입력):\n\n${list}`);
                  const idx = parseInt(choice)-1;
                  if(isNaN(idx)||idx<0||idx>=backups.length){ alert('취소되었습니다.'); return; }
                  if(!confirm(`[${backups[idx].replace('urbanplanad_backup_','')}] 백업으로 복원합니까?\n현재 데이터가 덮어씌워집니다.`)) return;
                  const raw=safeStorage.getItem(backups[idx]);
                  if(!raw){ alert('백업 데이터를 읽을 수 없습니다.'); return; }
                  safeStorage.setItem(STORAGE_KEY, raw);
                  setData(JSON.parse(raw));
                  setAdminOpen(false);
                  alert('✅ 복원 완료! 페이지를 새로고침합니다.');
                  location.reload();
                }}>
                <Icon name="restore" size={13} /> 백업 복원
              </button>
            </div>
          )}
          <button
            aria-expanded={adminOpen}
            style={{display:'flex',alignItems:'center',gap:6,background:'var(--navy)',color:'#fff',border:'1px solid rgba(255,255,255,0.15)',borderRadius:20,padding:'8px 15px',fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit',boxShadow:'var(--shadow-md)'}}
            onClick={()=>setAdminOpen(v=>!v)}>
            <Icon name="settings" size={13} /> 관리
          </button>
        </div>

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <!-- UI redesign 2026-06: 디자인 토큰 + 사이드바 레이아웃. 데이터/API 로직 변경 없음 -->
</body>
</html>
