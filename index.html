      .sort((a,b)=>b.publishedAt>a.publishedAt?1:-1);

    const specCls = SPEC_CLS[client.specialty]||'기타';
    const emoji   = SPEC_EMOJI[client.specialty]||'🏢';

    // 발행 글 인라인 편집 상태
    const [editingPost,    setEditingPost]    = useState(null);
    const [editPostTitle,  setEditPostTitle]  = useState('');
    const [editPostUrl,    setEditPostUrl]    = useState('');

    function startEditPost(pl) {
      setEditingPost(pl.logId);
      setEditPostTitle(pl.title || '');
      setEditPostUrl(pl.url    || '');
    }
    function saveEditPost(pl) {
      if (!editPostTitle.trim()) { setEditingPost(null); return; }
      mutate(d => ({
        ...d,
        postLogs: (d.postLogs||[]).map(p => p.logId===pl.logId
          ? { ...p, title: editPostTitle.trim(), url: editPostUrl.trim() }
          : p
        )
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updatePost', logId: pl.logId, title: editPostTitle.trim(), url: editPostUrl.trim() })
      }).catch(e => console.warn('updatePost 오류:', e));
      setEditingPost(null);
    }

    // 거래처 정보 인라인 편집 상태
    const [editingClient,  setEditingClient]  = useState(false);
    const [editCName,      setEditCName]      = useState(client.clientName);
    const [editContact,    setEditContact]    = useState(client.mainContact    || '');
    const [editReport,     setEditReport]     = useState(client.reportFile     || '');
    const [editSpecialty,  setEditSpecialty]  = useState(client.specialty      || '기타');
    const [editPriority,   setEditPriority]   = useState(client.priorityLevel  || '중간');

    function saveClientInfo() {
      onUpdateClient(client.clientId, {
        clientName:    editCName.trim()   || client.clientName,
        mainContact:   editContact.trim(),
        reportFile:    editReport.trim(),
        specialty:     editSpecialty,
        priorityLevel: editPriority,
      });
      setEditingClient(false);
    }

    return (
      <div style={{maxWidth:860,margin:'0 auto',padding:'28px 24px'}}>
        {/* Client info card */}
        <div style={{background:'#fff',borderRadius:14,border:'1px solid #e5e7eb',padding:'22px 24px',marginBottom:24}}>
          {editingClient ? (
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'#374151',marginBottom:10}}>거래처 정보 수정</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                <input value={editCName}   onChange={e=>setEditCName(e.target.value)}   placeholder="거래처명 *"   style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none'}} />
                <input value={editContact} onChange={e=>setEditContact(e.target.value)} placeholder="담당자명"     style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none'}} />
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                <select value={editSpecialty} onChange={e=>setEditSpecialty(e.target.value)}
                  style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fff'}}>
                  {SPECIALTIES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <select value={editPriority} onChange={e=>setEditPriority(e.target.value)}
                  style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fff'}}>
                  <option value="높음">우선순위: 높음</option>
                  <option value="중간">우선순위: 중간</option>
                  <option value="낮음">우선순위: 낮음</option>
                </select>
              </div>
              <input value={editReport}  onChange={e=>setEditReport(e.target.value)}  placeholder="보고서 파일명 (예: btskin.html)" style={{width:'100%',boxSizing:'border-box',padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:10}} />
              <div style={{display:'flex',gap:8,justifyContent:'space-between',alignItems:'center'}}>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={saveClientInfo} style={{padding:'6px 16px',background:'#1a1a2e',color:'#fff',border:'none',borderRadius:7,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>저장</button>
                  <button onClick={()=>setEditingClient(false)} style={{padding:'6px 12px',background:'none',border:'1px solid #d1d5db',borderRadius:7,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>취소</button>
                </div>
                <button onClick={()=>{ if(confirm(`"${client.clientName}" 거래처를 삭제합니까? 관련 업무/로그도 모두 제거됩니다.`)) onDeleteClient(client.clientId); }}
                  style={{padding:'6px 12px',background:'none',border:'1px solid #fca5a5',borderRadius:7,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#dc2626'}}>
                  🗑 거래처 삭제
                </button>
              </div>
            </div>
          ) : (
          <div style={{display:'flex',alignItems:'center',gap:18,flexWrap:'wrap'}}>
            <div style={{width:52,height:52,borderRadius:14,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,
              background: specCls==='피부과'?'#fde8ec':specCls==='성형외과'?'#ede9fe':specCls==='안과'?'#dbeafe':specCls==='치과'?'#d1fae5':specCls==='한의원'?'#dcfce7':'#fef3c7'}}>
              {emoji}
            </div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                <h1 style={{fontSize:20,fontWeight:900,color:'#1a1a2e',margin:0}}>{client.clientName}</h1>
                <SpecBadge specialty={client.specialty} />
              </div>
              <div style={{fontSize:11,color:'#9ca3af',marginTop:6}}>
                최근 업데이트 {fmtDate(client.lastUpdated)} &nbsp;·&nbsp; {client.mainContact}
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
              {client.reportFile && (
                <a href={client.reportFile} target="_blank" rel="noopener"
                  style={{background:'#1a1a2e',color:'#fff',padding:'8px 16px',borderRadius:8,textDecoration:'none',fontSize:13,fontWeight:700}}>
                  📋 보고서 열기
                </a>
              )}
              <button
                onClick={()=>{ setEditCName(client.clientName); setEditContact(client.mainContact||''); setEditReport(client.reportFile||''); setEditSpecialty(client.specialty||'기타'); setEditPriority(client.priorityLevel||'중간'); setEditingClient(true); }}
                style={{padding:'7px 12px',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:8,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280',fontWeight:600}}>
                ✎ 수정
              </button>
            </div>
          </div>
          )}
        </div>

        {/* 계정 / 비밀번호 메모 */}
        <CredentialsSection
          clientId={client.clientId}
          credentials={data.credentials || {}}
          onAdd={onAddCredential}
          onDelete={onDeleteCredential}
        />

        {/* Monthly Jobs */}
        <MonthlyJobsSection clientId={client.clientId} data={data} mutate={mutate} autoLog={autoLog} />

        {/* 이달의 발행 글 (postLogs) */}
        <div style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',padding:'18px 20px',marginBottom:20}}>
          <div className="section-title">📝 발행 글 목록 ({cPosts.length}건)</div>
          {cPosts.length === 0 && (
            <div style={{fontSize:12,color:'#9ca3af',padding:'6px 0'}}>
              각 업무 행의 ✏️ 버튼으로 발행 글을 기록하세요.
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            {cPosts.map((pl,i)=>{
              const job = (data.monthlyJobs||[]).find(j=>j.jobId===pl.jobId);
              return (
                <div key={pl.logId||i} style={{borderBottom: i<cPosts.length-1 ? '1px solid #f3f4f6':undefined}}>
                  {editingPost === pl.logId ? (
                    /* 인라인 편집 폼 */
                    <div style={{padding:'8px 0',display:'flex',flexDirection:'column',gap:5}}>
                      <input
                        value={editPostTitle}
                        onChange={e=>setEditPostTitle(e.target.value)}
                        placeholder="글 제목 *"
                        autoFocus
                        onKeyDown={e=>{ if(e.key==='Enter') saveEditPost(pl); if(e.key==='Escape') setEditingPost(null); }}
                        style={{width:'100%',boxSizing:'border-box',padding:'5px 9px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                      />
                      <input
                        value={editPostUrl}
                        onChange={e=>setEditPostUrl(e.target.value)}
                        placeholder="URL (선택)"
                        style={{width:'100%',boxSizing:'border-box',padding:'5px 9px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                      />
                      <div style={{display:'flex',gap:5}}>
                        <button onClick={()=>saveEditPost(pl)}
                          style={{padding:'4px 12px',background:'#1d4ed8',color:'#fff',border:'none',borderRadius:5,fontSize:11,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>저장</button>
                        <button onClick={()=>setEditingPost(null)}
                          style={{padding:'4px 10px',background:'none',border:'1px solid #d1d5db',borderRadius:5,fontSize:11,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>취소</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0'}}>
                      <div style={{width:6,height:6,borderRadius:'50%',background:'#3b82f6',flexShrink:0}} />
                      <div style={{flex:1,minWidth:0}}>
                        {pl.url ? (
                          <a href={pl.url} target="_blank" rel="noopener"
                            style={{fontSize:13,fontWeight:600,color:'#1d4ed8',textDecoration:'none',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                            {pl.title}
                          </a>
                        ) : (
                          <span style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pl.title}</span>
                        )}
                        <div style={{display:'flex',alignItems:'center',gap:6,marginTop:2}}>
                          {job && <span style={{fontSize:10,color:'#9ca3af'}}>{job.title}</span>}
                          {pl.channel && <span style={{fontSize:10,fontWeight:600,padding:'1px 6px',borderRadius:8,background:'#eff6ff',color:'#3b82f6'}}>{pl.channel}</span>}
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                        <span style={{fontSize:11,color:'#9ca3af'}}>{fmtDate(pl.publishedAt)}</span>
                        <button className="btn-icon" onClick={()=>startEditPost(pl)} title="수정"
                          style={{color:'#d1d5db',fontSize:11,padding:'2px 5px'}}>✎</button>
                        <button className="btn-icon"
                          onClick={() => onOpenModal('delete','del',{},{type:'post',id:pl.logId,name:'이 발행 글'})}
                          title="삭제" style={{color:'#d1d5db',fontSize:12,padding:'2px 5px'}}>🗑</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Deliverables */}
        {cDelivs.length > 0 && (
          <div style={{marginBottom:24}}>
            <div className="section-title">산출물 / 보고서 링크</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {cDelivs.map(d=>(
                <div key={d.deliverableId} style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:10,padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}>
                  <span style={{fontSize:20}}>📄</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:'#1a1a2e'}}>{d.title}</div>
                    <div style={{fontSize:11,color:'#9ca3af',marginTop:2}}>{d.contentPreview} · {fmtDate(d.updatedAt)}</div>
                  </div>
                  <span style={{fontSize:11,background:'#f3f4f6',padding:'2px 8px',borderRadius:20,color:'#6b7280',fontWeight:600}}>{d.kind}</span>
                  {d.reportFile && (
                    <a href={d.reportFile} target="_blank" rel="noopener"
                      style={{fontSize:12,fontWeight:700,color:'#1a1a2e',background:'#f0e6d3',padding:'5px 12px',borderRadius:6,textDecoration:'none',flexShrink:0}}>
                      열기 →
                    </a>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  DRAFTS VIEW (글 보관함)
  // ═══════════════════════════════════════════════
  const DRAFT_CLIENT_MAP = {
    btskin:'노형아름다운피부과', belrmon:'벨르몬성형외과', eyecare:'눈사랑안과',
    seoulup:'서울UP치과', echi:'이치과', igochi:'이고치과',
    jejuexpress:'제주인익스프레스', kyunghee:'365경희부부한의원'
  };
  const DRAFT_CHANNELS = ['홈페이지','블로그','위챗','인스타','라인','기타'];
  const DRAFT_CH_COLOR = {
    '홈페이지':'#1d4ed8','블로그':'#16a34a','위챗':'#15803d',
    '인스타':'#9333ea','라인':'#65a30d','기타':'#6b7280'
  };

  function DraftsView() {
    const [drafts,        setDrafts]        = useState([]);
    const [loading,       setLoading]       = useState(true);
    const [filterClient,  setFilterClient]  = useState('');
    const [filterChannel, setFilterChannel] = useState('');
    const [expandedId,    setExpandedId]    = useState(null);
    const [showAdd,       setShowAdd]       = useState(false);
    const [copied,        setCopied]        = useState(null);
    const [addForm,       setAddForm]       = useState({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' });

    function loadDrafts() {
      setLoading(true);
      fetch(API_URL + '?action=summary')
        .then(r => r.json())
        .then(d => {
          const list = (d.data?.drafts || []).slice().reverse();
          setDrafts(list);
          setLoading(false);
        })
        .catch(() => setLoading(false));
    }

    useEffect(() => { loadDrafts(); }, []);

    const allClients = [...new Set(drafts.map(d => d.clientId).filter(Boolean))];
    const filtered = drafts.filter(d =>
      (!filterClient  || d.clientId === filterClient) &&
      (!filterChannel || d.channel  === filterChannel)
    );

    function handleCopy(draft) {
      const text = draft.content || '';
      navigator.clipboard.writeText(text).then(() => {
        setCopied(draft.draftId);
        setTimeout(() => setCopied(null), 2000);
      }).catch(() => {
        const el = document.createElement('textarea');
        el.value = text; document.body.appendChild(el);
        el.select(); document.execCommand('copy'); document.body.removeChild(el);
        setCopied(draft.draftId);
        setTimeout(() => setCopied(null), 2000);
      });
    }

    function handleDelete(draftId) {
      if (!confirm('이 초안을 삭제하시겠습니까?')) return;
      setDrafts(prev => prev.filter(d => d.draftId !== draftId));
      fetch(API_URL, { method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'deleteDraft', draftId })
      }).catch(e => console.warn('deleteDraft 오류:', e));
    }

    function handleAdd() {
      if (!addForm.title.trim()) { alert('제목을 입력하세요.'); return; }
      if (!addForm.content.trim()) { alert('내용을 입력하세요.'); return; }
      const now = new Date();
      const kst = new Date(now.getTime() + 9*60*60*1000);
      const createdAt = kst.toISOString().slice(0,10);
      const draftId = 'dr-' + Date.now().toString(36);
      const newDraft = { ...addForm, draftId, createdAt, status:'draft' };
      setDrafts(prev => [newDraft, ...prev]);
      fetch(API_URL, { method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'addDraft', ...addForm })
      }).catch(e => console.warn('addDraft 오류:', e));
      setAddForm({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' });
      setShowAdd(false);
    }

    const iS = { fontFamily:'inherit', fontSize:13, border:'1px solid #e5e7eb', borderRadius:6, padding:'7px 10px', outline:'none', background:'#fff' };

    return (
      <div style={{maxWidth:960, margin:'0 auto', padding:'28px 24px'}}>

        {/* 헤더 행 */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20}}>
          <div>
            <h2 style={{margin:0, fontSize:20, fontWeight:800, color:'#1a1a2e'}}>📝 글 보관함</h2>
            <p style={{margin:'4px 0 0', fontSize:12, color:'#9ca3af'}}>오픈클로가 작성한 초안을 거래처별로 보관합니다. 복사 후 직접 발행하세요.</p>
          </div>
          <div style={{display:'flex', gap:8}}>
            <button onClick={loadDrafts}
              style={{background:'#f3f4f6', border:'none', borderRadius:8, padding:'8px 14px', fontSize:12, fontWeight:700, color:'#374151', cursor:'pointer', fontFamily:'inherit'}}>
              ↻ 새로고침
            </button>
            <button onClick={() => setShowAdd(v => !v)}
              style={{background: showAdd ? '#6366f1' : '#6366f1', color:'#fff', border:'none', borderRadius:8, padding:'8px 16px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit'}}>
              {showAdd ? '✕ 닫기' : '+ 직접 등록'}
            </button>
          </div>
        </div>

        {/* 직접 등록 폼 */}
        {showAdd && (
          <div style={{background:'#f9fafb', border:'1px solid #e5e7eb', borderRadius:12, padding:'20px', marginBottom:20}}>
            <div style={{fontWeight:700, fontSize:14, color:'#374151', marginBottom:14}}>새 초안 등록</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:10}}>
              <div>
                <div style={{fontSize:11, fontWeight:600, color:'#6b7280', marginBottom:4}}>거래처</div>
                <select value={addForm.clientId} onChange={e => setAddForm(f => ({...f, clientId:e.target.value}))} style={{...iS, width:'100%'}}>
                  <option value="">공통 / 없음</option>
                  {Object.entries(DRAFT_CLIENT_MAP).map(([id,name]) => <option key={id} value={id}>{name}</option>)}
                </select>
              </div>
              <div>
                <div style={{fontSize:11, fontWeight:600, color:'#6b7280', marginBottom:4}}>채널</div>
                <select value={addForm.channel} onChange={e => setAddForm(f => ({...f, channel:e.target.value}))} style={{...iS, width:'100%'}}>
                  {DRAFT_CHANNELS.map(ch => <option key={ch} value={ch}>{ch}</option>)}
                </select>
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11, fontWeight:600, color:'#6b7280', marginBottom:4}}>제목</div>
              <input value={addForm.title} onChange={e => setAddForm(f => ({...f, title:e.target.value}))} style={{...iS, width:'100%', boxSizing:'border-box'}} placeholder="글 제목" />
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11, fontWeight:600, color:'#6b7280', marginBottom:4}}>본문</div>
              <textarea value={addForm.content} onChange={e => setAddForm(f => ({...f, content:e.target.value}))}
                style={{...iS, width:'100%', boxSizing:'border-box', minHeight:140, resize:'vertical', lineHeight:1.6}}
                placeholder="글 본문 전체 내용을 붙여넣으세요" />
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:600, color:'#6b7280', marginBottom:4}}>메모 (선택)</div>
              <input value={addForm.memo} onChange={e => setAddForm(f => ({...f, memo:e.target.value}))} style={{...iS, width:'100%', boxSizing:'border-box'}} placeholder="키워드, 참고사항 등" />
            </div>
            <div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
              <button onClick={() => { setShowAdd(false); setAddForm({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' }); }}
                style={{background:'#f3f4f6', border:'none', borderRadius:7, padding:'8px 18px', fontSize:13, fontWeight:600, color:'#374151', cursor:'pointer', fontFamily:'inherit'}}>취소</button>
              <button onClick={handleAdd}
                style={{background:'#6366f1', border:'none', borderRadius:7, padding:'8px 20px', fontSize:13, fontWeight:700, color:'#fff', cursor:'pointer', fontFamily:'inherit'}}>저장</button>
            </div>
          </div>
        )}

        {/* 필터 행 */}
        <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:20}}>
          {/* 거래처 필터 */}
          <button onClick={() => setFilterClient('')}
            style={{background: filterClient==='' ? '#1a1a2e' : '#f3f4f6', color: filterClient==='' ? '#fff' : '#6b7280', border:'none', borderRadius:20, padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
            전체
          </button>
          {allClients.map(cid => (
            <button key={cid} onClick={() => setFilterClient(cid === filterClient ? '' : cid)}

  // ── SVG 차트: 손익 흐름 ──
  function ProfitChart({ data6 }) {
    const W=520, H=180, PL=52, PR=12, PT=20, PB=28;
    const cW=W-PL-PR, cH=H-PT-PB;
    const maxV = Math.max(...data6.flatMap(d=>[d.revenue,d.costs]), 1);
    const gW = cW / data6.length;
    const bW = gW * 0.28;
    const toY = v => PT + cH - (Math.max(0,v)/maxV)*cH;
    const profPts = data6.map((d,i) => `${PL+i*gW+gW/2},${toY(d.profit)}`).join(' ');
    const fK = v => v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':'0';
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
        {[0,0.25,0.5,0.75,1].map(r=>(
          <g key={r}>
            <line x1={PL} x2={W-PR} y1={toY(maxV*r)} y2={toY(maxV*r)} stroke={r===0?'#e5e7eb':'#f3f4f6'} strokeWidth="1"/>
            {r>0&&<text x={PL-4} y={toY(maxV*r)+4} textAnchor="end" fontSize="8" fill="#9ca3af">{fK(maxV*r)}</text>}

        {data6.map((d,i) => {
          const cx=PL+i*gW;

  // ── SVG 차트: 비용 도넛 ──
  function CostDonut({ expenses }) {
    const byCat = EXPENSE_CATS.map(cat=>({
      label:cat,
      value:expenses.filter(e=>e.category===cat).reduce((s,e)=>s+Number(e.amount||0),0),
      color:CAT_COLORS[cat]||'#d1d5db',
    })).filter(c=>c.value>0);
    const total=byCat.reduce((s,c)=>s+c.value,0);
    if (total===0) return <div style={{textAlign:'center',color:'#9ca3af',fontSize:12,padding:'40px 0'}}>이번 달 비용 없음</div>;
    const R=68, r=44, CX=80, CY=80;
    let ang=-Math.PI/2;
    const segs=byCat.map(c=>{
      const a=(c.value/total)*2*Math.PI;
      const x1=CX+R*Math.cos(ang), y1=CY+R*Math.sin(ang);
      ang+=a;
      const x2=CX+R*Math.cos(ang), y2=CY+R*Math.sin(ang);
      const xi1=CX+r*Math.cos(ang), yi1=CY+r*Math.sin(ang);
      const xi2=CX+r*Math.cos(ang-a), yi2=CY+r*Math.sin(ang-a);
      const lg=a>Math.PI?1:0;
      return {...c, path:`M${x1},${y1}A${R},${R},0,${lg},1,${x2},${y2}L${xi1},${yi1}A${r},${r},0,${lg},0,${xi2},${yi2}Z`};
    });
    return (
      <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
        <svg viewBox="0 0 160 160" style={{width:130,flexShrink:0}}>
          {segs.map((s,i)=><path key={i} d={s.path} fill={s.color}/>)}
          <text x={CX} y={CY-7}  textAnchor="middle" fontSize="9"  fill="#9ca3af">총비용</text>
          <text x={CX} y={CY+7}  textAnchor="middle" fontSize="12" fontWeight="700" fill="#374151">{(total/10000).toFixed(0)}만</text>
        </svg>
        <div style={{fontSize:10,lineHeight:'19px',paddingTop:6,flex:1}}>
          {segs.map((s,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:5}}>
              <span style={{width:7,height:7,borderRadius:1,background:s.color,display:'inline-block',flexShrink:0}}/>
              <span style={{color:'#6b7280',flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.label}</span>
              <span style={{color:'#374151',fontWeight:700,paddingLeft:4}}>{(s.value/10000).toFixed(1)}만</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ── 메인 컴포넌트 ──
  function RevenueView({ data }) {
    const clients = data.clients || [];
    const [revData,     setRevData]    = useState(()=>loadRevData());
    const [selMonth,    setSelMonth]   = useState(nowMonth);
    const [activeTab,   setActiveTab]  = useState('profit');

    const [expForm, setExpForm] = useState(blankExp);

    // localStorage 저장
    useEffect(()=>{ saveRevData(revData); }, [revData]);
    const mutRev = fn => setRevData(prev=>fn(prev));

    // Sheets에서 비용 데이터 동기화 (마운트 시)
    useEffect(()=>{
      fetchFromSheets().then(sheetsData=>{
        if (sheetsData.expenses && sheetsData.expenses.length > 0) {
          mutRev(prev=>({ ...prev, expenses: sheetsData.expenses }));
        }
      }).catch(()=>{});
    }, []);

    const cr = revData.clientRevenue || [];
    const selExpenses = (revData.expenses||[]).filter(e=>e.date&&e.date.startsWith(selMonth));

    // 거래처별 수익 계산 — 귀속비용은 비용기록에서 자동 집계
    const clientRows = clients.map(c=>{
      const rv = cr.find(r=>r.clientId===c.clientId)||{monthlyFee:0,additionalRevenue:{},contractStart:'',memo:''};
      const base  = Number(rv.monthlyFee)||0;
      const extra = Number((rv.additionalRevenue||{})[selMonth])||0;
      const totalRev = base+extra;
      // 비용 기록에서 이 거래처에 귀속된 비용 자동 합산
      const allocCost = selExpenses.filter(e=>e.clientId===c.clientId).reduce((s,e)=>s+Number(e.amount||0),0);
      const profit = totalRev-allocCost;
      const margin = totalRev>0 ? profit/totalRev*100 : 0;
      return {...c, monthlyFee:base, additionalRevenue:extra, totalRevenue:totalRev, allocatedCosts:allocCost, profit, margin, contractStart:rv.contractStart||'', memo:rv.memo||''};
    });

    const totalRevenue = clientRows.reduce((s,r)=>s+r.totalRevenue, 0);
    const totalCosts   = selExpenses.reduce((s,e)=>s+Number(e.amount||0), 0);
    const netProfit    = totalRevenue-totalCosts;
    const profitMargin = totalRevenue>0 ? netProfit/totalRevenue*100 : 0;
    const fixedCosts   = selExpenses.filter(e=>e.type==='고정비').reduce((s,e)=>s+Number(e.amount||0),0);
    const varCosts     = selExpenses.filter(e=>e.type==='변동비').reduce((s,e)=>s+Number(e.amount||0),0);

    // 전월 비교
    const prevM = (()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();
    const prevRevenue = clients.reduce((s,c)=>{ const rv=cr.find(r=>r.clientId===c.clientId)||{monthlyFee:0,additionalRevenue:{}}; return s+(Number(rv.monthlyFee)||0)+(Number((rv.additionalRevenue||{})[prevM])||0); },0);
    const prevCosts   = (revData.expenses||[]).filter(e=>e.date&&e.date.startsWith(prevM)).reduce((s,e)=>s+Number(e.amount||0),0);
    const profitDiff  = netProfit-(prevRevenue-prevCosts);

    // 6개월 추이
    const now6 = Array.from({length:6},(_,i)=>{
      const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-(5-i));
      const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const rev=clients.reduce((s,c)=>{ const rv=cr.find(r=>r.clientId===c.clientId)||{monthlyFee:0,additionalRevenue:{}}; return s+(Number(rv.monthlyFee)||0)+(Number((rv.additionalRevenue||{})[m])||0); },0);
      const cost=(revData.expenses||[]).filter(e=>e.date&&e.date.startsWith(m)).reduce((s,e)=>s+Number(e.amount||0),0);
      return {month:m, revenue:rev, costs:cost, profit:rev-cost};
    });

    // 상위 5 비용
    const top5 = [...selExpenses].sort((a,b)=>Number(b.amount)-Number(a.amount)).slice(0,5);

    // 월 선택지 (최근 12개월)
    const monthOptions = Array.from({length:12},(_,i)=>{
      const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    });

    // ── 거래처 수익 편집 ──
    function startEditClient(row) {
      setEditingCid(row.clientId);
      const rv=cr.find(r=>r.clientId===row.clientId)||{};
      setEditCForm({ monthlyFee:rv.monthlyFee||0, additionalRevenue:(rv.additionalRevenue||{})[selMonth]||0, contractStart:rv.contractStart||'', memo:rv.memo||'' });
    }
    function saveEditClient(clientId) {
      mutRev(prev=>{
        const idx=prev.clientRevenue.findIndex(r=>r.clientId===clientId);
        const ex=prev.clientRevenue[idx]||{clientId,additionalRevenue:{}};
        const updated={...ex, monthlyFee:Number(editCForm.monthlyFee)||0, additionalRevenue:{...(ex.additionalRevenue||{}),[selMonth]:Number(editCForm.additionalRevenue)||0}, contractStart:editCForm.contractStart||'', memo:editCForm.memo||''};
        return {...prev, clientRevenue: idx>=0 ? prev.clientRevenue.map((r,i)=>i===idx?updated:r) : [...prev.clientRevenue,updated]};
      });
      setEditingCid(null);
    }

    // ── 비용 CRUD (로컬 + Sheets 동기화) ──
    function addExpense() {
      const eid = 'exp-' + Date.now().toString(36);
      const newExp = { expenseId:eid, ...expForm, amount:Number(expForm.amount)||0 };
      mutRev(prev=>({...prev, expenses:[...prev.expenses, newExp]}));
      fetch(API_URL, {
        method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'addExpense', ...newExp })
      }).catch(e=>console.warn('addExpense Sheets 오류:', e));
      setExpForm(blankExp); setShowAddExp(false);
    }
    function startEditExp(e) { setEditingEid(e.expenseId); setExpForm({...e,amount:String(e.amount)}); setShowAddExp(false); }
    function saveEditExp() {
      const updated = { ...expForm, expenseId:editingEid, amount:Number(expForm.amount)||0 };
      mutRev(prev=>({...prev, expenses:prev.expenses.map(e=>e.expenseId===editingEid?updated:e)}));
      fetch(API_URL, {
        method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'updateExpense', ...updated })
      }).catch(e=>console.warn('updateExpense Sheets 오류:', e));
      setEditingEid(null); setExpForm(blankExp);
    }
    function deleteExp(eid) {
      if(!confirm('이 비용 항목을 삭제하시겠습니까?')) return;
      mutRev(prev=>({...prev, expenses:prev.expenses.filter(e=>e.expenseId!==eid)}));
      fetch(API_URL, {
        method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'deleteExpense', expenseId:eid })
      }).catch(e=>console.warn('deleteExpense Sheets 오류:', e));
    }

    const iS = {padding:'5px 8px',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none',background:'#fff'};
    const diffColor = profitDiff>=0?'#065f46':'#b91c1c';

    return (
      <div style={{maxWidth:1200,margin:'0 auto',padding:'24px 20px'}}>

        {/* 헤더 + 월 선택 */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <h2 style={{fontSize:16,fontWeight:800,color:'#1a1a2e',margin:0}}>손익 관리</h2>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:12,color:'#6b7280',fontWeight:600}}>기준 월</span>
            <select value={selMonth} onChange={e=>setSelMonth(e.target.value)} style={{...iS,fontWeight:700,color:'#1a1a2e',padding:'7px 10px'}}>
              {monthOptions.map(m=><option key={m} value={m}>{m.replace('-','년 ')}월</option>)}
            </select>
          </div>
        </div>

        {/* KPI 카드 4개 */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:22}}>
          {[
            {label:'이번 달 총매출',  value:fmtMoney(totalRevenue), icon:'💰', color:'#1d4ed8', bg:'#dbeafe', sub:`활성 거래처 ${clients.length}곳`},
            {label:'이번 달 총비용',  value:fmtMoney(totalCosts),   icon:'📤', color:'#b45309', bg:'#fef3c7', sub:`고정 ${(fixedCosts/10000).toFixed(0)}만 · 변동 ${(varCosts/10000).toFixed(0)}만`},
            {label:'이번 달 순이익',  value:fmtMoney(netProfit),    icon:netProfit>=0?'📈':'📉', color:netProfit>=0?'#065f46':'#b91c1c', bg:netProfit>=0?'#d1fae5':'#fee2e2',
              sub:<span style={{color:diffColor}}>{profitDiff>=0?'▲':'▼'} {fmtMoney(Math.abs(profitDiff))} 전월 대비</span>},
            {label:'순이익률',        value:`${profitMargin.toFixed(1)}%`, icon:'📊', color:'#6d28d9', bg:'#ede9fe', sub:`목표 30% ${profitMargin>=30?'✅ 달성':'— 미달성'}`},
          ].map((k,i)=>(
            <div key={i} style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',padding:'16px 18px'}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                <div style={{width:36,height:36,borderRadius:9,background:k.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{k.icon}</div>
                <span style={{fontSize:11,color:'#9ca3af',fontWeight:700,lineHeight:'14px'}}>{k.label}</span>
              </div>
              <div style={{fontSize:20,fontWeight:800,color:k.color,marginBottom:4}}>{k.value}</div>
              <div style={{fontSize:10,color:'#9ca3af'}}>{k.sub}</div>
            </div>
          ))}
        </div>

        {/* 보조 지표 바 */}
        <div style={{display:'flex',gap:10,marginBottom:22}}>
          {[
            {label:'고정비 총액', value:fmtMoney(fixedCosts), color:'#1d4ed8'},
            {label:'변동비 총액', value:fmtMoney(varCosts),   color:'#b45309'},
            {label:'활성 거래처', value:`${clients.length}곳`, color:'#374151'},
            {label:'비용 항목',   value:`${selExpenses.length}건`, color:'#374151'},
          ].map((s,i)=>(
            <div key={i} style={{background:'#fff',borderRadius:9,border:'1px solid #e5e7eb',padding:'10px 16px',display:'flex',alignItems:'center',gap:10,flex:1}}>
              <span style={{fontSize:11,color:'#9ca3af'}}>{s.label}</span>
              <span style={{fontSize:13,fontWeight:800,color:s.color,marginLeft:'auto'}}>{s.value}</span>
            </div>
          ))}
        </div>

        {/* 중단: 차트 2개 */}
        <div style={{display:'grid',gridTemplateColumns:'1.65fr 1fr',gap:14,marginBottom:22}}>
          {/* 손익 흐름 */}
          <div style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',padding:'18px 20px'}}>
            <div style={{fontSize:12,fontWeight:700,color:'#374151',marginBottom:14}}>📈 최근 6개월 손익 흐름</div>
            <ProfitChart data6={now6}/>
          </div>
          {/* 비용 구조 */}
          <div style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',padding:'18px 20px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <span style={{fontSize:12,fontWeight:700,color:'#374151'}}>📊 이번 달 비용 구조</span>
              <span style={{fontSize:10,color:'#9ca3af'}}>
                고정 {totalCosts>0?(fixedCosts/totalCosts*100).toFixed(0):0}% · 변동 {totalCosts>0?(varCosts/totalCosts*100).toFixed(0):0}%
              </span>
            </div>
            <CostDonut expenses={selExpenses}/>
            {top5.length>0&&(
              <div style={{marginTop:12,borderTop:'1px solid #f3f4f6',paddingTop:10}}>
                <div style={{fontSize:10,fontWeight:700,color:'#9ca3af',marginBottom:6}}>상위 비용 5개</div>
                {top5.map((e,i)=>(
                  <div key={e.expenseId} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                      <span style={{fontSize:10,color:'#9ca3af',width:12}}>{i+1}.</span>
                      <span style={{width:7,height:7,borderRadius:1,background:CAT_COLORS[e.category]||'#d1d5db',display:'inline-block',flexShrink:0}}/>
                      <span style={{fontSize:11,color:'#374151'}}>{e.description}</span>
                    </div>
                    <span style={{fontSize:11,fontWeight:700,color:'#374151',flexShrink:0}}>{fmtMoney(e.amount)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* 하단 탭 테이블 */}
        <div style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',overflow:'hidden'}}>
          {/* 탭 헤더 */}
          <div style={{display:'flex',borderBottom:'1px solid #e5e7eb',alignItems:'center'}}>
            {[{key:'profit',label:'📋 거래처별 수익성'},{key:'expenses',label:'💳 비용 기록'}].map(t=>(
              <button key={t.key} onClick={()=>setActiveTab(t.key)}
                style={{padding:'12px 20px',border:'none',background:'none',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',
                  color:activeTab===t.key?'#1a1a2e':'#9ca3af',
                  borderBottom:activeTab===t.key?'2px solid #1a1a2e':'2px solid transparent',
                  transition:'all 0.15s'}}>
                {t.label}
              </button>
            ))}
            {activeTab==='expenses'&&(
              <button onClick={()=>{setExpForm({...blankExp,date:today()});setShowAddExp(true);setEditingEid(null);}}
                style={{marginLeft:'auto',marginRight:14,background:'#1a1a2e',color:'#fff',border:'none',borderRadius:7,padding:'6px 14px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
                + 비용 추가
              </button>
            )}
          </div>

          {/* 탭 A: 거래처별 수익성 */}
          {activeTab==='profit'&&(
            <div>
              <div style={{display:'grid',gridTemplateColumns:'1.3fr 74px 100px 110px 100px 110px 110px 1fr 72px',gap:0,background:'#f9fafb',borderBottom:'1px solid #f3f4f6',padding:'8px 20px'}}>
                {['거래처','진료과','계약 시작일','월 기본계약금','당월 추가매출','거래처별 총매출','귀속비용','이익률',''].map((h,i)=>(
                  <span key={i} style={{fontSize:10,fontWeight:700,color:'#9ca3af'}}>{h}</span>
                ))}
              </div>
              {clientRows.map((row,idx)=>{
                const mc=row.margin>=30?'#065f46':row.margin>=20?'#b45309':'#b91c1c';
                return (
                  <div key={row.clientId} style={{borderBottom:idx<clientRows.length-1?'1px solid #f3f4f6':'none'}}>
                    {editingCid===row.clientId?(
                      <div style={{padding:'10px 20px',background:'#fffbeb',display:'grid',gridTemplateColumns:'1.3fr 74px 100px 110px 100px 110px 110px 1fr 72px',gap:6,alignItems:'center'}}>
                        <div style={{fontSize:13,fontWeight:700,color:'#1a1a2e'}}>{row.clientName}</div>
                        <SpecBadge specialty={row.specialty}/>
                        <input type="date"   value={editCForm.contractStart}     onChange={e=>setEditCForm(f=>({...f,contractStart:e.target.value}))}     style={{...iS,width:'100%'}}/>
                        <input type="number" value={editCForm.monthlyFee}         onChange={e=>setEditCForm(f=>({...f,monthlyFee:e.target.value}))}         style={{...iS,width:'100%'}} placeholder="0"/>
                        <input type="number" value={editCForm.additionalRevenue}  onChange={e=>setEditCForm(f=>({...f,additionalRevenue:e.target.value}))}  style={{...iS,width:'100%'}} placeholder="0"/>
                        <span style={{fontSize:11,fontWeight:700,color:'#1d4ed8'}}>{fmtMoney(Number(editCForm.monthlyFee||0)+Number(editCForm.additionalRevenue||0))}</span>
                        <span style={{fontSize:11,color:'#b45309',fontWeight:600}}>{fmtMoney(row.allocatedCosts)}<span style={{fontSize:9,color:'#9ca3af',marginLeft:3}}>자동</span></span>
                        <input type="text"   value={editCForm.memo}               onChange={e=>setEditCForm(f=>({...f,memo:e.target.value}))}               style={{...iS,width:'100%'}} placeholder="메모"/>
                        <div style={{display:'flex',gap:4}}>
                          <button onClick={()=>saveEditClient(row.clientId)} style={{background:'#1a1a2e',color:'#fff',border:'none',borderRadius:5,padding:'4px 9px',fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>저장</button>
                          <button onClick={()=>setEditingCid(null)} style={{background:'#f3f4f6',color:'#6b7280',border:'none',borderRadius:5,padding:'4px 7px',fontSize:10,cursor:'pointer',fontFamily:'inherit'}}>취소</button>
                        </div>
                      </div>
                    ):(
                      <div onClick={()=>startEditClient(row)}
                        style={{padding:'11px 20px',display:'grid',gridTemplateColumns:'1.3fr 74px 100px 110px 100px 110px 110px 1fr 72px',gap:8,alignItems:'center',cursor:'pointer',transition:'background 0.12s'}}
                        onMouseOver={e=>e.currentTarget.style.background='#f9fafb'}
                        onMouseOut={e=>e.currentTarget.style.background=''}>
                        <div>
                          <div style={{fontSize:13,fontWeight:700,color:'#1a1a2e'}}>{row.clientName}</div>
                          {row.memo&&<div style={{fontSize:10,color:'#9ca3af',marginTop:1}}>{row.memo}</div>}
                        </div>
                        <SpecBadge specialty={row.specialty}/>
                        <span style={{fontSize:11,color:'#6b7280'}}>{row.contractStart?fmtDate(row.contractStart):'—'}</span>
                        <span style={{fontSize:12,fontWeight:700,color:row.monthlyFee?'#374151':'#d1d5db'}}>{row.monthlyFee?fmtMoney(row.monthlyFee):'미입력'}</span>
                        <span style={{fontSize:12,color:row.additionalRevenue>0?'#1d4ed8':'#9ca3af'}}>{row.additionalRevenue>0?'+'+fmtMoney(row.additionalRevenue):'—'}</span>
                        <span style={{fontSize:12,fontWeight:700,color:'#1d4ed8'}}>{fmtMoney(row.totalRevenue)}</span>
                        <span style={{fontSize:11,color:row.allocatedCosts>0?'#b45309':'#9ca3af'}}>{row.allocatedCosts>0?fmtMoney(row.allocatedCosts):'—'}</span>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <div style={{flex:1,background:'#f3f4f6',borderRadius:99,height:5,overflow:'hidden'}}>
                            <div style={{width:`${Math.min(100,Math.max(0,row.margin))}%`,height:'100%',background:mc,borderRadius:99}}/>
                          </div>
                          <span style={{fontSize:10,fontWeight:800,color:mc,minWidth:32,textAlign:'right'}}>{row.margin.toFixed(0)}%</span>
                        </div>
                        <span style={{fontSize:11,color:'#c9a96e',fontWeight:600}}>편집 ✎</span>
                      </div>
                    )}
                  </div>
                );
              })}
              {/* 합계 행 */}
              <div style={{background:'#f8fafc',borderTop:'2px solid #e5e7eb',padding:'10px 20px',display:'grid',gridTemplateColumns:'1.3fr 74px 100px 110px 100px 110px 110px 1fr 72px',gap:8,alignItems:'center'}}>
                <span style={{fontSize:12,fontWeight:800,color:'#1a1a2e'}}>합계</span>
                <span/><span/>
                <span style={{fontSize:12,fontWeight:700}}>{fmtMoney(clientRows.reduce((s,r)=>s+r.monthlyFee,0))}</span>
                <span style={{fontSize:12,fontWeight:700,color:'#1d4ed8'}}>{fmtMoney(clientRows.reduce((s,r)=>s+r.additionalRevenue,0))}</span>
                <span style={{fontSize:13,fontWeight:800,color:'#1d4ed8'}}>{fmtMoney(totalRevenue)}</span>
                <span style={{fontSize:12,fontWeight:700,color:'#b45309'}}>{fmtMoney(clientRows.reduce((s,r)=>s+r.allocatedCosts,0))}</span>
                <span style={{fontSize:12,fontWeight:700,color:'#6d28d9'}}>{profitMargin.toFixed(1)}%</span>
                <span/>
              </div>
            </div>
          )}

          {/* 탭 B: 비용 기록 */}
          {activeTab==='expenses'&&(
            <div>
              {/* 비용 추가/수정 인라인 폼 */}
              {(showAddExp||editingEid)&&(
                <div style={{background:'#fffbeb',borderBottom:'1px solid #fef3c7',padding:'14px 20px'}}>
                  <div style={{fontSize:12,fontWeight:700,color:'#374151',marginBottom:10}}>{editingEid?'비용 수정':'새 비용 추가'}</div>
                  {/* 1행: 날짜 / 카테고리 / 세부내용 / 금액 / 구분 */}
                  <div style={{display:'grid',gridTemplateColumns:'120px 150px 1fr 130px 80px',gap:7,marginBottom:7}}>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>지출일</div>
                      <input type="date" value={expForm.date} onChange={e=>setExpForm(f=>({...f,date:e.target.value}))} style={{...iS,width:'100%'}}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>비용 항목</div>
                      <select value={expForm.category} onChange={e=>setExpForm(f=>({...f,category:e.target.value}))} style={{...iS,width:'100%'}}>
                        {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>세부 내용</div>
                      <input type="text" value={expForm.description} onChange={e=>setExpForm(f=>({...f,description:e.target.value}))} style={{...iS,width:'100%'}} placeholder="세부 내용을 입력하세요"/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>금액 (원)</div>
                      <input type="number" value={expForm.amount} onChange={e=>setExpForm(f=>({...f,amount:e.target.value}))} style={{...iS,width:'100%'}} placeholder="0"/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>구분</div>
                      <select value={expForm.type} onChange={e=>setExpForm(f=>({...f,type:e.target.value}))} style={{...iS,width:'100%'}}>
                        <option>고정비</option><option>변동비</option>
                      </select>
                    </div>
                  </div>
                  {/* 2행: 관련 거래처 / 결제수단 / 정기 / 메모 / 버튼 */}
                  <div style={{display:'grid',gridTemplateColumns:'160px 110px 100px 1fr auto',gap:7,alignItems:'end'}}>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>관련 거래처</div>
                      <select value={expForm.clientId} onChange={e=>setExpForm(f=>({...f,clientId:e.target.value}))} style={{...iS,width:'100%'}}>
                        <option value="">거래처 없음</option>
                        {clients.map(c=><option key={c.clientId} value={c.clientId}>{c.clientName}</option>)}
                      </select>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>결제수단</div>
                      <select value={expForm.payMethod} onChange={e=>setExpForm(f=>({...f,payMethod:e.target.value}))} style={{...iS,width:'100%'}}>
                        {PAY_METHODS.map(m=><option key={m}>{m}</option>)}
                      </select>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>정기지출</div>
                      <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#374151',cursor:'pointer',padding:'6px 0'}}>
                        <input type="checkbox" checked={expForm.isRecurring} onChange={e=>setExpForm(f=>({...f,isRecurring:e.target.checked}))} style={{width:14,height:14}}/>
                        정기지출 여부
                      </label>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:'#9ca3af',fontWeight:600,marginBottom:3}}>메모</div>
                      <input type="text" value={expForm.memo} onChange={e=>setExpForm(f=>({...f,memo:e.target.value}))} style={{...iS,width:'100%'}} placeholder="메모 (선택)"/>
                    </div>
                    <div style={{display:'flex',gap:6,paddingBottom:1}}>
                      <button onClick={editingEid?saveEditExp:addExpense} style={{background:'#1a1a2e',color:'#fff',border:'none',borderRadius:7,padding:'8px 18px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>{editingEid?'수정 완료':'추가'}</button>
                      <button onClick={()=>{setShowAddExp(false);setEditingEid(null);setExpForm(blankExp);}} style={{background:'#f3f4f6',color:'#6b7280',border:'none',borderRadius:7,padding:'8px 12px',fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>취소</button>
                    </div>
                  </div>
                </div>
              )}
              {/* 테이블 헤더 */}
              <div style={{display:'grid',gridTemplateColumns:'100px 120px 1fr 120px 68px 130px 88px 58px 1fr 70px',gap:0,background:'#f9fafb',borderBottom:'1px solid #f3f4f6',padding:'8px 20px'}}>
                {['지출일','비용 항목','세부 내용','금액','구분','관련 거래처','결제수단','정기','메모',''].map((h,i)=>(
                  <span key={i} style={{fontSize:10,fontWeight:700,color:'#9ca3af'}}>{h}</span>
                ))}
              </div>
              {selExpenses.length===0&&(
                <div style={{padding:'36px',textAlign:'center',color:'#9ca3af',fontSize:12}}>
                  {selMonth.replace('-','년 ')}월 비용 내역이 없습니다.<br/>상단 [+ 비용 추가] 버튼으로 기록을 시작하세요.
                </div>
              )}
              {selExpenses.map((e,idx)=>(
                <div key={e.expenseId}
                  style={{borderBottom:idx<selExpenses.length-1?'1px solid #f3f4f6':'none',display:'grid',gridTemplateColumns:'100px 120px 1fr 120px 68px 130px 88px 58px 1fr 70px',gap:8,alignItems:'center',padding:'10px 20px',transition:'background 0.12s'}}
                  onMouseOver={ev=>ev.currentTarget.style.background='#f9fafb'}
                  onMouseOut={ev=>ev.currentTarget.style.background=''}>
                  <span style={{fontSize:11,color:'#6b7280'}}>{e.date?fmtDate(e.date):'—'}</span>
                  <div style={{display:'flex',alignItems:'center',gap:5}}>
                    <span style={{width:7,height:7,borderRadius:1,background:CAT_COLORS[e.category]||'#d1d5db',display:'inline-block',flexShrink:0}}/>
                    <span style={{fontSize:11,fontWeight:600,color:'#374151'}}>{e.category}</span>
                  </div>
                  <span style={{fontSize:12,color:'#374151'}}>{e.description}</span>
                  <span style={{fontSize:12,fontWeight:700,color:'#1a1a2e'}}>{fmtMoney(e.amount)}</span>
                  <span style={{fontSize:10,fontWeight:700,padding:'2px 6px',borderRadius:4,background:e.type==='고정비'?'#dbeafe':'#fef3c7',color:e.type==='고정비'?'#1d4ed8':'#b45309',whiteSpace:'nowrap'}}>{e.type}</span>
                  <span style={{fontSize:11,color:'#6b7280'}}>{e.clientId?(clients.find(c=>c.clientId===e.clientId)||{clientName:'—'}).clientName:'—'}</span>
                  <span style={{fontSize:11,color:'#6b7280'}}>{e.payMethod}</span>
                  <span style={{fontSize:10,color:e.isRecurring?'#6d28d9':'#d1d5db',fontWeight:e.isRecurring?700:400}}>{e.isRecurring?'🔁':'—'}</span>
                  <span style={{fontSize:11,color:'#9ca3af',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.memo||'—'}</span>
                  <div style={{display:'flex',gap:3}}>
                    <button onClick={()=>startEditExp(e)} className="btn-icon" style={{fontSize:13}}>✎</button>
                    <button onClick={()=>deleteExp(e.expenseId)} className="btn-icon" style={{fontSize:13,color:'#ef4444'}}>✕</button>
                  </div>
                </div>
              ))}
              {selExpenses.length>0&&(
                <div style={{background:'#f8fafc',borderTop:'2px solid #e5e7eb',padding:'9px 20px',display:'flex',justifyContent:'flex-end',gap:24,alignItems:'center'}}>
                  <span style={{fontSize:11,color:'#9ca3af'}}>고정비 <strong style={{color:'#1d4ed8'}}>{fmtMoney(fixedCosts)}</strong></span>
                  <span style={{fontSize:11,color:'#9ca3af'}}>변동비 <strong style={{color:'#b45309'}}>{fmtMoney(varCosts)}</strong></span>
                  <span style={{fontSize:12,fontWeight:800,color:'#374151'}}>총비용 {fmtMoney(totalCosts)}</span>
                </div>
              )}
            </div>
          )}
        </div>

      </div>
    );
  }

  function App() {
    const [data,       setData]       = useState(()=>loadData());
    const [view,       setView]       = useState('main');
    const [selId,      setSelId]      = useState(null);
    const [modal,      setModal]      = useState({ open:false });
    const [syncStatus, setSyncStatus] = useState('idle');

    // ── 계약 upsert ──
    function upsertContract(clientId, fields) {
      mutate(d => {
        const existing = (d.contracts||[]).findIndex(c => c.clientId === clientId);
        let updated;
        if (existing >= 0) {
          updated = (d.contracts||[]).map(c => c.clientId === clientId ? { ...c, ...fields } : c);
        } else {
          updated = [...(d.contracts||[]), { clientId, ...fields }];
        }
        return { ...d, contracts: updated };
      });
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'upsertContract', clientId, ...fields })
      }).catch(e => console.warn('upsertContract Sheets 오류:', e));
    }

    useEffect(() => { saveData(data); }, [data]);

    const mutate = useCallback((fn) => setData(prev => fn(prev)), []);

    const handleSync = useCallback(() => {
      setSyncStatus('loading');
      fetchFromSheets()
        .then(sheetsData => {
          // credentials는 로컬 전용 — Sheets 동기화 시 덮어쓰지 않음
          // clients: DEFAULT_DATA 순서 + reportFile을 유지하면서 Sheets 데이터로 업데이트
          // commonTasks: Sheets가 비어있으면 로컬 값 유지 (API 호출 실패로 Sheets에 없는 경우 대비)
          mutate(prev => ({
            ...sheetsData,
            // 3-way merge: DEFAULT_DATA 순서 기준, Sheets 데이터 우선, localStorage 거래처 보존
            clients:      mergeClients(DEFAULT_DATA.clients, sheetsData.clients || [], prev.clients || []),
            credentials:  prev.credentials ?? DEFAULT_CREDENTIALS,
            contracts:    (sheetsData.contracts && sheetsData.contracts.length > 0)
                            ? sheetsData.contracts
                            : (prev.contracts && prev.contracts.length > 0)
                              ? prev.contracts
                              : [],
            commonTasks:  (sheetsData.commonTasks && sheetsData.commonTasks.length > 0)
                            ? sheetsData.commonTasks
                            : (prev.commonTasks && prev.commonTasks.length > 0)
                              ? prev.commonTasks
                              : sheetsData.commonTasks,
            // 동기화: currentCount·note는 Sheets 값 우선 (source of truth)
            // dueDate만 로컬 값 보존 (UI에서 편집 중일 수 있음)
            monthlyJobs: (sheetsData.monthlyJobs && sheetsData.monthlyJobs.length > 0)
              ? sheetsData.monthlyJobs.map(sj => {
                  const lj = (prev.monthlyJobs || []).find(j => j.jobId === sj.jobId);
                  // currentCount·note는 Sheets 값 사용 (항상 최신 반영)
                  // dueDate는 로컬 편집 중인 값 보존
                  return lj ? { ...sj, dueDate: lj.dueDate ?? sj.dueDate } : sj;
                })
              : (prev.monthlyJobs && prev.monthlyJobs.length > 0)
                ? prev.monthlyJobs
                : sheetsData.monthlyJobs,
          }));
          setSyncStatus('ok');
        })
        .catch(e => { console.error('Sheets 연동 오류:', e); setSyncStatus('error'); });
    }, []);

    // ── 월별 자동 초기화 ──
    useEffect(() => {
      const lastMonth = localStorage.getItem(MONTH_KEY);
      const curMonth  = nowMonth();
      if (lastMonth && lastMonth !== curMonth) {
        // 완료된 서브업무 수집 → Sheets에서 삭제
        const savedData = loadData();
        const completedSubs = (savedData.monthlyJobs || []).filter(
          j => j.kind === '서브' && j.note === '완료'
        );
        completedSubs.forEach(j => {
          fetch(API_URL, {
            method: 'POST', redirect: 'follow',
            body: JSON.stringify({ action: 'deleteSubJob', jobId: j.jobId })
          }).catch(() => {});
        });

        // 새 달 → 카운트/노트 초기화 + 완료된 서브업무 제거
        setData(prev => ({
          ...prev,
          monthlyJobs: prev.monthlyJobs
            .filter(j => !(j.kind === '서브' && j.note === '완료'))
            .map(j => ({
              ...j,
              currentCount: j.targetCount != null ? 0 : j.currentCount,
              note:         j.note === '완료' ? '' : j.note,
            })),
          postLogs: []
        }));
        fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({ action: 'monthlyReset', month: curMonth })
        }).catch(() => {});
      }
      localStorage.setItem(MONTH_KEY, curMonth);
    }, []);

    // 페이지 로드 시 자동 동기화 (loading 상태 즉시 표시)
    useEffect(() => { setSyncStatus('loading'); handleSync(); }, []);

    // ── 자동 로그 (업무 완료/카운트 시 자동 기록) ──
    function autoLog(clientId, message) {
      const newLog = { logId: `l-${uid()}`, clientId, createdAt: today(), message };
      mutate(d => ({ ...d, logs: [...(d.logs||[]), newLog] }));
      mutate(d => ({ ...d, clients: d.clients.map(c => c.clientId===clientId ? {...c, lastUpdated:today()} : c) }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addLog', clientId, message })
      }).catch(e => console.warn('autoLog 오류:', e));
    }

    // ── 로그 CRUD ──
    function addLog(logData, context) {
      const newL = { logId:`l-${uid()}`, clientId:context.clientId, createdAt:today(), ...logData };
      mutate(d=>({...d, logs:[...d.logs, newL]}));
      mutate(d=>({...d, clients:d.clients.map(c=>c.clientId===context.clientId?{...c,lastUpdated:today()}:c)}));
      // Sheets 동기화 (수동 로그도 저장)
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addLog', clientId: context.clientId, message: logData.message || '' })
      }).catch(e => console.warn('addLog Sheets 오류:', e));
    }
    function deleteLog(id) {
      mutate(d=>({...d, logs:d.logs.filter(l=>l.logId!==id)}));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deleteLog', logId: id })
      }).catch(e => console.warn('deleteLog Sheets 오류:', e));
    }

    // ── Modal ──
    function openModal(type, mode, formData, context) {
      setModal({ open:true, type, mode, formData, context });
    }
    function closeModal() { setModal({ open:false }); }

    function handleSave(type, mode, form, context) {
      if(type==='log')        addLog(form, context);
      if(type==='add-client') addClient(form);
      closeModal();
    }
    function handleDelete(context) {
      if(context.type==='log')  deleteLog(context.id);
      if(context.type==='post') deletePost(context.id);
      closeModal();
    }

    // ── 발행 글 삭제 ──
    function deletePost(logId) {
      mutate(d => ({ ...d, postLogs: (d.postLogs||[]).filter(p => p.logId !== logId) }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deletePost', logId })
      }).catch(e => console.warn('deletePost Sheets 오류:', e));
    }

    // ── 공통업무 CRUD ──
    function addCommonGroup(title) {
      const taskId = 'ct-g-' + uid();
      const newGroup = { taskId, title, kind: 'group', parentId: null, done: false, dueDate: null, createdAt: today() };
      mutate(d => ({ ...d, commonTasks: [...(d.commonTasks||[]), newGroup] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskAdd', taskId, title, kind: 'group', parentId: null })
      }).catch(e => console.warn('commonTaskAdd(group) 오류:', e));
    }
    function addCommonTask(parentId, title, dueDate) {
      const taskId = 'ct-' + uid();
      const newTask = { taskId, title, kind: 'task', parentId: parentId || null, done: false, dueDate: dueDate || null, createdAt: today() };
      mutate(d => ({ ...d, commonTasks: [...(d.commonTasks||[]), newTask] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskAdd', taskId, title, kind: 'task', parentId: parentId || null, dueDate: dueDate || null })
      }).catch(e => console.warn('commonTaskAdd(task) 오류:', e));
    }
    function toggleCommonTask(taskId, done) {
      mutate(d => ({
        ...d,
        commonTasks: (d.commonTasks||[]).map(t => t.taskId===taskId ? {...t, done} : t)
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskToggle', taskId, done })
      }).catch(e => console.warn('commonTaskToggle 오류:', e));
    }
    function deleteCommonTask(taskId) {
      // 그룹 삭제 시 하위 태스크도 함께 제거
      mutate(d => {
        const target = (d.commonTasks||[]).find(t => t.taskId === taskId);
        const toDelete = new Set([taskId]);
        if (target && target.kind === 'group') {
          (d.commonTasks||[]).forEach(t => { if (t.parentId === taskId) toDelete.add(t.taskId); });
        }
        toDelete.forEach(id => {
          if (id !== taskId) {
            fetch(API_URL, { method:'POST', redirect:'follow', body: JSON.stringify({ action:'commonTaskDelete', taskId: id }) }).catch(()=>{});
          }
        });
        return { ...d, commonTasks: (d.commonTasks||[]).filter(t => !toDelete.has(t.taskId)) };
      });
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskDelete', taskId })
      }).catch(e => console.warn('commonTaskDelete 오류:', e));
    }
    function editCommonTask(taskId, title, dueDate) {
      mutate(d => ({
        ...d,
        commonTasks: (d.commonTasks||[]).map(t => t.taskId===taskId ? { ...t, title, dueDate: dueDate !== undefined ? dueDate : t.dueDate } : t)
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskUpdate', taskId, title, dueDate: dueDate || null })
      }).catch(e => console.warn('commonTaskUpdate 오류:', e));
    }

    // ── 자격증명 CRUD (로컬 전용) ──
    function addCredential(clientId, cred) {
      const credId = 'cr-' + uid();
      mutate(d => ({
        ...d,
        credentials: {
          ...(d.credentials||{}),
          [clientId]: [...((d.credentials||{})[clientId]||[]), { credId, ...cred }]
        }
      }));
    }
    function deleteCredential(clientId, credId) {
      mutate(d => ({
        ...d,
        credentials: {
          ...(d.credentials||{}),
          [clientId]: ((d.credentials||{})[clientId]||[]).filter(c => c.credId!==credId)
        }
      }));
    }

    // ── 거래처 CRUD ──
    function addClient(fields) {
      const clientId = 'cl-' + uid();
      const newClient = {
        clientId,
        clientName:    (fields.clientName||'').trim(),
        specialty:     fields.specialty || '기타',
        mainContact:   (fields.mainContact||'').trim(),
        priorityLevel: fields.priorityLevel || '중간',
        reportFile:    (fields.reportFile||'').trim(),
        lastUpdated:   today(),
      };
      mutate(d => ({ ...d, clients: [...d.clients, newClient] }));
      // Sheets에도 저장 — sync 후에도 유지되도록
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addClient', ...newClient })
      }).catch(e => console.warn('addClient Sheets 오류:', e));
    }
    function updateClient(clientId, fields) {
      mutate(d => ({
        ...d,
        clients: d.clients.map(c => c.clientId===clientId ? { ...c, ...fields } : c)
      }));
      // Sheets 업데이트
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateClient', clientId, ...fields })
      }).catch(e => console.warn('updateClient Sheets 오류:', e));
    }
    function handleDeleteClient(clientId) {
      mutate(d => ({
        ...d,
        clients:     d.clients.filter(c => c.clientId !== clientId),
        monthlyJobs: d.monthlyJobs.filter(j => j.clientId !== clientId),
        logs:        d.logs.filter(l => l.clientId !== clientId),
        postLogs:    (d.postLogs||[]).filter(p => p.clientId !== clientId),
      }));
      setView('main');
      // Sheets에서도 삭제
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deleteClient', clientId })
      }).catch(e => console.warn('deleteClient Sheets 오류:', e));
    }

    // ── Client 그룹 분리 ──
    const { topClients, bottomClients } = useMemo(() => {
      const hasFessential = (c) => (data.monthlyJobs||[]).some(j => j.clientId===c.clientId && j.kind==='필수');
      return {
        topClients:    data.clients.filter(hasFessential),
        bottomClients: data.clients.filter(c => !hasFessential(c)),
      };
    }, [data.clients, data.monthlyJobs]);

    const selectedClient = selId ? data.clients.find(c=>c.clientId===selId) : null;

    const cardGrid = (clients) => (
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:16}}>
        {clients.map(client=>(
          <ClientCard
            key={client.clientId}
            client={client}
            data={data}
            onSelect={(id)=>{ setSelId(id); setView('client'); }}
          />
        ))}
      </div>
    );

    return (
      <div style={{minHeight:'100vh'}}>
        <Header
          view={view}
          selectedClient={selectedClient}
          onBack={()=>setView('main')}
          onHome={()=>setView('main')}
          onDrafts={()=>setView(v => v==='drafts' ? 'main' : 'drafts')}
          onRevenue={()=>setView(v => v==='revenue' ? 'main' : 'revenue')}
          syncStatus={syncStatus}
          onSync={handleSync}
        />

        {view==='main' && (
          <div style={{maxWidth:1200,margin:'0 auto',padding:'24px 24px'}}>

            {/* 내 사업 공통업무 */}
            <CommonTasksCard
              tasks={data.commonTasks || []}
              onAddGroup={addCommonGroup}
              onAddTask={addCommonTask}
              onToggle={toggleCommonTask}
              onDelete={deleteCommonTask}
              onEdit={editCommonTask}
            />

            {/* 필수업무 거래처 */}
            {topClients.length > 0 && cardGrid(topClients)}

            {/* 구분선 */}
            {topClients.length > 0 && bottomClients.length > 0 && (
              <div style={{display:'flex',alignItems:'center',gap:12,margin:'24px 0'}}>
                <div style={{flex:1,height:1,background:'#d1d5db'}} />
                <span style={{fontSize:11,fontWeight:700,color:'#9ca3af',letterSpacing:'1px',whiteSpace:'nowrap'}}>순위 관리 거래처</span>
                <div style={{flex:1,height:1,background:'#d1d5db'}} />
              </div>
            )}

            {/* 순위작업만 거래처 */}
            {bottomClients.length > 0 && cardGrid(bottomClients)}

            {/* 거래처 추가 버튼 */}
            <div style={{display:'flex',justifyContent:'center',marginTop:20,marginBottom:4}}>
              <button
                onClick={()=>openModal('add-client','add',{specialty:'기타',priorityLevel:'중간'},{})}
                style={{background:'none',border:'2px dashed #d1d5db',borderRadius:12,padding:'10px 28px',fontSize:13,fontWeight:700,color:'#9ca3af',cursor:'pointer',fontFamily:'inherit',transition:'all 0.15s'}}
                onMouseOver={e=>{e.target.style.borderColor='#c9a96e';e.target.style.color='#c9a96e';}}
                onMouseOut={e=>{e.target.style.borderColor='#d1d5db';e.target.style.color='#9ca3af';}}>
                + 거래처 추가
              </button>
            </div>

          </div>
        )}

        {view==='drafts' && (
          <DraftsView />
        )}

        {view==='revenue' && (
          <RevenueView data={data} />
        )}

        {view==='client' && selectedClient && (
          <ClientDetailView
            client={selectedClient}
            data={data}
            mutate={mutate}
            onOpenModal={openModal}
            autoLog={autoLog}
            onAddCredential={addCredential}
            onDeleteCredential={deleteCredential}
            onDeletePost={deletePost}
            onUpdateClient={updateClient}
            onDeleteClient={handleDeleteClient}
          />
        )}

        {modal.open && (
          <Modal modal={modal} onClose={closeModal} onSave={handleSave} onDelete={handleDelete} />
        )}

        {/* 관리 버튼 */}
        <div style={{position:'fixed',bottom:20,right:20,display:'flex',flexDirection:'column',gap:8,alignItems:'flex-end'}}>
          {view==='main' && (
            <button
              style={{background:'rgba(26,26,46,0.85)',color:'rgba(255,255,255,0.6)',border:'none',borderRadius:20,padding:'6px 14px',fontSize:11,cursor:'pointer',fontFamily:'inherit'}}
              onClick={()=>{ if(confirm('⚠️ 로컬 데이터를 기본값으로 초기화합니다. 계속하시겠습니까?') && confirm('정말 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) { localStorage.removeItem(STORAGE_KEY); setData({...DEFAULT_DATA}); } }}>
              ↺ 데이터 초기화
            </button>
          )}
          <button
            style={{background:'#c9a96e',color:'#fff',border:'none',borderRadius:20,padding:'6px 14px',fontSize:11,cursor:'pointer',fontFamily:'inherit'}}
            onClick={()=>{
              const json=JSON.stringify(window.dashboardData,null,2);
              const blob=new Blob([json],{type:'application/json'});
              const a=document.createElement('a');
              a.href=URL.createObjectURL(blob);
              a.download='dashboard_data.json';
              a.click();
            }}>
            ⬇ JSON 내보내기
          </button>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
