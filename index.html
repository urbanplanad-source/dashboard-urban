  function ClientDetailView({ client, data, mutate, onOpenModal, autoLog, onAddCredential, onDeleteCredential, onDeletePost, onUpdateClient, onDeleteClient, onSaveClientBrief }) {
    const cDelivs = (data.deliverables||[]).filter(d=>d.clientId===client.clientId);
    const cLogs   = (data.logs||[]).filter(l=>l.clientId===client.clientId).sort((a,b)=>b.createdAt>a.createdAt?1:-1);
    const [postMonth, setPostMonth] = useState(nowMonth);
    const clientPostMonths = useMemo(() => {
      const months = new Set([nowMonth()]);
      (data.postLogs||[]).forEach(post => {
        if (post.clientId === client.clientId && postLogMonth(post)) months.add(postLogMonth(post));
      });
      return [...months].sort((a,b)=>b.localeCompare(a));
    }, [data.postLogs, client.clientId]);

    // 선택한 월의 발행 글 (이 거래처의 전체 postLogs, 최신순)
    const cPosts  = (data.postLogs||[])
      .filter(p => p.clientId === client.clientId && postLogMonth(p) === postMonth)
      .sort((a,b)=>b.publishedAt>a.publishedAt?1:-1);

    // ── 상담 내역 (btskin / belrmon 전용, localStorage) ──
    const CONSULT_CLIENTS = ['btskin', 'belrmon'];
    const CONSULT_CH = ['위챗', '라인', '인스타'];
    const CONSULT_CH_COLOR = { '위챗':'#16a34a', '라인':'#65a30d', '인스타':'#9333ea' };
    const CONSULT_KEY = 'consult-v1-' + client.clientId;

    function readConsults(clientId) {
      const key = 'consult-v1-' + clientId;
      try {
        const list = JSON.parse(safeStorage.getItem(key) || '[]');
        return Array.isArray(list)
          ? list.map(c => ({ ...normalizeConsult(c), clientId: c.clientId || clientId })).filter(c => c.id)
          : [];
      } catch {
        return [];
      }
    }
    function writeConsults(clientId, list) {
      const normalized = (list || [])
        .map(c => ({ ...normalizeConsult(c), clientId: c.clientId || clientId }))
        .filter(c => c.id && c.status !== 'deleted');
      const key = 'consult-v1-' + clientId;
      safeStorage.setItem(key, JSON.stringify(normalized));
      if (normalized.length > 0) {
        safeStorage.setItem(key + '-lastgood', JSON.stringify(normalized));
      }
      return normalized;
    }

    const [consultList,    setConsultList]    = useState(() => {
      return readConsults(client.clientId);
    });
    const [consultMonth,   setConsultMonth]   = useState(() => prevMonth());
    // Sheets에 아직 없는 로컬 상담 건수. 화면 진입 시 자동 전송하지 않으므로
    // 사용자가 보강이 필요한 상태임을 알 수 있도록 표시만 한다.
    const [unsyncedConsultCount, setUnsyncedConsultCount] = useState(0);
    const [consultFilter,  setConsultFilter]  = useState('');
    const [consultExpId,   setConsultExpId]   = useState(null);
    const [showConsultAdd, setShowConsultAdd] = useState(false);
    const [histExpMonth,   setHistExpMonth]   = useState(null);  // 이전 월 통계 펼친 항목
    const [consultForm,    setConsultForm]    = useState(() => {
      return { date: today(), channel:'위챗', nickname:'', content:'' };
    });

    function saveConsults(list) {
      const normalized = writeConsults(client.clientId, list);
      setConsultList(normalized);
    }
    function addConsult() {
      if (!consultForm.nickname.trim()) { alert('닉네임을 입력하세요.'); return; }
      if (!consultForm.content.trim())  { alert('대화 내역을 입력하세요.'); return; }
      const id = 'cs-' + Date.now().toString(36);
      const entry = { ...consultForm, id, consultId: id, clientId: client.clientId, createdAt: new Date().toISOString() };
      saveConsults([entry, ...consultList]);
      setConsultMonth(normalizeMonth(entry.month || entry.date));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({
          action: 'addConsult',
          clientId: client.clientId,
          consultId: entry.id,
          date: entry.date,
          month: entry.month || normalizeMonth(entry.date),
          channel: entry.channel,
          nickname: entry.nickname,
          content: entry.content,
          createdAt: entry.createdAt,
        })
      })
        .then(r => r.json())
        .then(d => { if (!d.success) throw new Error(d.error || 'addConsult 실패'); })
        .catch(e => console.warn('addConsult Sheets 오류:', e));
      setConsultForm({ date: today(), channel:'위챗', nickname:'', content:'' });
      setShowConsultAdd(false);
    }
    function deleteConsult(id) {
      if (!confirm('이 상담 내역을 삭제하시겠습니까?')) return;
      saveConsults(consultList.filter(c => c.id !== id));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action:'deleteConsult', clientId: client.clientId, consultId: id })
      })
        .then(r => r.json())
        .then(d => { if (!d.success) throw new Error(d.error || 'deleteConsult 실패'); })
        .catch(e => console.warn('deleteConsult Sheets 오류:', e));
    }

    useEffect(() => {
      if (!CONSULT_CLIENTS.includes(client.clientId)) {
        setConsultList([]);
        return;
      }
      let cancelled = false;
      const currentRaw = safeStorage.getItem(CONSULT_KEY);
      const localList = readConsults(client.clientId);
      const fallbackList = localList.length
        ? localList
        : currentRaw === null ? (() => {
            try {
              const raw = safeStorage.getItem(CONSULT_KEY + '-lastgood');
              const parsed = raw ? JSON.parse(raw) : [];
              return Array.isArray(parsed)
                ? parsed.map(c => ({ ...normalizeConsult(c), clientId: c.clientId || client.clientId })).filter(c => c.id)
                : [];
            } catch {
              return [];
            }
          })() : [];

      setConsultList(fallbackList);
      if (fallbackList.length && !localList.length) {
        writeConsults(client.clientId, fallbackList);
      }

      // Keep persisted consultation records visible after their calendar month ends.
      const params = new URLSearchParams({ action:'consultsList', clientId: client.clientId });

      fetch(API_URL + '?' + params.toString())
        .then(r => r.json())
        .then(d => {
          const remote = d.data?.consults || d.consults || [];
          if (!d.success || !Array.isArray(remote) || cancelled) return;
          const normalizedRemote = remote
            .map(c => ({ ...normalizeConsult(c), clientId: c.clientId || client.clientId }))
            .filter(c => c.id && c.status !== 'deleted');
          const remoteIds = new Set(normalizedRemote.map(c => c.id));
          const currentLocal = readConsults(client.clientId);
          const baseLocal = currentLocal.length ? currentLocal : fallbackList;

          // 화면을 여는 것만으로는 절대 Sheets에 쓰지 않는다.
          // 과거에는 원격이 비었을 때 로컬 전체를, 원격에 없는 항목은 개별로
          // addConsult POST 했다. 수백 건이 동시 전송되어 Failed to fetch와
          // Apps Script 경합을 일으켰고, 사용자에게는 아무 표시도 남지 않았다.
          // 저장은 상담 추가/삭제 같은 명시적 사용자 행동에서만 수행한다.
          // 원격에 없는 로컬 항목은 삭제하지 않고 병합해 계속 표시하며,
          // Sheets 보강이 필요하면 scripts/consult-backfill.mjs로 처리한다.
          if (!normalizedRemote.length) {
            setUnsyncedConsultCount(baseLocal.filter(c => c.id).length);
            return;
          }

          setConsultList(() => {
            const merged = writeConsults(client.clientId, mergeConsultLists(baseLocal, normalizedRemote));
            setUnsyncedConsultCount(merged.filter(c => c.id && !remoteIds.has(c.id)).length);
            return merged;
          });
        })
        .catch(() => {});

      return () => { cancelled = true; };
    }, [client.clientId]);

    const consultMonths = [...new Set(consultList
      .map(item => normalizeMonth(item.month || item.date))
      .filter(Boolean))]
      .sort((a, b) => b.localeCompare(a));
    const monthConsultList = consultList.filter(item => normalizeMonth(item.month || item.date) === consultMonth);

    // 발행 글 인라인 편집 상태
    const [editingPost,    setEditingPost]    = useState(null);
    const [editPostTitle,  setEditPostTitle]  = useState('');
    const [editPostUrl,    setEditPostUrl]    = useState('');

    function startEditPost(pl) {
      setEditingPost(pl.logId);
      setEditPostTitle(pl.title || '');
      setEditPostUrl(pl.url    || '');
    }
    function saveEditPost(pl) {
      if (!editPostTitle.trim()) { setEditingPost(null); return; }
      mutate(d => ({
        ...d,
        postLogs: (d.postLogs||[]).map(p => p.logId===pl.logId
          ? { ...p, title: editPostTitle.trim(), url: editPostUrl.trim() }
          : p
        )
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updatePost', logId: pl.logId, title: editPostTitle.trim(), url: editPostUrl.trim() })
      }).catch(e => console.warn('updatePost 오류:', e));
      setEditingPost(null);
    }

    // 거래처 정보 인라인 편집 상태
    const [editingClient,  setEditingClient]  = useState(false);
    const [editCName,      setEditCName]      = useState(client.clientName);
    const [editContact,    setEditContact]    = useState(client.mainContact    || '');
    const [editReport,     setEditReport]     = useState(client.reportFile     || '');
    const [editSpecialty,  setEditSpecialty]  = useState(client.specialty      || '기타');
    const [editPriority,   setEditPriority]   = useState(client.priorityLevel  || '중간');

    function saveClientInfo() {
      onUpdateClient(client.clientId, {
        clientName:    editCName.trim()   || client.clientName,
        mainContact:   editContact.trim(),
        reportFile:    editReport.trim(),
        specialty:     editSpecialty,
        priorityLevel: editPriority,
      });
      setEditingClient(false);
    }

    return (
      <div style={{maxWidth:860,margin:'0 auto',padding:'28px 24px'}}>
        {/* Client info card */}
        <div style={{background:'var(--surface)',borderRadius:14,border:'1px solid var(--border)',padding:'22px 24px',marginBottom:24}}>
          {editingClient ? (
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'var(--text)',marginBottom:10}}>거래처 정보 수정</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                <input value={editCName}   onChange={e=>setEditCName(e.target.value)}   placeholder="거래처명 *"   style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none'}} />
                <input value={editContact} onChange={e=>setEditContact(e.target.value)} placeholder="담당자명"     style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none'}} />
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                <select value={editSpecialty} onChange={e=>setEditSpecialty(e.target.value)}
                  style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)'}}>
                  {SPECIALTIES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <select value={editPriority} onChange={e=>setEditPriority(e.target.value)}
                  style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)'}}>
                  <option value="높음">우선순위: 높음</option>
                  <option value="중간">우선순위: 중간</option>
                  <option value="낮음">우선순위: 낮음</option>
                </select>
              </div>
              <input value={editReport}  onChange={e=>setEditReport(e.target.value)}  placeholder="보고서 파일명 (예: btskin.html)" style={{width:'100%',boxSizing:'border-box',padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:10}} />
              <div style={{display:'flex',gap:8,justifyContent:'space-between',alignItems:'center'}}>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={saveClientInfo} style={{padding:'6px 16px',background:'var(--navy)',color:'#fff',border:'none',borderRadius:7,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>저장</button>
                  <button onClick={()=>setEditingClient(false)} style={{padding:'6px 12px',background:'none',border:'1px solid #dcdad4',borderRadius:7,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
                </div>
                <button onClick={()=>{ if(confirm(`"${client.clientName}" 거래처를 삭제합니까? 관련 업무/로그도 모두 제거됩니다.`)) onDeleteClient(client.clientId); }}
                  style={{display:'inline-flex',alignItems:'center',gap:4,padding:'6px 12px',background:'none',border:'1px solid #fca5a5',borderRadius:7,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--red)'}}>
                  <Icon name="trash" size={11} /> 거래처 삭제
                </button>
              </div>
            </div>
          ) : (
          <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
            <ClientAvatar client={client} size={50} />
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                <h1 style={{fontSize:20,fontWeight:800,color:'var(--ink)',margin:0,letterSpacing:'-.3px'}}>{client.clientName}</h1>
                <SpecBadge specialty={client.specialty} />
              </div>
              <div style={{fontSize:11.5,color:'var(--text-3)',marginTop:6}}>
                최근 업데이트 {fmtDate(client.lastUpdated)} &nbsp;·&nbsp; {client.mainContact}
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
              {client.reportFile && (
                <a href={client.reportFile} target="_blank" rel="noopener"
                  style={{display:'inline-flex',alignItems:'center',gap:6,background:'var(--navy)',color:'#fff',padding:'8px 16px',borderRadius:8,textDecoration:'none',fontSize:13,fontWeight:700}}>
                  보고서 열기 <Icon name="external" size={12} />
                </a>
              )}
              <button
                onClick={()=>{ setEditCName(client.clientName); setEditContact(client.mainContact||''); setEditReport(client.reportFile||''); setEditSpecialty(client.specialty||'기타'); setEditPriority(client.priorityLevel||'중간'); setEditingClient(true); }}
                style={{display:'inline-flex',alignItems:'center',gap:5,padding:'7px 12px',background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:8,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)',fontWeight:600}}>
                <Icon name="pencil" size={11} /> 수정
              </button>
            </div>
          </div>
          )}
        </div>

        <ClientBriefSection
          client={client}
          data={data}
          brief={(data.clientBriefs || {})[client.clientId]}
          onSave={onSaveClientBrief}
        />

        {/* 계정 / 비밀번호 메모 */}
        <CredentialsSection
          clientId={client.clientId}
          credentials={data.credentials || {}}
          onAdd={onAddCredential}
          onDelete={onDeleteCredential}
        />

        {/* Monthly Jobs */}
        <MonthlyJobsSection clientId={client.clientId} data={data} mutate={mutate} autoLog={autoLog} />

        {/* 이달의 발행 글 (postLogs) */}
        <div style={{background:'var(--surface)',borderRadius:12,border:'1px solid var(--border)',padding:'18px 20px',marginBottom:20}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,marginBottom:10,flexWrap:'wrap'}}>
            <div className="section-title" style={{marginBottom:0}}><Icon name="file" size={12} /> 발행 글 목록 ({cPosts.length}건)</div>
            <select value={postMonth} onChange={e=>setPostMonth(e.target.value)} aria-label="발행글 조회 월"
              style={{padding:'5px 9px',border:'1px solid var(--border)',borderRadius:7,background:'var(--surface)',fontSize:11.5,fontWeight:800,color:'var(--text)',fontFamily:'inherit'}}>
              {clientPostMonths.map(month=><option key={month} value={month}>{fmtMonth(month)}</option>)}
            </select>
          </div>
          {cPosts.length === 0 && (
            <div style={{fontSize:12,color:'var(--text-3)',padding:'6px 0'}}>
              {fmtMonth(postMonth)}에 등록된 발행 글이 없습니다. 다른 월을 선택하거나 각 업무 행의 기록 버튼으로 발행 글을 기록하세요.
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            {cPosts.map((pl,i)=>{
              const job = (data.monthlyJobs||[]).find(j=>j.jobId===pl.jobId);
              return (
                <div key={pl.logId||i} style={{borderBottom: i<cPosts.length-1 ? '1px solid #f3f4f6':undefined}}>
                  {editingPost === pl.logId ? (
                    /* 인라인 편집 폼 */
                    <div style={{padding:'8px 0',display:'flex',flexDirection:'column',gap:5}}>
                      <input
                        value={editPostTitle}
                        onChange={e=>setEditPostTitle(e.target.value)}
                        placeholder="글 제목 *"
                        autoFocus
                        onKeyDown={e=>{ if(e.key==='Enter') saveEditPost(pl); if(e.key==='Escape') setEditingPost(null); }}
                        style={{width:'100%',boxSizing:'border-box',padding:'5px 9px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                      />
                      <input
                        value={editPostUrl}
                        onChange={e=>setEditPostUrl(e.target.value)}
                        placeholder="URL (선택)"
                        style={{width:'100%',boxSizing:'border-box',padding:'5px 9px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                      />
                      <div style={{display:'flex',gap:5}}>
                        <button onClick={()=>saveEditPost(pl)}
                          style={{padding:'4px 12px',background:'var(--blue)',color:'#fff',border:'none',borderRadius:5,fontSize:11,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>저장</button>
                        <button onClick={()=>setEditingPost(null)}
                          style={{padding:'4px 10px',background:'none',border:'1px solid #dcdad4',borderRadius:5,fontSize:11,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0'}}>
                      <div style={{width:6,height:6,borderRadius:'50%',background:'#3b82f6',flexShrink:0}} />
                      <div style={{flex:1,minWidth:0}}>
                        {pl.url ? (
                          <a href={pl.url} target="_blank" rel="noopener"
                            style={{fontSize:13,fontWeight:600,color:'var(--blue)',textDecoration:'none',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                            {pl.title}
                          </a>
                        ) : (
                          <span style={{fontSize:13,fontWeight:600,color:'var(--text)',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pl.title}</span>
                        )}
                        <div style={{display:'flex',alignItems:'center',gap:6,marginTop:2}}>
                          {job && <span style={{fontSize:10,color:'var(--text-3)'}}>{job.title}</span>}
                          {pl.channel && <span style={{fontSize:10,fontWeight:600,padding:'1px 6px',borderRadius:8,background:'#eff6ff',color:'#3b82f6'}}>{pl.channel}</span>}
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                        <span style={{fontSize:11,color:'var(--text-3)'}}>{fmtDate(pl.publishedAt)}</span>
                        <button className="btn-icon" onClick={()=>startEditPost(pl)} title="수정"
                          style={{color:'#d1d5db',fontSize:11,padding:'2px 5px'}}>✎</button>
                        <button className="btn-icon"
                          onClick={() => onOpenModal('delete','del',{},{type:'post',id:pl.logId,name:'이 발행 글'})}
                          title="삭제" style={{color:'#d1d5db',padding:'2px 5px'}}><Icon name="trash" size={12} /></button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* ── 상담 내역 (btskin / belrmon 전용) ── */}
        {CONSULT_CLIENTS.includes(client.clientId) && (
          <div style={{marginBottom:24}}>
            {/* 섹션 헤더 */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <div className="section-title" style={{margin:0}}><Icon name="message" size={12} /> 채널별 상담 내역</div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <select value={consultMonth} onChange={e=>{setConsultMonth(e.target.value);setConsultFilter('');}}
                  style={{padding:'5px 9px',border:'1px solid var(--border)',borderRadius:7,fontSize:12,fontWeight:700,color:'var(--text)',background:'var(--surface)',fontFamily:'inherit'}}>
                  {consultMonths.map(month => <option key={month} value={month}>{fmtMonth(month)}</option>)}
                </select>
                <button onClick={()=>setShowConsultAdd(v=>!v)}
                  style={{background: showConsultAdd?'#6366f1':'rgba(99,102,241,0.1)', color: showConsultAdd?'#fff':'#6366f1', border:'1px solid rgba(99,102,241,0.3)', borderRadius:7, padding:'5px 14px', fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
                  {showConsultAdd ? '✕ 닫기' : '+ 추가'}
                </button>
              </div>
            </div>

            {/* 추가 폼 */}
            {showConsultAdd && (
              <div style={{background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:10, padding:'16px', marginBottom:12}}>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:8}}>
                  <div>
                    <div style={{fontSize:11,fontWeight:600,color:'var(--text-2)',marginBottom:3}}>날짜</div>
                    <input type="date" value={consultForm.date}
                      onChange={e=>setConsultForm(f=>({...f,date:e.target.value}))}
                      style={{width:'100%',boxSizing:'border-box',padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}} />
                  </div>
                  <div>
                    <div style={{fontSize:11,fontWeight:600,color:'var(--text-2)',marginBottom:3}}>채널</div>
                    <select value={consultForm.channel} onChange={e=>setConsultForm(f=>({...f,channel:e.target.value}))}
                      style={{width:'100%',boxSizing:'border-box',padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)'}}>
                      {CONSULT_CH.map(ch=><option key={ch} value={ch}>{ch}</option>)}
                    </select>
                  </div>
                  <div>
                    <div style={{fontSize:11,fontWeight:600,color:'var(--text-2)',marginBottom:3}}>상대방 닉네임</div>
                    <input value={consultForm.nickname} onChange={e=>setConsultForm(f=>({...f,nickname:e.target.value}))}
                      placeholder="닉네임 또는 이름"
                      style={{width:'100%',boxSizing:'border-box',padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}} />
                  </div>
                </div>
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--text-2)',marginBottom:3}}>대화 내역</div>
                  <textarea value={consultForm.content} onChange={e=>setConsultForm(f=>({...f,content:e.target.value}))}
                    placeholder="대화 내역 전체를 붙여넣으세요"
                    style={{width:'100%',boxSizing:'border-box',padding:'9px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none',minHeight:100,resize:'vertical',lineHeight:1.6}} />
                </div>
                <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                  <button onClick={()=>{setShowConsultAdd(false);}}
                    style={{padding:'7px 16px',background:'var(--border-2)',border:'none',borderRadius:6,fontSize:12,fontWeight:600,color:'var(--text)',cursor:'pointer',fontFamily:'inherit'}}>취소</button>
                  <button onClick={addConsult}
                    style={{padding:'7px 18px',background:'#6366f1',border:'none',borderRadius:6,fontSize:12,fontWeight:700,color:'#fff',cursor:'pointer',fontFamily:'inherit'}}>저장</button>
                </div>
              </div>
            )}

            {/* Sheets 미반영 안내 — 화면 진입만으로 자동 전송하지 않으므로 상태만 알린다 */}
            {unsyncedConsultCount > 0 && (
              <div style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 10px',marginBottom:10,fontSize:11,fontWeight:700,color:'var(--text-2)'}}>
                Sheets에 없는 로컬 상담 {unsyncedConsultCount}건이 있습니다. 화면에는 계속 표시되며 자동 전송하지 않습니다.
              </div>
            )}

            {/* 채널 필터 */}
            {monthConsultList.length > 0 && (
              <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
                <button onClick={()=>setConsultFilter('')}
                  style={{background:consultFilter===''?'#1a1a2e':'#f3f4f6', color:consultFilter===''?'#fff':'#6b7280', border:'none', borderRadius:20, padding:'4px 12px', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
                  전체 {monthConsultList.length}
                </button>
                {CONSULT_CH.map(ch=>{
                  const cnt = monthConsultList.filter(c=>c.channel===ch).length;
                  if (!cnt) return null;
                  const col = CONSULT_CH_COLOR[ch];
                  return (
                    <button key={ch} onClick={()=>setConsultFilter(ch===consultFilter?'':ch)}
                      style={{background:consultFilter===ch?col:'#f3f4f6', color:consultFilter===ch?'#fff':'#6b7280', border:'none', borderRadius:20, padding:'4px 12px', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
                      {ch} {cnt}
                    </button>
                  );
                })}
              </div>
            )}

            {/* 목록 */}
            {monthConsultList.length === 0 ? (
              <div style={{textAlign:'center',padding:'28px 0',color:'var(--text-3)',fontSize:12,border:'1px dashed #e8e7e3',borderRadius:10}}>
                {fmtMonth(consultMonth)}에 저장된 상담 내역이 없습니다
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {monthConsultList
                  .filter(c=>!consultFilter||c.channel===consultFilter)
                  .map(entry=>{
                    const col = CONSULT_CH_COLOR[entry.channel]||'#6b7280';
                    const isExp = consultExpId === entry.id;
                    return (
                      <div key={entry.id} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
                        {/* 카드 헤더 */}
                        <div style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px',cursor:'pointer'}}
                          onClick={()=>setConsultExpId(isExp?null:entry.id)}>
                          <span style={{background:col+'1a',color:col,fontSize:11,fontWeight:700,borderRadius:10,padding:'2px 9px',flexShrink:0}}>{entry.channel}</span>
                          <span style={{fontSize:13,fontWeight:700,color:'var(--ink)',flex:1}}>{entry.nickname}</span>
                          <span style={{fontSize:11,color:'var(--text-3)',flexShrink:0}}>{entry.date}</span>
                          <span style={{fontSize:11,color:'var(--text-3)',marginLeft:4}}>{isExp?'▲':'▼'}</span>
                          <button onClick={e=>{e.stopPropagation();deleteConsult(entry.id);}}
                            style={{background:'none',border:'none',color:'#d1d5db',fontSize:13,cursor:'pointer',padding:'0 2px',lineHeight:1,flexShrink:0}}
                            onMouseOver={e=>e.target.style.color='#ef4444'}
                            onMouseOut={e=>e.target.style.color='#d1d5db'}>✕</button>
                        </div>
                        {/* 내용 펼침 */}
                        {isExp && (
                          <div style={{padding:'0 14px 14px',borderTop:'1px solid var(--border-2)'}}>
                            <pre style={{margin:'10px 0 0',fontFamily:'inherit',fontSize:12,lineHeight:1.75,color:'var(--text)',whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{entry.content}</pre>
                          </div>
                        )}
                      </div>
                    );
                  })
                }
              </div>
            )}
          </div>
        )}

        {/* ── 채널별 상담 통계 (이전 월 백업) ── */}
        {CONSULT_CLIENTS.includes(client.clientId) && (() => {
          const HIST_COLORS = { '위챗':'#16a34a', '라인':'#65a30d', '인스타':'#9333ea' };
          const myHistories = (data.consultHistories || [])
            .filter(h => h.clientId === client.clientId)
            .sort((a, b) => b.month.localeCompare(a.month));
          if (!myHistories.length) return null;
          return (
            <div style={{marginBottom:24}}>
              <div className="section-title"><Icon name="chart" size={12} /> 채널별 상담 통계 (월별 백업)</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {myHistories.map(h => {
                  const total = h.summary?.total || 0;
                  const byChannel = h.summary?.byChannel || {};
                  const isOpen = histExpMonth === (h.month + h.clientId);
                  return (
                    <div key={h.month + h.clientId}
                      style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
                      {/* 헤더 */}
                      <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',cursor:'pointer',userSelect:'none'}}
                        onClick={()=>setHistExpMonth(isOpen ? null : (h.month + h.clientId))}>
                        <span style={{fontSize:13,fontWeight:700,color:'var(--ink)',flex:1}}>
                          {fmtMonth(h.month)} 상담 내역
                        </span>
                        <span style={{fontSize:12,background:'var(--gold-bg)',color:'#92400e',fontWeight:700,padding:'2px 10px',borderRadius:20,flexShrink:0}}>
                          총 {total}건
                        </span>
                        {/* 채널 요약 chips */}
                        <div style={{display:'flex',gap:5,flexShrink:0}}>
                          {Object.entries(byChannel).sort((a,b)=>b[1]-a[1]).map(([ch,cnt])=>{
                            const col = HIST_COLORS[ch]||'#6b7280';
                            return (
                              <span key={ch} style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:20,background:col+'18',color:col}}>
                                {ch} {cnt}
                              </span>
                            );
                          })}
                        </div>
                        <span style={{fontSize:11,color:'var(--text-3)',flexShrink:0}}>{isOpen?'▲':'▼'}</span>
                      </div>

                      {/* 채널별 비율 바 */}

                        {/* 개별 기록 (펼쳤을 때만) */}
                        {isOpen && h.records && h.records.length > 0 && (

                            {h.records.map((r,i)=>{

                              return (
                                <div key={r.id||i} style={{background:'var(--surface-2)',borderRadius:8,padding:'9px 12px',border:'1px solid #f3f4f6'}}>
                                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:r.content?5:0}}>
                                    <span style={{fontSize:10,fontWeight:700,borderRadius:10,padding:'1px 7px',background:col+'18',color:col,flexShrink:0}}>{r.channel}</span>
                                    <span style={{fontSize:12,fontWeight:700,color:'var(--ink)',flex:1}}>{r.nickname}</span>

        })()}

        {/* Deliverables */}
        {cDelivs.length > 0 && (
          <div style={{marginBottom:24}}>
            <div className="section-title">산출물 / 보고서 링크</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {cDelivs.map(d=>(
                <div key={d.deliverableId} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}>
                  <Icon name="file" size={18} style={{color:'var(--text-3)'}} />
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:'var(--ink)'}}>{d.title}</div>
                    <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{d.contentPreview} · {fmtDate(d.updatedAt)}</div>
                  </div>
                  <span style={{fontSize:11,background:'var(--border-2)',padding:'2px 8px',borderRadius:20,color:'var(--text-2)',fontWeight:600}}>{d.kind}</span>

                    <a href={d.reportFile} target="_blank" rel="noopener"
                      style={{fontSize:12,fontWeight:700,color:'var(--ink)',background:'var(--gold-bg)',padding:'5px 12px',borderRadius:6,textDecoration:'none',flexShrink:0}}>
                      열기 →
                    </a>
                  )}

              ))}
            </div>
          </div>
        )}

      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  DRAFTS VIEW (글 보관함)
  // ═══════════════════════════════════════════════
  const DRAFT_CLIENT_MAP = {
    btskin:'노형아름다운피부과', belrmon:'벨르몬성형외과', eyecare:'눈사랑안과',
    seoulup:'서울UP치과', echi:'이치과', igochi:'이고치과',
    jejuexpress:'제주인익스프레스',
    kyunghee:'365경희부부한의원 피부클리닉',
    hwabuk:'365경희부부한의원 화북점',
    jocheon:'경희부부한의원 조천점'
  };
  const DRAFT_CHANNELS = ['홈페이지','블로그','위챗','인스타','라인','기타'];
  const DRAFT_CH_COLOR = {
    '홈페이지':'#1d4ed8','블로그':'#16a34a','위챗':'#15803d',
    '인스타':'#9333ea','라인':'#65a30d','기타':'#6b7280'
  };
  const normalizePublishChannel = (channel) => {
    const ch = String(channel || '').trim();
    if (ch === '인스타그램') return '인스타';
    if (ch === 'LINE') return '라인';
    return DRAFT_CHANNELS.includes(ch) ? ch : '기타';
  };
  const jobChannelScore = (job, channel) => {
    const title = String(job?.title || '');
    const ch = normalizePublishChannel(channel);
    if (ch === '블로그' && title.includes('블로그')) return 30;
    if (ch === '위챗' && title.includes('위챗')) return 30;
    if (ch === '인스타' && /인스타|SNS/.test(title)) return 30;
    if (ch === '라인' && /라인|LINE/i.test(title)) return 30;
    if (ch === '홈페이지' && /홈페이지|병원마케팅 콘텐츠|콘텐츠 제작|글 발행/.test(title)) return 25;
    return 0;
  };

  // ── 글 보관함 파이프라인 status (Drafts 시트 status 컬럼과 1:1) ──
  // growth-team(push) → review → [검토] → approved → naver-writer(임시저장 성공 후 원본 삭제)
  // staged는 삭제를 사용하지 않는 수동/레거시 흐름을 위해 유지한다. 실제 발행은 항상 수동이다.
  const DRAFT_STATUSES = ['draft','review','approved','staged','published'];
  const DRAFT_STATUS_META = {
    draft:     { label:'초안',      color:'var(--text-2)', bg:'var(--border-2)' },
    review:    { label:'검토중',    color:'var(--amber)',  bg:'var(--amber-bg)' },
    approved:  { label:'승인',      color:'var(--blue)',   bg:'var(--blue-bg)' },
    staged:    { label:'임시저장됨', color:'var(--purple)', bg:'var(--purple-bg)' },
    published: { label:'발행완료',  color:'var(--green)',  bg:'var(--green-bg)' },
  };
  const normalizeDraftStatus = (s) => {
    const v = String(s || '').trim();
    return DRAFT_STATUSES.includes(v) ? v : 'draft';
  };
  const SAFE_DRAFT_ID_PATTERN = /^dr-[A-Za-z0-9]+(?:[-_][A-Za-z0-9]+)*$/;
  const NAVER_BLOG_CHANNEL_KEYS = new Set(['블로그', 'blog', 'naverblog', 'naver-blog', 'naver_blog']);
  const HOMEPAGE_CHANNEL_KEYS = new Set(['홈페이지', 'homepage', 'home']);
  const isSafeDraftId = (draftId) => SAFE_DRAFT_ID_PATTERN.test(String(draftId || '').trim());
  const isNaverBlogChannel = (channel) => NAVER_BLOG_CHANNEL_KEYS.has(String(channel || '').trim().toLowerCase().replace(/\s+/g, ''));
  const isHomepageChannel = (channel) => HOMEPAGE_CHANNEL_KEYS.has(String(channel || '').trim().toLowerCase().replace(/\s+/g, ''));
  const shouldShowApproveButton = (draft) => isNaverBlogChannel(draft?.channel)
    && ['draft', 'review'].includes(normalizeDraftStatus(draft?.status));
  const canRegisterPublishedDraft = (draft) => {
    const status = normalizeDraftStatus(draft?.status);
    return isHomepageChannel(draft?.channel) ? status === 'staged' : (status === 'approved' || status === 'staged');
  };
  const needsComplianceReview = (draft) => String(draft?.memo || '').toLowerCase().includes('needs_compliance_review');
  const getNaverCommandBlockReason = (draft) => {
    if (needsComplianceReview(draft)) return '심의 검토 표시가 있는 글은 승인하거나 CMD로 보낼 수 없습니다.';
    if (normalizeDraftStatus(draft?.status) !== 'approved') return '서버에 승인 저장이 완료된 글만 CMD로 보낼 수 있습니다.';
    if (!isNaverBlogChannel(draft?.channel)) return '블로그 채널의 승인 글만 네이버 임시저장 대상으로 선택할 수 있습니다.';
    if (!isSafeDraftId(draft?.draftId)) return '안전하지 않은 초안 ID라 CMD를 만들 수 없습니다.';
    return '';
  };
  const isNaverCommandEligible = (draft) => !getNaverCommandBlockReason(draft);
  const requireSafeDraftId = (draftId) => {
    const value = String(draftId || '').trim();
    if (!isSafeDraftId(value)) throw new Error(`안전하지 않은 초안 ID입니다: ${value || '(없음)'}`);
    return value;
  };
  const assertUpdateDraftResponse = (result, expectedDraftId) => {
    const expected = requireSafeDraftId(expectedDraftId);
    if (!result?.success) throw new Error(result?.error || 'updateDraft 실패');
    const confirmedDraftId = result.data?.draft?.draftId
      ?? result.data?.draftId
      ?? result.draft?.draftId
      ?? result.draftId;
    if (String(confirmedDraftId || '').trim() !== expected) {
      throw new Error(`updateDraft 응답의 초안 ID가 일치하지 않습니다 (${confirmedDraftId || '없음'}).`);
    }
  };

  function DraftsView({ data, mutate }) {
    const [drafts,        setDrafts]        = useState([]);
    const [loading,       setLoading]       = useState(true);
    const [detailLoading, setDetailLoading] = useState(null);
    const [detailErrors,  setDetailErrors]  = useState({});
    const [filterClient,  setFilterClient]  = useState('');
    const [filterChannel, setFilterChannel] = useState('');
    const [filterStatus,  setFilterStatus]  = useState('');
    const [expandedId,    setExpandedId]    = useState(null);
    const [showAdd,       setShowAdd]       = useState(false);
    const [copied,        setCopied]        = useState(null);
    const [commandCopied, setCommandCopied] = useState(null);
    const [selectedCommandCopied, setSelectedCommandCopied] = useState(false);
    const [allCommandCopied, setAllCommandCopied] = useState(false);
    const [selectedDraftIds, setSelectedDraftIds] = useState([]);
    const [statusSavingIds, setStatusSavingIds] = useState([]);
    const statusSavingRef = useRef(new Set());
    const [addForm,       setAddForm]       = useState({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' });
    const [publishDraft,  setPublishDraft]  = useState(null);
    const [publishForm,   setPublishForm]   = useState({ clientId:'', jobId:'', title:'', url:'', channel:'홈페이지', publishedAt:today() });
    const [publishSaving, setPublishSaving] = useState(false);

    function normalizeDraftList(list, hasFullContent=false) {
      return (list || []).map(d => {
        const content = d.content || '';
        return {
          ...d,
          status: normalizeDraftStatus(d.status),
          preview: d.preview || content.slice(0, 120),
          contentLength: Number(d.contentLength || content.length || 0),
          contentLoaded: hasFullContent || Boolean(content),
        };
      });
    }

    function extractDraftList(payload) {
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload?.data?.drafts)) return payload.data.drafts;
      if (Array.isArray(payload?.drafts)) return payload.drafts;
      throw new Error('초안 목록 응답에 drafts 배열이 없습니다.');
    }

    async function fetchDraftListSnapshot() {
      const response = await fetch(API_URL + '?action=draftsList');
      const payload = await readApiJson(response, 'draftsList');
      if (!payload.success) throw new Error(payload.error || 'draftsList 실패');
      return normalizeDraftList(extractDraftList(payload));
    }

    async function fetchSummaryDraftListSnapshot() {
      const response = await fetch(API_URL + '?action=summary&draftMode=light');
      const payload = await readApiJson(response, 'summary');
      if (!payload.success) throw new Error(payload.error || 'summary 실패');
      const list = extractDraftList(payload);
      const hasFullContent = list.some(item => item.content);
      return normalizeDraftList(list, hasFullContent);
    }

    async function fetchDraftDetailSnapshot(draftId) {
      const expectedDraftId = requireSafeDraftId(draftId);
      const response = await fetch(API_URL + '?action=draftDetail&draftId=' + encodeURIComponent(expectedDraftId));
      const payload = await readApiJson(response, 'draftDetail');
      const detail = payload.data?.draft || payload.data || payload.draft;
      if (!payload.success || !detail || typeof detail !== 'object' || Array.isArray(detail)) {
        throw new Error(payload.error || 'draftDetail 응답에 초안 상세가 없습니다.');
      }
      if (String(detail.draftId || '').trim() !== expectedDraftId) {
        throw new Error(`draftDetail 응답의 초안 ID가 일치하지 않습니다 (${detail.draftId || '없음'}).`);
      }
      return detail;
    }

    async function readDraftStatusSnapshot(draftId) {
      const expectedDraftId = requireSafeDraftId(draftId);
      const list = await fetchDraftListSnapshot();
      const matches = list.filter(item => String(item.draftId || '').trim() === expectedDraftId);
      if (matches.length !== 1) {
        throw new Error(matches.length === 0
          ? `draftsList에서 초안을 찾을 수 없습니다 (${expectedDraftId}).`
          : `draftsList에 같은 초안 ID가 여러 건 있습니다 (${expectedDraftId}).`);
      }
      const detail = await fetchDraftDetailSnapshot(expectedDraftId);
      const listStatus = String(matches[0].status || '').trim();
      const detailStatus = String(detail.status || '').trim();
      if (!DRAFT_STATUSES.includes(listStatus) || !DRAFT_STATUSES.includes(detailStatus)) {
        throw new Error(`재조회한 상태가 유효하지 않습니다 (목록: ${listStatus || '없음'}, 상세: ${detailStatus || '없음'}).`);
      }
      if (listStatus !== detailStatus) {
        throw new Error(`draftsList와 draftDetail의 상태가 다릅니다 (${listStatus} / ${detailStatus}).`);
      }
      return { list, detail, status:listStatus };
    }

    function applyDraftStatusSnapshot(snapshot) {
      setDrafts(snapshot.list.slice().reverse());
      setExpandedId(null);
      setSelectedDraftIds(prev => prev.filter(id => {
        const current = snapshot.list.find(item => item.draftId === id);
        return current && isNaverCommandEligible(current);
      }));
    }

    async function loadDrafts() {
      setLoading(true);
      setExpandedId(null);
      setSelectedDraftIds([]);
      try {
        const list = await fetchDraftListSnapshot();
        setDrafts(list.slice().reverse());
      } catch (draftsListError) {
        console.warn('draftsList 오류, summary light로 재조회:', draftsListError);
        try {
          const list = await fetchSummaryDraftListSnapshot();
          setDrafts(list.slice().reverse());
        } catch (summaryError) {
          console.warn('글 보관함 목록 조회 오류:', summaryError);
        }
      } finally {
        setLoading(false);
      }
    }

    useEffect(() => { loadDrafts(); }, []);

    const allClients = [...new Set(drafts.map(d => d.clientId).filter(Boolean))];
    const filtered = drafts.filter(d =>
      (!filterClient  || d.clientId === filterClient) &&
      (!filterChannel || d.channel  === filterChannel) &&
      (!filterStatus  || normalizeDraftStatus(d.status) === filterStatus)
    );
    const statusCounts = DRAFT_STATUSES.reduce((acc, s) => {
      acc[s] = drafts.filter(d => normalizeDraftStatus(d.status) === s).length;
      return acc;
    }, {});
    const statusSavingSet = new Set(statusSavingIds);
    const approvedBlogFiltered = filtered.filter(d => isNaverCommandEligible(d) && !statusSavingSet.has(d.draftId));
    const selectedDraftIdSet = new Set(selectedDraftIds);
    const approvedBlogById = new Map(approvedBlogFiltered.map(d => [d.draftId, d]));
    // 선택 일괄 명령은 사용자가 체크한 순서를 보존한다.
    const selectedApprovedDrafts = selectedDraftIds.map(id => approvedBlogById.get(id)).filter(Boolean);

    // ── 파이프라인 status 변경 (updateDraft 뒤 목록 + 상세 재확인 후에만 화면 반영) ──
    async function changeDraftStatus(draft, status) {
      const draftId = String(draft?.draftId || '').trim();
      const next = normalizeDraftStatus(status);
      const prevStatus = normalizeDraftStatus(draft.status);
      if (next === prevStatus) return;
      if (!isSafeDraftId(draftId)) {
        alert('초안 ID가 안전한 형식이 아니어서 상태를 변경하지 않았습니다.');
        return;
      }
      if ((next === 'approved' || next === 'published') && needsComplianceReview(draft)) {
        alert('심의 검토가 필요한 글은 표시를 해소한 뒤 승인 또는 발행완료 처리할 수 있습니다.');
        return;
      }
      if (isHomepageChannel(draft?.channel) && next === 'approved') {
        alert('홈페이지 글은 승인 자동화를 사용하지 않습니다. 아임웹 작업은 직접 진행해 주세요.');
        return;
      }
      if (isHomepageChannel(draft?.channel) && next === 'published' && prevStatus !== 'staged') {
        alert('임시저장 확인이 끝난 글만 발행완료로 변경할 수 있습니다. 먼저 상태를 임시저장됨으로 확인해 주세요.');
        return;
      }
      if (statusSavingRef.current.has(draftId)) return;

      statusSavingRef.current.add(draftId);
      setStatusSavingIds(prev => prev.includes(draftId) ? prev : [...prev, draftId]);
      let verifiedSnapshot = null;
      try {
        const response = await fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({
            action: 'updateDraft',
            draftId,
            status: next,
            expectedStatus: prevStatus,
          })
        });
        const result = await readApiJson(response, 'updateDraft');
        assertUpdateDraftResponse(result, draftId);

        const confirmedStatusValue = result.data?.draft?.status
          ?? result.data?.status
          ?? result.draft?.status
          ?? result.status;
        if (confirmedStatusValue === undefined || confirmedStatusValue === null || String(confirmedStatusValue).trim() === '') {
          throw new Error('updateDraft 응답에 최종 상태가 없어 변경 결과를 확인할 수 없습니다. 새로고침해 주세요.');
        }
        const confirmedStatus = String(confirmedStatusValue).trim();
        if (!DRAFT_STATUSES.includes(confirmedStatus)) {
          throw new Error(`updateDraft 응답의 최종 상태가 유효하지 않습니다 (${confirmedStatus}).`);
        }
        if (confirmedStatus !== next) {
          throw new Error(`서버 확인 상태가 요청과 다릅니다 (${confirmedStatus}).`);
        }

        verifiedSnapshot = await readDraftStatusSnapshot(draftId);
        if (verifiedSnapshot.status !== next) {
          throw new Error(`재조회한 실제 상태가 요청과 다릅니다 (${verifiedSnapshot.status}).`);
        }
        applyDraftStatusSnapshot(verifiedSnapshot);
      } catch (error) {
        console.warn('updateDraft status 오류:', error);
        let recheckError = null;
        if (!verifiedSnapshot) {
          try {
            verifiedSnapshot = await readDraftStatusSnapshot(draftId);
          } catch (verifyError) {
            recheckError = verifyError;
          }
        }

        if (verifiedSnapshot) {
          applyDraftStatusSnapshot(verifiedSnapshot);
          if (verifiedSnapshot.status === next) {
            alert(`요청 응답은 명확하지 않았지만 draftsList와 draftDetail 재확인 결과 '${DRAFT_STATUS_META[next].label}' 상태로 저장되어 있습니다.`);
          } else {
            alert(`상태 변경을 확정하지 못했습니다. 재조회한 실제 상태는 '${DRAFT_STATUS_META[verifiedSnapshot.status].label}'입니다.\n${error.message || error}`);
          }
        } else {
          alert(`상태 변경 결과를 확인하지 못했습니다. 화면은 승인된 것으로 바꾸지 않았습니다. 새로고침 후 실제 상태를 확인해 주세요.\n${error.message || error}${recheckError ? `\n재확인 오류: ${recheckError.message || recheckError}` : ''}`);
        }
      } finally {
        statusSavingRef.current.delete(draftId);
        setStatusSavingIds(prev => prev.filter(id => id !== draftId));
      }
    }

    async function copyDraftText(text, draftId) {
      try {
        await copyTextToClipboard(text);
        setCopied(draftId);
        setTimeout(() => setCopied(current => current === draftId ? null : current), 2000);
      } catch (error) {
        console.warn('초안 본문 복사 오류:', error);
        throw error;
      }
    }

    function loadDraftContent(draft) {
      if (!draft?.draftId) return Promise.resolve('');
      if (draft.contentLoaded || draft.content) return Promise.resolve(draft.content || '');
      setDetailLoading(draft.draftId);
      setDetailErrors(prev => ({ ...prev, [draft.draftId]: null }));
      return fetchDraftDetailSnapshot(draft.draftId)
        .then(detail => {
          if (detail.content === undefined) throw new Error('본문을 불러오지 못했습니다.');
          setDrafts(prev => prev.map(item => item.draftId === draft.draftId ? {
            ...item,
            ...detail,
            preview: item.preview || (detail.content || '').slice(0, 120),
            contentLength: Number(detail.contentLength || (detail.content || '').length || item.contentLength || 0),
            contentLoaded: true,
          } : item));
          return detail.content || '';
        })
        .catch(e => {
          setDetailErrors(prev => ({ ...prev, [draft.draftId]: e.message || '본문을 불러오지 못했습니다.' }));
          throw e;
        })
        .finally(() => setDetailLoading(null));
    }

    function toggleDraft(draft) {
      if (expandedId === draft.draftId) {
        setExpandedId(null);
        return;
      }
      setExpandedId(draft.draftId);
      loadDraftContent(draft).catch(() => {});
    }

    function handleCopy(draft) {
      loadDraftContent(draft)
        .then(text => copyDraftText(text, draft.draftId))
        .catch(() => alert('본문을 불러오거나 복사하지 못했습니다. 새로고침 후 다시 시도하세요.'));
    }

    function buildNaverTempSaveCommand(draftId) {
      const safeId = requireSafeDraftId(draftId);
      return `cd /d "%USERPROFILE%\\Desktop\\${'\uAC1C\uBC1C \uC791\uC5C5'}\\naver-writer" && npm.cmd run draft:dashboard -- --draft-id "${safeId}"`;
    }

    function buildNaverBulkTempSaveCommand(draftIds) {
      const safeIds = [...new Set((draftIds || []).map(requireSafeDraftId))];
      if (!safeIds.length) throw new Error('복사할 안전한 초안 ID가 없습니다.');
      return `cd /d "%USERPROFILE%\\Desktop\\${'\uAC1C\uBC1C \uC791\uC5C5'}\\naver-writer" && npm.cmd run drafts:dashboard -- --draft-ids "${safeIds.join(',')}"`;
    }

    async function copyCommandText(command, onCopied, onReset) {
      await copyTextToClipboard(command);
      onCopied();
      setTimeout(onReset, 2000);
    }

    function toggleDraftSelection(draftId) {
      const draft = drafts.find(item => item.draftId === draftId);
      const blockedReason = statusSavingSet.has(draftId) ? '상태 저장 중에는 선택할 수 없습니다.' : getNaverCommandBlockReason(draft);
      if (blockedReason) {
        alert(blockedReason);
        return;
      }
      setSelectedDraftIds(prev => prev.includes(draftId)
        ? prev.filter(id => id !== draftId)
        : [...prev, draftId]);
    }

    function toggleAllApprovedSelection() {
      const approvedIds = approvedBlogFiltered.map(d => d.draftId);
      const everySelected = approvedIds.length > 0 && approvedIds.every(id => selectedDraftIdSet.has(id));
      setSelectedDraftIds(prev => {
        const prevSet = new Set(prev);
        if (everySelected) {
          approvedIds.forEach(id => prevSet.delete(id));
        } else {
          approvedIds.forEach(id => prevSet.add(id));
        }
        return [...prevSet];
      });
    }

    async function copySelectedNaverCommands() {
      const ids = selectedApprovedDrafts.map(d => d.draftId);
      if (!ids.length) { alert('선택된 실행 가능 블로그 승인 글이 없습니다.'); return; }
      try {
        await copyCommandText(
          buildNaverBulkTempSaveCommand(ids),
          () => setSelectedCommandCopied(true),
          () => setSelectedCommandCopied(false),
        );
      } catch (error) {
        console.warn('선택 CMD 복사 오류:', error);
        alert(`선택 CMD를 복사하지 못했습니다.\n${error.message || error}`);
      }
    }

    async function copyApprovedNaverCommands() {
      const ids = approvedBlogFiltered.map(d => d.draftId);
      if (!ids.length) { alert('현재 필터에 실행 가능한 블로그 승인 글이 없습니다.'); return; }
      try {
        await copyCommandText(
          buildNaverBulkTempSaveCommand(ids),
          () => setAllCommandCopied(true),
          () => setAllCommandCopied(false),
        );
      } catch (error) {
        console.warn('전체 CMD 복사 오류:', error);
        alert(`전체 CMD를 복사하지 못했습니다.\n${error.message || error}`);
      }
    }

    async function copyNaverCommand(draft) {
      const blockedReason = statusSavingSet.has(draft.draftId) ? '상태 저장 중에는 CMD를 복사할 수 없습니다.' : getNaverCommandBlockReason(draft);
      if (blockedReason) {
        alert(blockedReason);
        return;
      }
      try {
        const command = buildNaverTempSaveCommand(draft.draftId);
        await copyCommandText(
          command,
          () => setCommandCopied(draft.draftId),
          () => setCommandCopied(current => current === draft.draftId ? null : current),
        );
      } catch (error) {
        console.warn('CMD 복사 오류:', error);
        alert(`CMD를 복사하지 못했습니다.\n${error.message || error}`);
      }
    }

    function handleDelete(draftId) {
      if (!confirm('이 초안을 삭제하시겠습니까?')) return;
      setDrafts(prev => prev.filter(d => d.draftId !== draftId));
      setSelectedDraftIds(prev => prev.filter(id => id !== draftId));
      fetch(API_URL, { method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'deleteDraft', draftId })
      }).catch(e => console.warn('deleteDraft 오류:', e));
    }

    function handleAdd() {
      if (!addForm.title.trim()) { alert('제목을 입력하세요.'); return; }
      if (!addForm.content.trim()) { alert('내용을 입력하세요.'); return; }
      const createdAt = today();
      const draftId = 'dr-' + Date.now().toString(36);
      const newDraft = { ...addForm, draftId, createdAt, status:'draft', preview:addForm.content.slice(0,120), contentLength:addForm.content.length, contentLoaded:true };
      setDrafts(prev => [newDraft, ...prev]);
      fetch(API_URL, { method:'POST', redirect:'follow',
        body: JSON.stringify({ action:'addDraft', ...addForm })
      })
        .then(r => r.json())
        .then(d => {
          if (d.success && d.draftId) {
            setDrafts(prev => prev.map(item => item.draftId === draftId ? { ...item, draftId:d.draftId } : item));
          }
        })
        .catch(e => console.warn('addDraft 오류:', e));
      setAddForm({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' });
      setShowAdd(false);
    }

    function getDraftPublishCandidates(draft, channelOverride) {
      const channel = normalizePublishChannel(channelOverride || draft?.channel || '홈페이지');
      return (data?.monthlyJobs || [])
        .filter(job => job.clientId === draft?.clientId)
        .filter(job => job.kind === '필수' || job.targetCount != null || job.title?.includes(channel))
        .map(job => ({
          job,
          score: jobChannelScore(job, channel) + (job.targetCount != null ? 10 : 0) + (job.kind === '필수' ? 5 : 0),
        }))
        .sort((a,b) => b.score - a.score || String(a.job.title).localeCompare(String(b.job.title), 'ko'))
        .map(item => item.job);
    }

    function openPublishModal(draft) {
      if (needsComplianceReview(draft)) {
        alert('심의 검토 표시가 있는 글은 발행 완료로 등록할 수 없습니다.');
        return;
      }
      if (!isSafeDraftId(draft?.draftId)) {
        alert('안전하지 않은 초안 ID라 발행 완료로 등록할 수 없습니다.');
        return;
      }
      if (!canRegisterPublishedDraft(draft)) {
        alert('임시저장 확인이 끝난 글만 발행 완료로 등록할 수 있습니다.');
        return;
      }
      if (!draft.clientId) {
        alert('거래처가 없는 공통 초안은 발행 기록에 연결할 수 없습니다.');
        return;
      }
      const candidates = getDraftPublishCandidates(draft, draft.channel);
      setPublishDraft(draft);
      setPublishForm({
        clientId: draft.clientId,
        jobId: candidates[0]?.jobId || '',
        title: draft.title || '',
        url: '',
        channel: normalizePublishChannel(draft.channel || '홈페이지'),
        publishedAt: today(),
      });
    }

    async function handlePublishDraft() {
      if (!publishDraft || publishSaving) return;
      if (needsComplianceReview(publishDraft)) { alert('심의 검토 표시가 있는 글은 발행 완료로 등록할 수 없습니다.'); return; }
      if (!isSafeDraftId(publishDraft.draftId)) { alert('안전하지 않은 초안 ID라 발행 완료로 등록할 수 없습니다.'); return; }
      if (!canRegisterPublishedDraft(publishDraft)) { alert('임시저장 확인이 끝난 글만 발행 완료로 등록할 수 있습니다.'); return; }
      if (!publishForm.clientId) { alert('거래처를 선택하세요.'); return; }
      if (!publishForm.jobId) { alert('연결할 업무를 선택하세요.'); return; }
      if (!publishForm.title.trim()) { alert('발행 제목을 입력하세요.'); return; }
      const job = (data?.monthlyJobs || []).find(item => item.jobId === publishForm.jobId);
      setPublishSaving(true);
      let addResult = null;
      try {
        const addRes = await fetch(API_URL, {
          method:'POST',
          redirect:'follow',
          body: JSON.stringify({
            action:'addPost',
            clientId: publishForm.clientId,
            jobId: publishForm.jobId,
            title: publishForm.title.trim(),
            url: publishForm.url.trim(),
            channel: normalizePublishChannel(publishForm.channel),
            publishedAt: publishForm.publishedAt || today(),
          })
        });
        addResult = await readApiJson(addRes, 'addPost');
        if (!addResult.success) throw new Error(addResult.error || 'addPost 실패');
      } catch (e) {
        setPublishSaving(false);
        alert(`발행 기록 저장에 실패했습니다.\n\n${e.message || e}`);
        return;
      }

      try {
        const draftRes = await fetch(API_URL, {
          method:'POST',
          redirect:'follow',
          body: JSON.stringify({
            action:'updateDraft',
            draftId: publishDraft.draftId,
            status:'published',
            expectedStatus: normalizeDraftStatus(publishDraft.status),
          })
        });
        const draftResult = await readApiJson(draftRes, 'updateDraft');
        assertUpdateDraftResponse(draftResult, publishDraft.draftId);
      } catch (e) {
        setPublishSaving(false);
        alert(`발행 기록은 저장됐지만 초안 상태 변경에 실패했습니다.\n글 보관함에서 상태를 수동으로 발행완료로 바꿔 주세요.\n\n${e.message || e}`);
        return;
      }

      const publishedAt = normalizeDate(addResult.publishedAt || publishForm.publishedAt || today());
      const newPost = {
        logId: addResult.logId || `pl-${Date.now().toString(36)}`,
        clientId: publishForm.clientId,
        jobId: publishForm.jobId,
        title: publishForm.title.trim(),
        url: publishForm.url.trim(),
        channel: normalizePublishChannel(publishForm.channel),
        publishedAt,
        month: normalizeMonth(addResult.month || publishedAt),
      };
      if (mutate) {
        mutate(prev => ({
          ...prev,
          postLogs: [...(prev.postLogs || []), newPost],
          monthlyJobs: (prev.monthlyJobs || []).map(item =>
            item.jobId === publishForm.jobId && job?.targetCount != null
              ? { ...item, currentCount: Number(item.currentCount || 0) + 1 }
              : item
          ),
        }));
      }
      setDrafts(prev => prev.map(item => item.draftId === publishDraft.draftId ? { ...item, status:'published' } : item));
      setPublishDraft(null);
      setPublishSaving(false);
    }

    const iS = { fontFamily:'inherit', fontSize:13, border:'1px solid var(--border)', borderRadius:6, padding:'7px 10px', outline:'none', background:'var(--surface)' };

    return (
      <div style={{maxWidth:960, margin:'0 auto', padding:'28px 24px'}}>

        {/* 헤더 행 */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20}}>
          <div>
            <h2 style={{display:'flex',alignItems:'center',gap:8,margin:0, fontSize:20, fontWeight:800, color:'var(--ink)',letterSpacing:'-.3px'}}><Icon name="file" size={18} style={{color:'var(--gold)'}} /> 글 보관함</h2>
            <p style={{margin:'4px 0 0', fontSize:12, color:'var(--text-3)'}}>Codex가 작성한 초안을 거래처별로 보관합니다. 복사 후 직접 발행하세요.</p>
          </div>
          <div style={{display:'flex', gap:8}}>
            <button onClick={loadDrafts}
              style={{display:'inline-flex',alignItems:'center',gap:5,background:'var(--border-2)', border:'none', borderRadius:8, padding:'8px 14px', fontSize:12, fontWeight:700, color:'var(--text)', cursor:'pointer', fontFamily:'inherit'}}>
              <Icon name="refresh" size={12} /> 새로고침
            </button>
            <button onClick={() => setShowAdd(v => !v)}
              style={{display:'inline-flex',alignItems:'center',gap:5,background:'var(--navy)', color:'#fff', border:'none', borderRadius:8, padding:'8px 16px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit'}}>
              {showAdd ? <><Icon name="x" size={12} /> 닫기</> : <><Icon name="plus" size={12} /> 직접 등록</>}
            </button>
          </div>
        </div>

        {/* 직접 등록 폼 */}
        {showAdd && (
          <div style={{background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:12, padding:'20px', marginBottom:20}}>
            <div style={{fontWeight:700, fontSize:14, color:'var(--text)', marginBottom:14}}>새 초안 등록</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:10}}>
              <div>
                <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>거래처</div>
                <select value={addForm.clientId} onChange={e => setAddForm(f => ({...f, clientId:e.target.value}))} style={{...iS, width:'100%'}}>
                  <option value="">공통 / 없음</option>
                  {Object.entries(DRAFT_CLIENT_MAP).map(([id,name]) => <option key={id} value={id}>{name}</option>)}
                </select>
              </div>
              <div>
                <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>채널</div>
                <select value={addForm.channel} onChange={e => setAddForm(f => ({...f, channel:e.target.value}))} style={{...iS, width:'100%'}}>
                  {DRAFT_CHANNELS.map(ch => <option key={ch} value={ch}>{ch}</option>)}
                </select>
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>제목</div>
              <input value={addForm.title} onChange={e => setAddForm(f => ({...f, title:e.target.value}))} style={{...iS, width:'100%', boxSizing:'border-box'}} placeholder="글 제목" />
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>본문</div>
              <textarea value={addForm.content} onChange={e => setAddForm(f => ({...f, content:e.target.value}))}
                style={{...iS, width:'100%', boxSizing:'border-box', minHeight:140, resize:'vertical', lineHeight:1.6}}
                placeholder="글 본문 전체 내용을 붙여넣으세요" />
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--text-2)', marginBottom:4}}>메모 (선택)</div>
              <input value={addForm.memo} onChange={e => setAddForm(f => ({...f, memo:e.target.value}))} style={{...iS, width:'100%', boxSizing:'border-box'}} placeholder="키워드, 참고사항 등" />
            </div>
            <div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
              <button onClick={() => { setShowAdd(false); setAddForm({ clientId:'', channel:'홈페이지', title:'', content:'', memo:'' }); }}
                style={{background:'var(--border-2)', border:'none', borderRadius:7, padding:'8px 18px', fontSize:13, fontWeight:600, color:'var(--text)', cursor:'pointer', fontFamily:'inherit'}}>취소</button>
              <button onClick={handleAdd}
                style={{background:'#6366f1', border:'none', borderRadius:7, padding:'8px 20px', fontSize:13, fontWeight:700, color:'#fff', cursor:'pointer', fontFamily:'inherit'}}>저장</button>
            </div>
          </div>
        )}

        {/* ── 파이프라인 요약 바 (status별 건수 + 클릭 필터) ── */}
        <div style={{display:'flex', gap:0, alignItems:'stretch', marginBottom:14, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'var(--radius)', overflow:'hidden', boxShadow:'var(--shadow-sm)'}}>
          {DRAFT_STATUSES.map((s, i) => {
            const meta = DRAFT_STATUS_META[s];
            const active = filterStatus === s;
            return (
              <button key={s}
                onClick={() => setFilterStatus(active ? '' : s)}
                style={{flex:1, minWidth:0, border:'none', borderLeft: i>0 ? '1px solid var(--border-2)' : 'none',
                  background: active ? meta.bg : 'transparent', cursor:'pointer', fontFamily:'inherit',
                  padding:'10px 6px', textAlign:'center', transition:'background .12s'}}>
                <div style={{fontSize:18, fontWeight:800, color: statusCounts[s] > 0 ? meta.color : 'var(--text-3)', lineHeight:1.1}}>
                  {statusCounts[s]}
                </div>
                <div style={{fontSize:10.5, fontWeight:700, color: active ? meta.color : 'var(--text-3)', marginTop:3, whiteSpace:'nowrap'}}>
                  {meta.label}{i < DRAFT_STATUSES.length-1 ? '' : ''}
                </div>
              </button>
            );
          })}
        </div>

        {/* 필터 행 */}
        <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:20}}>
          {/* 거래처 필터 */}
          <button onClick={() => setFilterClient('')}
            style={{background: filterClient==='' ? '#1a1a2e' : '#f3f4f6', color: filterClient==='' ? '#fff' : '#6b7280', border:'none', borderRadius:20, padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
            전체
          </button>
          {allClients.map(cid => (
            <button key={cid} onClick={() => setFilterClient(cid === filterClient ? '' : cid)}
              style={{background: filterClient===cid ? '#1a1a2e' : '#f3f4f6', color: filterClient===cid ? '#fff' : '#6b7280', border:'none', borderRadius:20, padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
              {DRAFT_CLIENT_MAP[cid] || cid}
            </button>
          ))}
          <div style={{width:1, background:'#e8e7e3', margin:'0 4px'}} />
          {/* 채널 필터 */}
          {DRAFT_CHANNELS.map(ch => (
            <button key={ch} onClick={() => setFilterChannel(ch === filterChannel ? '' : ch)}
              style={{background: filterChannel===ch ? DRAFT_CH_COLOR[ch]||'#374151' : '#f3f4f6', color: filterChannel===ch ? '#fff' : '#6b7280', border:'none', borderRadius:20, padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit'}}>
              {ch}
            </button>
          ))}
        </div>

        {/* 카운트 */}
        {/* bulk naver temp-save CMD */}
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:12,padding:'10px 12px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10}}>
          <button onClick={toggleAllApprovedSelection}
            disabled={!approvedBlogFiltered.length}
            style={{display:'inline-flex',alignItems:'center',gap:5,background:approvedBlogFiltered.length?'#f3f4f6':'var(--border-2)',color:approvedBlogFiltered.length?'var(--ink)':'var(--text-3)',border:'1px solid var(--border)',borderRadius:7,padding:'7px 11px',fontSize:12,fontWeight:800,cursor:approvedBlogFiltered.length?'pointer':'not-allowed',fontFamily:'inherit'}}>
            <Icon name="check" size={12} /> 현재 승인 블로그 선택
          </button>
          <button onClick={copySelectedNaverCommands}
            disabled={!selectedApprovedDrafts.length}
            style={{display:'inline-flex',alignItems:'center',gap:5,background:selectedApprovedDrafts.length?(selectedCommandCopied?'var(--green)':'var(--purple)'):'var(--border-2)',color:selectedApprovedDrafts.length?'#fff':'var(--text-3)',border:'none',borderRadius:7,padding:'7px 12px',fontSize:12,fontWeight:900,cursor:selectedApprovedDrafts.length?'pointer':'not-allowed',fontFamily:'inherit'}}>
            <Icon name={selectedCommandCopied ? 'check' : 'copy'} size={12} /> {selectedCommandCopied ? '선택 명령 복사됨' : '선택 일괄 CMD 복사'}
          </button>
          <button onClick={copyApprovedNaverCommands}
            disabled={!approvedBlogFiltered.length}
            style={{display:'inline-flex',alignItems:'center',gap:5,background:approvedBlogFiltered.length?(allCommandCopied?'var(--green)':'var(--navy)'):'var(--border-2)',color:approvedBlogFiltered.length?'#fff':'var(--text-3)',border:'none',borderRadius:7,padding:'7px 12px',fontSize:12,fontWeight:800,cursor:approvedBlogFiltered.length?'pointer':'not-allowed',fontFamily:'inherit'}}>
            <Icon name={allCommandCopied ? 'check' : 'copy'} size={12} /> {allCommandCopied ? '전체 명령 복사됨' : '현재 승인 블로그 전체 CMD 복사'}
          </button>
          <span style={{fontSize:12,color:'var(--text-3)',fontWeight:700}}>선택 {selectedApprovedDrafts.length}건 / 실행 가능 승인 블로그 {approvedBlogFiltered.length}건</span>
          <span style={{flexBasis:'100%',fontSize:11.5,color:'var(--text-3)'}}>CMD 실행 후 새로고침하면 임시저장 성공으로 삭제된 원본이 반영됩니다.</span>
        </div>
        <div style={{fontSize:12, color:'var(--text-3)', marginBottom:12}}>
          {loading ? '불러오는 중...' : `총 ${filtered.length}건${filterClient||filterChannel ? ' (필터 적용됨)' : ''}`}
        </div>

        {/* 초안 목록 */}
        {loading ? (
          <div style={{textAlign:'center', padding:'60px 0', color:'var(--text-3)', fontSize:13}}>보관함 로딩 중...</div>
        ) : filtered.length === 0 ? (
          <div style={{textAlign:'center', padding:'60px 0', color:'var(--text-3)', fontSize:13}}>
            {drafts.length === 0 ? '저장된 초안이 없습니다. Codex에게 글 작성 후 저장을 요청하세요.' : '해당 조건의 초안이 없습니다.'}
          </div>
        ) : (
          <div style={{display:'flex', flexDirection:'column', gap:12}}>

              const isCommandCopied = commandCopied === draft.draftId;
              const dStatus = normalizeDraftStatus(draft.status);

                  : '서버에 승인 저장이 완료된 뒤 네이버 CMD가 활성화됩니다';
              const commandBlockReason = isStatusSaving ? '상태 저장 중에는 CMD를 복사할 수 없습니다.' : getNaverCommandBlockReason(draft);

                      <input type="checkbox" checked={selectedDraftIds.includes(draft.draftId)} disabled={!canCopyNaverCommand} onChange={() => toggleDraftSelection(draft.draftId)} />

                      <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:4, flexWrap:'wrap'}}>

                        <span style={{background:chColor+'22', color:chColor, fontSize:11, fontWeight:700, borderRadius:10, padding:'2px 9px'}}>{draft.channel||'기타'}</span>

                        style={{border:'1px solid var(--border)', borderRadius:7, padding:'6px 8px', fontSize:12, fontWeight:700, fontFamily:'inherit', color:sMeta.color, background:'var(--surface)', cursor:isStatusSaving||!hasSafeDraftId?'not-allowed':'pointer', opacity:isStatusSaving||!hasSafeDraftId?0.65:1, outline:'none'}}>
                        {DRAFT_STATUSES.map(s => <option key={s} value={s} disabled={((s === 'approved' || s === 'published') && needsCompliance) || (s === 'approved' && isHomepageChannel(draft.channel))}>{DRAFT_STATUS_META[s].label}</option>)}
                      </select>
                      {showApprove && (
                        <button onClick={() => changeDraftStatus(draft, 'approved')}
                          disabled={!canApprove}
                          title={approveTitle}
                          style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,background:canApprove?'var(--blue)':'var(--border-2)', color:canApprove?'#fff':'var(--text-3)', border:'none', borderRadius:7, padding:'7px 12px', fontSize:12, fontWeight:800, cursor:canApprove?'pointer':'not-allowed', fontFamily:'inherit'}}>

    );

  const fmtMoney = (n) => {

  const REV_KEY = 'rev-data-v1';
  function loadRevData() {
    try {
      const parsed = JSON.parse(safeStorage.getItem(REV_KEY));
      const data = parsed || getDefaultRevData();
      return { ...data, expenses: (data.expenses || []).map(normalizeExpense) };
    } catch { return getDefaultRevData(); }
  }
  function saveRevData(d) { try { safeStorage.setItem(REV_KEY, JSON.stringify(d)); } catch {} }

       {category:'외주비',            type:'변동비',description:'중국어 번역',    amount:120000,clientId:'btskin',   payMethod:'계좌이체',isRecurring:false}],
      [{category:'광고비',            type:'변동비',description:'네이버 파워링크', amount:200000,clientId:'belrmon',  payMethod:'카드',    isRecurring:false}],
      [{category:'촬영/디자인 제작비',type:'변동비',description:'벨르몬 촬영',    amount:280000,clientId:'belrmon',  payMethod:'계좌이체',isRecurring:false},

       {category:'기타비용',          type:'변동비',description:'명함 인쇄',      amount:45000, clientId:'',         payMethod:'카드',    isRecurring:false}],
