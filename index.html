  <script type="text/babel">

  const { useState, useEffect, useMemo, useCallback } = React;

  // ═══════════════════════════════════════════════

  // ═══════════════════════════════════════════════

      { credId:'cr-bts-005', service:'가비아 (도메인관리)', url:'https://www.gabia.com', username:'btskin7114', password:'jeju!7114' },
      { credId:'cr-bts-006', service:'구글', url:'https://google.com', username:'beautifulskinclinic@gmail.com', password:'jBSC7467114' },
      { credId:'cr-bts-007', service:'안랩 기업용 v3백신', url:'https://www.ahnlab.com/ko', username:'btskincs7114@naver.com', password:'jeju!7114' },
    ],

  // ═══════════════════════════════════════════════
  //  DEFAULT DATA
  // ═══════════════════════════════════════════════
  const DEFAULT_DATA = {
    clients: [
      // ── 거래처 표시 순서 (이 배열 순서가 카드 표시 순서가 됩니다) ──
      { clientId:'btskin',      clientName:'노형아름다운피부과',         businessType:'병의원', specialty:'피부과',  mainContact:'원장님', lastUpdated:'2026-03-31', priorityLevel:'높음', reportFile:'btskin.html' },
      { clientId:'belrmon',     clientName:'벨르몬성형외과',            businessType:'병의원', specialty:'성형외과', mainContact:'원장님', lastUpdated:'2026-03-31', priorityLevel:'높음', reportFile:'belrmon.html' },
      { clientId:'kyunghee',    clientName:'365경희부부한의원 피부센터', businessType:'병의원', specialty:'한의원',  mainContact:'원장님', lastUpdated:'2026-03-27', priorityLevel:'중간', reportFile:'gyunghee.html' },
      { clientId:'eyecare',     clientName:'눈사랑안과',                businessType:'병의원', specialty:'안과',   mainContact:'원장님', lastUpdated:'2026-03-31', priorityLevel:'중간', reportFile:'eyecare.html' },
      { clientId:'seoulup',     clientName:'서울UP치과',                businessType:'병의원', specialty:'치과',   mainContact:'원장님', lastUpdated:'2026-03-31', priorityLevel:'중간', reportFile:'seoulup.html' },
      { clientId:'echi',        clientName:'이치과',                    businessType:'병의원', specialty:'치과',   mainContact:'원장님', lastUpdated:'2026-03-31', priorityLevel:'중간', reportFile:'echi.html' },
      { clientId:'jejuexpress', clientName:'제주인익스프레스',           businessType:'기타',   specialty:'이사',   mainContact:'담당자', lastUpdated:'2026-03-31', priorityLevel:'중간', reportFile:'jejuexpress.html' },
      { clientId:'igochi',      clientName:'이고치과',                  businessType:'병의원', specialty:'치과',   mainContact:'원장님', lastUpdated:'2026-03-31', priorityLevel:'중간', reportFile:'igochi.html' },
    ],
    projects:     [],
    tasks:        [],
    deliverables: [],
    logs: [],
    monthlyJobs: [
      // ── 365경희부부한의원 피부센터 (kyunghee) ──
      { jobId:'mj-kgh-001', clientId:'kyunghee', title:'네이버 블로그 의학정보 발행', kind:'서브', targetCount:5,    currentCount:3,    unit:'건', dueDate:null, note:'' },
      { jobId:'mj-kgh-002', clientId:'kyunghee', title:'병원 공식 홈페이지 제작',     kind:'서브', targetCount:null, currentCount:null, unit:null, dueDate:null, note:'진행중' },
      { jobId:'mj-kgh-003', clientId:'kyunghee', title:'외벽 현수막 디자인 시안 제작',kind:'서브', targetCount:null, currentCount:null, unit:null, dueDate:null, note:'진행중' },
      { jobId:'mj-kgh-004', clientId:'kyunghee', title:'카카오채널 매장사진 변경',    kind:'서브', targetCount:null, currentCount:null, unit:null, dueDate:null, note:'사진 미수령' },
      { jobId:'mj-kgh-005', clientId:'kyunghee', title:'카카오 고객센터 매장연결 해제 문의', kind:'서브', targetCount:null, currentCount:null, unit:null, dueDate:null, note:'답변 대기 중' },
    ],
    postLogs: [],
    commonTasks: [],
    contracts: [],
  };

  // ═══════════════════════════════════════════════
  //  HELPERS
  // ═══════════════════════════════════════════════
  const uid     = () => Math.random().toString(36).slice(2,10);
  const today   = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
  const nowMonth= () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; };
  const fmtDate = (d) => { if(!d) return '—'; const p=d.split('-'); return `${p[0].slice(2)}.${p[1]}.${p[2]}`; };
  const daysLeft= (d) => { if(!d) return null; const due=new Date(d+'T00:00:00'); const n=new Date(); const tod=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.ceil((due-tod)/86400000); };

  // DEFAULT_DATA 순서를 유지하면서 primary·fallback 데이터를 병합하는 함수
  // - primary  : Sheets 데이터 (sync 시) 또는 localStorage 데이터 (loadData 시)
  // - fallback : localStorage 데이터 (sync 시, UI 추가 거래처 보존용) — 생략 가능
  function mergeClients(defaultClients, primaryClients, fallbackClients) {
    fallbackClients = fallbackClients || [];
    const defaultIds  = defaultClients.map(c => c.clientId);
    const primaryIds  = primaryClients.map(c => c.clientId);
    return [
      // 1. DEFAULT_DATA 순서대로: primary > fallback > default 우선순위로 채움
      //    DEFAULT_DATA 필드를 base로 두어 businessType 등 누락 방지
      ...defaultClients.map(dc => {
        const src = primaryClients.find(c => c.clientId === dc.clientId)
                 || fallbackClients.find(c => c.clientId === dc.clientId);
        if (src) return { ...dc, ...src, reportFile: src.reportFile || dc.reportFile };
        return dc;
      }),
      // 2. primary에만 있는 거래처 (DEFAULT_DATA 외 Sheets 등록 거래처)
      ...primaryClients.filter(c => !defaultIds.includes(c.clientId)),
      // 3. fallback에만 있는 거래처 (UI 추가 후 미동기화 — sync 후에도 보존)
      ...fallbackClients.filter(c => !defaultIds.includes(c.clientId) && !primaryIds.includes(c.clientId))
    ];
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) {
        const s = JSON.parse(raw);
        return {
          clients:      mergeClients(DEFAULT_DATA.clients, s.clients || []),
          projects:     s.projects     ?? [],
          tasks:        s.tasks        ?? [],
          deliverables: s.deliverables ?? DEFAULT_DATA.deliverables,
          logs:         s.logs         ?? [],
          monthlyJobs:  s.monthlyJobs  ?? DEFAULT_DATA.monthlyJobs,
          postLogs:     s.postLogs     ?? [],
          commonTasks:  s.commonTasks  ?? [],
          credentials:  s.credentials  ?? DEFAULT_CREDENTIALS,
          contracts:    s.contracts    ?? [],
        };
      }
    } catch(e) {}
    return { ...DEFAULT_DATA };
  }

  function saveData(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
    window.dashboardData = data;
    window.dashboardAPI = {
      url: API_URL,
      summary:  () => fetch(API_URL + '?action=summary').then(r => r.json()),
      clients:  () => fetch(API_URL + '?action=clients').then(r => r.json()),
      addLog: (clientId, message) => fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addLog', clientId, message })
      }).then(r => r.json()),
      // OpenClaw가 호출: { action:"addPost", clientId, jobId, title, url, channel }
      addPost: (clientId, jobId, title, url, channel) => fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addPost', clientId, jobId, title, url, channel: channel||'홈페이지' })
      }).then(r => r.json()),
      updateJobCount: (jobId, delta) => fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateJobCount', jobId, delta })
      }).then(r => r.json()),
      // 공통업무 — OpenClaw 외부 호출용
      // kind: 'group'|'task'  parentId: 그룹 taskId (task일 때)  dueDate: 'YYYY-MM-DD'
      commonTaskAdd:    (title, kind, parentId, dueDate) => fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskAdd', title, kind: kind||'task', parentId: parentId||null, dueDate: dueDate||null })
      }).then(r => r.json()),
      commonTaskToggle: (taskId, done) => fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskToggle', taskId, done })
      }).then(r => r.json()),
      commonTaskDelete: (taskId) => fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskDelete', taskId })
      }).then(r => r.json()),
      commonTaskUpdate: (taskId, title, dueDate) => fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'commonTaskUpdate', taskId, title, dueDate: dueDate||null })
      }).then(r => r.json()),
    };
  }

  async function fetchFromSheets() {
    const res  = await fetch(API_URL + '?action=summary');
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'API 오류');
    const d = json.data;
    return {
      clients:      (d.clients     && d.clients.length)     ? d.clients     : DEFAULT_DATA.clients,
      projects:     [],
      tasks:        [],
      logs:         d.logs         || [],
      monthlyJobs:  (d.monthlyJobs && d.monthlyJobs.length) ? d.monthlyJobs : DEFAULT_DATA.monthlyJobs,
      deliverables: DEFAULT_DATA.deliverables,
      postLogs: (d.postLogs || []).map(p => ({
        ...p,
        channel: p.channel || p[''] || null   // Sheets 빈 헤더 키 정규화
      })),
      commonTasks: (d.commonTasks || []).map(t => ({
        ...t,
        done: t.done === true || t.done === 'TRUE' || t.done === '1',
      })),
      contracts: (d.contracts || []).map(c => ({
        ...c,
        monthlyFee: Number(c.monthlyFee) || 0,
      })),
      expenses: (d.expenses || []).map(e => ({
        ...e,
        amount:      Number(e.amount) || 0,
        isRecurring: e.isRecurring === true || e.isRecurring === 'true' || e.isRecurring === 'TRUE',
      })),
      drafts: (d.drafts || []),
    };
  }


  // ═══════════════════════════════════════════════
  //  BADGE COMPONENTS
  // ═══════════════════════════════════════════════
  function PriorityBadge({ priority }) {
    const m = {'높음':'pb-높음','중간':'pb-중간','낮음':'pb-낮음'};
    return <span className={`pb ${m[priority]||'pb-낮음'}`}>{priority}</span>;
  }
  function SpecBadge({ specialty }) {
    const cls = SPEC_CLS[specialty] || '기타';
    return <span className={`spec-badge spec-${cls}`}>{specialty}</span>;
  }
  function DueBadge({ dueDate }) {
    if(!dueDate) return null;
    const dl = daysLeft(dueDate);
    if(dl === null) return null;
    // 날짜 포맷 ex) 4/9
    const [,mm,dd] = dueDate.split('-');
    const label = `${parseInt(mm,10)}/${parseInt(dd,10)}까지`;
    if(dl < 0)   return <span style={{fontSize:11,fontWeight:700,color:'#dc2626',background:'#fef2f2',padding:'1px 6px',borderRadius:4}}>⚠ {label} ({Math.abs(dl)}일 초과)</span>;
    if(dl === 0) return <span style={{fontSize:11,fontWeight:700,color:'#dc2626',background:'#fef2f2',padding:'1px 6px',borderRadius:4}}>📅 {label} (오늘 마감)</span>;
    if(dl <= 3)  return <span style={{fontSize:11,fontWeight:700,color:'#d97706',background:'#fffbeb',padding:'1px 6px',borderRadius:4}}>📅 {label} (D-{dl})</span>;
    return <span style={{fontSize:11,color:'#6b7280',background:'#f3f4f6',padding:'1px 6px',borderRadius:4}}>📅 {label} (D-{dl})</span>;
  }

  // ═══════════════════════════════════════════════
  //  MONTHLY JOBS SECTION (이달의 업무)
  // ═══════════════════════════════════════════════
  function MonthlyJobsSection({ clientId, data, mutate, autoLog }) {
    const jobs      = (data.monthlyJobs || []).filter(j => j.clientId === clientId);
    const essential = jobs.filter(j => j.kind === '필수');
    const sub       = jobs.filter(j => j.kind === '서브' || j.kind === '순위');

    const [showAddSub,   setShowAddSub]   = useState(false);
    const [newSubTitle,  setNewSubTitle]  = useState('');
    const [newSubDue,    setNewSubDue]    = useState('');
    const [showAddEss,   setShowAddEss]   = useState(false);
    const [newEssTitle,  setNewEssTitle]  = useState('');
    const [newEssKind,   setNewEssKind]   = useState('필수');
    const [newEssCount,  setNewEssCount]  = useState('');
    const [newEssUnit,   setNewEssUnit]   = useState('건');

    const essentialDone = essential.filter(j =>
      j.targetCount != null ? j.currentCount >= j.targetCount : j.note === '완료'
    ).length;

    function updateCount(jobId, delta) {
      const job = jobs.find(j => j.jobId === jobId);
      mutate(d => ({
        ...d,
        monthlyJobs: d.monthlyJobs.map(j =>
          j.jobId === jobId
            ? { ...j, currentCount: Math.max(0, (j.currentCount||0) + delta) }
            : j
        )
      }));
      // 자동 로그: targetCount 있는 업무만 기록
      if (autoLog && job && job.targetCount != null) {
        const newCount = Math.max(0, (job.currentCount||0) + delta);
        if (delta > 0) {
          autoLog(clientId, `📌 ${job.title} +${delta}건 (${newCount}/${job.targetCount}${job.unit||''})`);
        } else if (delta < 0 && (job.currentCount||0) > 0) {
          autoLog(clientId, `↩ ${job.title} 수정 (${newCount}/${job.targetCount}${job.unit||''})`);
        }
      }
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateJobCount', jobId, delta })
      }).catch(e => console.warn('Sheets updateJobCount 오류:', e));
    }

    function updateNote(jobId, note) {
      const job = jobs.find(j => j.jobId === jobId);
      mutate(d => ({
        ...d,
        monthlyJobs: d.monthlyJobs.map(j => j.jobId === jobId ? { ...j, note } : j)
      }));
      // 자동 로그: 완료 처리 시만
      if (autoLog && note === '완료' && job) {
        autoLog(clientId, `✅ ${job.title} 완료 처리`);
      }
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateJobNote', jobId, note })
      }).catch(e => console.warn('Sheets updateJobNote 오류:', e));
    }

    function updateSubJob(jobId, fields) {
      // fields: { title, note, dueDate } — 변경된 것만 전달
      mutate(d => ({
        ...d,
        monthlyJobs: d.monthlyJobs.map(j => j.jobId === jobId ? { ...j, ...fields } : j)
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateSubJob', jobId, ...fields })
      }).catch(e => console.warn('updateSubJob 오류:', e));
    }

    function deleteSubJobLocal(jobId) {
      mutate(d => ({ ...d, monthlyJobs: d.monthlyJobs.filter(j => j.jobId !== jobId) }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deleteSubJob', jobId })
      }).catch(e => console.warn('deleteSubJob 오류:', e));
    }

    function handleAddEssentialJob() {
      if (!newEssTitle.trim()) return;
      const tempId  = 'mj-dyn-' + Date.now().toString(36);
      const tCount  = newEssCount ? parseInt(newEssCount, 10) : null;
      const newJob  = {
        jobId: tempId, clientId, title: newEssTitle.trim(),
        kind: newEssKind,
        targetCount: (!isNaN(tCount) && tCount > 0) ? tCount : null,
        currentCount: (!isNaN(tCount) && tCount > 0) ? 0 : null,
        unit: (!isNaN(tCount) && tCount > 0) ? (newEssUnit.trim() || '건') : null,
        dueDate: null, note: ''
      };
      mutate(d => ({ ...d, monthlyJobs: [...d.monthlyJobs, newJob] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addJob', clientId, title: newEssTitle.trim(), kind: newEssKind,
          targetCount: newJob.targetCount, unit: newJob.unit })
      }).then(r=>r.json()).then(res => {
        if (res.success && res.jobId) {
          mutate(d => ({ ...d, monthlyJobs: d.monthlyJobs.map(j => j.jobId===tempId ? {...j,jobId:res.jobId} : j) }));
        }
      }).catch(e => console.warn('addJob 오류:', e));
      setNewEssTitle(''); setNewEssCount(''); setNewEssUnit('건'); setShowAddEss(false);
    }

    function handleAddSubJob() {
      if (!newSubTitle.trim()) return;
      const tempId = 'mj-dyn-' + Date.now().toString(36);
      const newJob = {
        jobId: tempId, clientId, title: newSubTitle.trim(),
        kind: '서브', targetCount: null, currentCount: null, unit: null, dueDate: newSubDue || null, note: ''
      };
      mutate(d => ({ ...d, monthlyJobs: [...d.monthlyJobs, newJob] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addSubJob', clientId, title: newSubTitle.trim(), dueDate: newSubDue || null })
      }).then(r => r.json()).then(res => {
        if (res.success && res.jobId) {
          mutate(d => ({
            ...d,
            monthlyJobs: d.monthlyJobs.map(j => j.jobId === tempId ? { ...j, jobId: res.jobId } : j)
          }));
        }
      }).catch(e => console.warn('addSubJob 오류:', e));
      setNewSubTitle('');
      setNewSubDue('');
      setShowAddSub(false);
    }

    function JobRow({ job }) {
      const isCount  = job.targetCount != null;
      const isSub    = job.kind === '서브' || job.kind === '순위';
      // 블로그 업무: 카운트는 없지만 글 제목 기록 가능
      const isBlog   = !isCount && job.title.includes('블로그');
      const isDone   = isCount ? job.currentCount >= job.targetCount : job.note === '완료';
      const pct      = isCount ? Math.min(100, Math.round(((job.currentCount||0) / job.targetCount) * 100)) : 0;
      // 발행 기록은 카운트 업무 + 블로그 업무 모두 표시
      const jobLogs  = (isCount || isBlog)
        ? (data.postLogs||[]).filter(p => p.jobId === job.jobId)
        : [];

      // 수동 발행 기록 폼 상태
      const [showPost,    setShowPost]    = useState(false);
      const [postTitle,   setPostTitle]   = useState('');
      const [postUrl,     setPostUrl]     = useState('');
      const [postDate,    setPostDate]    = useState(today());
      const defaultCh = job.title.includes('인스타') ? '인스타그램'
                      : job.title.includes('블로그') ? '블로그'
                      : job.title.includes('위챗')   ? '위챗'
                      : '홈페이지';
      const [postChannel, setPostChannel] = useState(defaultCh);

      // 서브업무 인라인 편집 상태
      const [editing,    setEditing]    = useState(false);
      const [editTitle,  setEditTitle]  = useState(job.title);
      const [editNote,   setEditNote]   = useState(job.note || '');
      const [editDue,    setEditDue]    = useState(job.dueDate || '');

      // targetCount 인라인 편집 상태
      const [editingTarget,  setEditingTarget]  = useState(false);
      const [editTargetVal,  setEditTargetVal]  = useState(String(job.targetCount || ''));

      function saveTargetCount() {
        const n = parseInt(editTargetVal, 10);
        if (isNaN(n) || n < 0) { setEditingTarget(false); return; }
        mutate(d => ({
          ...d,
          monthlyJobs: d.monthlyJobs.map(j => j.jobId === job.jobId ? { ...j, targetCount: n } : j)
        }));
        fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({ action: 'updateJobTarget', jobId: job.jobId, targetCount: n })
        }).catch(e => console.warn('updateJobTarget 오류:', e));
        setEditingTarget(false);
      }

      function saveEdit() {
        if (!editTitle.trim()) return;
        updateSubJob(job.jobId, {
          title:   editTitle.trim(),
          note:    editNote.trim(),
          dueDate: editDue || null,
        });
        setEditing(false);
      }

      function handleSubmitPost() {
        if (!postTitle.trim()) return;
        const tempId    = 'pl-' + Date.now().toString(36);
        const pubDate   = postDate || today();
        mutate(d => ({
          ...d,
          // 카운트 업무만 currentCount 증가 (블로그 업무는 postLogs.length로만 카운팅)
          monthlyJobs: isCount ? d.monthlyJobs.map(j =>
            j.jobId === job.jobId ? { ...j, currentCount: (j.currentCount||0)+1 } : j
          ) : d.monthlyJobs,
          postLogs: [...(d.postLogs||[]), {
            logId: tempId, clientId, jobId: job.jobId,
            title: postTitle.trim(), url: postUrl.trim(),
            publishedAt: pubDate, month: pubDate.slice(0,7), channel: postChannel
          }]
        }));
        if (autoLog) autoLog(clientId, `📌 ${job.title} +1건 — ${postTitle.trim()}`);
        fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({ action:'addPost', clientId, jobId:job.jobId, title:postTitle.trim(), url:postUrl.trim(), channel:postChannel, publishedAt:pubDate })
        }).catch(e => console.warn('addPost 오류:', e));
        setPostTitle(''); setPostUrl(''); setPostDate(today()); setShowPost(false);
      }

      return (
        <div style={{padding:'10px 0',borderBottom:'1px solid #f3f4f6'}}>

          {/* ── 인라인 편집 폼 (서브업무만) ── */}
          {editing && (
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 12px',marginBottom:6,border:'1px solid #e5e7eb'}}>
              <div style={{fontSize:11,fontWeight:700,color:'#374151',marginBottom:6}}>서브업무 수정</div>
              <input
                value={editTitle}
                onChange={e => setEditTitle(e.target.value)}
                placeholder="업무 제목"
                autoFocus
                onKeyDown={e => { if(e.key==='Enter') saveEdit(); if(e.key==='Escape') setEditing(false); }}
                style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #d1d5db',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:5}}
              />
              <div style={{display:'flex',gap:6,marginBottom:5}}>
                <input
                  value={editNote}
                  onChange={e => setEditNote(e.target.value)}
                  placeholder="메모 (선택)"
                  style={{flex:1,padding:'6px 10px',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
                <input
                  type="date"
                  value={editDue}
                  onChange={e => setEditDue(e.target.value)}
                  style={{flex:'0 0 140px',padding:'6px 10px',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
              </div>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <button onClick={saveEdit}
                  style={{padding:'5px 14px',background:'#1a1a2e',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>
                  저장
                </button>
                <button onClick={() => setEditing(false)}
                  style={{padding:'5px 12px',background:'none',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>
                  취소
                </button>
                {job.kind === '서브' && (
                  <button
                    onClick={() => { if(confirm(`"${job.title}" 서브업무를 삭제하시겠습니까?`)) { deleteSubJobLocal(job.jobId); setEditing(false); } }}
                    style={{marginLeft:'auto',padding:'5px 12px',background:'none',border:'1px solid #fca5a5',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#dc2626'}}>
                    🗑 삭제
                  </button>
                )}
              </div>
            </div>
          )}

          {/* 제목 + 컨트롤 */}
          {!editing && (
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{
                fontSize:13,fontWeight:600,
                color: isDone ? '#9ca3af':'#1a1a2e',
                textDecoration: isDone ? 'line-through':'none',
                whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'
              }}>
                {job.title}
              </div>
              {job.dueDate && !isDone && (
                <div style={{fontSize:11,marginTop:2}}><DueBadge dueDate={job.dueDate} /></div>
              )}
              {!isCount && job.note && job.note !== '완료' && (
                <div style={{fontSize:11,color:'#6b7280',marginTop:2}}>{job.note}</div>
              )}
            </div>

            {isCount ? (
              <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                <button
                  onClick={()=>updateCount(job.jobId,-1)}
                  style={{width:22,height:22,borderRadius:'50%',border:'1px solid #d1d5db',background:'#f9fafb',cursor:'pointer',fontSize:14,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'#374151'}}>
                  −
                </button>
                <span style={{fontSize:12,fontWeight:700,
                  color: (job.currentCount||0) > job.targetCount ? '#059669' : isDone ? '#10b981':'#1d4ed8',
                  minWidth:52,textAlign:'center'}}>
                  {job.currentCount}/
                  {editingTarget ? (
                    <input
                      type="number" min="1" value={editTargetVal}
                      onChange={e=>setEditTargetVal(e.target.value)}
                      onBlur={saveTargetCount}
                      onKeyDown={e=>{ if(e.key==='Enter') saveTargetCount(); if(e.key==='Escape') setEditingTarget(false); }}
                      autoFocus
                      style={{width:38,padding:'1px 4px',border:'1px solid #93c5fd',borderRadius:4,fontSize:12,fontFamily:'inherit',outline:'none',fontWeight:700}}
                    />
                  ) : (
                    <span
                      onClick={()=>{ setEditTargetVal(String(job.targetCount)); setEditingTarget(true); }}
                      title="클릭하여 목표 수정"
                      style={{cursor:'pointer',borderBottom:'1px dashed #93c5fd'}}>
                      {job.targetCount}
                    </span>
                  )}
                  {!editingTarget && ((job.currentCount||0) > job.targetCount
                    ? <span style={{fontSize:10,fontWeight:800,color:'#059669',marginLeft:1}}>+{(job.currentCount||0)-job.targetCount}</span>
                    : <span style={{fontSize:10,fontWeight:400,color:'#9ca3af'}}>{job.unit}</span>
                  )}
                </span>
                <button
                  onClick={()=>updateCount(job.jobId,1)}
                  style={{width:22,height:22,borderRadius:'50%',border:'1px solid #d1d5db',background:'#f9fafb',cursor:'pointer',fontSize:14,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'#374151'}}>
                  +
                </button>
                {isDone && <span style={{fontSize:12,color:'#10b981',marginLeft:2}}>✓</span>}
                <button
                  onClick={()=>setShowPost(v=>!v)}
                  title="발행 글 제목 기록"
                  style={{width:24,height:24,borderRadius:6,border:'1px solid #dbeafe',background: showPost ? '#dbeafe':'#f0f9ff',cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'#2563eb',marginLeft:2}}>
                  ✏️
                </button>
              </div>
            ) : (
              <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                {/* 블로그 업무: 기록 건수 + ✏️ */}
                {isBlog && (
                  <>
                    {jobLogs.length > 0 && (
                      <span style={{fontSize:11,fontWeight:700,color:'#6366f1',background:'#ede9fe',padding:'2px 7px',borderRadius:10}}>
                        {jobLogs.length}건
                      </span>
                    )}
                    <button
                      onClick={()=>setShowPost(v=>!v)}
                      title="블로그 글 제목 기록"
                      style={{width:24,height:24,borderRadius:6,border:'1px solid #dbeafe',background: showPost ? '#dbeafe':'#f0f9ff',cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'#2563eb'}}>
                      ✏️
                    </button>
                  </>
                )}
                <button
                  onClick={()=>updateNote(job.jobId, job.note==='완료' ? '' : '완료')}
                  style={{fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:20,border:'none',cursor:'pointer',fontFamily:'inherit',
                    background: isDone ? '#d1fae5':'#dbeafe',
                    color:      isDone ? '#065f46':'#1d4ed8'
                  }}>
                  {isDone ? '✓ 완료' : '진행중'}
                </button>
                {/* 서브업무만 편집 아이콘 */}
                {isSub && (
                  <button
                    onClick={() => { setEditTitle(job.title); setEditNote(job.note||''); setEditDue(job.dueDate||''); setEditing(true); }}
                    title="수정"
                    style={{width:22,height:22,borderRadius:6,border:'1px solid #e5e7eb',background:'#f9fafb',cursor:'pointer',fontSize:11,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'#9ca3af'}}>
                    ✎
                  </button>
                )}
              </div>
            )}
          </div>
          )}  {/* !editing */}

          {/* 진행 바 (카운터 업무만) */}
          {isCount && (
            <div className="prog-track" style={{marginTop:7}}>
              <div className="prog-fill" style={{
                width: `${pct}%`,
                background: isDone ? '#10b981' : pct > 60 ? '#3b82f6' : pct > 30 ? '#6366f1' : '#94a3b8'
              }} />
            </div>
          )}

          {/* 수동 발행 기록 인라인 폼 (카운트 업무 + 블로그 업무) */}
          {(isCount || isBlog) && showPost && (
            <div style={{marginTop:8,padding:'10px 12px',background: isBlog ? '#f5f3ff':'#f0f9ff',borderRadius:8,border:`1px solid ${isBlog ? '#ddd6fe':'#bfdbfe'}`}}>
              <div style={{fontSize:11,fontWeight:700,color: isBlog ? '#6d28d9':'#1d4ed8',marginBottom:6}}>
                ✏️ {isBlog ? '블로그' : '발행'} 글 제목 기록
              </div>
              <input
                value={postTitle}
                onChange={e=>setPostTitle(e.target.value)}
                placeholder="글 제목 입력 (필수)"
                autoFocus
                onKeyDown={e=>{ if(e.key==='Enter') handleSubmitPost(); if(e.key==='Escape') setShowPost(false); }}
                style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none',marginBottom:5}}
              />
              <div style={{display:'flex',gap:6,marginBottom:7}}>
                <input
                  value={postUrl}
                  onChange={e=>setPostUrl(e.target.value)}
                  placeholder="URL (선택)"
                  style={{flex:1,padding:'6px 10px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
                <input
                  type="date"
                  value={postDate}
                  onChange={e=>setPostDate(e.target.value)}
                  style={{flex:'0 0 140px',padding:'6px 8px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
              </div>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <select
                  value={postChannel}
                  onChange={e=>setPostChannel(e.target.value)}
                  style={{flex:1,padding:'5px 8px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}>
                  <option value="홈페이지">홈페이지</option>
                  <option value="인스타그램">인스타그램</option>
                  <option value="블로그">블로그</option>
                  <option value="위챗">위챗</option>
                  <option value="LINE">LINE</option>
                  <option value="기타">기타</option>
                </select>
                <button onClick={handleSubmitPost}
                  style={{padding:'5px 14px',background:'#1d4ed8',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>
                  기록
                </button>
                <button onClick={()=>{setShowPost(false);setPostTitle('');setPostUrl('');}}
                  style={{padding:'5px 12px',background:'none',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>
                  취소
                </button>
              </div>
            </div>
          )}

          {/* 발행 글 목록 (카운트 업무 + 블로그 업무) */}
          {(isCount || isBlog) && jobLogs.length > 0 && (
            <div style={{marginTop:7,paddingLeft:6,borderLeft:'2px solid #e5e7eb'}}>
              {jobLogs.map(pl => (
                <div key={pl.logId} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',fontSize:11}}>
                  <span style={{color:'#9ca3af',flexShrink:0}}>↳</span>
                  {pl.url ? (
                    <a href={pl.url} target="_blank" rel="noopener"
                      style={{color:'#1d4ed8',textDecoration:'none',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600}}>
                      {pl.title}
                    </a>
                  ) : (
                    <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'#374151'}}>{pl.title}</span>
                  )}
                  {pl.publishedAt && (
                    <span style={{color:'#9ca3af',flexShrink:0,fontSize:10}}>{fmtDate(pl.publishedAt)}</span>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    if(jobs.length === 0) return null;

    return (
      <div style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',padding:'18px 20px',marginBottom:20}}>
        <div style={{marginBottom:14}}>
          <div className="section-title" style={{marginBottom:0}}>이달의 업무</div>
        </div>

        <div style={{marginBottom: sub.length > 0 ? 16 : 0}}>
          {essential.length > 0 && (
            <div style={{fontSize:11,fontWeight:700,color:'#dc2626',marginBottom:2,letterSpacing:'0.5px'}}>● 필수 업무</div>
          )}
          {essential.map(j => <JobRow key={j.jobId} job={j} />)}
          {/* 필수/순위업무 추가 UI */}
          {showAddEss ? (
            <div style={{marginTop:8,background:'#fef9f0',borderRadius:8,padding:'10px 12px',border:'1px solid #fde68a'}}>
              <div style={{fontSize:11,fontWeight:700,color:'#b45309',marginBottom:6}}>업무 추가</div>
              <input
                value={newEssTitle}
                onChange={e=>setNewEssTitle(e.target.value)}
                placeholder="업무 제목 *"
                autoFocus
                onKeyDown={e=>{ if(e.key==='Escape') setShowAddEss(false); }}
                style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #fcd34d',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:6}}
              />
              <div style={{display:'flex',gap:6,marginBottom:6,flexWrap:'wrap'}}>
                <select value={newEssKind} onChange={e=>setNewEssKind(e.target.value)}
                  style={{padding:'5px 8px',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none',background:'#fff'}}>
                  <option value="필수">필수</option>
                  <option value="순위">순위</option>
                </select>
                <input
                  type="number" min="1" value={newEssCount}
                  onChange={e=>setNewEssCount(e.target.value)}
                  placeholder="목표 수 (없으면 공란)"
                  style={{flex:1,minWidth:120,padding:'5px 8px',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
                {newEssCount && (
                  <input
                    value={newEssUnit} onChange={e=>setNewEssUnit(e.target.value)}
                    placeholder="단위 (건/개)"
                    style={{flex:'0 0 70px',padding:'5px 8px',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                  />
                )}
              </div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={handleAddEssentialJob}
                  style={{padding:'5px 14px',background:'#b45309',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>추가</button>
                <button onClick={()=>{setShowAddEss(false);setNewEssTitle('');setNewEssCount('');}}
                  style={{padding:'5px 12px',background:'none',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>취소</button>
              </div>
            </div>
          ) : (
            <button
              onClick={()=>setShowAddEss(true)}
              style={{marginTop: essential.length > 0 ? 6 : 0, fontSize:11, color:'#b45309', background:'none', border:'1px dashed #fcd34d', borderRadius:7, padding:'4px 12px', cursor:'pointer', fontFamily:'inherit'}}>
              + 업무 추가
            </button>
          )}
        </div>

        {(sub.length > 0 || true) && (
          <div>
            {sub.length > 0 && (
              <div style={{fontSize:11,fontWeight:700,color:'#6b7280',marginBottom:2,letterSpacing:'0.5px',
                marginTop: essential.length > 0 ? 14 : 0}}>
              {sub.some(j=>j.kind==='순위') && sub.some(j=>j.kind==='서브') ? '○ 서브 / 순위 업무' : sub.some(j=>j.kind==='순위') ? '○ 순위 업무' : '○ 서브 업무'}
            </div>
            )}
            {sub.map(j => <JobRow key={j.jobId} job={j} />)}
            {/* 서브업무 추가 UI */}
            {!showAddSub ? (
              <button
                onClick={() => setShowAddSub(true)}
                style={{marginTop: sub.length > 0 ? 8 : (essential.length > 0 ? 14 : 0), fontSize:12, color:'#9ca3af', background:'none', border:'1px dashed #d1d5db', borderRadius:8, padding:'5px 14px', cursor:'pointer', width:'100%', fontFamily:'inherit'}}>
                + 서브업무 추가
              </button>
            ) : (
              <div style={{marginTop:8, display:'flex', flexDirection:'column', gap:6}}>
                <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                  <input
                    value={newSubTitle}
                    onChange={e => setNewSubTitle(e.target.value)}
                    placeholder="서브업무 제목 입력"
                    style={{flex:1, minWidth:160, padding:'6px 10px', border:'1px solid #d1d5db', borderRadius:6, fontSize:13, fontFamily:'inherit', outline:'none'}}
                    onKeyDown={e => { if(e.key==='Enter') handleAddSubJob(); if(e.key==='Escape') { setShowAddSub(false); setNewSubTitle(''); setNewSubDue(''); } }}
                    autoFocus
                  />
                  <input
                    type="date"
                    value={newSubDue}
                    onChange={e => setNewSubDue(e.target.value)}
                    title="마감일 (선택)"
                    style={{flex:'0 0 140px', padding:'6px 10px', border:'1px solid #d1d5db', borderRadius:6, fontSize:12, fontFamily:'inherit', outline:'none', color: newSubDue ? '#374151' : '#9ca3af'}}
                  />
                </div>
                {newSubDue && (
                  <div style={{fontSize:11, color:'#6b7280', paddingLeft:2}}>📅 목표 마감일: <strong>{newSubDue.replace(/-/g,'/')} 까지</strong></div>
                )}
                <div style={{display:'flex', gap:6}}>
                  <button onClick={handleAddSubJob} style={{padding:'6px 14px', background:'#1a1a2e', color:'#fff', border:'none', borderRadius:6, fontSize:12, cursor:'pointer', fontFamily:'inherit', fontWeight:700}}>추가</button>
                  <button onClick={() => { setShowAddSub(false); setNewSubTitle(''); setNewSubDue(''); }} style={{padding:'6px 12px', background:'none', border:'1px solid #d1d5db', borderRadius:6, fontSize:12, cursor:'pointer', fontFamily:'inherit', color:'#6b7280'}}>취소</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  MODAL (로그 추가 + 삭제 확인만)
  // ═══════════════════════════════════════════════
  function Modal({ modal, onClose, onSave, onDelete }) {
    const [form, setForm] = useState(modal.formData || {});
    const set = (k,v) => setForm(p=>({...p,[k]:v}));

    if(!modal.open) return null;

    return (
      <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
        <div className="modal-box">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <h2 style={{fontSize:16,fontWeight:800,color:'#1a1a2e'}}>
              {modal.type==='log'        && '업데이트 로그 추가'}
              {modal.type==='delete'     && '삭제 확인'}
              {modal.type==='add-client' && '새 거래처 추가'}
            </h2>
            <button className="btn-icon" onClick={onClose}>✕</button>
          </div>

          {modal.type==='delete' && (
            <div>
              <p style={{fontSize:14,color:'#374151',marginBottom:8}}>
                <b>"{modal.context?.name}"</b>을(를) 삭제하시겠습니까?
              </p>
              <p style={{fontSize:12,color:'#9ca3af',marginBottom:20}}>이 작업은 되돌릴 수 없습니다.</p>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn-ghost" onClick={onClose}>취소</button>
                <button className="btn-danger" onClick={()=>onDelete(modal.context)}>삭제</button>
              </div>
            </div>
          )}

          {modal.type==='log' && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div>
                <label className="fi-label">업데이트 내용 *</label>
                <textarea className="fi" rows={3} value={form.message||''} onChange={e=>set('message',e.target.value)} placeholder="예: 블로그 포스팅 3건 발행 완료" />
              </div>
              <div>
                <label className="fi-label">날짜</label>
                <input className="fi" type="date" value={form.createdAt||today()} onChange={e=>set('createdAt',e.target.value)} />
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:4}}>
                <button className="btn-ghost" onClick={onClose}>취소</button>
                <button className="btn-primary" onClick={()=>onSave(modal.type, modal.mode, form, modal.context)}>저장</button>
              </div>
            </div>
          )}

          {modal.type==='add-client' && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="fi-label">거래처명 *</label>
                  <input className="fi" value={form.clientName||''} onChange={e=>set('clientName',e.target.value)} placeholder="예: 노형아름다운피부과" />
                </div>
                <div>
                  <label className="fi-label">전문과목</label>
                  <select className="fi" value={form.specialty||'기타'} onChange={e=>set('specialty',e.target.value)}>
                    {SPECIALTIES.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="fi-label">담당자</label>
                  <input className="fi" value={form.mainContact||''} onChange={e=>set('mainContact',e.target.value)} placeholder="담당자명" />
                </div>
                <div>
                  <label className="fi-label">우선순위</label>
                  <select className="fi" value={form.priorityLevel||'중간'} onChange={e=>set('priorityLevel',e.target.value)}>
                    <option value="높음">높음</option>
                    <option value="중간">중간</option>
                    <option value="낮음">낮음</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="fi-label">보고서 파일명</label>
                <input className="fi" value={form.reportFile||''} onChange={e=>set('reportFile',e.target.value)} placeholder="예: btskin.html" />
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:4}}>
                <button className="btn-ghost" onClick={onClose}>취소</button>
                <button className="btn-primary" onClick={()=>{ if(!(form.clientName||'').trim()){ alert('거래처명을 입력하세요.'); return; } onSave(modal.type, modal.mode, form, modal.context); }}>거래처 추가</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  HEADER
  // ═══════════════════════════════════════════════
  function Header({ view, selectedClient, onBack, onHome, onRevenue, onDrafts, syncStatus, onSync }) {
    const d = new Date();
    const dateStr = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
    const syncLabel = syncStatus === 'loading' ? '⏳ 동기화 중...'
                    : syncStatus === 'ok'      ? '✓ 동기화 완료'
                    : syncStatus === 'error'   ? '⚠ 재시도'
                    : '☁️ 구글시트 동기화';
    const syncBg    = syncStatus === 'loading' ? '#4b5563'
                    : syncStatus === 'ok'      ? '#065f46'
                    : syncStatus === 'error'   ? '#b91c1c'
                    : '#2563eb';

    const subLabel = view==='revenue' ? '💰 수익 관리'
                   : view==='drafts'  ? '📝 글 보관함'
                   : view==='client' && selectedClient ? selectedClient.clientName
                   : '이달의 업무 대시보드';

    return (
      <header style={{background:'#1a1a2e',padding:'0 32px',height:60,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:50}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:36,height:36,background:'#c9a96e',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:13,color:'#fff',cursor:'pointer'}} onClick={onHome}>UP</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:'#fff',lineHeight:1.3}}>어반플랜애드</div>
            {view==='client' && selectedClient ? (
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <button onClick={onBack} style={{background:'none',border:'none',color:'rgba(255,255,255,0.5)',cursor:'pointer',fontSize:11,padding:0,fontFamily:'inherit'}}>← 전체</button>
                <span style={{color:'rgba(255,255,255,0.3)',fontSize:11}}>/</span>
                <span style={{color:'rgba(255,255,255,0.7)',fontSize:11,fontWeight:600}}>{subLabel}</span>
              </div>
            ) : (
              <div style={{fontSize:11,color:'rgba(255,255,255,0.4)'}}>{subLabel}</div>
            )}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button
            onClick={onDrafts}
            style={{background: view==='drafts' ? '#6366f1' : 'rgba(99,102,241,0.12)', color: view==='drafts' ? '#fff' : '#818cf8', border:'1px solid rgba(99,102,241,0.35)', borderRadius:8, padding:'7px 14px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap', transition:'all 0.2s'}}>
            📝 글 보관함
          </button>
          <button
            onClick={onRevenue}
            style={{background: view==='revenue' ? '#c9a96e' : 'rgba(201,169,110,0.15)', color: view==='revenue' ? '#fff' : '#c9a96e', border:'1px solid rgba(201,169,110,0.4)', borderRadius:8, padding:'7px 14px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap', transition:'all 0.2s'}}>
            💰 수익 관리
          </button>
          <button
            onClick={onSync}
            disabled={syncStatus === 'loading'}
            style={{background:syncBg,color:'#fff',border:'none',borderRadius:8,padding:'7px 14px',fontSize:12,fontWeight:700,cursor: syncStatus==='loading' ? 'default':'pointer',fontFamily:'inherit',whiteSpace:'nowrap',transition:'background 0.2s'}}>
            {syncLabel}
          </button>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.35)'}}>{dateStr}</div>
        </div>
      </header>
    );
  }

  // ═══════════════════════════════════════════════
  //  COMMON TASKS CARD (내 사업 공통업무)
  // ═══════════════════════════════════════════════
  function CommonTasksCard({ tasks, onAddGroup, onAddTask, onToggle, onDelete, onEdit }) {
    const [showDone,          setShowDone]          = useState(false);
    const [addingGroup,       setAddingGroup]       = useState(false);
    const [newGroupTitle,     setNewGroupTitle]     = useState('');
    const [addingStandalone,  setAddingStandalone]  = useState(false);
    const [newStandaloneTitle,setNewStandaloneTitle]= useState('');
    const [newStandaloneDue,  setNewStandaloneDue]  = useState('');

    const groups     = tasks.filter(t => t.kind === 'group');
    // 하위호환: kind 없는 구버전 태스크도 standalone으로 처리
    const standalone = tasks.filter(t => t.kind !== 'group' && !t.parentId);
    const allTaskItems = tasks.filter(t => t.kind !== 'group');
    const pendingCount = allTaskItems.filter(t => !t.done).length;
    const doneCount    = allTaskItems.filter(t => t.done).length;

    function handleAddGroup() {
      if (!newGroupTitle.trim()) return;
      onAddGroup(newGroupTitle.trim());
      setNewGroupTitle(''); setAddingGroup(false);
    }
    function handleAddStandalone() {
      if (!newStandaloneTitle.trim()) return;
      onAddTask(null, newStandaloneTitle.trim(), newStandaloneDue || null);
      setNewStandaloneTitle(''); setNewStandaloneDue(''); setAddingStandalone(false);
    }

    // ── 개별 태스크 행 ──
    function TaskRow({ task, indent }) {
      const [editing, setEditing] = useState(false);
      const [editVal, setEditVal] = useState(task.title);
      const [editDue, setEditDue] = useState(task.dueDate || '');
      function saveEdit() {
        if (editVal.trim()) onEdit(task.taskId, editVal.trim(), editDue || null);
        setEditing(false);
      }
      return (
        <div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'6px 8px',marginLeft:indent?16:0,borderRadius:8,opacity:task.done?0.65:1}}>
          <div onClick={() => onToggle(task.taskId, !task.done)} style={{width:16,height:16,borderRadius:4,flexShrink:0,marginTop:2,cursor:'pointer',border:task.done?'none':'2px solid #d1d5db',background:task.done?'#10b981':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {task.done && <span style={{fontSize:10,color:'#fff',lineHeight:1}}>✓</span>}
          </div>
          <div style={{flex:1,minWidth:0}}>
            {editing ? (
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <input value={editVal} onChange={e=>setEditVal(e.target.value)} autoFocus
                  onKeyDown={e=>{if(e.key==='Enter')saveEdit();if(e.key==='Escape')setEditing(false);}}
                  style={{width:'100%',boxSizing:'border-box',padding:'4px 8px',border:'1px solid #93c5fd',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}}/>
                <div style={{display:'flex',gap:6}}>
                  <input type="date" value={editDue} onChange={e=>setEditDue(e.target.value)}
                    style={{flex:1,padding:'3px 8px',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}/>
                  <button onClick={saveEdit} style={{padding:'3px 10px',background:'#1a1a2e',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>저장</button>
                  <button onClick={()=>setEditing(false)} style={{padding:'3px 8px',background:'none',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>취소</button>
                </div>
              </div>
            ) : (
              <div>
                <span onDoubleClick={()=>!task.done&&setEditing(true)} title={task.done?'':'더블클릭으로 수정'}
                  style={{fontSize:13,color:task.done?'#9ca3af':'#374151',textDecoration:task.done?'line-through':'none',cursor:task.done?'default':'text'}}>
                  {task.title}
                </span>
                {task.dueDate && !task.done && <div style={{marginTop:2}}><DueBadge dueDate={task.dueDate}/></div>}
                {task.done && task.dueDate && <div style={{fontSize:10,color:'#9ca3af',marginTop:1}}>~{task.dueDate.slice(5).replace('-','/')}</div>}
              </div>
            )}
          </div>
          {!editing && (
            <div style={{display:'flex',gap:2,flexShrink:0}}>
              {!task.done && (
                <button onClick={()=>{setEditVal(task.title);setEditDue(task.dueDate||'');setEditing(true);}}
                  style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'#9ca3af',padding:'2px 4px'}} title="수정">✏️</button>
              )}
              <button onClick={()=>{if(confirm(`"${task.title}" 삭제?`))onDelete(task.taskId);}}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'#d1d5db',padding:'2px 4px'}} title="삭제">✕</button>
            </div>
          )}
        </div>
      );
    }

    // ── 그룹 섹션 ──
    function GroupSection({ group }) {
      const children      = tasks.filter(t => t.parentId === group.taskId);
      const pendingKids   = children.filter(c => !c.done);
      const doneKids      = children.filter(c => c.done);
      const visibleKids   = showDone ? children : pendingKids;
      const [collapsed,   setCollapsed]   = useState(false);
      const [addingTask,  setAddingTask]  = useState(false);
      const [newTitle,    setNewTitle]    = useState('');
      const [newDue,      setNewDue]      = useState('');
      function handleAddTask() {
        if (!newTitle.trim()) return;
        onAddTask(group.taskId, newTitle.trim(), newDue || null);
        setNewTitle(''); setNewDue(''); setAddingTask(false);
      }
      return (
        <div style={{marginBottom:8,border:'1px solid #e5e7eb',borderRadius:10,overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:'#f9fafb',cursor:'pointer',userSelect:'none'}}
            onClick={()=>setCollapsed(c=>!c)}>
            <span style={{fontSize:14}}>📁</span>
            <span style={{fontSize:13,fontWeight:700,color:'#1a1a2e',flex:1}}>{group.title}</span>
            {pendingKids.length > 0 && (
              <span style={{fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:12,background:'#fef3c7',color:'#b45309'}}>{pendingKids.length}건</span>
            )}
            {doneKids.length > 0 && (
              <span style={{fontSize:10,color:'#10b981',fontWeight:600}}>✓{doneKids.length}</span>
            )}
            <div onClick={e=>e.stopPropagation()} style={{display:'flex',gap:2,marginLeft:4}}>
              <button onClick={()=>setAddingTask(t=>!t)}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'#6b7280',padding:'2px 8px',borderRadius:4}}>+ 추가</button>
              <button onClick={()=>{if(confirm(`"${group.title}" 그룹과 하위 태스크 모두 삭제?`))onDelete(group.taskId);}}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'#d1d5db',padding:'2px 4px'}}>✕</button>
            </div>
            <span style={{fontSize:11,color:'#9ca3af',marginLeft:2}}>{collapsed?'▸':'▾'}</span>
          </div>
          {!collapsed && (
            <div style={{padding:'6px 8px'}}>
              {visibleKids.length === 0 && !addingTask && (
                <div style={{fontSize:12,color:'#9ca3af',padding:'8px',textAlign:'center'}}>태스크가 없습니다</div>
              )}
              {visibleKids.map(c => <TaskRow key={c.taskId} task={c} indent={true}/>)}
              {addingTask && (
                <div style={{padding:'8px',background:'#f0f9ff',borderRadius:8,marginTop:4}}>
                  <input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="태스크 제목" autoFocus
                    onKeyDown={e=>{if(e.key==='Enter')handleAddTask();if(e.key==='Escape'){setAddingTask(false);setNewTitle('');setNewDue('');}}}
                    style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #bae6fd',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:5}}/>
                  <div style={{display:'flex',gap:6}}>
                    <input type="date" value={newDue} onChange={e=>setNewDue(e.target.value)}
                      style={{flex:1,padding:'5px 8px',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}/>
                    <button onClick={handleAddTask} style={{padding:'5px 12px',background:'#1a1a2e',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>추가</button>
                    <button onClick={()=>{setAddingTask(false);setNewTitle('');setNewDue('');}} style={{padding:'5px 8px',background:'none',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>취소</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    return (
      <div style={{background:'#fff',borderRadius:14,border:'1px solid #e5e7eb',padding:'18px 22px',marginBottom:20,boxShadow:'0 1px 4px rgba(0,0,0,0.05)'}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:18}}>🗂️</span>
            <span style={{fontSize:14,fontWeight:700,color:'#1a1a2e'}}>내 사업 공통업무</span>
            {pendingCount > 0 && (
              <span style={{fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:20,background:'#fef3c7',color:'#b45309'}}>{pendingCount}건 진행 중</span>
            )}
          </div>
          <button onClick={()=>setShowDone(s=>!s)}
            style={{fontSize:11,color:'#9ca3af',background:'transparent',border:'none',cursor:'pointer',fontFamily:'inherit',padding:'2px 6px'}}>
            {showDone ? '완료 숨기기' : `완료 ${doneCount}건 보기`}
          </button>
        </div>

        {/* 그룹 목록 */}
        {groups.map(g => <GroupSection key={g.taskId} group={g}/>)}

        {/* 단독 태스크 */}
        {(showDone ? standalone : standalone.filter(t=>!t.done)).map(t => (
          <TaskRow key={t.taskId} task={t} indent={false}/>
        ))}

        {groups.length === 0 && standalone.length === 0 && !addingGroup && !addingStandalone && (
          <div style={{fontSize:13,color:'#9ca3af',padding:'16px',textAlign:'center'}}>그룹이나 업무를 추가해보세요</div>
        )}

        {/* 그룹 추가 폼 */}
        {addingGroup && (
          <div style={{marginTop:10,padding:'12px',background:'#f9fafb',borderRadius:8,border:'1px solid #e5e7eb'}}>
            <input value={newGroupTitle} onChange={e=>setNewGroupTitle(e.target.value)} placeholder="그룹 이름 (예: 인사이트메디 앱 출시)" autoFocus
              onKeyDown={e=>{if(e.key==='Enter')handleAddGroup();if(e.key==='Escape'){setAddingGroup(false);setNewGroupTitle('');}}}
              style={{width:'100%',boxSizing:'border-box',padding:'7px 12px',border:'1px solid #d1d5db',borderRadius:8,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:8}}/>
            <div style={{display:'flex',gap:6}}>
              <button onClick={handleAddGroup} style={{padding:'6px 14px',background:'#1a1a2e',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>생성</button>
              <button onClick={()=>{setAddingGroup(false);setNewGroupTitle('');}} style={{padding:'6px 10px',background:'none',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>취소</button>
            </div>
          </div>
        )}

        {/* 단독 업무 추가 폼 */}
        {addingStandalone && (
          <div style={{marginTop:10,padding:'12px',background:'#f9fafb',borderRadius:8,border:'1px solid #e5e7eb'}}>
            <input value={newStandaloneTitle} onChange={e=>setNewStandaloneTitle(e.target.value)} placeholder="단독 업무 제목" autoFocus
              onKeyDown={e=>{if(e.key==='Enter')handleAddStandalone();if(e.key==='Escape'){setAddingStandalone(false);setNewStandaloneTitle('');setNewStandaloneDue('');}}}
              style={{width:'100%',boxSizing:'border-box',padding:'7px 12px',border:'1px solid #d1d5db',borderRadius:8,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:6}}/>
            <div style={{display:'flex',gap:6}}>
              <input type="date" value={newStandaloneDue} onChange={e=>setNewStandaloneDue(e.target.value)}
                style={{flex:1,padding:'6px 10px',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}/>
              <button onClick={handleAddStandalone} style={{padding:'6px 14px',background:'#1a1a2e',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>추가</button>
              <button onClick={()=>{setAddingStandalone(false);setNewStandaloneTitle('');setNewStandaloneDue('');}} style={{padding:'6px 10px',background:'none',border:'1px solid #d1d5db',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'#6b7280'}}>취소</button>
            </div>
          </div>
        )}

        {/* 하단 액션 버튼 */}
        {!addingGroup && !addingStandalone && (
          <div style={{display:'flex',gap:8,marginTop:14}}>
            <button onClick={()=>setAddingGroup(true)}
              style={{flex:1,padding:'7px',background:'none',border:'1px dashed #d1d5db',borderRadius:8,fontSize:12,color:'#6b7280',cursor:'pointer',fontFamily:'inherit'}}>
              📁 그룹 추가
            </button>
            <button onClick={()=>setAddingStandalone(true)}
              style={{flex:1,padding:'7px',background:'none',border:'1px dashed #d1d5db',borderRadius:8,fontSize:12,color:'#6b7280',cursor:'pointer',fontFamily:'inherit'}}>
              ✚ 단독 업무 추가
            </button>
          </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  CREDENTIALS SECTION (거래처별 자격증명 메모)
  // ═══════════════════════════════════════════════
  function CredentialsSection({ clientId, credentials, onAdd, onDelete }) {
    const [open,    setOpen]    = useState(false);   // 기본 접힘
    const [showAdd, setShowAdd] = useState(false);
    const [revealed, setRevealed] = useState({});
    const [form, setForm]         = useState({ service:'', url:'', username:'', password:'' });

    const creds = credentials[clientId] || [];

    function handleAdd() {
      if (!form.service.trim() || !form.username.trim()) return;
      onAdd(clientId, { ...form });
      setForm({ service:'', url:'', username:'', password:'' });
      setShowAdd(false);
    }

    return (
      <div style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',marginBottom:20,overflow:'hidden'}}>
        {/* 헤더 — 항상 표시, 클릭으로 접기/펼치기 */}
        <div
          onClick={() => setOpen(o => !o)}
          style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 20px',cursor:'pointer',userSelect:'none'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:13}}>🔐</span>
            <span style={{fontSize:11,fontWeight:700,color:'#9ca3af',letterSpacing:'1px',textTransform:'uppercase'}}>계정 / 비밀번호 메모</span>
            {creds.length > 0 && (
              <span style={{fontSize:10,color:'#9ca3af',fontWeight:600}}>({creds.length}개)</span>
            )}
          </div>
          <span style={{fontSize:11,color:'#9ca3af',transition:'transform 0.2s',display:'inline-block',transform: open ? 'rotate(180deg)':'rotate(0deg)'}}>▾</span>
        </div>

        {/* 본문 — open 시에만 렌더 */}
        {open && (
        <div style={{padding:'0 20px 18px'}}>
          <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>
            <button
              onClick={e => { e.stopPropagation(); setShowAdd(s => !s); }}
              style={{fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:8,border:'1px solid #e5e7eb',background: showAdd ? '#f3f4f6':'#fff',cursor:'pointer',fontFamily:'inherit',color:'#374151'}}>
              {showAdd ? '취소' : '+ 추가'}
            </button>
          </div>

        {/* 추가 폼 */}
        {showAdd && (
          <div style={{background:'#f9fafb',borderRadius:10,padding:'12px',marginBottom:12,border:'1px solid #e5e7eb'}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
              <input
                placeholder="서비스명 *"
                value={form.service}
                onChange={e => setForm(f => ({...f,service:e.target.value}))}
                style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
              <input
                placeholder="URL (선택)"
                value={form.url}
                onChange={e => setForm(f => ({...f,url:e.target.value}))}
                style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
              <input
                placeholder="아이디 *"
                value={form.username}
                onChange={e => setForm(f => ({...f,username:e.target.value}))}
                style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
              <input
                placeholder="비밀번호"
                value={form.password}
                onChange={e => setForm(f => ({...f,password:e.target.value}))}
                onKeyDown={e => { if(e.key==='Enter') handleAdd(); }}
                style={{padding:'7px 10px',border:'1px solid #d1d5db',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
            </div>
            <button
              onClick={handleAdd}
              disabled={!form.service.trim() || !form.username.trim()}
              style={{padding:'7px 16px',background: (form.service.trim()&&form.username.trim()) ? '#1a1a2e':'#e5e7eb',color:(form.service.trim()&&form.username.trim())?'#fff':'#9ca3af',border:'none',borderRadius:7,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              저장
            </button>
          </div>
        )}

        {/* 목록 */}
        {creds.length === 0 && !showAdd && (
          <div style={{fontSize:12,color:'#9ca3af',padding:'8px 0'}}>등록된 계정이 없습니다.</div>
        )}
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {creds.map(c => (
            <div key={c.credId} className="cred-row">
              <div style={{flex:'0 0 130px',minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,color:'#374151',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.service}</div>
                {c.url && (
                  <a href={c.url} target="_blank" rel="noopener"
                    style={{fontSize:10,color:'#6b7280',textDecoration:'none',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {c.url.replace(/^https?:\/\//,'')}
                  </a>
                )}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,color:'#374151',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.username}</div>
              </div>
              <div
                className="cred-pw"
                onClick={() => setRevealed(r => ({...r,[c.credId]:!r[c.credId]}))}
                title="클릭하면 비밀번호가 표시됩니다"
                style={{
                  flex:'0 0 120px',fontSize:12,fontFamily:'monospace',
                  color: revealed[c.credId] ? '#1a1a2e':'#9ca3af',
                  cursor:'pointer',textAlign:'right',userSelect: revealed[c.credId] ? 'text':'none'
                }}>
                {revealed[c.credId] ? c.password : '••••••••'}
              </div>
              <button
                className="btn-icon"
                onClick={() => { if(confirm(`"${c.service}" 계정을 삭제하시겠습니까?`)) onDelete(clientId, c.credId); }}
                style={{color:'#d1d5db',fontSize:12,flexShrink:0}}>✕</button>
            </div>
          ))}
        </div>
        </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  CLIENT CARD (메인 뷰)
  // ═══════════════════════════════════════════════
  function ClientCard({ client, data, onSelect }) {
    const allJobs    = (data.monthlyJobs||[]).filter(j => j.clientId===client.clientId);
    const essential  = allJobs.filter(j => j.kind==='필수');
    const rankJobs   = allJobs.filter(j => j.kind==='순위');
    const subJobs    = allJobs.filter(j => j.kind==='서브');

    const isDone = j => j.targetCount!=null ? j.currentCount>=j.targetCount : j.note==='완료';

    const essentialDone = essential.filter(isDone).length;
    const allDone = essential.length > 0 && essentialDone === essential.length;

    const specCls = SPEC_CLS[client.specialty]||'기타';
    const emoji   = SPEC_EMOJI[client.specialty]||'🏢';

    // 카운터 업무 진행 상황
    const countJobs     = essential.filter(j => j.targetCount != null);
    // 필수업무 중 카운트 없는 업무 (노트/완료 표시용)
    const noCountEssential = essential.filter(j => j.targetCount == null);

    // 서브/순위 진행중 업무 (완료 제외)
    const nonEssentialActive = [...subJobs, ...rankJobs].filter(j => !isDone(j));
    const MAX_SUB = 4;
    const visibleSub = nonEssentialActive.slice(0, MAX_SUB);
    const hasMoreSub = nonEssentialActive.length > MAX_SUB;

    const bgColor = specCls==='피부과'?'#fde8ec':specCls==='성형외과'?'#ede9fe':specCls==='안과'?'#dbeafe':specCls==='치과'?'#d1fae5':specCls==='한의원'?'#dcfce7':'#fef3c7';

    return (
      <div className="card-hover" onClick={()=>onSelect(client.clientId)}
        style={{background:'#fff',borderRadius:14,border:'1px solid #e5e7eb',overflow:'hidden'}}>

        {/* Top */}
        <div style={{padding:'18px 20px 12px',display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:42,height:42,borderRadius:12,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,background:bgColor}}>
              {emoji}
            </div>
            <div>
              <div style={{fontSize:14,fontWeight:800,color:'#1a1a2e',lineHeight:1.3}}>{client.clientName}</div>
              <SpecBadge specialty={client.specialty} />
            </div>
          </div>
        </div>

        {/* 카운터 업무 진행 바 */}
        {countJobs.length > 0 && (
          <div style={{padding:'0 20px 12px'}}>
            {countJobs.map(j => {
              const pct = Math.min(100, Math.round(((j.currentCount||0)/j.targetCount)*100));
              const done = j.currentCount >= j.targetCount;
              return (
                <div key={j.jobId} style={{marginBottom: countJobs.length>1 ? 8 : 0}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                    <span style={{fontSize:11,color:'#6b7280',fontWeight:600}}>{j.title}</span>
                    <span style={{fontSize:11,fontWeight:700,
                      color: (j.currentCount||0) > j.targetCount ? '#059669' : done ? '#10b981':'#1d4ed8'}}>
                      {j.currentCount}/{j.targetCount}
                      {(j.currentCount||0) > j.targetCount
                        ? <span style={{fontSize:10,fontWeight:800,color:'#059669'}}>+{(j.currentCount||0)-j.targetCount}</span>
                        : j.unit
                      }
                    </span>
                  </div>
                  <div className="prog-track">
                    <div className="prog-fill" style={{
                      width:`${pct}%`,
                      background: done ? '#10b981' : pct > 60 ? '#3b82f6' : pct > 30 ? '#6366f1':'#94a3b8'
                    }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* 필수업무 중 카운트 없는 업무 (노트 방식 — 순위유지 등) */}
        {noCountEssential.length > 0 && (
          <div style={{padding:'0 20px',paddingBottom: visibleSub.length > 0 ? 6 : 10,borderTop: countJobs.length>0 ? '1px solid #f9fafb':'none',paddingTop: countJobs.length>0 ? 8 : 0}}>
            {noCountEssential.map(j => {
              const done = j.note === '완료';
              return (
                <div key={j.jobId} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0'}}>
                  <div style={{width:5,height:5,borderRadius:'50%',flexShrink:0,background:'#ef4444'}} />
                  <span style={{fontSize:11,color: done ? '#9ca3af':'#374151',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600,
                    textDecoration: done ? 'line-through':'none'}}>
                    {j.title}
                  </span>
                  {j.note && j.note !== '완료' && (
                    <span style={{fontSize:10,color:'#6b7280',flexShrink:0,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{j.note}</span>
                  )}
                  {done && <span style={{fontSize:10,color:'#10b981',flexShrink:0}}>✓</span>}
                </div>
              );
            })}
          </div>
        )}

        {/* 서브/순위 업무 진행중 목록 */}
        {visibleSub.length > 0 && (
          <div style={{padding:'0 20px 10px',borderTop:'1px solid #f9fafb',paddingTop:10}}>
            <div style={{fontSize:10,fontWeight:700,color:'#9ca3af',letterSpacing:'0.5px',marginBottom:6}}>진행중 업무</div>
            {visibleSub.map(j => (
              <div key={j.jobId} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:'1px solid #f9fafb'}}>
                <div style={{width:5,height:5,borderRadius:'50%',flexShrink:0,
                  background: j.kind==='순위' ? '#8b5cf6' : '#f59e0b'}} />
                <span style={{fontSize:12,color:'#374151',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {j.title}
                </span>
                {j.note && j.note !== '완료' && (
                  <span style={{fontSize:10,color:'#9ca3af',flexShrink:0}}>{j.note}</span>
                )}
                {j.dueDate && <DueBadge dueDate={j.dueDate} />}
              </div>
            ))}
            {hasMoreSub && (
              <div style={{fontSize:11,color:'#6b7280',marginTop:6,textAlign:'center',fontWeight:600}}>
                +{nonEssentialActive.length - MAX_SUB}개 더 · 카드 클릭해서 전체 보기 →
              </div>
            )}
          </div>
        )}

        {/* 완료된 업무 기록 */}
        {(() => {
          const completedJobs = [
            ...countJobs.filter(j => j.currentCount >= j.targetCount),
            ...noCountEssential.filter(j => j.note === '완료'),
            ...[...subJobs, ...rankJobs].filter(j => isDone(j)),
          ];
          if (completedJobs.length === 0) return null;
          return (
            <CompletedJobsSection jobs={completedJobs} />
          );
        })()}

        {/* Footer */}
        <div style={{padding:'10px 20px 14px',borderTop:'1px solid #f9fafb',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:10,color:'#9ca3af'}}>업데이트 {fmtDate(client.lastUpdated)}</span>
          {client.reportFile ? (
            <a href={client.reportFile} target="_blank" rel="noopener" onClick={e=>e.stopPropagation()}
              style={{fontSize:11,fontWeight:700,color:'#1a1a2e',background:'#f0e6d3',padding:'4px 10px',borderRadius:6,textDecoration:'none'}}>
              📋 보고서
            </a>
          ) : (
            <span style={{fontSize:10,color:'#d1d5db'}}>보고서 없음</span>
          )}
        </div>
      </div>
    );
  }

  function CompletedJobsSection({ jobs }) {
    const [open, setOpen] = useState(false);
    return (
      <div style={{borderTop:'1px solid #f3f4f6'}} onClick={e=>e.stopPropagation()}>
        <div
          onClick={()=>setOpen(o=>!o)}
          style={{display:'flex',alignItems:'center',gap:6,padding:'7px 20px',cursor:'pointer',userSelect:'none',background:'#fafafa'}}>
          <span style={{fontSize:10,fontWeight:700,color:'#10b981'}}>✓ 완료</span>
          <span style={{fontSize:10,color:'#9ca3af',fontWeight:600}}>{jobs.length}건</span>
          <span style={{fontSize:10,color:'#d1d5db',marginLeft:'auto'}}>{open?'▴':'▾'}</span>
        </div>
        {open && (
          <div style={{padding:'4px 20px 10px',background:'#fafafa'}}>
            {jobs.map(j => (
              <div key={j.jobId} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',borderBottom:'1px solid #f3f4f6'}}>
                <span style={{fontSize:10,color:'#10b981',flexShrink:0}}>✓</span>
                <span style={{fontSize:11,color:'#9ca3af',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:'line-through'}}>
                  {j.title}
                </span>
                {j.targetCount != null && (
                  <span style={{fontSize:10,color:'#9ca3af',flexShrink:0}}>{j.currentCount}/{j.targetCount}{j.unit}</span>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  RECENT LOGS (메인 뷰 하단)
  // ═══════════════════════════════════════════════
  function RecentLogs({ data, onGoClient }) {
    const sorted = [...(data.logs||[])].sort((a,b)=>b.createdAt>a.createdAt?1:-1).slice(0,8);
    if(sorted.length===0) return null;
    return (
      <div style={{marginTop:32}}>
        <div className="section-title">📋 최근 업데이트 로그</div>
        <div style={{background:'#fff',borderRadius:12,border:'1px solid #e5e7eb',overflow:'hidden'}}>
          {sorted.map((log,i)=>{
            const client = data.clients.find(c=>c.clientId===log.clientId);
            return (
              <div key={log.logId} style={{display:'flex',gap:12,padding:'12px 16px',borderBottom:i<sorted.length-1?'1px solid #f3f4f6':undefined,cursor:'pointer',alignItems:'flex-start'}}
                onClick={()=>client && onGoClient(client.clientId)}>
                <span style={{fontSize:16,marginTop:1}}>{SPEC_EMOJI[client?.specialty]||'🏢'}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,color:'#374151'}}>{log.message}</div>
                  <div style={{fontSize:10,color:'#9ca3af',marginTop:2}}>{client?.clientName||''}</div>
                </div>
                <span style={{fontSize:10,color:'#9ca3af',whiteSpace:'nowrap',marginTop:2}}>{fmtDate(log.createdAt)}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  CLIENT DETAIL VIEW
  // ═══════════════════════════════════════════════
  function ClientDetailView({ client, data, mutate, onOpenModal, autoLog, onAddCredential, onDeleteCredential, onDeletePost, onUpdateClient, onDeleteClient }) {
    const cDelivs = (data.deliverables||[]).filter(d=>d.clientId===client.clientId);
    const cLogs   = (data.logs||[]).filter(l=>l.clientId===client.clientId).sort((a,b)=>b.createdAt>a.createdAt?1:-1);

    // 이달 발행 글 (이 거래처의 전체 postLogs, 최신순)
    const cPosts  = (data.postLogs||[])
      .filter(p=>p.clientId===client.clientId)
