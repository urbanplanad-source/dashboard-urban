  }

  function MonthlyResetPreviewModal({ data, onClose, onConfirm }) {
    const backupMonth = prevMonth();
    const [remoteConsultBackups, setRemoteConsultBackups] = useState(null);
    const [consultBackupError, setConsultBackupError] = useState('');
    const preview = useMemo(
      () => getMonthlyResetPreview(data, remoteConsultBackups),
      [data, remoteConsultBackups]
    );
    useEffect(() => {
      let cancelled = false;
      const targets = ['btskin', 'belrmon'];
      Promise.all(targets.map(async clientId => {
        const result = await window.dashboardAPI.consultsList(clientId, backupMonth);
        const records = result.data?.consults || result.consults || [];
        if (!result.success || !Array.isArray(records)) throw new Error(result.error || `${clientId} 상담 조회 실패`);
        const clientName = (data.clients || []).find(client => client.clientId === clientId)?.clientName || clientId;
        return {
          clientId,
          clientName,
          records: records.map(item => ({ ...normalizeConsult(item), clientId: item.clientId || clientId })).filter(item => item.id),
        };
      }))
        .then(items => { if (!cancelled) setRemoteConsultBackups(items); })
        .catch(error => { if (!cancelled) setConsultBackupError(error.message || String(error)); });
      return () => { cancelled = true; };
    }, [backupMonth, data.clients]);
    const sampleList = (items, render, emptyText) => (
      <div style={{display:'flex',flexDirection:'column',gap:5,marginTop:8}}>
        {items.length > 0 ? items.slice(0, 5).map(render) : (
          <div style={{fontSize:12,color:'var(--text-3)',fontWeight:700}}>{emptyText}</div>
        )}
        {items.length > 5 && (
          <div style={{fontSize:11,color:'var(--text-3)',fontWeight:700}}>외 {items.length - 5}건</div>
        )}
      </div>
    );

    return (
      <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
        <div className="modal-box" style={{maxWidth:720}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginBottom:16}}>
            <div>
              <h2 style={{fontSize:17,fontWeight:900,color:'var(--ink)',margin:0}}>다음 달 초기화 미리보기</h2>
              <p style={{fontSize:12,color:'var(--text-3)',margin:'4px 0 0'}}>
                {fmtMonth(preview.backupMonth)} 마감 후 {fmtMonth(preview.targetMonth)} 운영월 기준으로 정리합니다.
              </p>
            </div>
            <button className="btn-icon" onClick={onClose}>✕</button>
          </div>

          {preview.unmetRequired.length > 0 && (
            <div style={{background:'var(--red-bg)',border:'1px solid #fecaca',borderRadius:10,padding:'10px 12px',marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:900,color:'var(--red)'}}>아직 미달성 필수업무 {preview.unmetRequired.length}건</div>
              <div style={{fontSize:11,color:'var(--red)',marginTop:4}}>초기화 전에 월말보고서와 발행 기록을 먼저 확인하세요.</div>
            </div>
          )}

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:12}}>
            <div style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:10,padding:12}}>
              <div style={{fontSize:12,fontWeight:900,color:'var(--ink)'}}>삭제될 완료 서브·순위 업무</div>
              <div style={{fontSize:22,fontWeight:900,color:'var(--green)',marginTop:2}}>{preview.completedSubs.length}건</div>
              {sampleList(preview.completedSubs, job => (
                <div key={job.jobId} style={{fontSize:12,color:'var(--text)',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{job.title}</div>
              ), '삭제될 완료 서브·순위 업무 없음')}
            </div>

            <div style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:10,padding:12}}>
              <div style={{fontSize:12,fontWeight:900,color:'var(--ink)'}}>이월될 미완료 서브·순위 업무</div>
              <div style={{fontSize:22,fontWeight:900,color:'var(--blue)',marginTop:2}}>{preview.carryoverSubs.length}건</div>
              {sampleList(preview.carryoverSubs, job => (
                <div key={job.jobId} style={{fontSize:12,color:'var(--text)',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{job.title}</div>
              ), '이월될 서브·순위 업무 없음')}
            </div>

            <div style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:10,padding:12}}>
              <div style={{fontSize:12,fontWeight:900,color:'var(--ink)'}}>고정비 자동 적용</div>
              <div style={{fontSize:22,fontWeight:900,color:'var(--text-2)',marginTop:2}}>안 함</div>
              <div style={{fontSize:12,color:'var(--text-3)',fontWeight:700,marginTop:8}}>수동 적용 대기</div>
            </div>

            <div style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:10,padding:12}}>
              <div style={{fontSize:12,fontWeight:900,color:'var(--ink)'}}>상담 백업 대상</div>
              {!remoteConsultBackups && !consultBackupError && (
                <div style={{fontSize:11,color:'var(--text-3)',fontWeight:700,marginTop:6}}>Sheets의 {fmtMonth(backupMonth)} 상담을 확인하는 중...</div>
              )}
              {consultBackupError && (
                <div style={{fontSize:11,color:'var(--red)',fontWeight:700,marginTop:6}}>상담 조회 실패: {consultBackupError}</div>
              )}
              <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:10}}>
                {remoteConsultBackups && preview.consultBackups.map(item => (
                  <div key={item.clientId} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:12,fontWeight:800}}>
                    <span style={{color:'var(--text)'}}>{item.clientName}</span>
                    <span style={{color:item.records.length ? 'var(--green)' : 'var(--text-3)'}}>{item.records.length}건</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:18}}>
            <button className="btn-ghost" onClick={onClose}>취소</button>
            <button className="btn-primary" disabled={!remoteConsultBackups || !!consultBackupError} onClick={onConfirm}>초기화 실행</button>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  SIDEBAR (좌측 내비게이션)
  // ═══════════════════════════════════════════════
  function Sidebar({ view, selectedClient, clients, onHome, onGoClient, onRevenue, onDrafts, syncStatus, onSync }) {
    const [filter, setFilter] = useState('');
    const d = new Date();
    const dateStr = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
    const q = filter.trim().toLowerCase();
    const list = (clients || []).filter(c =>
      !q || [c.clientName, c.clientId, c.specialty, c.businessType]
        .filter(Boolean).join(' ').toLowerCase().includes(q)
    );

    const syncLabel = syncStatus === 'loading' ? '동기화 중...'
                    : syncStatus === 'ok'      ? '동기화 완료'
                    : syncStatus === 'error'   ? '동기화 재시도'
                    : '구글시트 동기화';
    const syncBg    = syncStatus === 'loading' ? 'rgba(255,255,255,.14)'
                    : syncStatus === 'ok'      ? 'rgba(14,159,110,.85)'
                    : syncStatus === 'error'   ? 'rgba(220,38,38,.85)'
                    : 'rgba(37,99,235,.85)';

    return (
      <aside className="sidebar">
        <div className="side-logo" onClick={onHome} style={{cursor:'pointer'}}>
          <div className="side-logo-mark">UP</div>
          <div className="side-logo-text">
            <div style={{fontSize:14,fontWeight:800,color:'#fff',lineHeight:1.25}}>어반플랜애드</div>
            <div style={{fontSize:10.5,color:'rgba(255,255,255,.42)',marginTop:1}}>업무 대시보드</div>
          </div>
        </div>

        <nav className="side-nav">
          <button className={'side-nav-btn' + (view==='main' ? ' active' : '')} onClick={onHome}>
            <Icon name="grid" size={15} /> 대시보드
          </button>
          <button className={'side-nav-btn' + (view==='drafts' ? ' active' : '')} onClick={onDrafts}>
            <Icon name="file" size={15} /> 글 보관함
          </button>
          <button className={'side-nav-btn' + (view==='revenue' ? ' active' : '')} onClick={onRevenue}>
            <Icon name="wallet" size={15} /> 손익 관리
          </button>
        </nav>

        <div className="side-sec">거래처 {list.length > 0 && `(${list.length})`}</div>
        <input
          className="side-filter"
          value={filter}
          onChange={e=>setFilter(e.target.value)}
          onKeyDown={e=>{
            if(e.key==='Enter' && list[0]) { onGoClient(list[0].clientId); setFilter(''); }
            if(e.key==='Escape') setFilter('');
          }}
          placeholder="거래처 검색"
          aria-label="거래처 검색"
        />
        <div className="side-clients">
          {list.map(c => {
            const active = view==='client' && selectedClient?.clientId === c.clientId;
            return (
              <button key={c.clientId}
                className={'side-client-btn' + (active ? ' active' : '')}
                onClick={()=>onGoClient(c.clientId)}>
                <span className="side-dot" style={{background: SPEC_COLOR[c.specialty] || SPEC_COLOR['기타']}} />
                <span className="side-client-name">{c.clientName}</span>
              </button>
            );
          })}
          {list.length === 0 && (
            <div style={{fontSize:12,color:'rgba(255,255,255,.35)',padding:'8px 10px'}}>검색 결과 없음</div>
          )}
        </div>

        <div className="side-foot">
          <button className="side-sync" style={{background:syncBg}} onClick={onSync} disabled={syncStatus==='loading'}>
            <Icon name="refresh" size={13} /> {syncLabel}
          </button>
          <div className="side-date">{dateStr}</div>
        </div>
      </aside>
    );
  }

  // ═══════════════════════════════════════════════
  //  COMMON TASKS CARD (내 사업 공통업무)
  // ═══════════════════════════════════════════════
  function CommonTasksCard({ tasks, onAddGroup, onAddTask, onToggle, onDelete, onEdit }) {
    const [showDone,          setShowDone]          = useState(false);
    const [addingGroup,       setAddingGroup]       = useState(false);
    const [newGroupTitle,     setNewGroupTitle]     = useState('');
    const [addingStandalone,  setAddingStandalone]  = useState(false);
    const [newStandaloneTitle,setNewStandaloneTitle]= useState('');
    const [newStandaloneDue,  setNewStandaloneDue]  = useState('');

    const groups     = tasks.filter(t => t.kind === 'group');
    // 하위호환: kind 없는 구버전 태스크도 standalone으로 처리
    const standalone = tasks.filter(t => t.kind !== 'group' && !t.parentId);
    const allTaskItems = tasks.filter(t => t.kind !== 'group');
    const pendingCount = allTaskItems.filter(t => !t.done).length;
    const doneCount    = allTaskItems.filter(t => t.done).length;

    function handleAddGroup() {
      if (!newGroupTitle.trim()) return;
      onAddGroup(newGroupTitle.trim());
      setNewGroupTitle(''); setAddingGroup(false);
    }
    function handleAddStandalone() {
      if (!newStandaloneTitle.trim()) return;
      onAddTask(null, newStandaloneTitle.trim(), newStandaloneDue || null);
      setNewStandaloneTitle(''); setNewStandaloneDue(''); setAddingStandalone(false);
    }

    // ── 개별 태스크 행 ──
    function TaskRow({ task, indent }) {
      const [editing, setEditing] = useState(false);
      const [editVal, setEditVal] = useState(task.title);
      const [editDue, setEditDue] = useState(task.dueDate || '');
      function saveEdit() {
        if (editVal.trim()) onEdit(task.taskId, editVal.trim(), editDue || null);
        setEditing(false);
      }
      return (
        <div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'6px 8px',marginLeft:indent?16:0,borderRadius:8,opacity:task.done?0.65:1}}>
          <div onClick={() => onToggle(task.taskId, !task.done)} style={{width:16,height:16,borderRadius:4,flexShrink:0,marginTop:2,cursor:'pointer',border:task.done?'none':'2px solid #d1d5db',background:task.done?'#10b981':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {task.done && <span style={{fontSize:10,color:'#fff',lineHeight:1}}>✓</span>}
          </div>
          <div style={{flex:1,minWidth:0}}>
            {editing ? (
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <input value={editVal} onChange={e=>setEditVal(e.target.value)} autoFocus
                  onKeyDown={e=>{if(e.key==='Enter')saveEdit();if(e.key==='Escape')setEditing(false);}}
                  style={{width:'100%',boxSizing:'border-box',padding:'4px 8px',border:'1px solid #93c5fd',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}}/>
                <div style={{display:'flex',gap:6}}>
                  <input type="date" value={editDue} onChange={e=>setEditDue(e.target.value)}
                    style={{flex:1,padding:'3px 8px',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}/>
                  <button onClick={saveEdit} style={{padding:'3px 10px',background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>저장</button>
                  <button onClick={()=>setEditing(false)} style={{padding:'3px 8px',background:'none',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
                </div>
              </div>
            ) : (
              <div>
                <span onDoubleClick={()=>!task.done&&setEditing(true)} title={task.done?'':'더블클릭으로 수정'}
                  style={{fontSize:13,color:task.done?'#9ca3af':'#374151',textDecoration:task.done?'line-through':'none',cursor:task.done?'default':'text'}}>
                  {task.title}
                </span>
                {task.dueDate && !task.done && <div style={{marginTop:2}}><DueBadge dueDate={task.dueDate}/></div>}
                {task.done && task.dueDate && <div style={{fontSize:10,color:'var(--text-3)',marginTop:1}}>~{task.dueDate.slice(5).replace('-','/')}</div>}
              </div>
            )}
          </div>
          {!editing && (
            <div style={{display:'flex',gap:2,flexShrink:0}}>
              {!task.done && (
                <button onClick={()=>{setEditVal(task.title);setEditDue(task.dueDate||'');setEditing(true);}}
                  style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-3)',padding:'2px 4px',display:'inline-flex'}} title="수정"><Icon name="pencil" size={11} /></button>
              )}
              <button onClick={()=>{if(confirm(`"${task.title}" 삭제?`))onDelete(task.taskId);}}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'#d1d5db',padding:'2px 4px'}} title="삭제">✕</button>
            </div>
          )}
        </div>
      );
    }

    // ── 그룹 섹션 ──
    function GroupSection({ group }) {
      const children      = tasks.filter(t => t.parentId === group.taskId);
      const pendingKids   = children.filter(c => !c.done);
      const doneKids      = children.filter(c => c.done);
      const visibleKids   = showDone ? children : pendingKids;
      const [collapsed,   setCollapsed]   = useState(false);
      const [addingTask,  setAddingTask]  = useState(false);
      const [newTitle,    setNewTitle]    = useState('');
      const [newDue,      setNewDue]      = useState('');
      function handleAddTask() {
        if (!newTitle.trim()) return;
        onAddTask(group.taskId, newTitle.trim(), newDue || null);
        setNewTitle(''); setNewDue(''); setAddingTask(false);
      }
      return (
        <div style={{marginBottom:8,border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:'var(--surface-2)',cursor:'pointer',userSelect:'none'}}
            onClick={()=>setCollapsed(c=>!c)}>
            <Icon name="folder" size={14} style={{color:'var(--gold)'}} />
            <span style={{fontSize:13,fontWeight:700,color:'var(--ink)',flex:1}}>{group.title}</span>
            {pendingKids.length > 0 && (
              <span style={{fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:12,background:'var(--amber-bg)',color:'var(--amber)'}}>{pendingKids.length}건</span>
            )}
            {doneKids.length > 0 && (
              <span style={{fontSize:10,color:'var(--green)',fontWeight:600}}>✓{doneKids.length}</span>
            )}
            <div onClick={e=>e.stopPropagation()} style={{display:'flex',gap:2,marginLeft:4}}>
              <button onClick={()=>setAddingTask(t=>!t)}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--text-2)',padding:'2px 8px',borderRadius:4}}>+ 추가</button>
              <button onClick={()=>{if(confirm(`"${group.title}" 그룹과 하위 태스크 모두 삭제?`))onDelete(group.taskId);}}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'#d1d5db',padding:'2px 4px'}}>✕</button>
            </div>
            <span style={{fontSize:11,color:'var(--text-3)',marginLeft:2}}>{collapsed?'▸':'▾'}</span>
          </div>
          {!collapsed && (
            <div style={{padding:'6px 8px'}}>
              {visibleKids.length === 0 && !addingTask && (
                <div style={{fontSize:12,color:'var(--text-3)',padding:'8px',textAlign:'center'}}>태스크가 없습니다</div>
              )}
              {visibleKids.map(c => <TaskRow key={c.taskId} task={c} indent={true}/>)}
              {addingTask && (
                <div style={{padding:'8px',background:'#f0f9ff',borderRadius:8,marginTop:4}}>
                  <input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="태스크 제목" autoFocus
                    onKeyDown={e=>{if(e.key==='Enter')handleAddTask();if(e.key==='Escape'){setAddingTask(false);setNewTitle('');setNewDue('');}}}
                    style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #bae6fd',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:5}}/>
                  <div style={{display:'flex',gap:6}}>
                    <input type="date" value={newDue} onChange={e=>setNewDue(e.target.value)}
                      style={{flex:1,padding:'5px 8px',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}/>
                    <button onClick={handleAddTask} style={{padding:'5px 12px',background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>추가</button>
                    <button onClick={()=>{setAddingTask(false);setNewTitle('');setNewDue('');}} style={{padding:'5px 8px',background:'none',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    return (
      <div style={{background:'var(--surface)',borderRadius:14,border:'1px solid var(--border)',padding:'18px 22px',marginBottom:20,boxShadow:'0 1px 4px rgba(0,0,0,0.05)'}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <Icon name="clipboard" size={16} style={{color:'var(--gold)'}} />
            <span style={{fontSize:14,fontWeight:800,color:'var(--ink)'}}>내 사업 공통업무</span>
            {pendingCount > 0 && (
              <span style={{fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:20,background:'var(--amber-bg)',color:'var(--amber)'}}>{pendingCount}건 진행 중</span>
            )}
          </div>
          <button onClick={()=>setShowDone(s=>!s)}
            style={{fontSize:11,color:'var(--text-3)',background:'transparent',border:'none',cursor:'pointer',fontFamily:'inherit',padding:'2px 6px'}}>
            {showDone ? '완료 숨기기' : `완료 ${doneCount}건 보기`}
          </button>
        </div>

        {/* 그룹 목록 */}
        {groups.map(g => <GroupSection key={g.taskId} group={g}/>)}

        {/* 단독 태스크 */}
        {(showDone ? standalone : standalone.filter(t=>!t.done)).map(t => (
          <TaskRow key={t.taskId} task={t} indent={false}/>
        ))}

        {groups.length === 0 && standalone.length === 0 && !addingGroup && !addingStandalone && (
          <div style={{fontSize:13,color:'var(--text-3)',padding:'16px',textAlign:'center'}}>그룹이나 업무를 추가해보세요</div>
        )}

        {/* 그룹 추가 폼 */}
        {addingGroup && (
          <div style={{marginTop:10,padding:'12px',background:'var(--surface-2)',borderRadius:8,border:'1px solid var(--border)'}}>
            <input value={newGroupTitle} onChange={e=>setNewGroupTitle(e.target.value)} placeholder="그룹 이름 (예: 인사이트메디 앱 출시)" autoFocus
              onKeyDown={e=>{if(e.key==='Enter')handleAddGroup();if(e.key==='Escape'){setAddingGroup(false);setNewGroupTitle('');}}}
              style={{width:'100%',boxSizing:'border-box',padding:'7px 12px',border:'1px solid #dcdad4',borderRadius:8,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:8}}/>
            <div style={{display:'flex',gap:6}}>
              <button onClick={handleAddGroup} style={{padding:'6px 14px',background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>생성</button>
              <button onClick={()=>{setAddingGroup(false);setNewGroupTitle('');}} style={{padding:'6px 10px',background:'none',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
            </div>
          </div>
        )}

        {/* 단독 업무 추가 폼 */}
        {addingStandalone && (
          <div style={{marginTop:10,padding:'12px',background:'var(--surface-2)',borderRadius:8,border:'1px solid var(--border)'}}>
            <input value={newStandaloneTitle} onChange={e=>setNewStandaloneTitle(e.target.value)} placeholder="단독 업무 제목" autoFocus
              onKeyDown={e=>{if(e.key==='Enter')handleAddStandalone();if(e.key==='Escape'){setAddingStandalone(false);setNewStandaloneTitle('');setNewStandaloneDue('');}}}
              style={{width:'100%',boxSizing:'border-box',padding:'7px 12px',border:'1px solid #dcdad4',borderRadius:8,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:6}}/>
            <div style={{display:'flex',gap:6}}>
              <input type="date" value={newStandaloneDue} onChange={e=>setNewStandaloneDue(e.target.value)}
                style={{flex:1,padding:'6px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}/>
              <button onClick={handleAddStandalone} style={{padding:'6px 14px',background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>추가</button>
              <button onClick={()=>{setAddingStandalone(false);setNewStandaloneTitle('');setNewStandaloneDue('');}} style={{padding:'6px 10px',background:'none',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
            </div>
          </div>
        )}

        {/* 하단 액션 버튼 */}
        {!addingGroup && !addingStandalone && (
          <div style={{display:'flex',gap:8,marginTop:14}}>
            <button onClick={()=>setAddingGroup(true)}
              style={{flex:1,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,padding:'7px',background:'none',border:'1px dashed #d6d5d0',borderRadius:8,fontSize:12,color:'var(--text-2)',cursor:'pointer',fontFamily:'inherit'}}>
              <Icon name="folder" size={12} /> 그룹 추가
            </button>
            <button onClick={()=>setAddingStandalone(true)}
              style={{flex:1,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,padding:'7px',background:'none',border:'1px dashed #d6d5d0',borderRadius:8,fontSize:12,color:'var(--text-2)',cursor:'pointer',fontFamily:'inherit'}}>
              <Icon name="plus" size={12} /> 단독 업무 추가
            </button>
          </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  RESERVATION CALENDAR CARD (예약 고객 캘린더)
  // ═══════════════════════════════════════════════
  function CalendarCard({ data, onAddReservation, onUpdateReservation, onDeleteReservation, onGoClient }) {
    const [cursor, setCursor] = useState(() => {
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), 1);
    });
    const [selectedDate, setSelectedDate] = useState(today());
    const [showAdd, setShowAdd] = useState(false);
    const [editingTaskId, setEditingTaskId] = useState(null);
    const emptyReservation = (date = selectedDate) => ({
      clientId: (data.clients||[])[0]?.clientId || '', appointmentDate: date || today(), appointmentTime:'',
      patientName:'', birthDate:'', nationality:'', gender:'', partySize:1, treatment:'', note:''
    });
    const [form, setForm] = useState(() => emptyReservation(today()));

    const monthKey = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;
    const monthLabel = `${cursor.getFullYear()}년 ${cursor.getMonth()+1}월`;
    const clientsById = useMemo(() => {
      const m = {};
      (data.clients||[]).forEach(c => { m[c.clientId] = c; });
      return m;
    }, [data.clients]);

    const reservations = useMemo(() => (data.reservations||[])
      .map(item => {
        const reservation = cleanReservation(item);
        if (!reservation.appointmentDate) return null;
        const client = clientsById[reservation.clientId];
        return {
          reservationId: item.reservationId,
          ...reservation,
          clientName: client?.clientName || reservation.clientId || '병원 미지정',
          color: SPEC_COLOR[client?.specialty] || '#c9a96e',
        };
      })
      .filter(Boolean)
      .sort((a,b) => `${a.appointmentDate}${a.appointmentTime}${a.patientName}`.localeCompare(`${b.appointmentDate}${b.appointmentTime}${b.patientName}`)),
      [data.reservations, clientsById]);

    const reservationsByDate = useMemo(() => {
      const m = {};
      reservations.forEach(item => { (m[item.appointmentDate] ||= []).push(item); });
      return m;
    }, [reservations]);

    const monthReservations = reservations.filter(item => item.appointmentDate.startsWith(monthKey));
    const selectedReservations = reservationsByDate[selectedDate] || [];
    const firstDay = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
    const cells = [];
    for (let i=0; i<startOffset; i++) cells.push(null);
    for (let d=1; d<=daysInMonth; d++) cells.push(new Date(cursor.getFullYear(), cursor.getMonth(), d));
    while (cells.length % 7 !== 0) cells.push(null);

    function moveMonth(delta) {
      const n = new Date(cursor.getFullYear(), cursor.getMonth()+delta, 1);
      setCursor(n);
      setSelectedDate(`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-01`);
      setShowAdd(false);
      setEditingTaskId(null);
    }
    function openAddForm() {
      setEditingTaskId(null);
      setForm(emptyReservation(selectedDate));
      setShowAdd(true);
    }
    function startEdit(item) {
      setEditingTaskId(item.reservationId);
      setForm(cleanReservation(item));
      setShowAdd(true);
    }
    function saveReservation() {
      const next = cleanReservation(form);
      if (!next.clientId || !next.appointmentDate || !next.appointmentTime || !next.patientName) {
        alert('병원, 예약일, 예약시간, 고객명은 필수입니다.');
        return;
      }
      if (editingTaskId) onUpdateReservation(editingTaskId, next);
      else onAddReservation(next);
      setSelectedDate(next.appointmentDate);
      const [y,m] = next.appointmentDate.split('-').map(Number);
      setCursor(new Date(y, m-1, 1));
      setShowAdd(false);
      setEditingTaskId(null);
    }
    function deleteReservation(item) {
      if (!confirm(`${item.patientName} 예약 정보를 삭제할까요?`)) return;
      onDeleteReservation(item.reservationId);
      setShowAdd(false);
      setEditingTaskId(null);
    }

    const fieldStyle = {width:'100%',boxSizing:'border-box',padding:'7px 9px',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,fontFamily:'inherit',background:'#fff'};
    const labelStyle = {display:'flex',flexDirection:'column',gap:4,fontSize:10.5,fontWeight:800,color:'var(--text-2)',minWidth:0};

    return (
      <div style={{background:'var(--surface)',borderRadius:14,border:'1px solid var(--border)',padding:'18px 18px',marginBottom:20,boxShadow:'0 1px 4px rgba(0,0,0,0.05)',minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,gap:8}}>
          <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
            <Icon name="calendar" size={16} style={{color:'var(--gold)'}} />
            <div>
              <div style={{fontSize:14,fontWeight:800,color:'var(--ink)'}}>예약 고객 캘린더</div>
              <div style={{fontSize:11,color:'var(--text-3)'}}>{monthReservations.length}건 예약 · 이 PC에만 저장</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
            <button onClick={()=>moveMonth(-1)} title="이전 달" style={{width:28,height:28,border:'1px solid var(--border)',borderRadius:7,background:'var(--surface)',cursor:'pointer'}}>‹</button>
            <div style={{fontSize:13,fontWeight:800,color:'var(--text)',minWidth:86,textAlign:'center'}}>{monthLabel}</div>
            <button onClick={()=>moveMonth(1)} title="다음 달" style={{width:28,height:28,border:'1px solid var(--border)',borderRadius:7,background:'var(--surface)',cursor:'pointer'}}>›</button>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,marginBottom:5}}>
          {['일','월','화','수','목','금','토'].map((d,i)=><div key={d} style={{fontSize:10,fontWeight:800,color:i===0?'#dc2626':i===6?'#2563eb':'#9ca3af',textAlign:'center'}}>{d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
          {cells.map((d,i)=>{
            if(!d) return <div key={'b'+i} style={{aspectRatio:'1/0.9'}} />;
            const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
             const dayReservations = reservationsByDate[ds] || [];
            const isToday = ds === today();
            const isSelected = ds === selectedDate;
            return (
              <button key={ds} onClick={()=>{setSelectedDate(ds);setShowAdd(false);setEditingTaskId(null);}}
                style={{aspectRatio:'1/0.9',border:isSelected?'2px solid #1a1a2e':'1px solid #e8e7e3',borderRadius:8,background:isSelected?'#f8fafc':'#fff',padding:4,cursor:'pointer',fontFamily:'inherit',textAlign:'left',overflow:'hidden'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:11,fontWeight:isToday?900:700,color:isToday?'#c9a96e':'#374151'}}>{d.getDate()}</span>
                   {dayReservations.length>0 && <span style={{fontSize:9,fontWeight:800,color:'#fff',background:'var(--navy)',borderRadius:9,padding:'0 5px'}}>{dayReservations.length}</span>}
                 </div>
                 <div style={{display:'flex',gap:2,marginTop:4,flexWrap:'wrap'}}>
                   {dayReservations.slice(0,3).map(item=><span key={item.reservationId} style={{width:5,height:5,borderRadius:'50%',background:item.color,display:'inline-block'}} />)}
                </div>
              </button>
            );
          })}
        </div>

        <div style={{marginTop:14,borderTop:'1px solid var(--border-2)',paddingTop:12}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:800,color:'var(--text)'}}>{fmtDate(selectedDate)} 예약 고객</div>
            <button onClick={openAddForm} style={{fontSize:11,fontWeight:800,color:'var(--blue)',border:'1px dashed #bfdbfe',borderRadius:7,background:'#eff6ff',padding:'4px 9px',cursor:'pointer',fontFamily:'inherit'}}>+ 예약 등록</button>
          </div>

          {showAdd && (
            <div style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:9,padding:10,marginBottom:10}}>
              <div style={{fontSize:11.5,fontWeight:900,color:'var(--ink)',marginBottom:8}}>{editingTaskId ? '예약 정보 수정' : '예약 고객 등록'}</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:7}}>
                <label style={labelStyle}>병원 *
                  <select value={form.clientId} onChange={e=>setForm(f=>({...f,clientId:e.target.value}))} style={fieldStyle}>
                    <option value="">병원 선택</option>
                    {(data.clients||[]).map(c=><option key={c.clientId} value={c.clientId}>{c.clientName}</option>)}
                  </select>
                </label>
                <label style={labelStyle}>고객명 / 여권 영문명 *
                  <input value={form.patientName} onChange={e=>setForm(f=>({...f,patientName:e.target.value}))} placeholder="MA WENYUAN" style={fieldStyle} />
                </label>
                <label style={labelStyle}>예약일 *
                  <input type="date" value={form.appointmentDate} onChange={e=>setForm(f=>({...f,appointmentDate:e.target.value}))} style={fieldStyle} />
                </label>
                <label style={labelStyle}>예약시간 *
                  <input type="time" value={form.appointmentTime} onChange={e=>setForm(f=>({...f,appointmentTime:e.target.value}))} style={fieldStyle} />
                </label>
                <label style={labelStyle}>생년월일
                  <input value={form.birthDate} onChange={e=>setForm(f=>({...f,birthDate:e.target.value}))} placeholder="19770313 또는 1977-03-13" style={fieldStyle} />
                </label>
                <label style={labelStyle}>국적
                  <input value={form.nationality} onChange={e=>setForm(f=>({...f,nationality:e.target.value}))} placeholder="中國香港 / Hong Kong" style={fieldStyle} />
                </label>
                <label style={labelStyle}>성별
                  <select value={form.gender} onChange={e=>setForm(f=>({...f,gender:e.target.value}))} style={fieldStyle}>
                    <option value="">선택 안 함</option><option value="여성">여성</option><option value="남성">남성</option><option value="기타">기타</option>
                  </select>
                </label>
                <label style={labelStyle}>인원
                  <input type="number" min="1" value={form.partySize} onChange={e=>setForm(f=>({...f,partySize:e.target.value}))} style={fieldStyle} />
                </label>
                <label style={{...labelStyle,gridColumn:'1 / -1'}}>시술 / 상담 내용
                  <input value={form.treatment} onChange={e=>setForm(f=>({...f,treatment:e.target.value}))} placeholder="울쎄라, 상담 후 추가 시술 추천 예정" style={fieldStyle} />
                </label>
                <label style={{...labelStyle,gridColumn:'1 / -1'}}>추가 메모
                  <textarea value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} rows="2" placeholder="통역, 동행인, 요청사항 등" style={{...fieldStyle,resize:'vertical'}} />
                </label>
              </div>
              <div style={{display:'flex',gap:6,marginTop:9}}>
                <button onClick={saveReservation} style={{padding:'6px 12px',background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit'}}>저장</button>
                <button onClick={()=>{setShowAdd(false);setEditingTaskId(null);}} style={{padding:'6px 9px',background:'var(--surface)',color:'var(--text-2)',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>취소</button>
                {editingTaskId && <button onClick={()=>deleteReservation({reservationId:editingTaskId,patientName:form.patientName})} style={{marginLeft:'auto',padding:'6px 9px',background:'var(--surface)',color:'var(--red)',border:'1px solid #fecaca',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>삭제</button>}
              </div>
            </div>
          )}

          {selectedReservations.length === 0 ? (
            <div style={{fontSize:12,color:'var(--text-3)',textAlign:'center',padding:'16px 0'}}>등록된 예약 고객이 없습니다</div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:280,overflowY:'auto',paddingRight:2}}>
              {selectedReservations.map(item=>(
                <div key={item.reservationId} style={{border:'1px solid var(--border)',borderRadius:9,padding:'9px 10px',background:'#fff'}}>
                    <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                      <span style={{width:7,height:7,borderRadius:'50%',background:item.color,marginTop:6,flexShrink:0}} />
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',gap:7,alignItems:'baseline',flexWrap:'wrap'}}>
                          <span style={{fontSize:12,fontWeight:900,color:'var(--ink)'}}>{item.appointmentTime}</span>
                          <span style={{fontSize:12,fontWeight:800,color:'#374151'}}>{item.patientName}</span>
                          <span style={{fontSize:10,color:'var(--text-3)'}}>{item.partySize}명</span>
                        </div>
                        <div style={{display:'flex',gap:5,alignItems:'center',marginTop:4,flexWrap:'wrap'}}>
                          <button onClick={()=>onGoClient(item.clientId)} style={{fontSize:10,fontWeight:800,color:item.color,background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:10,padding:'1px 6px',cursor:'pointer',fontFamily:'inherit'}}>{item.clientName}</button>
                          {item.treatment && <span style={{fontSize:10.5,color:'var(--text-2)'}}>{item.treatment}</span>}
                        </div>
                        {(item.birthDate || item.nationality || item.gender) && <div style={{fontSize:10,color:'var(--text-3)',marginTop:4}}>{[item.birthDate,item.nationality,item.gender].filter(Boolean).join(' · ')}</div>}
                        {item.note && <div style={{fontSize:10.5,color:'var(--text-2)',marginTop:4,whiteSpace:'pre-wrap'}}>{item.note}</div>}
                      </div>
                      <button onClick={()=>startEdit(item)} title="예약 수정" style={{border:'1px solid var(--border)',background:'var(--surface-2)',borderRadius:6,width:24,height:24,fontSize:11,cursor:'pointer',color:'var(--text-2)',flexShrink:0}}>✎</button>
                    </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  CREDENTIALS SECTION (거래처별 자격증명 메모)
  // ═══════════════════════════════════════════════
  function CredentialsSection({ clientId, credentials, onAdd, onDelete, title='계정 / 비밀번호 메모' }) {
    const [open,    setOpen]    = useState(false);   // 기본 접힘
    const [showAdd, setShowAdd] = useState(false);
    const [revealed, setRevealed] = useState({});
    const [copied, setCopied] = useState(null);
    const [form, setForm]         = useState({ service:'', url:'', username:'', password:'' });

    const creds = credentials[clientId] || [];

    function handleAdd() {
      if (!form.service.trim() || !form.username.trim()) return;
      onAdd(clientId, { ...form });
      setForm({ service:'', url:'', username:'', password:'' });
      setShowAdd(false);
    }

    async function copyText(value, key) {
      if (!value) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const el = document.createElement('textarea');
          el.value = value;
          el.setAttribute('readonly', '');
          el.style.position = 'fixed';
          el.style.left = '-9999px';
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
        }
        setCopied(key);
        setTimeout(() => setCopied(c => c === key ? null : c), 1200);
      } catch (e) {
        alert('복사에 실패했습니다. 직접 선택해서 복사해주세요.');
      }
    }

    return (
      <div style={{background:'var(--surface)',borderRadius:12,border:'1px solid var(--border)',marginBottom:20,overflow:'hidden'}}>
        {/* 헤더 — 항상 표시, 클릭으로 접기/펼치기 */}
        <div
          onClick={() => setOpen(o => !o)}
          style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 20px',cursor:'pointer',userSelect:'none'}}>
          <div style={{display:'flex',alignItems:'center',gap:7}}>
            <Icon name="lock" size={12} style={{color:'var(--text-3)'}} />
            <span style={{fontSize:11,fontWeight:700,color:'var(--text-3)',letterSpacing:'1px',textTransform:'uppercase'}}>{title}</span>
            {creds.length > 0 && (
              <span style={{fontSize:10,color:'var(--text-3)',fontWeight:600}}>({creds.length}개)</span>
            )}
          </div>
          <span style={{fontSize:11,color:'var(--text-3)',transition:'transform 0.2s',display:'inline-block',transform: open ? 'rotate(180deg)':'rotate(0deg)'}}>▾</span>
        </div>

        {/* 본문 — open 시에만 렌더 */}
        {open && (
        <div style={{padding:'0 20px 18px'}}>
          <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>
            <button
              onClick={e => { e.stopPropagation(); setShowAdd(s => !s); }}
              style={{fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:8,border:'1px solid var(--border)',background: showAdd ? '#f3f4f6':'#fff',cursor:'pointer',fontFamily:'inherit',color:'var(--text)'}}>
              {showAdd ? '취소' : '+ 추가'}
            </button>
          </div>

        {/* 추가 폼 */}
        {showAdd && (
          <div style={{background:'var(--surface-2)',borderRadius:10,padding:'12px',marginBottom:12,border:'1px solid var(--border)'}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
              <input
                placeholder="서비스명 *"
                value={form.service}
                onChange={e => setForm(f => ({...f,service:e.target.value}))}
                style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
              <input
                placeholder="URL (선택)"
                value={form.url}
                onChange={e => setForm(f => ({...f,url:e.target.value}))}
                style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
              <input
                placeholder="아이디 *"
                value={form.username}
                onChange={e => setForm(f => ({...f,username:e.target.value}))}
                style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
              <input
                placeholder="비밀번호"
                value={form.password}
                onChange={e => setForm(f => ({...f,password:e.target.value}))}
                onKeyDown={e => { if(e.key==='Enter') handleAdd(); }}
                style={{padding:'7px 10px',border:'1px solid #dcdad4',borderRadius:7,fontSize:12,fontFamily:'inherit',outline:'none'}}
              />
            </div>
            <button
              onClick={handleAdd}
              disabled={!form.service.trim() || !form.username.trim()}
              style={{padding:'7px 16px',background: (form.service.trim()&&form.username.trim()) ? '#1a1a2e':'#e8e7e3',color:(form.service.trim()&&form.username.trim())?'#fff':'#9ca3af',border:'none',borderRadius:7,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              저장
            </button>
          </div>
        )}

        {/* 목록 */}
        {creds.length === 0 && !showAdd && (
          <div style={{fontSize:12,color:'var(--text-3)',padding:'8px 0'}}>등록된 계정이 없습니다.</div>
        )}
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {creds.map(c => (
            <div key={c.credId} className="cred-row">
              <div style={{flex:'0 0 130px',minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.service}</div>
                {c.url && (
                  <a href={c.url} target="_blank" rel="noopener"
                    style={{fontSize:10,color:'var(--text-2)',textDecoration:'none',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {c.url.replace(/^https?:\/\//,'')}
                  </a>
                )}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
                  <div style={{fontSize:12,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{c.username}</div>
                  <button
                    onClick={() => copyText(c.username, c.credId + ':id')}
                    title="아이디 복사"
                    style={{fontSize:10,fontWeight:700,color:copied===c.credId+':id'?'#059669':'#6b7280',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:'2px 6px',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>
                    {copied===c.credId+':id'?'복사됨':'ID'}
                  </button>
                </div>
              </div>
              <div
                className="cred-pw"
                onClick={() => setRevealed(r => ({...r,[c.credId]:!r[c.credId]}))}
                title="클릭하면 비밀번호가 표시됩니다"
                style={{
                  flex:'0 0 120px',fontSize:12,fontFamily:'monospace',
                  color: revealed[c.credId] ? '#1a1a2e':'#9ca3af',
                  cursor:'pointer',textAlign:'right',userSelect: revealed[c.credId] ? 'text':'none'
                }}>
                {revealed[c.credId] ? c.password : '••••••••'}
              </div>
              <button
                onClick={() => copyText(c.password || '', c.credId + ':pw')}
                title="비밀번호 복사"
                disabled={!c.password}
                style={{fontSize:10,fontWeight:700,color:copied===c.credId+':pw'?'#059669':'#6b7280',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:'2px 6px',cursor:c.password?'pointer':'default',fontFamily:'inherit',whiteSpace:'nowrap',opacity:c.password?1:0.45}}>
                {copied===c.credId+':pw'?'복사됨':'PW'}
              </button>
              <button
                className="btn-icon"
                onClick={() => { if(confirm(`"${c.service}" 계정을 삭제하시겠습니까?`)) onDelete(clientId, c.credId); }}
                style={{color:'#d1d5db',fontSize:12,flexShrink:0}}>✕</button>
            </div>
          ))}
        </div>
        </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  CLIENT CARD (메인 뷰)
  // ═══════════════════════════════════════════════
  function ClientCard({ client, data, onSelect }) {
    // ── 네이버 방문자 리뷰 수 (reviewTargets에서 clientId 매칭) ──
    const reviewTarget = (data.reviewTargets||[]).find(r => r.clientId === client.clientId);
    const visitorReviewCount = reviewTarget ? reviewTarget.savedVisitorReviewCount : null;

    const allJobs    = (data.monthlyJobs||[]).filter(j => j.clientId===client.clientId);
    const essential  = allJobs.filter(j => j.kind==='필수');
    const rankJobs   = allJobs.filter(j => j.kind==='순위');
    const subJobs    = allJobs.filter(j => j.kind==='서브');

    const isDone = isJobDone;

    const essentialDone = essential.filter(isDone).length;
    const allDone = essential.length > 0 && essentialDone === essential.length;

    // 카운터 업무 진행 상황
    const countJobs     = essential.filter(j => j.targetCount != null);
    // 필수업무 중 카운트 없는 업무 (노트/완료 표시용)
    const noCountEssential = essential.filter(j => j.targetCount == null);

    // 서브/순위 진행중 업무 (완료 제외)
    const nonEssentialActive = sortJobsForFocus([...subJobs, ...rankJobs].filter(j => !isDone(j)));
    const MAX_SUB = 4;
    const visibleSub = nonEssentialActive.slice(0, MAX_SUB);
    const hasMoreSub = nonEssentialActive.length > MAX_SUB;

    return (
      <div className="card-hover" onClick={()=>onSelect(client.clientId)}
        style={{background:'var(--surface)',borderRadius:'var(--radius)',border:'1px solid var(--border)',overflow:'hidden',boxShadow:'var(--shadow-sm)'}}>

        {/* Top */}
        <div style={{padding:'16px 18px 12px',display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:11}}>
            <ClientAvatar client={client} size={38} />
            <div>
              <div style={{fontSize:14,fontWeight:800,color:'var(--ink)',lineHeight:1.3,marginBottom:2}}>{client.clientName}</div>
              <SpecBadge specialty={client.specialty} />
            </div>
          </div>
        </div>

        {/* 카운터 업무 진행 바 */}
        {countJobs.length > 0 && (
          <div style={{padding:'0 20px 12px'}}>
            {countJobs.map(j => {
              const pct = Math.min(100, Math.round(((j.currentCount||0)/j.targetCount)*100));
              const done = j.currentCount >= j.targetCount;
              return (
                <div key={j.jobId} style={{marginBottom: countJobs.length>1 ? 8 : 0}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                    <span style={{fontSize:11,color:'var(--text-2)',fontWeight:600}}>{j.title}</span>
                    <span style={{fontSize:11,fontWeight:700,
                      color: (j.currentCount||0) > j.targetCount ? '#059669' : done ? '#10b981':'#1d4ed8'}}>
                      {j.currentCount}/{j.targetCount}
                      {(j.currentCount||0) > j.targetCount
                        ? <span style={{fontSize:10,fontWeight:800,color:'var(--green)'}}>+{(j.currentCount||0)-j.targetCount}</span>
                        : j.unit
                      }
                    </span>
                  </div>
                  <div className="prog-track">
                    <div className="prog-fill" style={{
                      width:`${pct}%`,
                      background: done ? '#10b981' : pct > 60 ? '#3b82f6' : pct > 30 ? '#6366f1':'#94a3b8'
                    }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* 필수업무 중 카운트 없는 업무 (노트 방식 — 순위유지 등) */}
        {noCountEssential.length > 0 && (
          <div style={{padding:'0 20px',paddingBottom: visibleSub.length > 0 ? 6 : 10,borderTop: countJobs.length>0 ? '1px solid #f9fafb':'none',paddingTop: countJobs.length>0 ? 8 : 0}}>
            {noCountEssential.map(j => {
              const done = isDone(j);
              return (
                <div key={j.jobId} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0'}}>
                  <div style={{width:5,height:5,borderRadius:'50%',flexShrink:0,background:'#ef4444'}} />
                  <span style={{fontSize:11,color: done ? '#9ca3af':'#374151',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600,
                    textDecoration: done ? 'line-through':'none'}}>
                    {j.title}
                  </span>
                  {j.note && !done && (
                    <span style={{fontSize:10,color:'var(--text-2)',flexShrink:0,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{j.note}</span>
                  )}
                  {done && <span style={{fontSize:10,color:'var(--green)',flexShrink:0}}>✓</span>}
                </div>
              );
            })}
          </div>
        )}

        {/* 서브/순위 업무 진행중 목록 */}
        {visibleSub.length > 0 && (
          <div style={{padding:'0 20px 10px',borderTop:'1px solid var(--border-2)',paddingTop:10}}>
            <div style={{fontSize:10,fontWeight:700,color:'var(--text-3)',letterSpacing:'0.5px',marginBottom:6}}>진행중 업무</div>
            {visibleSub.map(j => (
              <div key={j.jobId} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:'1px solid var(--border-2)'}}>
                <div style={{width:5,height:5,borderRadius:'50%',flexShrink:0,
                  background: j.kind==='순위' ? '#8b5cf6' : '#f59e0b'}} />
                <span style={{fontSize:12,color:'var(--text)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {j.title}
                </span>
                {j.note && !isDone(j) && (
                  <span style={{fontSize:10,color:'var(--text-3)',flexShrink:0}}>{j.note}</span>
                )}
                {j.dueDate && <DueBadge dueDate={j.dueDate} />}
              </div>
            ))}
            {hasMoreSub && (
              <div style={{fontSize:11,color:'var(--text-2)',marginTop:6,textAlign:'center',fontWeight:600}}>
                +{nonEssentialActive.length - MAX_SUB}개 더 · 카드 클릭해서 전체 보기 →
              </div>
            )}
          </div>
        )}

        {/* 완료된 업무 기록 */}
        {(() => {
          const completedJobs = [
            ...countJobs.filter(j => j.currentCount >= j.targetCount),
            ...noCountEssential.filter(isDone),
            ...[...subJobs, ...rankJobs].filter(j => isDone(j)),
          ];
          if (completedJobs.length === 0) return null;
          return (
            <CompletedJobsSection jobs={completedJobs} />
          );
        })()}

        {/* Footer */}
        <div style={{padding:'10px 18px 13px',borderTop:'1px solid var(--border-2)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:10.5,color:'var(--text-3)'}}>업데이트 {fmtDate(client.lastUpdated)}</span>
            {visitorReviewCount != null && (
              <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:10.5,fontWeight:700,color:'var(--green)',background:'var(--green-bg)',padding:'2px 8px',borderRadius:6}}>
                <Icon name="star" size={10} /> 방문자리뷰 {Number(visitorReviewCount).toLocaleString('ko-KR')}
              </span>
            )}
          </div>
          {client.reportFile ? (
            <a href={client.reportFile} target="_blank" rel="noopener" onClick={e=>e.stopPropagation()}
              style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,color:'var(--gold-ink)',background:'var(--gold-bg)',padding:'4px 10px',borderRadius:6,textDecoration:'none'}}>
              보고서 <Icon name="external" size={10} />
            </a>
          ) : (
            <span style={{fontSize:10.5,color:'var(--text-3)'}}>보고서 없음</span>
          )}
        </div>
      </div>
    );
  }

  function CompletedJobsSection({ jobs }) {
    const [open, setOpen] = useState(false);
    return (
      <div style={{borderTop:'1px solid var(--border-2)'}} onClick={e=>e.stopPropagation()}>
        <div
          onClick={()=>setOpen(o=>!o)}
          style={{display:'flex',alignItems:'center',gap:6,padding:'7px 20px',cursor:'pointer',userSelect:'none',background:'#fafafa'}}>
          <span style={{fontSize:10,fontWeight:700,color:'var(--green)'}}>✓ 완료</span>
          <span style={{fontSize:10,color:'var(--text-3)',fontWeight:600}}>{jobs.length}건</span>
          <span style={{fontSize:10,color:'#d1d5db',marginLeft:'auto'}}>{open?'▴':'▾'}</span>
        </div>
        {open && (
          <div style={{padding:'4px 20px 10px',background:'#fafafa'}}>
            {jobs.map(j => (
              <div key={j.jobId} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',borderBottom:'1px solid var(--border-2)'}}>
                <span style={{fontSize:10,color:'var(--green)',flexShrink:0}}>✓</span>
                <span style={{fontSize:11,color:'var(--text-3)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:'line-through'}}>
                  {j.title}
                </span>
                {j.targetCount != null && (
                  <span style={{fontSize:10,color:'var(--text-3)',flexShrink:0}}>{j.currentCount}/{j.targetCount}{j.unit}</span>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  RECENT LOGS (메인 뷰 하단)
  // ═══════════════════════════════════════════════
  function RecentLogs({ data, onGoClient }) {
    const sorted = [...(data.logs||[])].sort((a,b)=>b.createdAt>a.createdAt?1:-1).slice(0,8);
    if(sorted.length===0) return null;
    return (
      <div style={{marginTop:28}}>
        <div className="section-title"><Icon name="clipboard" size={12} /> 최근 업데이트 로그</div>
        <div style={{background:'var(--surface)',borderRadius:'var(--radius)',border:'1px solid var(--border)',overflow:'hidden',boxShadow:'var(--shadow-sm)'}}>
          {sorted.map((log,i)=>{
            const client = data.clients.find(c=>c.clientId===log.clientId);
            return (
              <div key={log.logId} style={{display:'flex',gap:11,padding:'11px 16px',borderBottom:i<sorted.length-1?'1px solid var(--border-2)':undefined,cursor:'pointer',alignItems:'flex-start'}}
                onClick={()=>client && onGoClient(client.clientId)}>
                <ClientAvatar client={client} size={26} />
                <div style={{flex:1}}>
                  <div style={{fontSize:12.5,color:'var(--text)'}}>{log.message}</div>
                  <div style={{fontSize:10.5,color:'var(--text-3)',marginTop:2}}>{client?.clientName||''}</div>
                </div>
                <span style={{fontSize:10.5,color:'var(--text-3)',whiteSpace:'nowrap',marginTop:2}}>{fmtDate(log.createdAt)}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function hasClientBriefContent(brief) {
    const b = normalizeClientBrief(brief || {});
    return CLIENT_BRIEF_FIELDS.some(field => String(b[field.key] || '').trim())
      || (b.procedurePrices || []).length > 0;
  }

  function getClientBriefWikiPath(clientId) {
    return `docs/briefs/clients/${clientId}.md`;
  }

  function formatClientBriefContext(client, brief, data) {
    const b = normalizeClientBrief(brief || {}, client.clientId);
    const wikiBriefPath = getClientBriefWikiPath(client.clientId);
    const jobs = sortJobsForFocus((data.monthlyJobs || [])
      .filter(j => j.clientId === client.clientId && !isJobDone(j)))
      .slice(0, 12);
    const posts = [...(data.postLogs || [])]
      .filter(p => p.clientId === client.clientId)
      .sort((a,b) => String(b.publishedAt || '').localeCompare(String(a.publishedAt || '')))
      .slice(0, 8);

    const lines = [
      '# 거래처 콘텐츠 작성 컨텍스트',
      '',
      `거래처: ${client.clientName}`,
      `clientId: ${client.clientId}`,
      `진료과/분야: ${client.specialty || ''}`,
      `담당자: ${client.mainContact || ''}`,
      `브리프 업데이트: ${b.updatedAt || '미입력'}`,
      `상세 브리프 위키: ${wikiBriefPath}`,
      '',
      '## 읽기 순서',
      '1. 대시보드 clientBrief API 브리프',
      `2. ${wikiBriefPath}`,
      '3. docs/compliance/medical-ad-review-guide.md',
      '4. docs/compliance/medical-ad-checklist.json',
      '',
      '## 콘텐츠 브리프',
    ];

    CLIENT_BRIEF_FIELDS.forEach(field => {
      lines.push('', `### ${field.label}`);
      lines.push(String(b[field.key] || '').trim() || '미입력');
    });

    lines.push('', '## 시술 / 가격표');
    if ((b.procedurePrices || []).length) {
      b.procedurePrices.forEach((row, index) => {
        lines.push([
          `${index + 1}.`,
          row.category ? `[${row.category}]` : '',
          row.name || '시술명 미입력',
          row.regularPrice ? `정상가: ${row.regularPrice}` : '',
          row.eventPrice ? `이벤트가: ${row.eventPrice}` : '',
          row.sessionInfo ? `구성: ${row.sessionInfo}` : '',
          row.notes ? `비고: ${row.notes}` : '',
        ].filter(Boolean).join(' '));
      });
    } else {
      lines.push('미입력');
    }

    lines.push('', '## 현재 진행중 업무');
    if (jobs.length) {
      jobs.forEach(j => {
        lines.push(`- ${j.title}${j.dueDate ? ` / 마감 ${j.dueDate}` : ''}${j.note ? ` / 메모 ${j.note}` : ''}`);
      });
    } else {
      lines.push('- 진행중 업무 없음');
    }

    lines.push('', '## 최근 발행 글');
    if (posts.length) {
      posts.forEach(p => {
        lines.push(`- ${p.publishedAt || ''} ${p.channel || ''} ${p.title || ''}`.trim());
      });
    } else {
      lines.push('- 최근 발행 기록 없음');
    }

    lines.push(
      '',
      '## 작성 전 확인',
      '- 위 브리프를 우선 기준으로 삼고, 확인되지 않은 수치나 효과는 만들지 않는다.',
      `- 긴 맥락은 ${wikiBriefPath}를 함께 확인한다.`,
      '- 의료/시술 콘텐츠는 docs/compliance 기준으로 PASS/REVISE/HOLD 검수를 수행한다.',
      '- 의료/시술 콘텐츠는 개인별 차이와 상담 필요성을 자연스럽게 반영한다.',
      '- 작성 후 대시보드 글 보관함에는 addDraft 구조로 저장하고 memo에 의료광고 검수 결론을 남긴다.'
    );

    return lines.join('\n');
  }

  function ClientBriefSection({ client, data, brief, onSave }) {

    const [editing, setEditing] = useState(false);
    const [form, setForm] = useState(() => normalizeClientBrief(brief || {}, client.clientId));
    const [copied, setCopied] = useState(false);
    const [saveState, setSaveState] = useState('idle');

    useEffect(() => {
      setForm(normalizeClientBrief(brief || {}, client.clientId));
      setEditing(false);
      setSaveState('idle');
    }, [client.clientId, briefSignature]);

    const currentBrief = normalizeClientBrief(editing ? form : (brief || {}), client.clientId);
    const wikiBriefPath = getClientBriefWikiPath(client.clientId);
    const hasContent = hasClientBriefContent(currentBrief);

    function updateField(key, value) {
      setForm(prev => ({ ...prev, [key]: value }));
    }

    function updatePrice(index, key, value) {
      setForm(prev => ({
        ...prev,
        procedurePrices: (prev.procedurePrices || []).map((row, i) => i === index ? { ...row, [key]: value } : row)
      }));
    }

    function addPriceRow() {
      setForm(prev => ({
        ...prev,
        procedurePrices: [...(prev.procedurePrices || []), { category:'', name:'', regularPrice:'', eventPrice:'', sessionInfo:'', notes:'' }]

    function saveBrief() {
      const clean = normalizeClientBrief(form, client.clientId);
      setSaveState('saving');

        .then(() => {
          setForm(clean);
          setEditing(false);

          console.warn('upsertClientBrief 오류:', e);

          setSaveState('local');

    function copyContext() {
      const text = formatClientBriefContext(client, currentBrief, data);
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }).catch(() => {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);

    const statusText = saveState === 'saving'
      ? '저장중'

            {(currentBrief.procedurePrices || []).length > 0 && (
              <div style={{marginTop:14,borderTop:'1px solid var(--border-2)',paddingTop:12}}>
                <div style={{fontSize:11,fontWeight:800,color:'var(--text-2)',marginBottom:7}}>시술 / 가격표</div>
                <div style={{overflowX:'auto'}}>

                  {currentBrief.procedurePrices.map((row, i) => (
