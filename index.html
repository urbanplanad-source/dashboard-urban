<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>어반플랜애드 — 업무 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script src="credentials.local.js"></script>
  <style>
    /* ═══════ DESIGN TOKENS ═══════ */
    :root {
      --bg:        #f6f6f4;
      --surface:   #ffffff;
      --surface-2: #fafaf9;
      --border:    #e8e7e3;
      --border-2:  #f1f0ed;
      --ink:       #191926;
      --text:      #292936;
      --text-2:    #5d5f6b;
      --text-3:    #9b9da6;
      --navy:      #1a1a2e;
      --navy-2:    #2d2d50;
      --gold:      #c9a96e;
      --gold-bg:   #f6efe1;
      --gold-ink:  #8a6c35;
      --blue:      #2563eb;  --blue-bg:   #e9f0fd;
      --green:     #0e9f6e;  --green-bg:  #e4f5ee;
      --purple:    #7c3aed;  --purple-bg: #f0ebfd;
      --amber:     #d97706;  --amber-bg:  #fcf3e4;
      --red:       #dc2626;  --red-bg:    #fdebeb;
      --pink:      #db2777;  --pink-bg:   #fce9f1;
      --radius:    10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(20,22,35,.05);
      --shadow-md: 0 10px 28px rgba(20,22,35,.12);
      --side-w:    232px;
      --font: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); margin:0;
           font-feature-settings: 'tnum' 1; }
    ::-webkit-scrollbar { width:5px; height:5px; } ::-webkit-scrollbar-thumb { background:#d6d5d0; border-radius:3px; }
    button, input, select, textarea { font-family: inherit; }

    /* ═══════ APP SHELL (sidebar + content) ═══════ */
    .app-shell   { min-height:100vh; }
    .app-content { margin-left:var(--side-w); min-height:100vh; }
    .sidebar {
      position:fixed; left:0; top:0; bottom:0; width:var(--side-w); z-index:60;
      background:var(--navy); color:#fff; display:flex; flex-direction:column;
      padding:18px 12px 14px;
    }
    .side-logo { display:flex; align-items:center; gap:10px; padding:2px 8px 16px; }
    .side-logo-mark { width:34px; height:34px; border-radius:9px; background:var(--gold); color:#fff;
      display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; letter-spacing:.5px; flex-shrink:0; }
    .side-nav { display:flex; flex-direction:column; gap:2px; margin-bottom:14px; }
    .side-nav-btn {
      display:flex; align-items:center; gap:9px; width:100%; text-align:left;
      background:transparent; border:none; color:rgba(255,255,255,.62);
      font-size:13px; font-weight:600; padding:8px 10px; border-radius:8px; cursor:pointer;
      transition:background .12s, color .12s;
    }
    .side-nav-btn:hover { background:rgba(255,255,255,.07); color:#fff; }
    .side-nav-btn.active { background:rgba(255,255,255,.12); color:#fff; }
    .side-nav-btn.active svg { color:var(--gold); }
    .side-sec { font-size:10px; font-weight:700; letter-spacing:1.2px; color:rgba(255,255,255,.34);
      text-transform:uppercase; padding:10px 10px 6px; }
    .side-filter { width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
      border-radius:8px; color:#fff; font-size:12px; padding:7px 10px; outline:none; margin:0 0 6px; }
    .side-filter::placeholder { color:rgba(255,255,255,.35); }
    .side-clients { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:1px; min-height:0; }
    .side-client-btn {
      display:flex; align-items:center; gap:8px; width:100%; text-align:left;
      background:transparent; border:none; color:rgba(255,255,255,.66);
      font-size:12.5px; font-weight:500; padding:7px 10px; border-radius:8px; cursor:pointer;
      transition:background .12s, color .12s; white-space:nowrap; overflow:hidden;
    }
    .side-client-btn:hover { background:rgba(255,255,255,.07); color:#fff; }
    .side-client-btn.active { background:rgba(201,169,110,.18); color:#fff; font-weight:700; }
    .side-client-name { overflow:hidden; text-overflow:ellipsis; flex:1; }
    .side-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .side-foot { border-top:1px solid rgba(255,255,255,.1); padding-top:10px; margin-top:8px;
      display:flex; flex-direction:column; gap:8px; }
    .side-sync { display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
      border:none; border-radius:8px; padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer;
      color:#fff; transition:filter .15s; }
    .side-sync:hover { filter:brightness(1.12); }
    .side-date { font-size:11px; color:rgba(255,255,255,.38); text-align:center; }

    @media (max-width: 920px) {
      .app-content { margin-left:0; }
      .sidebar { position:sticky; top:0; bottom:auto; width:100%; height:auto;
        flex-direction:row; align-items:center; gap:6px; padding:10px 14px; overflow-x:auto; }
      .side-logo { padding:0 8px 0 0; }
      .side-logo-text, .side-sec, .side-filter, .side-clients, .side-date { display:none; }
      .side-nav { flex-direction:row; margin:0; }
      .side-nav-btn { white-space:nowrap; padding:7px 11px; }
      .side-foot { border:none; padding:0; margin-left:auto; flex-direction:row; }
      .side-sync { width:auto; white-space:nowrap; }
    }

    /* ═══════ BADGES ═══════ */
    .sb { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:6px; white-space:nowrap; }
    .sb-대기         { background:var(--border-2);  color:var(--text-2); }
    .sb-진행중       { background:var(--blue-bg);   color:var(--blue); }
    .sb-검토중       { background:var(--purple-bg); color:var(--purple); }
    .sb-피드백대기   { background:var(--amber-bg);  color:var(--amber); }
    .sb-완료         { background:var(--green-bg);  color:var(--green); }

    .pb { display:inline-flex; font-size:10px; font-weight:700; padding:2px 8px; border-radius:6px; }
    .pb-높음 { background:var(--red-bg);   color:var(--red); }
    .pb-중간 { background:var(--amber-bg); color:var(--amber); }
    .pb-낮음 { background:var(--border-2); color:var(--text-2); }

    .spec-badge { font-size:11px; font-weight:700; padding:2.5px 8px; border-radius:6px; display:inline-block; line-height:1.4; }
    .spec-피부과   { background:var(--pink-bg);   color:var(--pink); }
    .spec-성형외과 { background:var(--purple-bg); color:var(--purple); }
    .spec-안과     { background:var(--blue-bg);   color:var(--blue); }
    .spec-치과     { background:var(--green-bg);  color:var(--green); }
    .spec-이사     { background:var(--amber-bg);  color:var(--amber); }
    .spec-한의원   { background:#e6f4e2;          color:#3f8530; }
    .spec-기타     { background:var(--border-2);  color:var(--text-2); }

    /* ═══════ SURFACES ═══════ */
    .card-hover { transition: box-shadow .15s, transform .15s, border-color .15s; cursor:pointer; }
    .card-hover:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:#dcdad4 !important; }

    .modal-bg { position:fixed; inset:0; background:rgba(18,18,28,.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(2px); }
    .modal-box { background:var(--surface); border-radius:var(--radius-lg); max-width:540px; width:100%; max-height:90vh; overflow-y:auto; padding:28px; box-shadow:var(--shadow-md); }

    .fi { width:100%; padding:9px 12px; border:1px solid #dcdad4; border-radius:8px; font-size:13px; outline:none; font-family:inherit; background:var(--surface); color:var(--text); transition:border-color .12s, box-shadow .12s; }
    .fi:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,169,110,.18); }
    .fi-label { font-size:12px; font-weight:700; color:var(--text-2); margin-bottom:4px; display:block; }

    .btn-primary { background:var(--navy); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .12s; }
    .btn-primary:hover { background:var(--navy-2); }
    .btn-danger  { background:var(--red); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-ghost   { background:transparent; color:var(--text-2); border:1px solid var(--border); border-radius:8px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn-ghost:hover { background:var(--surface-2); }
    .btn-icon    { background:transparent; border:none; cursor:pointer; padding:4px 6px; border-radius:6px; font-size:14px; color:var(--text-3); display:inline-flex; align-items:center; justify-content:center; }
    .btn-icon:hover { background:var(--border-2); color:var(--text); }

    .section-title { font-size:11px; font-weight:700; color:var(--text-3); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:6px; }

    /* ═══════ KPI ROW ═══════ */
    .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
    @media (max-width:860px){ .kpi-grid { grid-template-columns:repeat(2,1fr); } }
    .kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow-sm); min-width:0; }
    .kpi-label { font-size:11px; font-weight:600; color:var(--text-3); display:flex; align-items:center; gap:6px; margin-bottom:8px; }
    .kpi-value { font-size:21px; font-weight:800; color:var(--ink); letter-spacing:-.3px; line-height:1.1; }
    .kpi-sub   { font-size:11px; color:var(--text-3); margin-top:5px; }

    /* ═══════ CLIENT TABLE ═══════ */
    .ctbl { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
    .ctbl-head, .ctbl-row { display:grid; grid-template-columns: 2fr 86px 2.2fr 78px 92px 110px 84px; gap:10px; align-items:center; padding:10px 18px; }
    .ctbl-head { background:var(--surface-2); border-bottom:1px solid var(--border-2); padding-top:9px; padding-bottom:9px; }
    .ctbl-head span { font-size:10.5px; font-weight:700; color:var(--text-3); letter-spacing:.4px; }
    .ctbl-row { border-bottom:1px solid var(--border-2); cursor:pointer; transition:background .1s; }
    .ctbl-row:last-child { border-bottom:none; }
    .ctbl-row:hover { background:var(--surface-2); }
    @media (max-width:1080px){
      .ctbl-head { display:none; }
      .ctbl-row { grid-template-columns:1fr 1fr; }
    }

    /* segmented control */
    .seg { display:inline-flex; background:var(--border-2); border-radius:8px; padding:2.5px; gap:2px; }
    .seg button { border:none; background:transparent; color:var(--text-2); font-size:12px; font-weight:600;
      border-radius:6px; padding:5px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all .12s; }
    .seg button.active { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); font-weight:700; }

    /* ═══════ PROGRESS ═══════ */
    .prog-track { background:var(--border-2); border-radius:99px; height:6px; overflow:hidden; margin-top:5px; }
    .prog-fill  { height:100%; border-radius:99px; transition:width .4s ease; }

    /* ═══════ COMMON TASKS / CREDENTIALS ═══════ */
    .ct-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; transition:background .12s; }
    .ct-item:hover { background:var(--surface-2); }
    .ct-item.done .ct-title { color:var(--text-3); text-decoration:line-through; }
    .ct-check { width:18px; height:18px; border-radius:5px; border:1.5px solid #d6d5d0; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; }
    .ct-check.done { background:var(--green); border-color:var(--green); color:#fff; }

    .cred-row { display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-2); }
    .cred-pw  { font-family:ui-monospace, monospace; font-size:12px; color:var(--text); letter-spacing:.5px; cursor:pointer; }

    .main-top-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
    @media (max-width: 860px) {
      .main-top-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

  const { useState, useEffect, useMemo, useCallback, useRef } = React;

  // ═══════════════════════════════════════════════
  //  CONSTANTS
  // ═══════════════════════════════════════════════
  const SPECIALTIES = ['피부과','성형외과','안과','치과','한의원','이사/운송','기타'];
  const STORAGE_KEY = 'urbanplanad_pm_v1';
  const MONTH_KEY   = 'urbanplanad_lastMonth';
  const API_URL = 'https://script.google.com/macros/s/AKfycbwUsy5dDEG-t4FszWRCj-f0-FLIOY4SPMatiNsm55xM7bFXzaAEFS6McQdvmXT85dT0/exec';

  const SPEC_CLS   = { '피부과':'피부과','성형외과':'성형외과','안과':'안과','치과':'치과','한의원':'한의원','이사/운송':'이사','기타':'기타' };
  const SPEC_COLOR = { '피부과':'#db2777','성형외과':'#7c3aed','안과':'#2563eb','치과':'#0e9f6e','한의원':'#3f8530','이사/운송':'#d97706','이사':'#d97706','기타':'#5d5f6b' };
  const SPEC_BG    = { '피부과':'#fce9f1','성형외과':'#f0ebfd','안과':'#e9f0fd','치과':'#e4f5ee','한의원':'#e6f4e2','이사/운송':'#fcf3e4','이사':'#fcf3e4','기타':'#f1f0ed' };

  const CLIENT_BRIEF_FIELDS = [
    { key:'brandSummary', label:'한 줄 포지션', rows:2, placeholder:'예: 지역 기반 피부/통증/미용 진료에서 어떤 이미지로 기억되어야 하는지' },
    { key:'clinicFeatures', label:'병원 특징 / 강점', rows:5, placeholder:'위치, 진료 철학, 장비, 공간, 예약/상담 방식, 지역 내 차별점' },
    { key:'doctorStyle', label:'원장님 스타일', rows:4, placeholder:'상담 톤, 설명 방식, 선호 표현, 피하고 싶은 이미지, 환자 응대 특징' },
    { key:'targetPatients', label:'핵심 타깃 / 환자 상황', rows:4, placeholder:'연령대, 지역, 고민, 검색 의도, 방문 전 불안 요소' },
    { key:'representativeTreatments', label:'대표 시술 / 주력 서비스', rows:5, placeholder:'주력 시술명, 추천 대상, 강점, 함께 묶을 수 있는 시술' },
    { key:'procedureNotes', label:'시술별 설명 포인트', rows:5, placeholder:'각 시술의 원리, 상담 시 강조점, 사후관리, 주의사항, 자주 묻는 질문' },
    { key:'pricingMemo', label:'가격 / 이벤트 운영 메모', rows:4, placeholder:'가격표 해석 기준, 이벤트 기간, 패키지 구성, 외부 공개 시 주의할 점' },
    { key:'writingGuidelines', label:'글 작성 지침', rows:6, placeholder:'제목 구조, 본문 흐름, 도입부 톤, CTA, 이미지 캡션, 채널별 차이' },
    { key:'toneAndManner', label:'톤앤매너', rows:4, placeholder:'차분함, 전문성, 친근함, 고급감 등. 금지되는 말투도 함께 기록' },
    { key:'requiredPhrases', label:'반드시 포함할 표현 / 고정 문구', rows:4, placeholder:'진료명, 병원명 표기, 주소/예약 문구, 상담 안내, 고정 CTA' },
    { key:'forbiddenPhrases', label:'금지 / 주의 표현', rows:4, placeholder:'과장 표현, 보장 표현, 경쟁 병원 비교, 사용 금지 키워드' },
    { key:'medicalAdCautions', label:'의료광고 / 심의 주의사항', rows:5, placeholder:'전후사진, 가격 노출, 치료효과 표현, 후기 활용, 심의 필요 여부' },
    { key:'contentAngles', label:'콘텐츠 아이디어 / 소재', rows:5, placeholder:'계절 이슈, 증상별 주제, 자주 묻는 질문, 지역 키워드, 캠페인 방향' },
    { key:'keywords', label:'핵심 키워드', rows:3, placeholder:'대표 키워드, 지역 키워드, 롱테일 키워드, 피해야 할 키워드' },
    { key:'faq', label:'자주 묻는 질문 / 답변 기준', rows:5, placeholder:'환자 질문과 답변 톤. 답변 불가/확인 필요 항목도 기록' },
    { key:'localContext', label:'지역 / 경쟁 / 운영 맥락', rows:4, placeholder:'상권, 인근 지역, 경쟁 구도, 주요 유입 채널, 운영 이슈' },
    { key:'referenceLinks', label:'참고 링크 / 자료 위치', rows:3, placeholder:'홈페이지, 플레이스, 가격표 파일, 내부 문서, 이미지 폴더 링크' },
    { key:'internalNotes', label:'내부 메모', rows:4, placeholder:'콘텐츠 작성자가 알아야 하는 기타 맥락. 계정/비밀번호는 입력하지 않음' },
  ];

  const CLIENT_BRIEF_PRICE_FIELDS = [
    { key:'category', label:'분류', placeholder:'피부 / 통증 / 치과' },
    { key:'name', label:'시술명', placeholder:'예: 리프팅, 임플란트' },
    { key:'regularPrice', label:'정상가', placeholder:'예: 300,000원' },
    { key:'eventPrice', label:'이벤트가', placeholder:'예: 199,000원' },
    { key:'sessionInfo', label:'구성', placeholder:'횟수, 부위, 소요시간' },
    { key:'notes', label:'비고', placeholder:'노출 주의, 상담 후 확정 등' },
  ];

  // ═══════════════════════════════════════════════
  //  ICONS (inline SVG — 이모지 대체)
  // ═══════════════════════════════════════════════
  const ICON_PATHS = {
    grid:      <g><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>,

    next.procedurePrices = normalizeProcedurePrices(next.procedurePrices || next.procedurePricesJson);
    next.updatedAt = normalizeDate(next.updatedAt) || String(next.updatedAt || '');
    delete next.procedurePricesJson;
    return next;
  };
  const normalizeClientBriefMap = (input) => {
    const result = {};
    if (Array.isArray(input)) {
      input.forEach(item => {
        const cid = item?.clientId;
        if (cid) result[cid] = normalizeClientBrief(item, cid);
      });
      return result;
    }
    Object.entries(input || {}).forEach(([cid, item]) => {
      result[cid] = normalizeClientBrief(item || {}, cid);
    });
    return result;
  };
  const mergeClientBriefMaps = (primary, fallback) => ({
    ...normalizeClientBriefMap(fallback),
    ...normalizeClientBriefMap(primary),
  });
  const mergeConsultLists = (localList, remoteList) => {
    const byId = new Map();
    [...(remoteList || []), ...(localList || [])]
      .map(normalizeConsult)
      .filter(c => c.id && c.status !== 'deleted')
      .forEach(c => byId.set(c.id, c));
    return [...byId.values()].sort((a,b) =>
      String(b.date || b.createdAt || '').localeCompare(String(a.date || a.createdAt || ''))
    );
  };
  const fmtMonth = (m) => { const nm = normalizeMonth(m); if(!nm) return ''; const [y,mo]=nm.split('-'); return `${y}년 ${Number(mo)}월`; };
  const fmtDate  = (d) => { const nd = normalizeDate(d); if(!nd) return '—'; const p=nd.split('-'); return `${p[0].slice(2)}.${p[1]}.${p[2]}`; };
  const daysLeft= (d) => { const nd = normalizeDate(d); if(!nd) return null; const due=new Date(nd+'T00:00:00'); const n=new Date(); const tod=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.ceil((due-tod)/86400000); };

  // DEFAULT_DATA 순서를 유지하면서 primary·fallback 데이터를 병합하는 함수
  // - primary  : Sheets 데이터 (sync 시) 또는 localStorage 데이터 (loadData 시)
  // - fallback : localStorage 데이터 (sync 시, UI 추가 거래처 보존용) — 생략 가능
  function mergeClients(defaultClients, primaryClients, fallbackClients) {
    fallbackClients = fallbackClients || [];
    const defaultIds  = defaultClients.map(c => c.clientId);
    const primaryIds  = primaryClients.map(c => c.clientId);
    return [
      // 1. DEFAULT_DATA 순서대로: primary > fallback > default 우선순위로 채움
      //    DEFAULT_DATA 필드를 base로 두어 businessType 등 누락 방지
      ...defaultClients.map(dc => {
        const src = primaryClients.find(c => c.clientId === dc.clientId)
                 || fallbackClients.find(c => c.clientId === dc.clientId);
        if (src) return { ...dc, ...src, reportFile: src.reportFile || dc.reportFile };
        return dc;
      }),
      // 2. primary에만 있는 거래처 (DEFAULT_DATA 외 Sheets 등록 거래처)
      ...primaryClients.filter(c => !defaultIds.includes(c.clientId)),
      // 3. fallback에만 있는 거래처 (UI 추가 후 미동기화 — sync 후에도 보존)
      ...fallbackClients.filter(c => !defaultIds.includes(c.clientId) && !primaryIds.includes(c.clientId))
    ];
  }

  async function readApiJson(res, actionLabel) {
    const text = await res.text();
    let json;
    try {
      json = text ? JSON.parse(text) : {};
    } catch (e) {
      const preview = String(text || '')
        .replace(/<[^>]*>/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 180);
      throw new Error(`${actionLabel || 'API'} 응답이 JSON이 아닙니다. Apps Script 배포/권한/서버 오류를 확인해 주세요.${preview ? ` 응답: ${preview}` : ''}`);
    }
    if (!res.ok) {
      throw new Error(`${actionLabel || 'API'} HTTP ${res.status}: ${json.error || res.statusText || '요청 실패'}`);
    }
    return json;
  }

  function PriorityBadge({ priority }) {
    const m = {'높음':'pb-높음','중간':'pb-중간','낮음':'pb-낮음'};
    return <span className={`pb ${m[priority]||'pb-낮음'}`}>{priority}</span>;
  }
  function SpecBadge({ specialty }) {
    const cls = SPEC_CLS[specialty] || '기타';
    return <span className={`spec-badge spec-${cls}`}>{specialty}</span>;
  }
  function DueBadge({ dueDate }) {
    if(!dueDate) return null;
    const dl = daysLeft(dueDate);
    if(dl === null) return null;
    // 날짜 포맷 ex) 4/9
    const [,mm,dd] = dueDate.split('-');
    const label = `${parseInt(mm,10)}/${parseInt(dd,10)}까지`;
    const base = {display:'inline-flex',alignItems:'center',gap:3,fontSize:11,fontWeight:700,padding:'1px 7px',borderRadius:5};
    if(dl < 0)   return <span style={{...base,color:'var(--red)',background:'var(--red-bg)'}}><Icon name="alert" size={10} /> {label} ({Math.abs(dl)}일 초과)</span>;
    if(dl === 0) return <span style={{...base,color:'var(--red)',background:'var(--red-bg)'}}><Icon name="clock" size={10} /> {label} (오늘 마감)</span>;
    if(dl <= 3)  return <span style={{...base,color:'var(--amber)',background:'var(--amber-bg)'}}><Icon name="clock" size={10} /> {label} (D-{dl})</span>;
    return <span style={{...base,fontWeight:500,color:'var(--text-2)',background:'var(--border-2)'}}><Icon name="clock" size={10} /> {label} (D-{dl})</span>;
  }

  const isJobDone = (job) => {
    if (!job) return false;
    if (job.targetCount != null) return Number(job.currentCount || 0) >= Number(job.targetCount || 0);
    return String(job.note || '').trim().startsWith('완료');
  };

  const isCompletedSubJob = (job) => String(job?.note || '').trim().startsWith('완료');
  const postLogMonth = (post) => normalizeMonth(post?.month || post?.publishedAt || post?.date);
  const getMonthPostLogs = (data, month = nowMonth()) =>
    (data?.postLogs || []).filter(post => postLogMonth(post) === month);
  const getJobMonthPostLogs = (data, jobId, month = nowMonth()) =>
    getMonthPostLogs(data, month).filter(post => post.jobId === jobId);
  const getJobPostReconciliation = (job, data, month = nowMonth()) => {
    if (!job || job.targetCount == null) return null;
    const recordCount = getJobMonthPostLogs(data, job.jobId, month).length;
    const currentCount = Number(job.currentCount || 0);
    const delta = recordCount - currentCount;
    return {
      recordCount,
      currentCount,
      delta,
      mismatch: delta !== 0,
    };
  };
  async function copyTextToClipboard(text) {
    if (navigator.clipboard?.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (error) {
        console.warn('Clipboard API 실패, 호환 복사를 시도합니다:', error);
      }
    }

    const el = document.createElement('textarea');
    el.value = String(text ?? '');
    el.setAttribute('readonly', '');
    el.style.position = 'fixed';
    el.style.left = '-9999px';
    el.style.top = '0';
    document.body.appendChild(el);
    try {
      el.focus();
      el.select();
      el.setSelectionRange(0, el.value.length);
      if (document.execCommand('copy') !== true) {
        throw new Error('브라우저가 복사 작업을 거부했습니다.');
      }
      return true;
    } finally {
      document.body.removeChild(el);
    }
  }

  function buildDailyBriefingText(data) {
    const clientsById = {};
    (data.clients || []).forEach(client => { clientsById[client.clientId] = client; });

    const formatJobLine = (item) => {
      const clientName = item.clientName || '내 사업';
      const dueText = item.days < 0
        ? `${Math.abs(item.days)}일 초과`
        : item.days === 0
          ? '오늘 마감'
          : `D-${item.days}`;
      return `- [${clientName}] ${item.title} (${dueText})`;
    };

    const jobs = (data.monthlyJobs || [])
      .filter(job => job.dueDate && !isJobDone(job))
      .map(job => ({
        title: job.title,
        days: daysLeft(job.dueDate),
        clientName: clientsById[job.clientId]?.clientName || job.clientId || '거래처',
      }))
      .filter(item => item.days !== null && item.days <= 3)
      .sort((a,b) => a.days - b.days || String(a.title).localeCompare(String(b.title)));

    const tasks = (data.commonTasks || [])
      .filter(task => task.kind !== 'group' && task.dueDate && !task.done)
      .map(task => ({
        title: task.title,
        days: daysLeft(task.dueDate),
        clientName: '내 사업',
      }))
      .filter(item => item.days !== null && item.days <= 3)
      .sort((a,b) => a.days - b.days || String(a.title).localeCompare(String(b.title)));

    const focus = [...jobs, ...tasks].sort((a,b) => a.days - b.days || String(a.title).localeCompare(String(b.title)));
    const overdue = focus.filter(item => item.days < 0);
    const todayItems = focus.filter(item => item.days === 0);
    const soonItems = focus.filter(item => item.days > 0);
    const countJobs = (data.monthlyJobs || []).filter(job => job.kind === '필수' && job.targetCount != null);
    const progressLines = countJobs
      .filter(job => Number(job.currentCount || 0) < Number(job.targetCount || 0))
      .slice()
      .sort((a,b) => {
        const ap = Number(a.currentCount || 0) / Math.max(1, Number(a.targetCount || 0));
        const bp = Number(b.currentCount || 0) / Math.max(1, Number(b.targetCount || 0));
        return ap - bp;
      })
      .slice(0, 8)
      .map(job => {
        const clientName = clientsById[job.clientId]?.clientName || job.clientId || '거래처';
        const pct = Math.round(Number(job.currentCount || 0) / Math.max(1, Number(job.targetCount || 0)) * 100);
        return `- [${clientName}] ${job.title}: ${job.currentCount || 0}/${job.targetCount}${job.unit || ''} (${pct}%)`;
      });
    const doneSubCount = (data.monthlyJobs || [])
      .filter(job => (job.kind === '서브' || job.kind === '순위') && isJobDone(job))
      .length;

    const lines = [`오늘의 업무 브리핑 (${today()})`, ''];
    lines.push('[초과]');
    lines.push(...(overdue.length ? overdue.map(formatJobLine) : ['- 없음']));
    lines.push('', '[오늘 마감]');
    lines.push(...(todayItems.length ? todayItems.map(formatJobLine) : ['- 없음']));
    lines.push('', '[3일 이내]');
    lines.push(...(soonItems.length ? soonItems.map(formatJobLine) : ['- 없음']));
    lines.push('', '[필수 업무 미달]');
    lines.push(...(progressLines.length ? progressLines : ['- 없음']));
    lines.push('', `[이번 달 완료 서브/순위 업무] ${doneSubCount}건`);
    return lines.join('\n');
  }

  // 서브 업무와 순위 업무는 화면 전반에서 함께 다룬다. 초기화 미리보기와 집계도
  // 동일하게 맞춰야 미리보기에 없는 업무가 조용히 초기화되는 일이 없다.
  const isSubLikeJob = (job) => job?.kind === '서브' || job?.kind === '순위';

  function getMonthlyResetPreview(data, remoteConsultBackups = null) {
    const backupMonth = prevMonth();
    const targetMonth = nowMonth();
    const allSubs = (data.monthlyJobs || []).filter(isSubLikeJob);
    const completedSubs = allSubs.filter(isCompletedSubJob);
    const carryoverSubs = allSubs.filter(job => !isCompletedSubJob(job));
    const unmetRequired = (data.monthlyJobs || [])
      .filter(job => job.kind === '필수' && !isJobDone(job));
    const consultTargets = ['btskin', 'belrmon'];
    const localConsultBackups = consultTargets.map(clientId => {
      const raw = safeStorage.getItem('consult-v1-' + clientId);
      const records = raw ? (() => { try { return JSON.parse(raw); } catch { return []; } })() : [];
      const clientName = (data.clients || []).find(client => client.clientId === clientId)?.clientName || clientId;
      return { clientId, clientName, records };
    });
    return {
      backupMonth,
      targetMonth,
      completedSubs,
      carryoverSubs,
      unmetRequired,
      consultBackups: remoteConsultBackups || localConsultBackups,
    };
  }

  // ═══════════════════════════════════════════════
  //  MONTHLY RESET — 단계 분리
  //  서버 반영 여부와 화면 갱신 여부를 반드시 구분한다.
  //  monthlyReset POST가 성공한 뒤 summary 조회가 실패해도 그것은 "초기화 실패"가
  //  아니다. 재실행을 유도하면 중복 처리 위험이 생긴다.
  // ═══════════════════════════════════════════════
  const MONTHLY_RESET_STAGE = {
    IDLE: 'idle',
    PREFLIGHT_LOADING: 'preflight_loading',
    RESET_POSTING: 'reset_posting',
    RESET_APPLIED_REFRESHING: 'reset_applied_refreshing',
    COMPLETE: 'complete',
    PREFLIGHT_FAILED: 'preflight_failed',
    RESET_FAILED: 'reset_failed',
    RESET_APPLIED_REFRESH_FAILED: 'reset_applied_refresh_failed',
  };

  // 서버 반영이 끝난 뒤의 단계에서는 절대 재실행을 안내하지 않는다.
  const MONTHLY_RESET_MESSAGE = {
    [MONTHLY_RESET_STAGE.PREFLIGHT_FAILED]:
      '상담 자료를 확인하지 못해 초기화를 시작하지 않았습니다.\nSheets와 로컬 모두 변경되지 않았습니다.\n잠시 후 다시 시도해 주세요.',
    [MONTHLY_RESET_STAGE.RESET_FAILED]:
      '초기화 요청이 실패했습니다.\nSheets 반영이 확인되지 않아 로컬 화면도 초기화하지 않았습니다.\n잠시 후 다시 시도해 주세요.',
    [MONTHLY_RESET_STAGE.RESET_APPLIED_REFRESH_FAILED]:
      'Sheets 초기화는 완료되었습니다.\n다시 초기화하지 마세요.\n\n화면 갱신에만 실패했으므로 동기화 버튼을 눌러 최신 상태를 불러와 주세요.',
  };

  // 순수 오케스트레이션. React와 분리해 두어야 모의 fetch로 단계별 검증이 가능하다.
  // 반환값의 stage로 호출측이 로컬 상태 반영 여부를 결정한다.
  async function runMonthlyReset({
    backupMonth,
    targetMonth,
    consultTargets,
    clients,
    consultsList,
    postJson,
    fetchSummary,
    onStage,
  }) {
    const setStage = (stage) => { if (onStage) onStage(stage); return stage; };
    const result = {
      stage: MONTHLY_RESET_STAGE.IDLE,
      serverResetSucceeded: false,
      histories: [],
      afterReset: null,
      error: null,
    };

    // ── 1) preflight: 전월 상담을 원격에서 확인한다. 여기서는 아무것도 쓰지 않는다.
    setStage(MONTHLY_RESET_STAGE.PREFLIGHT_LOADING);
    try {
      const histories = await Promise.all(consultTargets.map(async (clientId) => {
        const response = await consultsList(clientId, backupMonth);
        const records = response?.data?.consults || response?.consults || [];
        if (!response?.success || !Array.isArray(records)) {
          throw new Error(response?.error || `${clientId} ${backupMonth} 상담 조회 실패`);
        }
        const normalized = records
          .map(record => ({ ...normalizeConsult(record), clientId: record.clientId || clientId }))
          .filter(record => record.id && normalizeMonth(record.month || record.date) === backupMonth);
        const byChannel = {};
        normalized.forEach(record => { byChannel[record.channel] = (byChannel[record.channel] || 0) + 1; });
        const clientName = (clients || []).find(item => item.clientId === clientId)?.clientName || clientId;
        return {
          month: backupMonth,
          clientId,
          clientName,
          records: normalized,
          savedAt: new Date().toISOString(),
          summary: { total: normalized.length, byChannel },
        };
      }));
      result.histories = histories.filter(history => history.records.length > 0);
    } catch (error) {
      result.stage = setStage(MONTHLY_RESET_STAGE.PREFLIGHT_FAILED);
      result.error = error;
      return result;
    }

    // ── 2) 서버 초기화 요청 1회. 완료 서브업무 삭제/카운트 초기화/새 달 구성은 서버가 처리한다.
    setStage(MONTHLY_RESET_STAGE.RESET_POSTING);
    try {
      await postJson({ action: 'monthlyReset', month: targetMonth });
    } catch (error) {
      result.stage = setStage(MONTHLY_RESET_STAGE.RESET_FAILED);
      result.error = error;
      return result;
    }

    // 여기를 지난 시점부터 서버는 이미 초기화된 상태다.
    result.serverResetSucceeded = true;

    // ── 3) 화면 갱신용 재조회. 실패해도 서버 반영은 되돌리지 않는다.
    setStage(MONTHLY_RESET_STAGE.RESET_APPLIED_REFRESHING);
    try {
      const afterReset = await fetchSummary();
      if (!afterReset || !Array.isArray(afterReset.monthlyJobs) || afterReset.monthlyJobs.length === 0) {
        // 빈 응답을 정상으로 취급하면 이월 업무가 사라진 것으로 오인하게 된다.
        // 과거에는 이 지점에서 addSubJob으로 자동 재생성해 Sheets에 중복을 만들었다.
        // 이제는 자동 보강하지 않고 수동 확인 대상으로 남긴다.
        throw new Error('초기화 후 업무 목록을 확인하지 못했습니다.');
      }
      result.afterReset = afterReset;
      result.stage = setStage(MONTHLY_RESET_STAGE.COMPLETE);
    } catch (error) {
      result.stage = setStage(MONTHLY_RESET_STAGE.RESET_APPLIED_REFRESH_FAILED);
      result.error = error;
    }
    return result;
  }

  const isWaitingJob = (job) =>
    /대기|미수령|보류|홀드|확인\s*필요|자료\s*확인|응답\s*대기|수령\s*대기/.test(String(job?.note || ''));

  const dueSortBucket = (job) => {
    const dl = daysLeft(job?.dueDate);
    if (dl === null) return 4;
    if (dl < 0) return 0;
    if (dl === 0) return 1;
    if (dl <= 3) return 2;
    return 3;
  };

  const sortJobsForFocus = (jobs) => (jobs || [])
    .map((job, index) => ({ job, index }))
    .sort((a, b) => {
      const aDone = isJobDone(a.job);
      const bDone = isJobDone(b.job);
      if (aDone !== bDone) return aDone ? 1 : -1;

      const aBucket = dueSortBucket(a.job);
      const bBucket = dueSortBucket(b.job);
      if (aBucket !== bBucket) return aBucket - bBucket;

      if (!aDone && aBucket > 2) {
        const aWaiting = isWaitingJob(a.job);
        const bWaiting = isWaitingJob(b.job);
        if (aWaiting !== bWaiting) return aWaiting ? 1 : -1;
      }

      const aDays = daysLeft(a.job?.dueDate);
      const bDays = daysLeft(b.job?.dueDate);
      if (aDays !== bDays) {
        return (aDays ?? Number.POSITIVE_INFINITY) - (bDays ?? Number.POSITIVE_INFINITY);
      }

      return a.index - b.index;
    })
    .map(({ job }) => job);

  const hasCredentialEntries = (credentials) =>
    Object.values(credentials || {}).some(list =>
      Array.isArray(list) && list.some(item => item?.username || item?.password || item?.url)
    );

  function TodayFocus({ data, syncStatus, onGoClient, onSync }) {
    const [briefCopied, setBriefCopied] = useState(false);
    const clientsById = useMemo(() => {
      const map = {};
      (data.clients || []).forEach(client => { map[client.clientId] = client; });
      return map;
    }, [data.clients]);

    const focusItems = useMemo(() => {
      const jobItems = (data.monthlyJobs || [])
        .filter(job => job.dueDate && !isJobDone(job))
        .map(job => ({
          id: job.jobId,
          kind: job.kind || '업무',
          title: job.title,
          dueDate: job.dueDate,
          days: daysLeft(job.dueDate),
          clientId: job.clientId,
          clientName: clientsById[job.clientId]?.clientName || job.clientId || '거래처',
        }));

      const taskItems = (data.commonTasks || [])
        .filter(task => task.kind !== 'group' && task.dueDate && !task.done)
        .map(task => ({
          id: task.taskId,
          kind: '공통',
          title: task.title,
          dueDate: task.dueDate,
          days: daysLeft(task.dueDate),
          clientId: null,
          clientName: '내 사업',
        }));

      return [...jobItems, ...taskItems]
        .filter(item => item.days !== null && item.days <= 3)
        .sort((a,b) => a.days - b.days || String(a.dueDate).localeCompare(String(b.dueDate)))
        .slice(0, 6);
    }, [data.monthlyJobs, data.commonTasks, clientsById]);

    const overdueCount = focusItems.filter(item => item.days < 0).length;
    const todayCount = focusItems.filter(item => item.days === 0).length;
    const syncText = syncStatus === 'error' ? '동기화 재확인 필요'
                   : syncStatus === 'loading' ? '동기화 중'
                   : syncStatus === 'ok' ? '동기화 완료'
                   : '동기화 대기';
    const syncColor = syncStatus === 'error' ? '#dc2626'
                    : syncStatus === 'loading' ? '#4b5563'
                    : syncStatus === 'ok' ? '#16a34a'
                    : '#2563eb';

    const chipStyle = (bg, color) => ({
      display:'inline-flex',alignItems:'center',gap:5,borderRadius:999,padding:'5px 10px',
      background:bg,color,fontSize:12,fontWeight:800,whiteSpace:'nowrap'
    });
    function handleCopyBriefing() {
      copyTextToClipboard(buildDailyBriefingText(data))
        .then(() => {
          setBriefCopied(true);
          setTimeout(() => setBriefCopied(false), 1800);
        })
        .catch(() => alert('브리핑 복사에 실패했습니다. 브라우저 권한을 확인해 주세요.'));
    }

    return (
      <section style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:18,marginBottom:18,boxShadow:'0 1px 2px rgba(15,23,42,0.04)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,marginBottom:14,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:18,fontWeight:900,color:'var(--ink)',lineHeight:1.25}}>오늘의 포커스</div>
            <div style={{fontSize:13,color:'var(--text-2)',marginTop:3}}>{today()} 기준 운영 우선순위</div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
            <span style={chipStyle(overdueCount ? '#fef2f2' : '#f8fafc', overdueCount ? '#b91c1c' : '#64748b')}>초과 {overdueCount}건</span>
            <span style={chipStyle(todayCount ? '#fff7ed' : '#f8fafc', todayCount ? '#c2410c' : '#64748b')}>오늘 {todayCount}건</span>
            <button onClick={handleCopyBriefing}
              style={{...chipStyle(briefCopied ? 'var(--green-bg)' : '#eff6ff', briefCopied ? 'var(--green)' : 'var(--blue)'),border:'none',cursor:'pointer',fontFamily:'inherit'}}>
              <Icon name={briefCopied ? 'check' : 'copy'} size={12} /> {briefCopied ? '브리핑 복사됨' : '브리핑 복사'}
            </button>
            <button onClick={onSync} disabled={syncStatus==='loading'}
              style={{...chipStyle(syncStatus==='error' ? '#fef2f2' : '#f0fdf4', syncColor),border:'none',cursor:syncStatus==='loading'?'default':'pointer',fontFamily:'inherit'}}>
              {syncText}
            </button>
          </div>
        </div>

        {focusItems.length > 0 ? (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:10}}>
            {focusItems.map(item => {
              const label = item.days < 0 ? `${Math.abs(item.days)}일 초과` : item.days === 0 ? '오늘 마감' : `D-${item.days}`;
              const urgent = item.days <= 0;
              return (
                <button key={item.kind + item.id}
                  onClick={() => item.clientId && onGoClient(item.clientId)}
                  disabled={!item.clientId}
                  style={{textAlign:'left',background:urgent?'#fff7ed':'#f8fafc',border:`1px solid ${urgent?'#fed7aa':'#e2e8f0'}`,borderRadius:10,padding:'11px 12px',cursor:item.clientId?'pointer':'default',fontFamily:'inherit'}}>
                  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:5}}>
                    <span style={{fontSize:11,fontWeight:900,color:urgent?'#c2410c':'#2563eb',background:'var(--surface)',borderRadius:999,padding:'2px 7px'}}>{label}</span>
                    <span style={{fontSize:11,color:'var(--text-2)',fontWeight:700}}>{item.kind}</span>
                  </div>
                  <div style={{fontSize:13,fontWeight:800,color:'var(--ink)',lineHeight:1.35,wordBreak:'keep-all'}}>{item.title}</div>
                  <div style={{fontSize:12,color:'var(--text-2)',marginTop:5}}>{item.clientName} · {fmtDate(item.dueDate)}</div>
                </button>
              );
            })}
          </div>
        ) : (
          <div style={{background:'var(--surface-2)',border:'1px solid #e2e8f0',borderRadius:10,padding:'16px 14px',fontSize:13,color:'var(--text-2)',fontWeight:700}}>
            3일 이내 마감 업무가 없습니다.
          </div>
        )}
      </section>
    );
  }

  // ═══════════════════════════════════════════════
  //  MONTHLY JOBS SECTION (이달의 업무)
  // ═══════════════════════════════════════════════
  function MonthlyJobsSection({ clientId, data, mutate, autoLog }) {
    const jobs      = (data.monthlyJobs || []).filter(j => j.clientId === clientId);
    const essential = jobs.filter(j => j.kind === '필수');
    const sub       = jobs.filter(j => j.kind === '서브' || j.kind === '순위');
    const sortedSub = sortJobsForFocus(sub);

    const [showAddSub,   setShowAddSub]   = useState(false);
    const [newSubTitle,  setNewSubTitle]  = useState('');
    const [newSubDue,    setNewSubDue]    = useState('');
    const [showAddEss,   setShowAddEss]   = useState(false);
    const [newEssTitle,  setNewEssTitle]  = useState('');
    const [newEssKind,   setNewEssKind]   = useState('필수');
    const [newEssCount,  setNewEssCount]  = useState('');
    const [newEssUnit,   setNewEssUnit]   = useState('건');

    const essentialDone = essential.filter(isJobDone).length;

    function updateCount(jobId, delta) {
      const job = jobs.find(j => j.jobId === jobId);
      mutate(d => ({
        ...d,
        monthlyJobs: d.monthlyJobs.map(j =>
          j.jobId === jobId
            ? { ...j, currentCount: Math.max(0, (j.currentCount||0) + delta) }
            : j
        )
      }));
      // 자동 로그: targetCount 있는 업무만 기록
      if (autoLog && job && job.targetCount != null) {
        const newCount = Math.max(0, (job.currentCount||0) + delta);
        if (delta > 0) {
          autoLog(clientId, `📌 ${job.title} +${delta}건 (${newCount}/${job.targetCount}${job.unit||''})`);
        } else if (delta < 0 && (job.currentCount||0) > 0) {
          autoLog(clientId, `↩ ${job.title} 수정 (${newCount}/${job.targetCount}${job.unit||''})`);
        }
      }
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateJobCount', jobId, delta })
      }).catch(e => console.warn('Sheets updateJobCount 오류:', e));
    }

    async function reconcileJobCount(job) {
      const rec = getJobPostReconciliation(job, data, nowMonth());
      if (!rec || !rec.mismatch) return;
      const ok = confirm(`당월 발행 기록 기준으로 카운트를 맞출까요?\n\n현재 카운트: ${rec.currentCount}건\n당월 발행 기록: ${rec.recordCount}건`);
      if (!ok) return;
      mutate(d => ({
        ...d,
        monthlyJobs: d.monthlyJobs.map(j =>
          j.jobId === job.jobId ? { ...j, currentCount: rec.recordCount } : j
        )
      }));
      if (autoLog) {
        autoLog(clientId, `발행 기록 기준 카운트 보정 — ${job.title} (${rec.currentCount}→${rec.recordCount})`);
      }
      const unitDelta = rec.delta > 0 ? 1 : -1;
      for (let i = 0; i < Math.abs(rec.delta); i++) {
        try {
          await fetch(API_URL, {
            method: 'POST', redirect: 'follow',
            body: JSON.stringify({ action: 'updateJobCount', jobId: job.jobId, delta: unitDelta })
          });
        } catch (e) {
          console.warn('Sheets updateJobCount 대사 오류:', e);
          break;
        }
      }
    }

    function updateNote(jobId, note) {
      const job = jobs.find(j => j.jobId === jobId);
      mutate(d => ({
        ...d,
        monthlyJobs: d.monthlyJobs.map(j => j.jobId === jobId ? { ...j, note } : j)
      }));
      // 자동 로그: 완료 처리 시만
      if (autoLog && note === '완료' && job) {
        autoLog(clientId, `✅ ${job.title} 완료 처리`);
      }
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateJobNote', jobId, note })
      }).catch(e => console.warn('Sheets updateJobNote 오류:', e));
    }

    function updateSubJob(jobId, fields) {
      // fields: { title, note, dueDate } — 변경된 것만 전달
      mutate(d => ({
        ...d,
        monthlyJobs: d.monthlyJobs.map(j => j.jobId === jobId ? { ...j, ...fields } : j)
      }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'updateSubJob', jobId, ...fields })
      }).catch(e => console.warn('updateSubJob 오류:', e));
    }

    function deleteSubJobLocal(jobId) {
      mutate(d => ({ ...d, monthlyJobs: d.monthlyJobs.filter(j => j.jobId !== jobId) }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'deleteSubJob', jobId })
      }).catch(e => console.warn('deleteSubJob 오류:', e));
    }

    function handleAddEssentialJob() {
      if (!newEssTitle.trim()) return;
      const tempId  = 'mj-dyn-' + Date.now().toString(36);
      const tCount  = newEssCount ? parseInt(newEssCount, 10) : null;
      const newJob  = {
        jobId: tempId, clientId, title: newEssTitle.trim(),
        kind: newEssKind,
        targetCount: (!isNaN(tCount) && tCount > 0) ? tCount : null,
        currentCount: (!isNaN(tCount) && tCount > 0) ? 0 : null,
        unit: (!isNaN(tCount) && tCount > 0) ? (newEssUnit.trim() || '건') : null,
        dueDate: null, note: ''
      };
      mutate(d => ({ ...d, monthlyJobs: [...d.monthlyJobs, newJob] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addJob', clientId, title: newEssTitle.trim(), kind: newEssKind,
          targetCount: newJob.targetCount, unit: newJob.unit })
      }).then(r=>r.json()).then(res => {
        if (res.success && res.jobId) {
          mutate(d => ({ ...d, monthlyJobs: d.monthlyJobs.map(j => j.jobId===tempId ? {...j,jobId:res.jobId} : j) }));
        }
      }).catch(e => console.warn('addJob 오류:', e));
      setNewEssTitle(''); setNewEssCount(''); setNewEssUnit('건'); setShowAddEss(false);
    }

    function handleAddSubJob() {
      if (!newSubTitle.trim()) return;
      const tempId = 'mj-dyn-' + Date.now().toString(36);
      const newJob = {
        jobId: tempId, clientId, title: newSubTitle.trim(),
        kind: '서브', targetCount: null, currentCount: null, unit: null, dueDate: newSubDue || null, note: '',
        syncPending: true
      };
      mutate(d => ({ ...d, monthlyJobs: [...d.monthlyJobs, newJob] }));
      fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ action: 'addSubJob', clientId, title: newSubTitle.trim(), dueDate: newSubDue || null })
      }).then(r => r.json()).then(res => {
        if (res.success && res.jobId) {
          mutate(d => ({
            ...d,
            monthlyJobs: d.monthlyJobs.map(j => j.jobId === tempId ? { ...j, jobId: res.jobId, syncPending: false } : j)
          }));
        }
      }).catch(e => console.warn('addSubJob 오류:', e));
      setNewSubTitle('');
      setNewSubDue('');
      setShowAddSub(false);
    }

    // 필수업무 표시명 매핑
    const TITLE_DISPLAY_MAP = { '홈페이지 글 발행': '병원마케팅 콘텐츠 제작' };

    function JobRow({ job }) {
      const isCount  = job.targetCount != null;
      const isSub    = job.kind === '서브' || job.kind === '순위';
      // 블로그 업무: 카운트는 없지만 글 제목 기록 가능
      const isBlog   = !isCount && job.title.includes('블로그');
      const isDone   = isJobDone(job);
      const pct      = isCount ? Math.min(100, Math.round(((job.currentCount||0) / job.targetCount) * 100)) : 0;
      const reconciliation = isCount ? getJobPostReconciliation(job, data, nowMonth()) : null;
      // 발행 기록은 카운트 업무 + 블로그 업무 모두 표시
      // Monthly view only: past records stay available for archived reports.
      const jobLogs  = (isCount || isBlog)
        ? getJobMonthPostLogs(data, job.jobId, nowMonth())
        : [];
      // 표시 제목 (매핑 적용)
      const displayTitle = TITLE_DISPLAY_MAP[job.title] || job.title;

      // 수동 발행 기록 폼 상태
      const [showPost,    setShowPost]    = useState(false);
      const [postTitle,   setPostTitle]   = useState('');
      const [postUrl,     setPostUrl]     = useState('');
      const [postDate,    setPostDate]    = useState(today());
      const defaultCh = job.title.includes('인스타') ? '인스타그램'
                      : job.title.includes('블로그') ? '블로그'
                      : job.title.includes('위챗')   ? '위챗'
                      : '홈페이지';
      const [postChannel, setPostChannel] = useState(defaultCh);

      // 발행 항목 편집/삭제 상태
      const [editingLogId,  setEditingLogId]  = useState(null);
      const [editLogTitle,  setEditLogTitle]  = useState('');
      const [editLogUrl,    setEditLogUrl]    = useState('');

      // 서브업무 인라인 편집 상태
      const [editing,    setEditing]    = useState(false);
      const [editTitle,  setEditTitle]  = useState(job.title);
      const [editNote,   setEditNote]   = useState(job.note || '');
      const [editDue,    setEditDue]    = useState(job.dueDate || '');

      // targetCount 인라인 편집 상태
      const [editingTarget,  setEditingTarget]  = useState(false);
      const [editTargetVal,  setEditTargetVal]  = useState(String(job.targetCount || ''));

      function saveTargetCount() {
        const n = parseInt(editTargetVal, 10);
        if (isNaN(n) || n < 0) { setEditingTarget(false); return; }
        mutate(d => ({
          ...d,
          monthlyJobs: d.monthlyJobs.map(j => j.jobId === job.jobId ? { ...j, targetCount: n } : j)
        }));
        fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({ action: 'updateJobTarget', jobId: job.jobId, targetCount: n })
        }).catch(e => console.warn('updateJobTarget 오류:', e));
        setEditingTarget(false);
      }

      function saveEdit() {
        if (!editTitle.trim()) return;
        updateSubJob(job.jobId, {
          title:   editTitle.trim(),
          note:    editNote.trim(),
          dueDate: editDue || null,
        });
        setEditing(false);
      }

      function deleteLog(logId) {
        if (!confirm('이 발행 항목을 삭제하시겠습니까?')) return;
        mutate(d => ({
          ...d,
          monthlyJobs: isCount ? d.monthlyJobs.map(j =>
            j.jobId === job.jobId ? { ...j, currentCount: Math.max(0,(j.currentCount||0)-1) } : j
          ) : d.monthlyJobs,
          postLogs: (d.postLogs||[]).filter(p => p.logId !== logId)
        }));
        fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({ action: 'deletePost', logId })
        }).catch(e => console.warn('deletePost 오류:', e));
      }

      function saveLogEdit(logId) {
        if (!editLogTitle.trim()) return;
        mutate(d => ({
          ...d,
          postLogs: (d.postLogs||[]).map(p =>
            p.logId === logId ? { ...p, title: editLogTitle.trim(), url: editLogUrl.trim() } : p
          )
        }));
        fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({ action: 'updatePost', logId, title: editLogTitle.trim(), url: editLogUrl.trim() })
        }).catch(e => console.warn('updatePost 오류:', e));
        setEditingLogId(null);
      }

      function handleSubmitPost() {
        if (!postTitle.trim()) return;
        const tempId    = 'pl-' + Date.now().toString(36);
        const pubDate   = postDate || today();
        mutate(d => ({
          ...d,
          // 카운트 업무만 currentCount 증가 (블로그 업무는 postLogs.length로만 카운팅)
          monthlyJobs: isCount ? d.monthlyJobs.map(j =>
            j.jobId === job.jobId ? { ...j, currentCount: (j.currentCount||0)+1 } : j
          ) : d.monthlyJobs,
          postLogs: [...(d.postLogs||[]), {
            logId: tempId, clientId, jobId: job.jobId,
            title: postTitle.trim(), url: postUrl.trim(),
            publishedAt: pubDate, month: pubDate.slice(0,7), channel: postChannel
          }]
        }));
        if (autoLog) autoLog(clientId, `📌 ${job.title} +1건 — ${postTitle.trim()}`);
        fetch(API_URL, {
          method: 'POST', redirect: 'follow',
          body: JSON.stringify({ action:'addPost', clientId, jobId:job.jobId, title:postTitle.trim(), url:postUrl.trim(), channel:postChannel, publishedAt:pubDate })
        }).catch(e => console.warn('addPost 오류:', e));
        setPostTitle(''); setPostUrl(''); setPostDate(today()); setShowPost(false);
      }

      return (
        <div style={{padding:'10px 0',borderBottom:'1px solid var(--border-2)'}}>

          {/* ── 인라인 편집 폼 (서브업무만) ── */}
          {editing && (
            <div style={{background:'var(--surface-2)',borderRadius:8,padding:'10px 12px',marginBottom:6,border:'1px solid var(--border)'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--text)',marginBottom:6}}>서브업무 수정</div>
              <input
                value={editTitle}
                onChange={e => setEditTitle(e.target.value)}
                placeholder="업무 제목"
                autoFocus
                onKeyDown={e => { if(e.key==='Enter') saveEdit(); if(e.key==='Escape') setEditing(false); }}
                style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:5}}
              />
              <div style={{display:'flex',gap:6,marginBottom:5}}>
                <input
                  value={editNote}
                  onChange={e => setEditNote(e.target.value)}
                  placeholder="메모 (선택)"
                  style={{flex:1,padding:'6px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
                <input
                  type="date"
                  value={editDue}
                  onChange={e => setEditDue(e.target.value)}
                  style={{flex:'0 0 140px',padding:'6px 10px',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
              </div>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <button onClick={saveEdit}
                  style={{padding:'5px 14px',background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>
                  저장
                </button>
                <button onClick={() => setEditing(false)}
                  style={{padding:'5px 12px',background:'none',border:'1px solid #dcdad4',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>
                  취소
                </button>
                {job.kind === '서브' && (
                  <button
                    onClick={() => { if(confirm(`"${job.title}" 서브업무를 삭제하시겠습니까?`)) { deleteSubJobLocal(job.jobId); setEditing(false); } }}
                    style={{marginLeft:'auto',display:'inline-flex',alignItems:'center',gap:4,padding:'5px 12px',background:'none',border:'1px solid #fca5a5',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--red)'}}>
                    <Icon name="trash" size={11} /> 삭제
                  </button>
                )}
              </div>
            </div>
          )}

          {/* 제목 + 컨트롤 */}
          {!editing && (
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{
                fontSize:13,fontWeight:600,
                color: isDone ? '#9ca3af':'#1a1a2e',
                textDecoration: isDone ? 'line-through':'none',
                whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'
              }}>
                {displayTitle}
              </div>
              {job.dueDate && !isDone && (
                <div style={{fontSize:11,marginTop:2}}><DueBadge dueDate={job.dueDate} /></div>
              )}
              {!isCount && job.note && !isDone && (
                <div style={{fontSize:11,color:'var(--text-2)',marginTop:2}}>{job.note}</div>
              )}
            </div>

            {isCount ? (
              <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                <button
                  onClick={()=>updateCount(job.jobId,-1)}
                  style={{width:22,height:22,borderRadius:'50%',border:'1px solid #dcdad4',background:'var(--surface-2)',cursor:'pointer',fontSize:14,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'var(--text)'}}>
                  −
                </button>
                <span style={{fontSize:12,fontWeight:700,
                  color: (job.currentCount||0) > job.targetCount ? '#059669' : isDone ? '#10b981':'#1d4ed8',
                  minWidth:52,textAlign:'center'}}>
                  {job.currentCount}/
                  {editingTarget ? (
                    <input
                      type="number" min="1" value={editTargetVal}
                      onChange={e=>setEditTargetVal(e.target.value)}
                      onBlur={saveTargetCount}
                      onKeyDown={e=>{ if(e.key==='Enter') saveTargetCount(); if(e.key==='Escape') setEditingTarget(false); }}
                      autoFocus
                      style={{width:38,padding:'1px 4px',border:'1px solid #93c5fd',borderRadius:4,fontSize:12,fontFamily:'inherit',outline:'none',fontWeight:700}}
                    />
                  ) : (
                    <span
                      onClick={()=>{ setEditTargetVal(String(job.targetCount)); setEditingTarget(true); }}
                      title="클릭하여 목표 수정"
                      style={{cursor:'pointer',borderBottom:'1px dashed #93c5fd'}}>
                      {job.targetCount}
                    </span>
                  )}
                  {!editingTarget && ((job.currentCount||0) > job.targetCount
                    ? <span style={{fontSize:10,fontWeight:800,color:'var(--green)',marginLeft:1}}>+{(job.currentCount||0)-job.targetCount}</span>
                    : <span style={{fontSize:10,fontWeight:400,color:'var(--text-3)'}}>{job.unit}</span>
                  )}
                </span>
                <button
                  onClick={()=>updateCount(job.jobId,1)}
                  style={{width:22,height:22,borderRadius:'50%',border:'1px solid #dcdad4',background:'var(--surface-2)',cursor:'pointer',fontSize:14,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'var(--text)'}}>
                  +
                </button>
                {isDone && <span style={{fontSize:12,color:'var(--green)',marginLeft:2}}>✓</span>}
                <button
                  onClick={()=>setShowPost(v=>!v)}
                  title="발행 글 제목 기록"
                  style={{width:24,height:24,borderRadius:6,border:'1px solid #dbeafe',background: showPost ? '#dbeafe':'#f0f9ff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'var(--blue)',marginLeft:2}}>
                  <Icon name="pencil" size={11} />
                </button>
              </div>
            ) : (
              <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                {/* 블로그 업무: 기록 건수 + ✏️ */}
                {isBlog && (
                  <>
                    {jobLogs.length > 0 && (
                      <span style={{fontSize:11,fontWeight:700,color:'#6366f1',background:'var(--purple-bg)',padding:'2px 7px',borderRadius:10}}>
                        {jobLogs.length}건
                      </span>
                    )}
                    <button
                      onClick={()=>setShowPost(v=>!v)}
                      title="블로그 글 제목 기록"
                      style={{width:24,height:24,borderRadius:6,border:'1px solid #dbeafe',background: showPost ? '#dbeafe':'#f0f9ff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'var(--blue)'}}>
                      <Icon name="pencil" size={11} />
                    </button>
                  </>
                )}
                <button
                  onClick={()=>updateNote(job.jobId, isDone ? '' : '완료')}
                  style={{fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:20,border:'none',cursor:'pointer',fontFamily:'inherit',
                    background: isDone ? 'var(--green-bg)':'var(--blue-bg)',
                    color:      isDone ? 'var(--green)':'var(--blue)'
                  }}>
                  {isDone ? '✓ 완료' : '진행중'}
                </button>
                {/* 서브업무만 편집 아이콘 */}
                {isSub && (
                  <button
                    onClick={() => { setEditTitle(job.title); setEditNote(job.note||''); setEditDue(job.dueDate||''); setEditing(true); }}
                    title="수정"
                    style={{width:22,height:22,borderRadius:6,border:'1px solid var(--border)',background:'var(--surface-2)',cursor:'pointer',fontSize:11,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'var(--text-3)'}}>
                    ✎
                  </button>
                )}
              </div>
            )}
          </div>
          )}  {/* !editing */}

          {/* 진행 바 (카운터 업무만) */}
          {isCount && (
            <div className="prog-track" style={{marginTop:7}}>
              <div className="prog-fill" style={{
                width: `${pct}%`,
                background: isDone ? '#10b981' : pct > 60 ? '#3b82f6' : pct > 30 ? '#6366f1' : '#94a3b8'
              }} />
            </div>
          )}

          {reconciliation?.mismatch && (
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginTop:7,padding:'7px 9px',background:'var(--amber-bg)',border:'1px solid #fde68a',borderRadius:8,flexWrap:'wrap'}}>
              <span style={{fontSize:11,fontWeight:800,color:'var(--amber)'}}>
                당월 기록 {reconciliation.recordCount}건 / 카운트 {reconciliation.currentCount}건
              </span>
              <button onClick={() => reconcileJobCount(job)}
                style={{border:'none',borderRadius:6,background:'#b45309',color:'#fff',padding:'4px 9px',fontSize:11,fontWeight:800,cursor:'pointer',fontFamily:'inherit'}}>
                기록 기준 맞추기
              </button>
            </div>
          )}

          {/* 수동 발행 기록 인라인 폼 (카운트 업무 + 블로그 업무) */}
          {(isCount || isBlog) && showPost && (
            <div style={{marginTop:8,padding:'10px 12px',background: isBlog ? '#f5f3ff':'#f0f9ff',borderRadius:8,border:`1px solid ${isBlog ? '#ddd6fe':'#bfdbfe'}`}}>
              <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:700,color: isBlog ? 'var(--purple)':'var(--blue)',marginBottom:6}}>
                <Icon name="pencil" size={11} /> {isBlog ? '블로그' : '발행'} 글 제목 기록
              </div>
              <input
                value={postTitle}
                onChange={e=>setPostTitle(e.target.value)}
                placeholder="글 제목 입력 (필수)"
                autoFocus
                onKeyDown={e=>{ if(e.key==='Enter') handleSubmitPost(); if(e.key==='Escape') setShowPost(false); }}
                style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none',marginBottom:5}}
              />
              <div style={{display:'flex',gap:6,marginBottom:7}}>
                <input
                  value={postUrl}
                  onChange={e=>setPostUrl(e.target.value)}
                  placeholder="URL (선택)"
                  style={{flex:1,padding:'6px 10px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
                <input
                  type="date"
                  value={postDate}
                  onChange={e=>setPostDate(e.target.value)}
                  style={{flex:'0 0 140px',padding:'6px 8px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
              </div>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <select
                  value={postChannel}
                  onChange={e=>setPostChannel(e.target.value)}
                  style={{flex:1,padding:'5px 8px',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}>
                  <option value="홈페이지">홈페이지</option>
                  <option value="인스타그램">인스타그램</option>
                  <option value="블로그">블로그</option>
                  <option value="위챗">위챗</option>
                  <option value="LINE">LINE</option>
                  <option value="기타">기타</option>
                </select>
                <button onClick={handleSubmitPost}
                  style={{padding:'5px 14px',background:'var(--blue)',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>
                  기록
                </button>
                <button onClick={()=>{setShowPost(false);setPostTitle('');setPostUrl('');}}
                  style={{padding:'5px 12px',background:'none',border:'1px solid #93c5fd',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>
                  취소
                </button>
              </div>
            </div>
          )}

          {/* 발행 글 목록 (카운트 업무 + 블로그 업무) */}
          {(isCount || isBlog) && jobLogs.length > 0 && (
            <div style={{marginTop:7,paddingLeft:6,borderLeft:'2px solid #e8e7e3'}}>
              {jobLogs.map(pl => (
                <div key={pl.logId}>
                  {editingLogId === pl.logId ? (
                    <div style={{padding:'6px 8px',background:'#f0f9ff',borderRadius:7,marginBottom:4,border:'1px solid #bfdbfe'}}>
                      <input
                        value={editLogTitle}
                        onChange={e=>setEditLogTitle(e.target.value)}
                        placeholder="제목"
                        autoFocus
                        onKeyDown={e=>{ if(e.key==='Enter') saveLogEdit(pl.logId); if(e.key==='Escape') setEditingLogId(null); }}
                        style={{width:'100%',boxSizing:'border-box',padding:'4px 8px',border:'1px solid #93c5fd',borderRadius:5,fontSize:12,fontFamily:'inherit',outline:'none',marginBottom:4}}
                      />
                      <input
                        value={editLogUrl}
                        onChange={e=>setEditLogUrl(e.target.value)}
                        placeholder="URL (선택)"
                        style={{width:'100%',boxSizing:'border-box',padding:'4px 8px',border:'1px solid #93c5fd',borderRadius:5,fontSize:12,fontFamily:'inherit',outline:'none',marginBottom:5}}
                      />
                      <div style={{display:'flex',gap:5}}>
                        <button onClick={()=>saveLogEdit(pl.logId)}
                          style={{padding:'3px 10px',background:'var(--blue)',color:'#fff',border:'none',borderRadius:5,fontSize:11,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>저장</button>
                        <button onClick={()=>setEditingLogId(null)}
                          style={{padding:'3px 9px',background:'none',border:'1px solid #93c5fd',borderRadius:5,fontSize:11,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',fontSize:11,group:'1'}}>
                      <span style={{color:'var(--text-3)',flexShrink:0}}>↳</span>
                      {pl.url ? (
                        <a href={pl.url} target="_blank" rel="noopener"
                          style={{color:'var(--blue)',textDecoration:'none',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600}}>
                          {pl.title}
                        </a>
                      ) : (
                        <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--text)'}}>{pl.title}</span>
                      )}
                      {pl.publishedAt && (
                        <span style={{color:'var(--text-3)',flexShrink:0,fontSize:10}}>{fmtDate(pl.publishedAt)}</span>
                      )}
                      <button
                        onClick={()=>{ setEditingLogId(pl.logId); setEditLogTitle(pl.title); setEditLogUrl(pl.url||''); }}
                        title="수정"
                        style={{width:18,height:18,borderRadius:4,border:'1px solid var(--border)',background:'var(--surface-2)',cursor:'pointer',fontSize:9,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'var(--text-2)',flexShrink:0}}>
                        ✎
                      </button>
                      <button
                        onClick={()=>deleteLog(pl.logId)}
                        title="삭제"
                        style={{width:18,height:18,borderRadius:4,border:'1px solid #fecaca',background:'var(--red-bg)',cursor:'pointer',fontSize:9,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',color:'var(--red)',flexShrink:0}}>
                        ✕
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    if(jobs.length === 0) return null;

    return (
      <div style={{background:'var(--surface)',borderRadius:12,border:'1px solid var(--border)',padding:'18px 20px',marginBottom:20}}>
        <div style={{marginBottom:14}}>
          <div className="section-title" style={{marginBottom:0}}>이달의 업무</div>
        </div>

        <div style={{marginBottom: sub.length > 0 ? 16 : 0}}>
          {essential.length > 0 && (
            <div style={{fontSize:11,fontWeight:700,color:'var(--red)',marginBottom:2,letterSpacing:'0.5px'}}>● 필수 업무</div>
          )}
          {essential.map(j => <JobRow key={j.jobId} job={j} />)}
          {/* 필수/순위업무 추가 UI */}
          {showAddEss ? (
            <div style={{marginTop:8,background:'#fef9f0',borderRadius:8,padding:'10px 12px',border:'1px solid #fde68a'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--amber)',marginBottom:6}}>업무 추가</div>
              <input
                value={newEssTitle}
                onChange={e=>setNewEssTitle(e.target.value)}
                placeholder="업무 제목 *"
                autoFocus
                onKeyDown={e=>{ if(e.key==='Escape') setShowAddEss(false); }}
                style={{width:'100%',boxSizing:'border-box',padding:'6px 10px',border:'1px solid #fcd34d',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:6}}
              />
              <div style={{display:'flex',gap:6,marginBottom:6,flexWrap:'wrap'}}>
                <select value={newEssKind} onChange={e=>setNewEssKind(e.target.value)}
                  style={{padding:'5px 8px',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none',background:'var(--surface)'}}>
                  <option value="필수">필수</option>
                  <option value="순위">순위</option>
                </select>
                <input
                  type="number" min="1" value={newEssCount}
                  onChange={e=>setNewEssCount(e.target.value)}
                  placeholder="목표 수 (없으면 공란)"
                  style={{flex:1,minWidth:120,padding:'5px 8px',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                />
                {newEssCount && (
                  <input
                    value={newEssUnit} onChange={e=>setNewEssUnit(e.target.value)}
                    placeholder="단위 (건/개)"
                    style={{flex:'0 0 70px',padding:'5px 8px',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,fontFamily:'inherit',outline:'none'}}
                  />
                )}
              </div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={handleAddEssentialJob}
                  style={{padding:'5px 14px',background:'#b45309',color:'#fff',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>추가</button>
                <button onClick={()=>{setShowAddEss(false);setNewEssTitle('');setNewEssCount('');}}
                  style={{padding:'5px 12px',background:'none',border:'1px solid #fcd34d',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'inherit',color:'var(--text-2)'}}>취소</button>
              </div>
            </div>
          ) : (
            <button
              onClick={()=>setShowAddEss(true)}
              style={{marginTop: essential.length > 0 ? 6 : 0, fontSize:11, color:'var(--amber)', background:'none', border:'1px dashed #fcd34d', borderRadius:7, padding:'4px 12px', cursor:'pointer', fontFamily:'inherit'}}>
              + 업무 추가
            </button>
          )}
        </div>

        {(sub.length > 0 || true) && (
          <div>
            {sub.length > 0 && (
              <div style={{fontSize:11,fontWeight:700,color:'var(--text-2)',marginBottom:2,letterSpacing:'0.5px',
                marginTop: essential.length > 0 ? 14 : 0}}>
              {sub.some(j=>j.kind==='순위') && sub.some(j=>j.kind==='서브') ? '○ 서브 / 순위 업무' : sub.some(j=>j.kind==='순위') ? '○ 순위 업무' : '○ 서브 업무'}
            </div>
            )}
            {sortedSub.map(j => <JobRow key={j.jobId} job={j} />)}
            {/* 서브업무 추가 UI */}
            {!showAddSub ? (
              <button
                onClick={() => setShowAddSub(true)}
                style={{marginTop: sub.length > 0 ? 8 : (essential.length > 0 ? 14 : 0), fontSize:12, color:'var(--text-3)', background:'none', border:'1px dashed #d1d5db', borderRadius:8, padding:'5px 14px', cursor:'pointer', width:'100%', fontFamily:'inherit'}}>
                + 서브업무 추가
              </button>
            ) : (
              <div style={{marginTop:8, display:'flex', flexDirection:'column', gap:6}}>
                <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                  <input
                    value={newSubTitle}
                    onChange={e => setNewSubTitle(e.target.value)}
                    placeholder="서브업무 제목 입력"
                    style={{flex:1, minWidth:160, padding:'6px 10px', border:'1px solid #dcdad4', borderRadius:6, fontSize:13, fontFamily:'inherit', outline:'none'}}
                    onKeyDown={e => { if(e.key==='Enter') handleAddSubJob(); if(e.key==='Escape') { setShowAddSub(false); setNewSubTitle(''); setNewSubDue(''); } }}
                    autoFocus
                  />
                  <input
                    type="date"
                    value={newSubDue}
                    onChange={e => setNewSubDue(e.target.value)}
                    title="마감일 (선택)"
                    style={{flex:'0 0 140px', padding:'6px 10px', border:'1px solid #dcdad4', borderRadius:6, fontSize:12, fontFamily:'inherit', outline:'none', color: newSubDue ? '#374151' : '#9ca3af'}}
                  />
                </div>
                {newSubDue && (
                  <div style={{display:'flex',alignItems:'center',gap:4,fontSize:11, color:'var(--text-2)', paddingLeft:2}}><Icon name="calendar" size={11} /> 목표 마감일: <strong>{newSubDue.replace(/-/g,'/')} 까지</strong></div>
                )}
                <div style={{display:'flex', gap:6}}>
                  <button onClick={handleAddSubJob} style={{padding:'6px 14px', background:'var(--navy)', color:'#fff', border:'none', borderRadius:6, fontSize:12, cursor:'pointer', fontFamily:'inherit', fontWeight:700}}>추가</button>
                  <button onClick={() => { setShowAddSub(false); setNewSubTitle(''); setNewSubDue(''); }} style={{padding:'6px 12px', background:'none', border:'1px solid #dcdad4', borderRadius:6, fontSize:12, cursor:'pointer', fontFamily:'inherit', color:'var(--text-2)'}}>취소</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════
  //  MODAL (로그 추가 + 삭제 확인만)
  // ═══════════════════════════════════════════════
  function Modal({ modal, onClose, onSave, onDelete }) {
    const [form, setForm] = useState(modal.formData || {});
    const set = (k,v) => setForm(p=>({...p,[k]:v}));

    if(!modal.open) return null;

    return (
      <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
        <div className="modal-box">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <h2 style={{fontSize:16,fontWeight:800,color:'var(--ink)'}}>
              {modal.type==='log'        && '업데이트 로그 추가'}
              {modal.type==='delete'     && '삭제 확인'}
              {modal.type==='add-client' && '새 거래처 추가'}
            </h2>
            <button className="btn-icon" onClick={onClose}>✕</button>
          </div>

          {modal.type==='delete' && (
            <div>
              <p style={{fontSize:14,color:'var(--text)',marginBottom:8}}>
                <b>"{modal.context?.name}"</b>을(를) 삭제하시겠습니까?
              </p>
              <p style={{fontSize:12,color:'var(--text-3)',marginBottom:20}}>이 작업은 되돌릴 수 없습니다.</p>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn-ghost" onClick={onClose}>취소</button>
                <button className="btn-danger" onClick={()=>onDelete(modal.context)}>삭제</button>
              </div>
            </div>
          )}

          {modal.type==='log' && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div>
                <label className="fi-label">업데이트 내용 *</label>
                <textarea className="fi" rows={3} value={form.message||''} onChange={e=>set('message',e.target.value)} placeholder="예: 블로그 포스팅 3건 발행 완료" />
              </div>
              <div>
                <label className="fi-label">날짜</label>
                <input className="fi" type="date" value={form.createdAt||today()} onChange={e=>set('createdAt',e.target.value)} />
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:4}}>
                <button className="btn-ghost" onClick={onClose}>취소</button>
                <button className="btn-primary" onClick={()=>onSave(modal.type, modal.mode, form, modal.context)}>저장</button>
              </div>
            </div>
          )}

          {modal.type==='add-client' && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="fi-label">거래처명 *</label>
                  <input className="fi" value={form.clientName||''} onChange={e=>set('clientName',e.target.value)} placeholder="예: 노형아름다운피부과" />
                </div>
                <div>
                  <label className="fi-label">전문과목</label>
                  <select className="fi" value={form.specialty||'기타'} onChange={e=>set('specialty',e.target.value)}>
                    {SPECIALTIES.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="fi-label">담당자</label>
                  <input className="fi" value={form.mainContact||''} onChange={e=>set('mainContact',e.target.value)} placeholder="담당자명" />
                </div>
                <div>
                  <label className="fi-label">우선순위</label>
                  <select className="fi" value={form.priorityLevel||'중간'} onChange={e=>set('priorityLevel',e.target.value)}>
                    <option value="높음">높음</option>
                    <option value="중간">중간</option>
                    <option value="낮음">낮음</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="fi-label">보고서 파일명</label>
                <input className="fi" value={form.reportFile||''} onChange={e=>set('reportFile',e.target.value)} placeholder="예: btskin.html" />
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:4}}>
                <button className="btn-ghost" onClick={onClose}>취소</button>
                <button className="btn-primary" onClick={()=>{ if(!(form.clientName||'').trim()){ alert('거래처명을 입력하세요.'); return; } onSave(modal.type, modal.mode, form, modal.context); }}>거래처 추가</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
