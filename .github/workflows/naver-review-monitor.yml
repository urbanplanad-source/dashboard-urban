name: Naver Place Visitor Review Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate monitor script
        run: node --check scripts/naver-review-monitor.mjs

      - name: Run visitor review monitor
        run: node scripts/naver-review-monitor.mjs
        env:
          REVIEW_MONITOR_API_URL: ${{ secrets.REVIEW_MONITOR_API_URL }}
